# yubiOS bootc install configuration
# Applied during: bootc install to-filesystem
# Schema verified from: https://github.com/bootc-dev/bootc/blob/v1.16.3/crates/lib/src/install/config.rs

[install]
# systemd-boot: works natively on standard UEFI, no GRUB needed.
bootloader = "systemd"

# DPS root discovery: systemd-boot always implements BLI (Boot Loader Interface).
# Verified: use_discoverable_partitions() defaults true for systemd-boot.
discoverable-partitions = true

# direct only: FIDO2 enrollment happens post-install via yubiOS-enroll-luks.
# tpm2-luks excluded: we replace TPM with YubiKey FIDO2. Using tpm2-luks would
# create a TPM dependency that defeats the TPM-free design goal.
block = ["direct"]

# No match-architectures: applies to both x86-64 and aarch64.

# Install-time kernel arguments. In bootc 1.16.3 these are embedded into the
# .cmdline PE section of the auto-generated UKI (see
# crates/lib/src/bootc_composefs/boot.rs write_systemd_uki_config). This
# matches the mkosi.conf [Content] KernelCommandLine so the mkosi path and
# the bootc install path agree on the cmdline, which is required by
# ADR-006's "both paths behave identically at runtime" principle.
# PR #2305 (v1.16.4) extends this with user-provided kargs via x-options-source-*.
kargs = ["root=dissect", "mount.usr=dissect", "rw", "audit=0"]

# OMN-150 Phase 2 -- sealed-UKI BLSConfig integration (active in bootc 1.17.1+).
# Both Containerfile (`d4b95e208f`) and Containerfile.dev (`c612e010a95c`) build
# `/boot/EFI/Linux/<kver>.efi` in the `FROM rootfs AS uki` stage via
# `bootc container ukify --rootfs /target`, re-pin mtimes to `SOURCE_DATE_EPOCH`
# in `prefinal`, and ship a single-layer `FROM scratch` image so the layer-computed
# composefs digest matches the UKI's embedded composefs digest. At install time,
# `bootc install to-filesystem --composefs-backend` (`setup_composefs_uki_boot` in
# `crates/lib/src/bootc_composefs/boot.rs`) detects `/boot/EFI/Linux/<kver>.efi`
# (`BootType::Uki`), verifies its embedded `composefs.digest=v1-sha512-12:<digest>`
# against the installed composefs EROFS image, writes the UKI to the ESP at
# `/EFI/Linux/bootc/bootc_composefs-<digest>.efi`, and writes the Type2 BLSConfig
# entry `/loader/entries/bootc_<os_id>-<version>-1.conf` with
# `uki /EFI/Linux/bootc/bootc_composefs-<digest>.efi`.

[install.filesystem.root]
# ext4 matches the yubiOS convention already used by the to-filesystem CI lane
# (ci_test_bootc-filesystem.yml formats it with -O verity), which composefs
# fs-verity needs. xfs verity support is newer and thinner; btrfs is unneeded
# complexity for a single-root layout. Confirmed the fedora-bootc base ships
# NO default here -- Fedora-based bootc images have none (only CentOS-based
# images default to xfs) -- so `bootc install to-disk` errored 'No root
# filesystem specified' with nothing to fall back on (yubiOS#9, yubiOS#20,
# run 30152891747). This file is the only usr/lib/bootc/install/*.toml in the
# repo, so there is no other config to conflict with.
type = "ext4"

# Match Ubuntu 26.04 on rock1 (Pine64 RockPro64 v2.1):
# - dw_wdt: DesignWare watchdog is blacklisted on RockPro64 so early boot never trips WDT before systemd binds it
# - rk3399_dmc: U-Boot SPL owns LPDDR4 init; Linux rk3399-dmc-freq has no OPP table on RockPro64
# - rk_crypto: Rockchip v1 crypto has broken ahash export statesize in 7.x and priority-300 skcipher DMA self-tests; use ARMv8 CE
blacklist dw_wdt
blacklist rk3399_dmc
blacklist rk_crypto

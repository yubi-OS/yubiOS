# yubiOS: state directories the image ships empty. Declared here so bootc upgrades, which do not
# re-apply /var from the image, still create them on every boot (lint var-tmpfiles).
d /var/lib/containers 0755 root root - -
d /var/lib/tpm2-tss 0755 root root - -
d /var/lib/tpm2-tss/system 0755 root root - -

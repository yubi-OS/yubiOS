# Stop all PM sleep depths (s2idle, shallow, deep, standby, hibernate, hybrid-sleep).
# Mainline TF-A v2.15 on RK3588 (ROCK 5B) does not resume from PSCI SYSTEM_SUSPEND.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
SuspendState=
HibernateState=

# yubiOS systemd-homed defaults
# Source: https://www.man7.org/linux/man-pages/man5/homed.conf.5.html

[Home]
# LUKS2 loopback file per user — strongest encryption, U2F/HSM FIDO2 unlockable.
# Source: homectl(1) --storage=luks
DefaultStorage=luks

# ext4 inside LUKS2 on /var/home: fast mount/fsck, zero double-CoW amplification
# on SD/eMMC storage, and instant sparse loopback activation with online discard.
# Source: homectl(1) --fs-type=ext4
DefaultFileSystemType=ext4

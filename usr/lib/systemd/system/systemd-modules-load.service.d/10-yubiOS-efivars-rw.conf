# systemd PID 1 mounts /sys/firmware/efi/efivars at early boot before optee and
# tee_stmm_efi load, so efivarfs_fill_super() initially sets SB_RDONLY (ro).
# Once systemd-modules-load.service loads tee, optee, and tee_stmm_efi, remount
# /sys/firmware/efi/efivars rw so first-boot Secure Boot enrollment can write
# PK, KEK, and db.
[Service]
ExecStartPost=-/bin/sh -c 'if [ -d /sys/firmware/efi/efivars ]; then mount -o remount,rw /sys/firmware/efi/efivars 2>/dev/null || { umount /sys/firmware/efi/efivars 2>/dev/null || true; mount -t efivarfs -o rw efivarfs /sys/firmware/efi/efivars 2>/dev/null || true; }; fi'

# Remount /sys/firmware/efi/efivars rw after tee_stmm_efi loads, and if owner
# Secure Boot keys were enrolled (.sb-enrolled) but volatile StMM reset on a
# microSD-only board without eMMC RPMB (SetupMode=1), restore db.auth, KEK.auth,
# and PK.auth into StandaloneMM automatically at boot.
[Service]
ExecStartPost=-/bin/sh -c 'if [ -d /sys/firmware/efi/efivars ]; then mount -o remount,rw /sys/firmware/efi/efivars 2>/dev/null || { umount /sys/firmware/efi/efivars 2>/dev/null || true; mount -t efivarfs -o rw efivarfs /sys/firmware/efi/efivars 2>/dev/null || true; }; sm_file=/sys/firmware/efi/efivars/SetupMode-8be4df61-93ca-11d2-aa0d-00e098032b8c; if [ -r "$sm_file" ] && [ "$(od -An -t u1 -j4 -N1 "$sm_file" | tr -d " ")" = "1" ]; then for d in /var/lib/yubiOS/secureboot /boot/EFI/yubiOS/secureboot; do if [ -f "$d/PK.auth" ] && [ -f "$d/KEK.auth" ] && [ -f "$d/db.auth" ]; then efi-updatevar -f "$d/db.auth" db 2>/dev/null || true; efi-updatevar -f "$d/KEK.auth" KEK 2>/dev/null || true; efi-updatevar -f "$d/PK.auth" PK 2>/dev/null || true; break; fi; done; fi; fi; /usr/lib/yubiOS/ab-etc-merge.sh 2>/dev/null || true'

# Keep /etc/machine-id set to "uninitialized" at switch-root on every boot until
# yubiOS-enroll.service has completed and written /var/lib/yubiOS/.enrolled.
# At switch-root, systemd PID 1 sees "uninitialized", activates ConditionFirstBoot=yes
# for the boot, and populates /etc/machine-id with a valid machine ID so
# systemd-pcrmachine.service, dbus-broker, and journald succeed.
[Service]
ExecStartPost=-/bin/sh -c 'if [ ! -e /sysroot/var/lib/yubiOS/.enrolled ] && [ -d /sysroot/etc ]; then printf "uninitialized\n" > /sysroot/etc/machine-id; fi'

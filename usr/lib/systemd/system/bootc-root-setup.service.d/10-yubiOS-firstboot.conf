# 1. If LABEL=yubiOS-luks exists (created during first-boot enrollment), unlock
#    it via YubiKey FIDO2 (PIN + touch) in initramfs before switching root, and
#    reconcile the A/B (/usr A + /usr B) 3-way /etc merge over /sysroot/etc.
# 2. If first-boot enrollment has not completed yet (! /var/lib/yubiOS/.enrolled),
#    keep /sysroot/etc/machine-id set to "uninitialized" so systemd PID 1 after
#    switch-root evaluates ConditionFirstBoot=yes as true and starts yubiOS-enroll.service.
[Unit]
Wants=systemd-ask-password-console.service
After=systemd-udevd.service

[Service]
ExecStartPre=-/bin/sh -c 'for i in 1 2 3 4 5; do [ -b /dev/disk/by-label/yubiOS-luks ] && break; sleep 1; done; if [ -b /dev/disk/by-label/yubiOS-luks ] && [ ! -b /dev/mapper/yubios-root ]; then /usr/lib/systemd/systemd-cryptsetup attach yubios-root /dev/disk/by-label/yubiOS-luks none fido2-device=auto,fido2-with-client-pin=yes,fido2-with-user-presence=yes; fi'
ExecStartPost=-/bin/sh -c 'if [ -b /dev/mapper/yubios-root ]; then mkdir -p /run/yubios-luks && mount /dev/mapper/yubios-root /run/yubios-luks 2>/dev/null || true; if mountpoint -q /run/yubios-luks 2>/dev/null; then cp -a /run/yubios-luks/etc/. /sysroot/etc/ 2>/dev/null || true; cp -a /run/yubios-luks/var/. /sysroot/var/ 2>/dev/null || true; umount /run/yubios-luks 2>/dev/null || true; fi; fi; if [ ! -f /sysroot/var/lib/yubiOS/.enrolled ] && [ -d /sysroot/etc ]; then printf "uninitialized\n" > /sysroot/etc/machine-id; fi'

# OPTIONAL drop-in: run yubiOS-chipsec-firstboot.service out of the signed
# CHIPSEC portable service image instead of the host /usr (ADR-024, OMN-18).
#
# NOT active by default. It lives outside every systemd unit search path so
# in-image execution is unchanged when no .raw is provisioned. To enable,
# provision the image built by mkosi --profile chipsec-portable
# (usr/lib/yubiOS/chipsec/build-portable-image.sh build) and then:
#
#   install -m 0644 yubios-chipsec-portable.raw /var/lib/portables/yubios-chipsec.raw
#   install -D -m 0644 /usr/lib/yubiOS/chipsec/yubiOS-chipsec-portable.conf \
#     /etc/systemd/system/yubiOS-chipsec-firstboot.service.d/50-portable.conf
#   systemctl daemon-reload
#
# The image is a DPS GPT image with root + root-verity + root-verity-sig
# partitions (mkosi Verity=signed). RootImagePolicy= refuses to mount it
# unless the root partition is dm-verity protected AND its root hash carries
# a valid PKCS#7 signature against the kernel keyring (.platform /
# .secondary_trusted_keys or the systemd verity keyring), and refuses any
# other partition (=absent default below).
#
# If the .raw is missing, ConditionPathExists= skips the unit (it does not
# fall back), so only install this drop-in together with the image.

[Unit]
ConditionPathExists=/var/lib/portables/yubios-chipsec.raw

[Service]
RootImage=/var/lib/portables/yubios-chipsec.raw
RootImagePolicy=root=signed:usr=signed+absent:=absent
# The status file must land on the HOST /run/yubiOS and /var/lib/yubiOS:
# RuntimeDirectory=/StateDirectory= in the main unit are bind-mounted into
# the RootImage namespace by systemd, so no extra BindPaths= are needed.
MountAPIVFS=yes
BindReadOnlyPaths=/sys/firmware

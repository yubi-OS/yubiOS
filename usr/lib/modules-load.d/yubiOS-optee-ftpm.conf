# Load OP-TEE and Microsoft fTPM TEE drivers early in initramfs and real root
# so /dev/tpm0 and /dev/tpmrm0 are probed at ~3s in initrd before tpm2.target
# and systemd-pcrphase-initrd.service (fixes 45s dev-tpm0.device initrd timeout
# and 54s delayed TPM probe on ARM64 boards such as ROCK 5B and PineTab2).
tee
optee
tpm_ftpm_tee

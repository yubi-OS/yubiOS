# Include crypt + systemd-cryptsetup + systemd-ask-password + fido2 + lvm + overlayfs + plymouth
# modules and USB/HID/Rockchip USB+DRM/HDMI PHY drivers in initramfs so dracut prompts for the
# YubiKey FIDO2 key at boot, renders the Plymouth boot splash on HDMI, and activates the yubios
# LVM VG before switching root.
# Source: https://www.freedesktop.org/software/systemd/man/latest/systemd-cryptenroll.html
add_dracutmodules+=" crypt systemd-cryptsetup systemd-ask-password fido2 lvm overlayfs plymouth drm "
add_drivers+=" dm_mod dm_crypt usbhid hid_generic xhci_hcd xhci_plat_hcd ehci_hcd ehci_platform ohci_hcd ohci_platform dwc3 dwc3_of_simple phy_rockchip_inno_usb2 phy_rockchip_naneng_combphy phy_rockchip_usbdp rockchipdrm dw_hdmi_qp phy_rockchip_samsung_hdptx analogix_dp "
install_items+=" /usr/bin/fido2-assert /usr/bin/fido2-token /usr/bin/cryptsetup /usr/lib/systemd/systemd-cryptsetup /usr/lib/systemd/system-generators/systemd-cryptsetup-generator /usr/lib/yubiOS/ab-etc-merge.sh /etc/plymouth/plymouthd.conf /usr/share/plymouth/plymouthd.defaults /usr/share/plymouth/themes/spinner/header-image.png /usr/share/plymouth/themes/spinner/watermark.png /usr/share/pixmaps/yubios-logo.png "

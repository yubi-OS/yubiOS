# Include crypt + systemd-cryptsetup + systemd-ask-password + fido2 modules
# and USB/HID/Rockchip USB PHY drivers in initramfs so dracut prompts for the
# YubiKey FIDO2 key at boot before switching root.
# Source: https://www.freedesktop.org/software/systemd/man/latest/systemd-cryptenroll.html
add_dracutmodules+=" crypt systemd-cryptsetup systemd-ask-password fido2 overlayfs "
add_drivers+=" dm_crypt usbhid hid_generic xhci_hcd xhci_plat_hcd ehci_hcd ehci_platform ohci_hcd ohci_platform dwc3 dwc3_of_simple phy_rockchip_inno_usb2 phy_rockchip_naneng_combphy phy_rockchip_usbdp "
install_items+=" /usr/bin/fido2-assert /usr/bin/fido2-token /usr/bin/cryptsetup /usr/lib/systemd/systemd-cryptsetup /usr/lib/systemd/system-generators/systemd-cryptsetup-generator /usr/lib/yubiOS/ab-etc-merge.sh "

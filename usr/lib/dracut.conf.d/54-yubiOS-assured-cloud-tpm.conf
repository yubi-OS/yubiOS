# Ensure multi-arch (amd64 + arm64) cloud Shielded VM vTPM (tpm_crb, tpm_tis)
# and cloud storage/network drivers (virtio, nvme, gve) are present in initramfs.
add_drivers+=" tpm tpm_tis tpm_tis_core tpm_crb tpm_ftpm_tee virtio_pci virtio_blk virtio_scsi virtio_net nvme gve "

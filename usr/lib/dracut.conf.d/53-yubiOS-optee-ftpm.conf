# Include OP-TEE + fTPM drivers and early modules-load config in the initramfs
# so ARM64 boards (ROCK 5B, PineTab2, RockPro64, QEMU virt) bring up /dev/tpm0
# and /dev/tpmrm0 at ~3s in initrd instead of timing out 45s on dev-tpm0.device
# and loading at ~54s after switch-root.
add_drivers+=" tee optee tpm_ftpm_tee dw_mmc dw_mmc-pltfm dw_mmc-rockchip sdhci-of-dwcmshc "
install_items+=" /usr/lib/modules-load.d/yubiOS-optee-ftpm.conf "

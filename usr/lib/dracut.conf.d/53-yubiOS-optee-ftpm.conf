# Include OP-TEE + fTPM + StMM EFI + RPMB + Rockchip PMIC/regulator/clock/DMA/MMC drivers,
# early modules-load config, efivarfs rw remount drop-in, and pre-enrollment firstboot hook.
add_drivers+=" rpmb-core tee efivarfs optee tpm_ftpm_tee tee_stmm_efi dw_mmc dw_mmc-pltfm dw_mmc-rockchip sdhci-of-dwcmshc sdhci-of-arasan phy-rockchip-emmc phy-rockchip-typec rk8xx-core rk8xx-i2c rk8xx-spi rk808-regulator clk-rk808 pwm-rockchip io-domain pl330 "
omit_drivers+=" dw_wdt rk3399_dmc rk_crypto "
install_items+=" /usr/lib/modprobe.d/yubiOS-rockchip.conf /usr/lib/modules-load.d/yubiOS-optee-ftpm.conf /usr/lib/systemd/system/systemd-modules-load.service.d/10-yubiOS-efivars-rw.conf /usr/lib/systemd/system/bootc-root-setup.service.d/10-yubiOS-firstboot.conf /usr/lib/systemd/system/yubiOS-lvm-usr-overlay.service "

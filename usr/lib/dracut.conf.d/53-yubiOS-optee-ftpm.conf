# Include OP-TEE + fTPM drivers, early modules-load config, and pre-enrollment
# firstboot machine-id hook in the initramfs so ARM64 boards (ROCK 5B, PineTab2,
# RockPro64, QEMU virt) bring up /dev/tpm0 and /dev/tpmrm0 at ~3s in initrd and
# preserve ConditionFirstBoot=yes until /var/lib/yubiOS/.enrolled is written.
add_drivers+=" tee optee tpm_ftpm_tee dw_mmc dw_mmc-pltfm dw_mmc-rockchip sdhci-of-dwcmshc "
install_items+=" /usr/lib/modules-load.d/yubiOS-optee-ftpm.conf /usr/lib/systemd/system/bootc-root-setup.service.d/10-yubiOS-firstboot.conf "

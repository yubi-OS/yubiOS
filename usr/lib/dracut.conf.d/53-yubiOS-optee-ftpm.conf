# Include OP-TEE + fTPM + StMM EFI drivers, early modules-load config, and
# pre-enrollment firstboot machine-id hook in the initramfs.
add_drivers+=" tee optee tpm_ftpm_tee tee_stmm_efi efivarfs dw_mmc dw_mmc-pltfm dw_mmc-rockchip sdhci-of-dwcmshc "
install_items+=" /usr/lib/modules-load.d/yubiOS-optee-ftpm.conf /usr/lib/systemd/system/bootc-root-setup.service.d/10-yubiOS-firstboot.conf "

# yubiOS bootc + libostree composefs dracut configuration.
# The upstream 51bootc module installs bootc-root-setup.service and the
# initramfs setup binary, while the ostree module + /usr/lib/ostree/prepare-root.conf
# (`[composefs] enabled = yes` per https://ostreedev.github.io/ostree/composefs/)
# enables libostree composefs root mounting and /run/ostree-booted registration.
# Source: https://github.com/bootc-dev/bootc/tree/main/crates/initramfs/dracut
# Source: https://ostreedev.github.io/ostree/composefs/
add_drivers+=" overlay erofs "
add_dracutmodules+=" bootc "
add_dracutmodules+=" ostree "
install_items+=" /usr/lib/ostree/prepare-root.conf "

# RK3588 (ROCK 5B) HDMI QP (hdmi-audio-codec) & ES8316 audio configuration (OMN-194).
# Prevents WirePlumber from probing unpopulated/disconnected dw-hdmi-qp ELD streams
# ("HDMI: Unknown ELD version 0" / "ASoC error (-19): at snd_soc_dai_prepare() on i2s-hifi")
# and pins standard 48kHz S16LE stereo parameters for connected HDMI / ES8316 outputs.
# ACP reads api.acp.auto-profile / api.acp.auto-port (not api.alsa.*). The ES8316
# analog card is pinned to the UCM "HiFi" profile; the image's UCM override
# (/usr/share/alsa/ucm2/Rockchip/rk3588-es8316/HiFi.conf) drops JackControl so the
# Headphones/Headset ports are never marked unavailable by the hp-det GPIO.
# Canonical vendor drop-in: not copied to /etc/wireplumber/wireplumber.conf.d/.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.platform-hdmi*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = false
        api.acp.auto-profile = false
        api.acp.auto-port = false
        device.profile = "output:stereo-fallback"
      }
    }
  }
  {
    matches = [
      {
        device.name = "~alsa_card.platform-analog-sound*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = true
        api.acp.auto-profile = false
        api.acp.auto-port = false
        device.profile = "HiFi"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.platform-hdmi*"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = "FL,FR"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.platform-analog-sound*"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = "FL,FR"
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

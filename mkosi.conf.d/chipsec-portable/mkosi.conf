# SPDX-License-Identifier: LGPL-2.1-or-later
# yubiOS CHIPSEC portable service image (ADR-024, OMN-18).
#
# Builds a Discoverable-Partitions-Specification GPT image with a dm-verity
# protected root and a PKCS#7-signed root hash (root + root-verity +
# root-verity-sig), consumed by
# usr/lib/yubiOS/chipsec/yubiOS-chipsec-portable.conf via RootImage= +
# RootImagePolicy=root=signed. The pinned CHIPSEC 1.13.16 install comes from
# mkosi.conf.d/chipsec/install-chipsec.sh (applies to every profile).
#
# Usage:  mkosi --profile chipsec-portable build
#   or:   usr/lib/yubiOS/chipsec/build-portable-image.sh build
# Output: mkosi.output/yubios-chipsec-portable.raw
#
# Verity signing key: mkosi uses VerityKey=/VerityCertificate= and defaults
# them to the SecureBoot key pair (mkosi.key / mkosi.crt). For an owner-held
# YubiKey PIV key (slot 9c) set VerityKeySource=engine:pkcs11 and point
# VerityKey= at the pkcs11: URI on the command line.

[Match]
Profile=chipsec-portable

[Output]
Format=portable
ImageId=yubios-chipsec
Output=yubios-chipsec-portable
SplitArtifacts=

[Validation]
Verity=signed

[Content]
Bootable=no
CleanPackageMetadata=yes
Packages=
        python3
        python3-pip
        kmod
        util-linux-core

PostInstallationScripts=mkosi.conf.d/chipsec-portable/mkosi.postinst

# Component CI adapted from the former yubi-OS/optee_os ci_test.yml. The
# checkout is an immutable yubiOS extension of the current upstream release;
# fetch-released-tag-ref verifies its release ancestry and exact fetchability.
name: ci_fork_optee_os

# yubiOS OP-TEE (BL32) fork CI — task T2 / C2 of #35.
# Builds OP-TEE core for PLATFORM=vexpress-qemu_armv8a plus the user-TA dev kit,
# with the yubiOS RPMB-backed secure-storage flags (CFG_RPMB_FS=y CFG_REE_FS=n
# CFG_EARLY_TA=y). The dev kit (export-ta_arm64) is what T3/C3 (optee_ftpm) builds
# its fTPM TA against, so this CI gates that dependency.
#
# BARE runners (no dhi container): OP-TEE needs a full cross toolchain
# (gcc-aarch64-linux-gnu + the 32-bit arm compiler for the ta_arm32 dev kit) plus
# libc/crt*.o that the hardened dhi base intentionally omits — same lesson as the
# bcvk Rust CI. Native multi-arch matrix kept for parity; aarch64 firmware cross-
# compiles cleanly on amd64 and builds native on the arm64 runner.
# Action refs pinned per PINNED.md.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build-optee:
    name: Build OP-TEE BL32 + TA devkit (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ${{ github.workflow }}-build-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      PLATFORM: vexpress-qemu_armv8a
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # see PINNED.md
        with:
          repository: yubi-OS/optee_os
          ref: 440b10c3f9b1c8501f2550e282ae071bb5424972 # release-descendant ref; see PINNED.md

      - name: Install OP-TEE build deps + cross toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            python3 python3-pip python3-pyelftools python3-cryptography \
            device-tree-compiler bison flex bc uuid-dev libssl-dev openssl \
            build-essential

      - name: Build OP-TEE core (BL32) + user-TA dev kit
        run: |
          make -C "$GITHUB_WORKSPACE" -j"$(nproc)" \
            PLATFORM="$PLATFORM" \
            CROSS_COMPILE64=aarch64-linux-gnu- \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            CFG_RPMB_FS=y \
            CFG_REE_FS=n \
            CFG_EARLY_TA=y \
            all

      - name: Verify BL32 images + TA dev kit exist
        run: |
          set -e
          fail=0
          for img in tee-header_v2.bin tee-pager_v2.bin tee-pageable_v2.bin; do
            found=$(find out -name "$img" -print -quit 2>/dev/null || true)
            if [ -n "$found" ]; then
              echo "OK  $img -> $found"
            else
              echo "MISSING  $img"; fail=1
            fi
          done
          # TA dev kit: modern OP-TEE exports export-ta_arm64 (older trees: export-user_ta).
          devkit=$(find out -type d \( -name 'export-ta_arm64' -o -name 'export-user_ta' \) -print -quit 2>/dev/null || true)
          if [ -n "$devkit" ]; then
            echo "OK  TA dev kit -> $devkit"
            ls "$devkit"
            test -d "$devkit/include" || { echo "dev kit has no include/ headers"; fail=1; }
          else
            echo "MISSING  TA dev kit (export-ta_arm64 / export-user_ta)"; fail=1
          fi
          exit $fail

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [build-optee]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

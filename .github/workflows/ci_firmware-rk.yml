            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Assemble board-scoped /firmware payload
        if: steps.rk_tpl_gate.outputs.skip_publish != '1'
        env:
          BOARD: ${{ matrix.board }}
          BOARD_TITLE: ${{ matrix.board_title }}
          STORAGE_NOTE: ${{ matrix.storage_note }}
          OPTEE_PLATFORM: ${{ matrix.optee_platform }}
          OPTEE_FLAVOR: ${{ matrix.optee_flavor }}
          TFA_PLAT: ${{ matrix.tfa_plat }}
          UBOOT_DEFCONFIG: ${{ matrix.uboot_defconfig }}
          REQUIRED_IMAGE: ${{ matrix.required_image }}
        run: |
          set -euxo pipefail
          source scripts/lib/reproducible-build.sh
          rm -rf fw
          mkdir -p fw/firmware
          find art -name fip.bin        -exec cp {} fw/firmware/ \; -quit
          find art -name flash.bin      -exec cp {} fw/firmware/ \; -quit
          find art -name bl1.bin        -exec cp {} fw/firmware/ \; -quit
          find art -name bl31.elf       -exec cp {} fw/firmware/ \; -quit
          find art -name BL32_AP_MM.fd  -exec cp {} fw/firmware/ \; -quit
          find art -name u-boot.bin     -exec cp {} fw/firmware/ \; -quit
          find art -name u-boot.itb     -exec cp {} fw/firmware/ \; -quit
          find art -name idbloader.img  -exec cp {} fw/firmware/ \; -quit
          find art -name u-boot-rockchip.bin     -exec cp {} fw/firmware/ \; -quit
          find art -name u-boot-rockchip-spi.bin -exec cp {} fw/firmware/ \; -quit
          find art -name fip-info.txt   -exec cp {} fw/firmware/ \; -quit
          find art -name firmware-manifest.txt   -exec cp {} fw/firmware/BUILD-MANIFEST.txt \; -quit
          # find art -name rk-tpl-required.txt     -exec cp {} fw/firmware/RK-TPL-REQUIRED.txt \; -quit
          find art -name tee.elf        -exec cp {} fw/firmware/ \; -quit
          find art -name tee.bin        -exec cp {} fw/firmware/ \; -quit
          find art -name 'tee-*_v2.bin' -exec cp {} fw/firmware/ \;
          if [ "$BOARD" = "qemu-arm64" ] && [ ! -s fw/firmware/flash.bin ]; then
            dd if=fw/firmware/bl1.bin of=fw/firmware/flash.bin bs=4096 conv=notrunc
            dd if=fw/firmware/fip.bin of=fw/firmware/flash.bin seek=64 bs=4096 conv=notrunc
          fi
          test -s "fw/firmware/${REQUIRED_IMAGE}" || echo "NO BOOTABLE RK IMAGE FOUND!"
          test -s fw/firmware/BL32_AP_MM.fd
          if [ "$BOARD" = "qemu-arm64" ]; then
            test -s fw/firmware/fip.bin
            test -s fw/firmware/bl1.bin
            test -s fw/firmware/flash.bin
          else
            test -s fw/firmware/bl31.elf
            test -s fw/firmware/u-boot.bin
            test -s fw/firmware/u-boot.itb || echo "NO BOOTABLE ITB IMAGE FOUND!"
            test -s fw/firmware/idbloader.img || echo "NO BOOTABLE IDB IMAGE FOUND!"
            test -s fw/firmware/tee.elf || test -s fw/firmware/tee.bin
          fi
          {
            echo "yubiOS ARM64 firmware bundle"
            echo "board=${BOARD}"
            echo "board_title=${BOARD_TITLE}"
            echo "yubios_commit=${GITHUB_SHA}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "tfa_ref=${TFA_REF}"
            echo "optee_os_ref=${OPTEE_OS_REF} (release provenance in PINNED.md)"
            echo "optee_ftpm_ref=${OPTEE_FTPM_REF} (release provenance in PINNED.md)"
            echo "uboot_ref=${UBOOT_REF}"
            echo "edk2_ref=${EDK2_REF}"
            echo "edk2_platforms_ref=${EDK2_PLATFORMS_REF}"
            echo "ms_tpm_ref=${MS_TPM_REF}"
            echo "ftpm_uuid=${FTPM_UUID}"
            echo "optee_platform=${OPTEE_PLATFORM}"
            echo "optee_flavor=${OPTEE_FLAVOR}"
            echo "tfa_plat=${TFA_PLAT}"
            echo "uboot_defconfig=${UBOOT_DEFCONFIG}"
            echo "required_image=${REQUIRED_IMAGE}"
            echo "storage_note=${STORAGE_NOTE}"
            if [ "$BOARD" = "qemu-arm64" ]; then
              echo "signature_envelope=TF-A CREATE_KEYS=1; excluded from byte-for-byte proof"
            fi
          } > fw/firmware/MANIFEST.txt
          normalize_reproducible_tree fw/firmware
          write_reproducible_checksums fw/firmware
          ls -l fw/firmware/

      - name: Log in to Docker Hub
        if: steps.rk_tpl_gate.outputs.skip_publish != '1'
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///run/docker-rootless/docker.sock login -u 0mniteck42 --password-stdin

      - name: Build and push firmware OCI artifact through Bake
        if: steps.rk_tpl_gate.outputs.skip_publish != '1'
        env:
          FIRMWARE_CONTEXT: fw
          FIRMWARE_BOARD: ${{ matrix.board }}
          FIRMWARE_BOARD_TITLE: ${{ matrix.board_title }}
          FIRMWARE_PUBLISH_ORIGINAL: ${{ matrix.publish_original }}
          GIT_SHA: ${{ github.sha }}
          PUSH: 'true'
        run: |
          set -euxo pipefail
          docker -H unix:///run/docker-rootless/docker.sock buildx bake \
            --builder hardened \
            --file yubiOS-bake.hcl \
            firmware
          docker -H unix:///run/docker-rootless/docker.sock logout

      - name: Verify pushed board tag
        if: steps.rk_tpl_gate.outputs.skip_publish != '1'
        env:
          BOARD: ${{ matrix.board }}
        run: docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "0mniteck/yubios:firmware-${BOARD}"

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [stmm, optee_fip, firmware-reproducibility, qemu, firmware-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

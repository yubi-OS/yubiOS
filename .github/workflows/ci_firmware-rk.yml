name: yubiOS RK firmware

# Rockchip-oriented firmware workflow derived from ci_test-int.yml.
# It keeps the existing QEMU-validated firmware build path and adds
# board-specific RK3399/RK3588 build lanes with their U-Boot defconfigs,
# OP-TEE platform flavors, and TF-A platforms. RK3588 remains gated on a real
# ROCKCHIP_TPL DDR blob; CI records that gate instead of publishing a faked
# non-functional Rockchip image.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'
        type: string
      Docker_push:
        description: 'Push firmware bundle and board-scoped variants to Docker Hub?'
        type: boolean
        required: false
        default: false
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

env:
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
  TFA_REF: da738d5eae93af342fdc4995dd3c05acb4c9d757 # release ref; see PINNED.md
  OPTEE_OS_REF: 440b10c3f9b1c8501f2550e282ae071bb5424972 # release-descendant ref; see PINNED.md
  OPTEE_FTPM_REF: 5e09cdbe1bcb1bc3bcf4875ebafb4e1a1154417c # release-descendant ref; see PINNED.md
  UBOOT_REF: ece349ade2973e220f524ce59e59711cc919263f # release ref; see PINNED.md
  EDK2_REF: b7a715f7c03c45c6b4575bf88596bfd79658b8ce # compatible release ref; see PINNED.md
  EDK2_PLATFORMS_REF: cc384840c440415a091623a7658112fedc416094 # compatibility ref; see PINNED.md
  MS_TPM_REF: 98b60a44aba79b15fcce1c0d1e46cf5918400f6a # release ref; see PINNED.md
  FTPM_UUID: bc50d971-d4c9-42c4-82cb-343fb7f37896
  MBEDTLS_REF: 0bebf8b8c7f07abe3571ded48a11aa907a1ffb20 # mbedtls-3.6.6

jobs:
  stmm:
    name: Stage 1 - BL32_AP_MM.fd (StandaloneMM RPMB, AARCH64) ${{ matrix.artifact_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
            buildx_arch: linux-amd64
            artifact_suffix: amd64
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64-repro
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:4440cf16b142316744a7fd1c5070eb23df54c7c335d8684c8d72864f0f3eb30e # auto-resolves to ${{ matrix.arch }}
    env:
      EDK2_REPO: https://github.com/yubi-OS/edk2.git
      EDK2_PLATFORMS_REPO: https://github.com/yubi-OS/edk2-platforms.git
      ACTIVE_PLATFORM: Platform/StandaloneMm/PlatformStandaloneMmPkg/PlatformStandaloneMmRpmb.dsc
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Install docker CLI + buildx (${{ matrix.arch }})
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.6.0.tgz"
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-rootless-extras-29.6.0.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.${{ matrix.buildx_arch }}"
          case "${{ matrix.docker_arch }}" in
            x86_64)
              DOCKER_SHA512=42401384ef853dab0a1986a7990420e77d3ee2bc39e178f8817d27ba6c4403998b7aacf3c28c7172135cdeec281cd328a8f2af949b5f57db44a211a093cfd20b
              ROOTLESS_SHA512=184b583a0f325bef12feaf1ca175ff5ea4a65a168f2136eb1daf9c2ae646eecf02134ed65766c8800bd8eb03ac4d338d1e5d700248bc33632027b5b0b52de48a
              BUILDX_SHA512=710f4f48a101af939c4a4cace5ca93ab8c1a1a9ae244a4ef73b2a900f228614472b635bd202fae383c851686d383a37cdeddf45e6d54b36cae8458826c272262
              ;;
            aarch64)
              DOCKER_SHA512=04713ac54030bed8b2c096280d034b02f5430ed73ba8bcc4a686f7bbbf4a3444eb027847e896cd9ee91c3237dbe1c25a4cfca43d1dcd922a1a10009c960ace0b
              ROOTLESS_SHA512=37649acdaacc597c115d2f19b71a4729a0119c6debbba4b4af18da2fd497ac28f5691df13137b7fc59903551ab0e08868f4b976a9a5704e2b7958b3b5b0cc0af
              BUILDX_SHA512=6dc0d4ed11a7bbd8148dab8897594d7050e7f3bc43e6d130e629aa443e50266e77beed8816737e5dc34b7d43617e7a4eef8121561042ef9a87479aea14383058
              ;;
            *)
              echo "Unsupported Docker artifact architecture: ${{ matrix.docker_arch }}" >&2
              exit 1
              ;;
          esac
          printf '%s  %s\n' "$DOCKER_SHA512" docker-29.6.0.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$ROOTLESS_SHA512" docker-rootless-extras-29.6.0.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$BUILDX_SHA512" "buildx-v0.35.0.${{ matrix.buildx_arch }}" | sha512sum --check --strict
          tar xzf docker-29.6.0.tgz
          tar xzf docker-rootless-extras-29.6.0.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 "buildx-v0.35.0.${{ matrix.buildx_arch }}" "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Install EDK2 build deps
        run: |
          set -euxo pipefail
          apt-get update -qq
          apt-get install -y -qq \
            build-essential uuid-dev iasl nasm \
            python3 python3-venv python3-pip \
            bison flex libssl-dev \
            gcc-aarch64-linux-gnu git || true

      - name: Clone edk2 + edk2-platforms
        run: |
          set -euxo pipefail
          ws="${RUNNER_TEMP:-$GITHUB_WORKSPACE}/yubios-rk-${{ matrix.arch }}-uefi"
          rm -rf "$ws"
          mkdir -p "$ws"
          echo "UEFI_WS=$ws" >> "$GITHUB_ENV"

          fetch_ref() {
            repo_url=$1
            ref=$2
            destination=$3
            git init -q "$destination"
            git -C "$destination" remote add origin "$repo_url"
            git -C "$destination" fetch -q --depth=1 --filter=tree:0 origin "$ref"
            git -C "$destination" checkout --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$ref"
          }

          fetch_ref "$EDK2_REPO" "$EDK2_REF" "$ws/edk2"
          fetch_ref "$EDK2_PLATFORMS_REPO" "$EDK2_PLATFORMS_REF" "$ws/edk2-platforms"
          git -C "$ws/edk2" submodule update --init --recursive
          test -f "$ws/edk2-platforms/$ACTIVE_PLATFORM"
          test -f "$ws/edk2-platforms/${ACTIVE_PLATFORM%.dsc}.fdf"

      - name: Resolve AARCH64 cross prefix
        id: tc
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "prefix=" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=aarch64-linux-gnu-" >> "$GITHUB_OUTPUT"
          fi

      - name: Build BaseTools
        # EDK2's VfrCompile generator uses an ordinary multi-target rule; a
        # parallel BaseTools build can run it more than once and consume
        # partially generated PCCTS headers on ARM64.
        run: make -C "$UEFI_WS/edk2/BaseTools" -j1

      - name: Build StandaloneMM RPMB platform
        run: |
          set -euxo pipefail
          ws="$UEFI_WS"
          export WORKSPACE="$ws"
          export PACKAGES_PATH="$ws/edk2:$ws/edk2-platforms"
          export EDK_TOOLS_PATH="$ws/edk2/BaseTools"
          export PYTHON_COMMAND=python3
          cd "$ws/edk2"
          # EDK2 setup scripts intentionally probe unset environment variables.
          set +u
          . ./edksetup.sh
          set -u
          cfg=CryptoPkg/Library/MbedTlsLib/Include/mbedtls/mbedtls_config.h
          sed -i 's@^#define MBEDTLS_HAVE_ASM@/* yubiOS CI: aarch64 inline asm disabled */ // #define MBEDTLS_HAVE_ASM@' "$cfg"
          sed -i 's@^#define MBEDTLS_AESCE_C@/* yubiOS CI: ARM AES-CE disabled under -mgeneral-regs-only */ // #define MBEDTLS_AESCE_C@' "$cfg"
          sed -i 's/ -Werror//g' Conf/tools_def.txt
          export GCCNOLTO_AARCH64_PREFIX="${{ steps.tc.outputs.prefix }}"
          source "$GITHUB_WORKSPACE/scripts/lib/reproducible-build.sh"
          write_reproducible_edk2_stack_cookies \
            "$ws/Build/MmStandaloneRpmb/RELEASE_GCCNOLTO" \
            "${EDK2_REF}:${EDK2_PLATFORMS_REF}:${ACTIVE_PLATFORM}"
          build -a AARCH64 -t GCCNOLTO -b RELEASE \
            -p "$ACTIVE_PLATFORM" \
            -n "$(nproc)" 2>&1 | tee "$ws/edk2-build.log"
          ! grep -q 'Failed to get Stack Cookie Value List' "$ws/edk2-build.log"

      - name: Stage BL32_AP_MM.fd
        run: |
          set -euxo pipefail
          fd="$(find "$UEFI_WS/Build" -name 'BL32_AP_MM.fd' | head -n1)"
          test -n "$fd"
          mkdir -p artifacts
          cp "$fd" artifacts/BL32_AP_MM.fd
          sha256sum artifacts/BL32_AP_MM.fd

      - name: Upload BL32_AP_MM.fd
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # PINNED.md
        with:
          name: BL32_AP_MM-${{ matrix.artifact_suffix }}
          path: artifacts/BL32_AP_MM.fd
          if-no-files-found: error

  optee_fip:
    name: Stage 2 - ${{ matrix.board }} OP-TEE/TF-A/U-Boot ${{ matrix.artifact_suffix }}
    needs: stmm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
            buildx_arch: linux-amd64
            artifact_suffix: amd64
            board: qemu-arm64
            board_title: QEMU ARM64 CI baseline
            build_kind: qemu
            uboot_defconfig: qemu_arm64_defconfig
            optee_platform: vexpress-qemu_armv8a
            optee_flavor: ''
            tfa_plat: qemu
            requires_rockchip_tpl: false
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64
            board: qemu-arm64
            board_title: QEMU ARM64 CI baseline
            build_kind: qemu
            uboot_defconfig: qemu_arm64_defconfig
            optee_platform: vexpress-qemu_armv8a
            optee_flavor: ''
            tfa_plat: qemu
            requires_rockchip_tpl: false
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
            buildx_arch: linux-amd64
            artifact_suffix: amd64
            board: rockpro64-rk3399
            board_title: ROCKPro64 / RK3399 supported secondary Path A
            build_kind: rockchip
            uboot_defconfig: rockpro64-rk3399_defconfig
            optee_platform: rockchip
            optee_flavor: rk3399
            tfa_plat: rk3399
            requires_rockchip_tpl: false
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64
            board: rockpro64-rk3399
            board_title: ROCKPro64 / RK3399 supported secondary Path A
            build_kind: rockchip
            uboot_defconfig: rockpro64-rk3399_defconfig
            optee_platform: rockchip
            optee_flavor: rk3399
            tfa_plat: rk3399
            requires_rockchip_tpl: false
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
            buildx_arch: linux-amd64
            artifact_suffix: amd64
            board: rock5b-rk3588
            board_title: Radxa ROCK 5B / RK3588 primary Path A
            build_kind: rockchip
            uboot_defconfig: rock5b-rk3588_defconfig
            optee_platform: rockchip
            optee_flavor: rk3588
            tfa_plat: rk3588
            requires_rockchip_tpl: true
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64
            board: rock5b-rk3588
            board_title: Radxa ROCK 5B / RK3588 primary Path A
            build_kind: rockchip
            uboot_defconfig: rock5b-rk3588_defconfig
            optee_platform: rockchip
            optee_flavor: rk3588
            tfa_plat: rk3588
            requires_rockchip_tpl: true
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64-repro
            board: qemu-arm64
            board_title: QEMU ARM64 CI baseline
            build_kind: qemu
            uboot_defconfig: qemu_arm64_defconfig
            optee_platform: vexpress-qemu_armv8a
            optee_flavor: ''
            tfa_plat: qemu
            requires_rockchip_tpl: false
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64-repro
            board: rockpro64-rk3399
            board_title: ROCKPro64 / RK3399 supported secondary Path A
            build_kind: rockchip
            uboot_defconfig: rockpro64-rk3399_defconfig
            optee_platform: rockchip
            optee_flavor: rk3399
            tfa_plat: rk3399
            requires_rockchip_tpl: false
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64-repro
            board: rock5b-rk3588
            board_title: Radxa ROCK 5B / RK3588 primary Path A
            build_kind: rockchip
            uboot_defconfig: rock5b-rk3588_defconfig
            optee_platform: rockchip
            optee_flavor: rk3588
            tfa_plat: rk3588
            requires_rockchip_tpl: true
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:4440cf16b142316744a7fd1c5070eb23df54c7c335d8684c8d72864f0f3eb30e # auto-resolves to ${{ matrix.arch }}
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Install docker CLI + buildx (${{ matrix.arch }})
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.6.0.tgz"
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-rootless-extras-29.6.0.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.${{ matrix.buildx_arch }}"
          case "${{ matrix.docker_arch }}" in
            x86_64)
              DOCKER_SHA512=42401384ef853dab0a1986a7990420e77d3ee2bc39e178f8817d27ba6c4403998b7aacf3c28c7172135cdeec281cd328a8f2af949b5f57db44a211a093cfd20b
              ROOTLESS_SHA512=184b583a0f325bef12feaf1ca175ff5ea4a65a168f2136eb1daf9c2ae646eecf02134ed65766c8800bd8eb03ac4d338d1e5d700248bc33632027b5b0b52de48a
              BUILDX_SHA512=710f4f48a101af939c4a4cace5ca93ab8c1a1a9ae244a4ef73b2a900f228614472b635bd202fae383c851686d383a37cdeddf45e6d54b36cae8458826c272262
              ;;
            aarch64)
              DOCKER_SHA512=04713ac54030bed8b2c096280d034b02f5430ed73ba8bcc4a686f7bbbf4a3444eb027847e896cd9ee91c3237dbe1c25a4cfca43d1dcd922a1a10009c960ace0b
              ROOTLESS_SHA512=37649acdaacc597c115d2f19b71a4729a0119c6debbba4b4af18da2fd497ac28f5691df13137b7fc59903551ab0e08868f4b976a9a5704e2b7958b3b5b0cc0af
              BUILDX_SHA512=6dc0d4ed11a7bbd8148dab8897594d7050e7f3bc43e6d130e629aa443e50266e77beed8816737e5dc34b7d43617e7a4eef8121561042ef9a87479aea14383058
              ;;
            *)
              echo "Unsupported Docker artifact architecture: ${{ matrix.docker_arch }}" >&2
              exit 1
              ;;
          esac
          printf '%s  %s\n' "$DOCKER_SHA512" docker-29.6.0.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$ROOTLESS_SHA512" docker-rootless-extras-29.6.0.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$BUILDX_SHA512" "buildx-v0.35.0.${{ matrix.buildx_arch }}" | sha512sum --check --strict
          tar xzf docker-29.6.0.tgz
          tar xzf docker-rootless-extras-29.6.0.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 "buildx-v0.35.0.${{ matrix.buildx_arch }}" "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Install full ARM64 firmware toolchain
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-arm-none-eabi python3 python3-venv python3-dev \
            python3-pyelftools python3-cryptography python3-setuptools \
            device-tree-compiler \
            openssl libssl-dev libgnutls28-dev \
            bison flex bc \
            uuid-dev iasl nasm swig \
            git ca-certificates || true
          if [ "$(uname -m)" = "x86_64" ]; then
            echo "AARCH64_PREFIX=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          else
            echo "AARCH64_PREFIX=" >> "$GITHUB_ENV"
          fi

      - name: Download BL32_AP_MM.fd from stmm job
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: BL32_AP_MM-${{ matrix.artifact_suffix }}
          path: stmm_artifact

      - name: Clone U-Boot and stage yubiOS fTPM fragment
        run: |
          set -euxo pipefail
          rm -rf u-boot
          git init -q u-boot
          git -C u-boot remote add origin https://github.com/yubi-OS/u-boot
          git -C u-boot fetch -q --depth=1 origin "$UBOOT_REF"
          git -C u-boot checkout --detach FETCH_HEAD
          test "$(git -C u-boot rev-parse HEAD)" = "$UBOOT_REF"
          cat > u-boot/yubios_ftpm.config <<'EOF'
          CONFIG_TEE=y
          CONFIG_OPTEE=y
          CONFIG_TPM=y
          CONFIG_TPM_V2=y
          CONFIG_TPM2_FTPM_TEE=y
          CONFIG_EFI_LOADER=y
          CONFIG_EFI_MM_COMM_TEE=y
          CONFIG_EFI_TCG2_PROTOCOL=y
          CONFIG_HASH=y
          CONFIG_MEASURED_BOOT=y
          CONFIG_CMD_TPM=y
          CONFIG_BOOTDELAY=1
          CONFIG_BOOTCOMMAND="tpm2 init && tpm2 startup TPM2_SU_CLEAR && tpm2 self_test full && echo YUBIOS_TPM_OK; bootefi bootmgr"
          # CONFIG_UNIT_TEST is not set
          EOF

      - name: Build QEMU U-Boot BL33
        if: matrix.build_kind == 'qemu'
        env:
          UBOOT_DEFCONFIG: ${{ matrix.uboot_defconfig }}
        run: |
          set -euxo pipefail
          make -C u-boot CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm "$UBOOT_DEFCONFIG"
          ./u-boot/scripts/kconfig/merge_config.sh -m -O u-boot u-boot/.config u-boot/yubios_ftpm.config
          make -C u-boot CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm olddefconfig
          make -C u-boot -j"$(nproc)" CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm
          test -f u-boot/u-boot.bin
          echo "BL33_BIN=$GITHUB_WORKSPACE/u-boot/u-boot.bin" >> "$GITHUB_ENV"

      - name: Stage StMM artifact
        run: |
          set -euxo pipefail
          fd="$(find stmm_artifact -name 'BL32_AP_MM.fd' -print -quit)"
          test -n "$fd"
          cp "$fd" "$GITHUB_WORKSPACE/BL32_AP_MM.fd"
          echo "STMM_FD=$GITHUB_WORKSPACE/BL32_AP_MM.fd" >> "$GITHUB_ENV"
          ls -l "$GITHUB_WORKSPACE/BL32_AP_MM.fd"

      - name: Build OP-TEE TA dev kit
        env:
          OPTEE_PLATFORM: ${{ matrix.optee_platform }}
          OPTEE_FLAVOR: ${{ matrix.optee_flavor }}
        run: |
          set -euxo pipefail
          rm -rf optee_os
          git init -q optee_os
          git -C optee_os remote add origin https://github.com/yubi-OS/optee_os
          git -C optee_os fetch -q --depth=1 origin "$OPTEE_OS_REF"
          git -C optee_os checkout --detach FETCH_HEAD
          test "$(git -C optee_os rev-parse HEAD)" = "$OPTEE_OS_REF"
          optee_args=(PLATFORM="$OPTEE_PLATFORM")
          if [ -n "$OPTEE_FLAVOR" ]; then
            optee_args+=(PLATFORM_FLAVOR="$OPTEE_FLAVOR")
          fi
          make -C optee_os -j"$(nproc)" \
            "${optee_args[@]}" \
            CROSS_COMPILE64=aarch64-linux-gnu- \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            CFG_RPMB_FS=y CFG_REE_FS=n CFG_EARLY_TA=y \
            CFG_STMM_VOLATILE_STORAGE=y \
            CFG_CORE_HEAP_SIZE=524288 CFG_TEE_RAM_VA_SIZE=0x00400000 \
            CFG_TEE_CORE_LOG_LEVEL=3 CFG_TEE_TA_LOG_LEVEL=3 \
            ta_dev_kit
          devkit="$(find "$GITHUB_WORKSPACE/optee_os/out" -type d -name 'export-ta_arm64' -print -quit)"
          test -f "$devkit/mk/ta_dev_kit.mk"
          echo "TA_DEV_KIT_DIR=$devkit" >> "$GITHUB_ENV"

      - name: Build fTPM TA
        run: |
          set -euxo pipefail
          rm -rf optee_ftpm ms-tpm-20-ref
          git init -q optee_ftpm
          git -C optee_ftpm remote add origin https://github.com/yubi-OS/optee_ftpm
          git -C optee_ftpm fetch -q --depth=1 origin "$OPTEE_FTPM_REF"
          git -C optee_ftpm checkout --detach FETCH_HEAD
          test "$(git -C optee_ftpm rev-parse HEAD)" = "$OPTEE_FTPM_REF"
          git init -q ms-tpm-20-ref
          git -C ms-tpm-20-ref remote add origin https://github.com/yubi-OS/ms-tpm-20-ref
          git -C ms-tpm-20-ref fetch -q --depth=1 origin "$MS_TPM_REF"
          git -C ms-tpm-20-ref checkout --detach FETCH_HEAD
          test "$(git -C ms-tpm-20-ref rev-parse HEAD)" = "$MS_TPM_REF"
          make -C optee_ftpm -j"$(nproc)" \
            CFG_FTPM_VOLATILE_NV=y \
            TA_DEV_KIT_DIR="$TA_DEV_KIT_DIR" \
            CFG_MS_TPM_20_REF="$GITHUB_WORKSPACE/ms-tpm-20-ref" \
            CROSS_COMPILE_ta_arm64=aarch64-linux-gnu- \
            CFG_ARM64_ta_arm64=y
          stripped="$(find optee_ftpm -name "${FTPM_UUID}.stripped.elf" -print -quit)"
          test -n "$stripped"
          echo "FTPM_TA=$GITHUB_WORKSPACE/$stripped" >> "$GITHUB_ENV"

      - name: Rebuild OP-TEE BL32 folding fTPM Early TA and StMM
        env:
          OPTEE_PLATFORM: ${{ matrix.optee_platform }}
          OPTEE_FLAVOR: ${{ matrix.optee_flavor }}
        run: |
          set -euxo pipefail
          optee_args=(PLATFORM="$OPTEE_PLATFORM")
          if [ -n "$OPTEE_FLAVOR" ]; then
            optee_args+=(PLATFORM_FLAVOR="$OPTEE_FLAVOR")
          fi
          make -C optee_os -j"$(nproc)" \
            "${optee_args[@]}" \
            CROSS_COMPILE64=aarch64-linux-gnu- \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            CFG_RPMB_FS=y CFG_REE_FS=n \
            CFG_STMM_VOLATILE_STORAGE=y \
            CFG_CORE_HEAP_SIZE=524288 CFG_TEE_RAM_VA_SIZE=0x00400000 \
            CFG_EARLY_TA=y EARLY_TA_PATHS="$FTPM_TA" \
            CFG_CORE_DYN_SHM=y \
            CFG_TEE_CORE_LOG_LEVEL=3 CFG_TEE_TA_LOG_LEVEL=3 \
            CFG_STMM_PATH="$STMM_FD" \
            all
          h="$(find optee_os/out -name tee-header_v2.bin -print -quit)"
          p="$(find optee_os/out -name tee-pager_v2.bin -print -quit)"
          x="$(find optee_os/out -name tee-pageable_v2.bin -print -quit)"
          test -n "$h" && test -n "$p" && test -n "$x"
          echo "BL32_HDR=$GITHUB_WORKSPACE/$h" >> "$GITHUB_ENV"
          echo "BL32_PAGER=$GITHUB_WORKSPACE/$p" >> "$GITHUB_ENV"
          echo "BL32_PAGEABLE=$GITHUB_WORKSPACE/$x" >> "$GITHUB_ENV"
          tee_bin="$(find optee_os/out -type f \( -name tee.elf -o -name tee.bin \) -print -quit)"
          test -n "$tee_bin"
          echo "TEE_BIN=$GITHUB_WORKSPACE/$tee_bin" >> "$GITHUB_ENV"

      - name: Build TF-A trusted firmware
        env:
          BUILD_KIND: ${{ matrix.build_kind }}
          TFA_PLAT: ${{ matrix.tfa_plat }}
        run: |
          set -euxo pipefail
          rm -rf arm-trusted-firmware mbedtls
          git init -q arm-trusted-firmware
          git -C arm-trusted-firmware remote add origin https://github.com/yubi-OS/arm-trusted-firmware
          git -C arm-trusted-firmware fetch -q --depth=1 origin "$TFA_REF"
          git -C arm-trusted-firmware checkout --detach FETCH_HEAD
          test "$(git -C arm-trusted-firmware rev-parse HEAD)" = "$TFA_REF"
          if [ "$TFA_PLAT" = "rk3399" ]; then
            m0_makefile=arm-trusted-firmware/plat/rockchip/rk3399/drivers/m0/Makefile
            sed -i 's/-Wall -O3 -nostdlib/-Wall -Os -nostdlib/' "$m0_makefile"
            grep -q -- '-Wall -Os -nostdlib' "$m0_makefile"
          fi
          CROSS=""
          [ "$(uname -m)" = "x86_64" ] && CROSS="aarch64-linux-gnu-"
          tfa_args=(
            CROSS_COMPILE="${CROSS}"
            PLAT="$TFA_PLAT"
            ARCH=aarch64
            BUILD_MESSAGE_TIMESTAMP="\"${TF_A_BUILD_TIMESTAMP}\""
            BUILD_STRING="$TF_A_BUILD_STRING"
          )
          if [ "$TFA_PLAT" = "rk3399" ]; then
            tfa_ld="${CROSS}ld.bfd"
            if [ -z "$CROSS" ]; then
              tfa_ld=ld.bfd
            fi
            command -v "$tfa_ld"
            "$tfa_ld" --version
            tfa_args+=(LD="$tfa_ld")
          fi
          if [ "$BUILD_KIND" = "qemu" ]; then
            git init -q mbedtls
            git -C mbedtls remote add origin https://github.com/Mbed-TLS/mbedtls
            git -C mbedtls fetch --depth 1 origin "$MBEDTLS_REF"
            git -C mbedtls checkout --detach FETCH_HEAD
            make -C arm-trusted-firmware -j"$(nproc)" \
              "${tfa_args[@]}" \
              SPD=opteed \
              BL32="$BL32_HDR" BL32_EXTRA1="$BL32_PAGER" BL32_EXTRA2="$BL32_PAGEABLE" \
              BL32_RAM_LOCATION=tdram \
              BL33="$BL33_BIN" \
              TRUSTED_BOARD_BOOT=1 GENERATE_COT=1 CREATE_KEYS=1 \
              MBEDTLS_DIR="$GITHUB_WORKSPACE/mbedtls" \
              DEBUG=1 \
              all fip
            fip="$(find arm-trusted-firmware/build -name fip.bin -print -quit)"
            test -n "$fip"
            echo "FIP_BIN=$GITHUB_WORKSPACE/$fip" >> "$GITHUB_ENV"
            flash="$(find arm-trusted-firmware/build -name flash.bin -print -quit || true)"
            if [ -n "$flash" ]; then
              echo "FLASH_BIN=$GITHUB_WORKSPACE/$flash" >> "$GITHUB_ENV"
            fi
          else
            make -C arm-trusted-firmware -j"$(nproc)" \
              "${tfa_args[@]}" \
              bl31
            bl31="$(find arm-trusted-firmware/build -path "*/release/bl31/bl31.elf" -print -quit)"
            test -n "$bl31"
            echo "BL31_BIN=$GITHUB_WORKSPACE/$bl31" >> "$GITHUB_ENV"
          fi

      - name: Verify FIP contents
        if: matrix.build_kind == 'qemu'
        run: |
          set -euxo pipefail
          ft=arm-trusted-firmware/tools/fiptool/fiptool
          test -x "$ft" || make -C arm-trusted-firmware fiptool
          "$ft" info "$FIP_BIN" | tee fip-info.txt
          grep -qi 'Secure Payload BL32\|tos-fw\|Trusted OS' fip-info.txt
          grep -qi 'Non-Trusted Firmware BL33\|nt-fw\|Non-Trusted' fip-info.txt

      - name: Build Rockchip U-Boot board image
        if: matrix.build_kind == 'rockchip'
        env:
          BOARD: ${{ matrix.board }}
          UBOOT_DEFCONFIG: ${{ matrix.uboot_defconfig }}
          REQUIRES_ROCKCHIP_TPL: ${{ matrix.requires_rockchip_tpl }}
        run: |
          set -euxo pipefail
          make -C u-boot CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm "$UBOOT_DEFCONFIG"
          ./u-boot/scripts/kconfig/merge_config.sh -m -O u-boot u-boot/.config u-boot/yubios_ftpm.config
          make -C u-boot CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm olddefconfig
          grep -E 'CONFIG_ROCKCHIP_RK(3399|3588)=y|CONFIG_ROCKCHIP_EXTERNAL_TPL=y|CONFIG_SPL_ATF=y|CONFIG_TPM2_FTPM_TEE=y' \
            u-boot/.config | tee u-boot-config-summary.txt
          make -C u-boot -j"$(nproc)" CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm u-boot.bin
          test -s u-boot/u-boot.bin
          build_args=(BL31="$BL31_BIN" TEE="$TEE_BIN")
          if [ "$REQUIRES_ROCKCHIP_TPL" = "true" ]; then
            if [ -z "${ROCKCHIP_TPL:-}" ]; then
              {
                echo "board=${BOARD}"
                echo "uboot_defconfig=${UBOOT_DEFCONFIG}"
                echo "reason=ROCKCHIP_TPL is required for RK3588 board images"
                echo "detail=U-Boot RK3588 Kconfig implies ROCKCHIP_EXTERNAL_TPL; binman marks missing/faked blobs non-functional."
                echo "next=Provide a real rk3588 DDR/TPL blob via ROCKCHIP_TPL before publishing firmware-${BOARD}."
              } > rk-tpl-required.txt
              echo "::notice title=RK3588 external TPL required::${BOARD} built source firmware pieces, but skipped the final Rockchip image because ROCKCHIP_TPL is unset."
              exit 0
            fi
            test -s "$ROCKCHIP_TPL"
            build_args+=(ROCKCHIP_TPL="$ROCKCHIP_TPL")
          fi
          make -C u-boot -j"$(nproc)" CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm "${build_args[@]}" 2>&1 | tee u-boot-build.log
          ! grep -Eiq 'missing external blobs|faked external blobs|non-functional|Some images are invalid' u-boot-build.log
          test -s u-boot/u-boot.bin

      - name: Write firmware artifact manifest
        if: always()
        env:
          BOARD: ${{ matrix.board }}
          BOARD_TITLE: ${{ matrix.board_title }}
          BUILD_KIND: ${{ matrix.build_kind }}
          UBOOT_DEFCONFIG: ${{ matrix.uboot_defconfig }}
          OPTEE_PLATFORM: ${{ matrix.optee_platform }}
          OPTEE_FLAVOR: ${{ matrix.optee_flavor }}
          TFA_PLAT: ${{ matrix.tfa_plat }}
          REQUIRES_ROCKCHIP_TPL: ${{ matrix.requires_rockchip_tpl }}
        run: |
          set -euo pipefail
          {
            echo "yubiOS ARM64 firmware build artifact"
            echo "board=${BOARD}"
            echo "board_title=${BOARD_TITLE}"
            echo "build_kind=${BUILD_KIND}"
            echo "arch=${{ matrix.arch }}"
            echo "uboot_defconfig=${UBOOT_DEFCONFIG}"
            echo "optee_platform=${OPTEE_PLATFORM}"
            echo "optee_flavor=${OPTEE_FLAVOR}"
            echo "tfa_plat=${TFA_PLAT}"
            echo "rockchip_tpl_required=${REQUIRES_ROCKCHIP_TPL}"
            if [ -n "${ROCKCHIP_TPL:-}" ]; then
              echo "rockchip_tpl_provided=true"
            else
              echo "rockchip_tpl_provided=false"
            fi
            echo "yubios_commit=${GITHUB_SHA}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "tfa_ref=${TFA_REF}"
            echo "optee_os_ref=${OPTEE_OS_REF}"
            echo "optee_ftpm_ref=${OPTEE_FTPM_REF}"
            echo "uboot_ref=${UBOOT_REF}"
            echo "edk2_ref=${EDK2_REF}"
            echo "edk2_platforms_ref=${EDK2_PLATFORMS_REF}"
            echo "ms_tpm_ref=${MS_TPM_REF}"
            echo "ftpm_uuid=${FTPM_UUID}"
            if [ "$BUILD_KIND" = "qemu" ]; then
              echo "signature_envelope=TF-A CREATE_KEYS=1; excluded from byte-for-byte proof"
            fi
            if [ -n "${ROCKCHIP_TPL:-}" ]; then
              echo "rockchip_tpl_sha256=$(sha256sum "$ROCKCHIP_TPL" | cut -d' ' -f1)"
            fi
          } > firmware-manifest.txt

      - name: Upload fip + flash artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # PINNED.md
        with:
          name: fip-flash-${{ matrix.board }}-${{ matrix.artifact_suffix }}
          path: |
            arm-trusted-firmware/build/**/fip.bin
            arm-trusted-firmware/build/**/flash.bin
            arm-trusted-firmware/build/**/bl1.bin
            arm-trusted-firmware/build/**/bl31.elf
            BL32_AP_MM.fd
            optee_os/out/**/tee-*_v2.bin
            optee_os/out/**/tee.elf
            optee_os/out/**/tee.bin
            u-boot/u-boot.bin
            u-boot/u-boot.itb
            u-boot/idbloader.img
            u-boot/u-boot-rockchip.bin
            u-boot/u-boot-rockchip-spi.bin
            fip-info.txt
            u-boot-config-summary.txt
            u-boot-build.log
            rk-tpl-required.txt
            firmware-manifest.txt
          if-no-files-found: warn
          retention-days: 7

  firmware-reproducibility:
    name: Stage 2 proof - ${{ matrix.board }} unsigned components (arm64)
    needs: [stmm, optee_fip]
    strategy:
      fail-fast: false
      matrix:
        board: [qemu-arm64, rockpro64-rk3399, rock5b-rk3588]
    runs-on: ubuntu-24.04
    container:
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:4440cf16b142316744a7fd1c5070eb23df54c7c335d8684c8d72864f0f3eb30e
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git
          apt-get install -y -qq --no-install-recommends python3

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: arm64
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Clean firmware proof workspace
        run: rm -rf proof repro-evidence

      - name: Download primary StandaloneMM artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: BL32_AP_MM-arm64
          path: proof/primary/stmm

      - name: Download rebuilt StandaloneMM artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: BL32_AP_MM-arm64-repro
          path: proof/rebuild/stmm

      - name: Download primary board artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: fip-flash-${{ matrix.board }}-arm64
          path: proof/primary/firmware

      - name: Download rebuilt board artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: fip-flash-${{ matrix.board }}-arm64-repro
          path: proof/rebuild/firmware

      - name: Prove two clean firmware component builds match
        run: |
          python3 scripts/verify-reproducible-firmware.py \
            "${{ matrix.board }}" \
            proof/primary \
            proof/rebuild \
            "repro-evidence/firmware-${{ matrix.board }}-arm64.json"

      - name: Retain firmware reproducibility evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # PINNED.md
        with:
          name: reproducibility-firmware-${{ matrix.board }}-arm64-${{ github.sha }}
          path: repro-evidence/firmware-${{ matrix.board }}-arm64.json
          if-no-files-found: error
          retention-days: 30

  qemu:
    name: Stage 3 - QEMU fTPM e2e (${{ matrix.arch }})
    needs: [optee_fip, firmware-reproducibility]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
            buildx_arch: linux-amd64
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            docker_arch: aarch64
            buildx_arch: linux-arm64
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:4440cf16b142316744a7fd1c5070eb23df54c7c335d8684c8d72864f0f3eb30e # auto-resolves to ${{ matrix.arch }}
    env:
      BOOT_TIMEOUT: '180'
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Install docker CLI + buildx (${{ matrix.arch }})
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.6.0.tgz"
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-rootless-extras-29.6.0.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.${{ matrix.buildx_arch }}"
          case "${{ matrix.docker_arch }}" in
            x86_64)
              DOCKER_SHA512=42401384ef853dab0a1986a7990420e77d3ee2bc39e178f8817d27ba6c4403998b7aacf3c28c7172135cdeec281cd328a8f2af949b5f57db44a211a093cfd20b
              ROOTLESS_SHA512=184b583a0f325bef12feaf1ca175ff5ea4a65a168f2136eb1daf9c2ae646eecf02134ed65766c8800bd8eb03ac4d338d1e5d700248bc33632027b5b0b52de48a
              BUILDX_SHA512=710f4f48a101af939c4a4cace5ca93ab8c1a1a9ae244a4ef73b2a900f228614472b635bd202fae383c851686d383a37cdeddf45e6d54b36cae8458826c272262
              ;;
            aarch64)
              DOCKER_SHA512=04713ac54030bed8b2c096280d034b02f5430ed73ba8bcc4a686f7bbbf4a3444eb027847e896cd9ee91c3237dbe1c25a4cfca43d1dcd922a1a10009c960ace0b
              ROOTLESS_SHA512=37649acdaacc597c115d2f19b71a4729a0119c6debbba4b4af18da2fd497ac28f5691df13137b7fc59903551ab0e08868f4b976a9a5704e2b7958b3b5b0cc0af
              BUILDX_SHA512=6dc0d4ed11a7bbd8148dab8897594d7050e7f3bc43e6d130e629aa443e50266e77beed8816737e5dc34b7d43617e7a4eef8121561042ef9a87479aea14383058
              ;;
            *)
              echo "Unsupported Docker artifact architecture: ${{ matrix.docker_arch }}" >&2
              exit 1
              ;;
          esac
          printf '%s  %s\n' "$DOCKER_SHA512" docker-29.6.0.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$ROOTLESS_SHA512" docker-rootless-extras-29.6.0.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$BUILDX_SHA512" "buildx-v0.35.0.${{ matrix.buildx_arch }}" | sha512sum --check --strict
          tar xzf docker-29.6.0.tgz
          tar xzf docker-rootless-extras-29.6.0.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 "buildx-v0.35.0.${{ matrix.buildx_arch }}" "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Install QEMU + TPM tooling
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-utils tpm2-tools python3 coreutils ca-certificates ipxe-qemu || true
          qemu-system-aarch64 --version

      - name: Clean QEMU artifact directory
        run: rm -rf image

      - name: Download fip/flash from optee_fip job
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: fip-flash-qemu-arm64-${{ matrix.arch }}
          path: image

      - name: Resolve or assemble flash.bin
        id: image
        run: |
          set -euxo pipefail
          rm -rf image/flash.bin
          flash="$(find image -name flash.bin -type f -print -quit 2>/dev/null || true)"
          if [ -z "$flash" ]; then
            bl1="$(find image -name bl1.bin -type f -print -quit 2>/dev/null || true)"
            fip="$(find image -name fip.bin -type f -print -quit 2>/dev/null || true)"
            if [ -n "$bl1" ] && [ -n "$fip" ]; then
              dd if="$bl1" of=image/flash.bin bs=4096 conv=notrunc
              dd if="$fip" of=image/flash.bin seek=64 bs=4096 conv=notrunc
              flash="image/flash.bin"
            fi
          fi
          if [ -n "$flash" ]; then
            echo "flash=$flash" >> "$GITHUB_OUTPUT"
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=No bootable image::optee_fip produced no flash.bin/fip.bin."
          fi

      - name: Boot stitched image under QEMU and assert fTPM markers
        if: steps.image.outputs.ready == '1'
        run: |
          set -euxo pipefail
          timeout "$BOOT_TIMEOUT" qemu-system-aarch64 \
            -M virt,secure=on -cpu max -m 2048 \
            -bios "${{ steps.image.outputs.flash }}" \
            -nographic -d guest_errors \
            -serial file:nw.log -serial file:optee.log || true
          touch nw.log optee.log
          fail=0
          grep -Eiq "early_ta_init.*${FTPM_UUID}|Early TA ${FTPM_UUID}" nw.log optee.log \
            && echo "PASS: fTPM Early TA at init" || { echo "::error::fTPM Early TA not at init"; fail=1; }
          grep -Eiq "ldelf: Loading TS ${FTPM_UUID}|Lookup user TA ELF ${FTPM_UUID}" nw.log optee.log \
            && echo "PASS: fTPM TA probed" || { echo "::error::fTPM TA never probed"; fail=1; }
          grep -q "YUBIOS_TPM_OK" nw.log \
            && echo "PASS: fTPM functional" || { echo "::error::fTPM not functional"; fail=1; }
          ! grep -Eq "Missing TPMv2 device|Couldn't set TPM|TA panicked|ldelf failed|data-abort" nw.log optee.log \
            && echo "PASS: no known failure signatures" || { echo "::error::known failure signature present"; fail=1; }
          grep -Eiq "stmm load address" nw.log optee.log \
            && echo "PASS: StMM SP loaded into OP-TEE" || { echo "::error::StMM SP never loaded"; fail=1; }
          [ "$fail" -eq 0 ]

      - name: Loud skip when no bootable image exists
        if: steps.image.outputs.ready != '1'
        run: echo "::notice title=QEMU e2e loud skip::No fip/flash artifact was available."

  firmware-publish:

name: yubiOS RK firmware

# Rockchip-oriented firmware workflow derived from ci_test-int.yml.
# It keeps the existing QEMU-validated firmware build path and adds
# board-specific RK3399/RK3566/RK3588 build lanes with their U-Boot defconfigs,
# OP-TEE platform flavors, and TF-A platforms. RK3588 remains gated on a real
# ROCKCHIP_TPL DDR blob; CI records that gate instead of publishing a faked
# non-functional Rockchip image.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'
        type: string
      Docker_push:
        description: 'Push firmware bundle and board-scoped variants to Docker Hub?'
        type: boolean
        required: false
        default: false
      burn_otp_fuses:
        description: 'Disable OP-TEE CFG_RK_SECURE_BOOT_SIMULATION to burn OTP fuses on hardware? (IRREVERSIBLE — keep false unless rehearsing on a sacrificial board)'
        type: boolean
        required: false
        default: false
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

env:
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb # v0.35.0
  TFA_REF: da738d5eae93af342fdc4995dd3c05acb4c9d757 # release ref; see PINNED.md
  OPTEE_OS_REF: 462e8e6793b988c5b3d2b815b17d091012ceffd7 # release-descendant ref; see PINNED.md
  OPTEE_FTPM_REF: b78d47800ca1a162f860c031cf1bf2bb0ed6cfbf # release-descendant ref; see PINNED.md
  UBOOT_REF: 8e7b49c78689957d3ee8eb217d7bdadad3026bd9 # release-descendant ref; see PINNED.md
  EDK2_REF: b7a715f7c03c45c6b4575bf88596bfd79658b8ce # compatible release ref; see PINNED.md
  EDK2_PLATFORMS_REF: cc384840c440415a091623a7658112fedc416094 # compatibility ref; see PINNED.md
  MS_TPM_REF: 6c893ca8ebbbcb55ba788d8f289a5d4e64bc0d48 # yubios branch (v1.83r1 descendant); see PINNED.md
  FTPM_UUID: bc50d971-d4c9-42c4-82cb-343fb7f37896
  MBEDTLS_REF: 068ff080b369adfac81509f9b57b2afabaf82dc5 # mbedtls-3.6.7

jobs:
  stmm:
    name: Stage 1 - BL32_AP_MM.fd (StandaloneMM RPMB, AARCH64) ${{ matrix.artifact_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64-repro
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:1aa0a2307eea88ae00d07c7b3c8e804187ee272ccc89cde7b51667b3b065fb1d # trixie-debian13-dev — auto-resolves to ${{ matrix.arch }}
    env:
      EDK2_REPO: https://github.com/yubi-OS/edk2.git
      EDK2_PLATFORMS_REPO: https://github.com/yubi-OS/edk2-platforms.git
      ACTIVE_PLATFORM: Platform/StandaloneMm/PlatformStandaloneMmPkg/PlatformStandaloneMmRpmb.dsc
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Install docker CLI + buildx (${{ matrix.arch }})
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.9.3.tgz"
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-rootless-extras-29.9.3.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.39.0/buildx-v0.39.0.${{ matrix.buildx_arch }}"
          case "${{ matrix.docker_arch }}" in
            x86_64)
              DOCKER_SHA512=ff0eeb5d9994a6891b9bebe7c37c8982642da9fdc3b7f19302b3c2276b306b859d56e76f00148eeed2e36daffa576873e15276d79a61e1798e11741511c6e65e # 29.9.3 (linux/amd64)
              ROOTLESS_SHA512=3ea734eb68ae8e74159725410072bc196251bba2f12988014193d694a8a12e4a38f448c1d980563e810cfa4c92c8e364e8aa69652eda1900f91768ea7badb693 # 29.9.3 (linux/amd64)
              BUILDX_SHA512=9c3a17f0b782cfcc12b883546ed4efe684900f2139bee2ca369518aea35ea36a44201f9669f0eab43fca926926d90e11bf8cabf4a87653ad7aff50c5dba80fa6 # v0.39.0 (linux/amd64)
              ;;
            aarch64)
              DOCKER_SHA512=373b7542d225479e066cb540889cf24035f7909a17519845bedb93bb0b208c3bdd778af47d412de52136bf98d63ac1a5aba76e09eacd15641151c6e7f73aa198 # 29.9.3 (linux/arm64)
              ROOTLESS_SHA512=7bab17249d06874cd5900ffc9908db692e8f158e17b03fc8afff5b9feaab5044752f7a018225695f8ca548212fa4d5095c3f15d0b06ed263f00ab4a895d6fc8a # 29.9.3 (linux/arm64)
              BUILDX_SHA512=810c87058af0abb1205366d85ac47c3b1111676f7ae411fba19d3fe49a13a0695fe0d8bb03cdbd097132507eec19c7aecf4189e3ca30cab0e4a2a3b92ce8ad2b # v0.39.0 (linux/arm64)
              ;;
            *)
              echo "Unsupported Docker artifact architecture: ${{ matrix.docker_arch }}" >&2
              exit 1
              ;;
          esac
          printf '%s  %s\n' "$DOCKER_SHA512" docker-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$ROOTLESS_SHA512" docker-rootless-extras-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$BUILDX_SHA512" "buildx-v0.39.0.${{ matrix.buildx_arch }}" | sha512sum --check --strict
          tar xzf docker-29.9.3.tgz
          tar xzf docker-rootless-extras-29.9.3.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 "buildx-v0.39.0.${{ matrix.buildx_arch }}" "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Install EDK2 build deps
        run: |
          set -euxo pipefail
          apt-get update -qq
          apt-get install -y -qq \
            build-essential uuid-dev iasl nasm \
            python3 python3-venv python3-pip \
            bison flex libssl-dev \
            gcc-aarch64-linux-gnu git || true

      - name: Clone edk2 + edk2-platforms
        run: |
          set -euxo pipefail
          ws="${RUNNER_TEMP:-$GITHUB_WORKSPACE}/yubios-rk-${{ matrix.arch }}-uefi"
          rm -rf "$ws"
          mkdir -p "$ws"
          echo "UEFI_WS=$ws" >> "$GITHUB_ENV"

          fetch_ref() {
            repo_url=$1
            ref=$2
            destination=$3
            git init -q "$destination"
            git -C "$destination" remote add origin "$repo_url"
            git -C "$destination" fetch -q --depth=1 --filter=tree:0 origin "$ref"
            git -C "$destination" checkout --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$ref"
          }

          fetch_ref "$EDK2_REPO" "$EDK2_REF" "$ws/edk2"
          fetch_ref "$EDK2_PLATFORMS_REPO" "$EDK2_PLATFORMS_REF" "$ws/edk2-platforms"
          git -C "$ws/edk2" submodule update --init --recursive
          test -f "$ws/edk2-platforms/$ACTIVE_PLATFORM"
          test -f "$ws/edk2-platforms/${ACTIVE_PLATFORM%.dsc}.fdf"

      - name: Resolve AARCH64 cross prefix
        id: tc
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "prefix=" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=aarch64-linux-gnu-" >> "$GITHUB_OUTPUT"
          fi

      - name: Build BaseTools
        # EDK2's VfrCompile generator uses an ordinary multi-target rule; a
        # parallel BaseTools build can run it more than once and consume
        # partially generated PCCTS headers on ARM64.
        run: make -C "$UEFI_WS/edk2/BaseTools" -j1

      - name: Build StandaloneMM RPMB platform
        run: |
          set -euxo pipefail
          ws="$UEFI_WS"
          export WORKSPACE="$ws"
          export PACKAGES_PATH="$ws/edk2:$ws/edk2-platforms"
          export EDK_TOOLS_PATH="$ws/edk2/BaseTools"
          export PYTHON_COMMAND=python3
          cd "$ws/edk2"
          # EDK2 setup scripts intentionally probe unset environment variables.
          set +u
          . ./edksetup.sh
          set -u
          cfg=CryptoPkg/Library/MbedTlsLib/Include/mbedtls/mbedtls_config.h
          sed -i 's@^#define MBEDTLS_HAVE_ASM@/* yubiOS CI: aarch64 inline asm disabled */ // #define MBEDTLS_HAVE_ASM@' "$cfg"
          sed -i 's@^#define MBEDTLS_AESCE_C@/* yubiOS CI: ARM AES-CE disabled under -mgeneral-regs-only */ // #define MBEDTLS_AESCE_C@' "$cfg"
          sed -i 's/ -Werror//g' Conf/tools_def.txt
          export GCCNOLTO_AARCH64_PREFIX="${{ steps.tc.outputs.prefix }}"
          source "$GITHUB_WORKSPACE/scripts/lib/reproducible-build.sh"
          write_reproducible_edk2_stack_cookies \
            "$ws/Build/MmStandaloneRpmb/RELEASE_GCCNOLTO" \
            "${EDK2_REF}:${EDK2_PLATFORMS_REF}:${ACTIVE_PLATFORM}"
          build -a AARCH64 -t GCCNOLTO -b RELEASE \
            -p "$ACTIVE_PLATFORM" \
            -n "$(nproc)" 2>&1 | tee "$ws/edk2-build.log"
          ! grep -q 'Failed to get Stack Cookie Value List' "$ws/edk2-build.log"

      - name: Stage BL32_AP_MM.fd
        run: |
          set -euxo pipefail
          fd="$(find "$UEFI_WS/Build" -name 'BL32_AP_MM.fd' | head -n1)"
          test -n "$fd"
          mkdir -p artifacts
          cp "$fd" artifacts/BL32_AP_MM.fd
          sha256sum artifacts/BL32_AP_MM.fd

      - name: Upload BL32_AP_MM.fd
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — see PINNED.md
        with:
          name: BL32_AP_MM-${{ matrix.artifact_suffix }}
          path: artifacts/BL32_AP_MM.fd
          if-no-files-found: error

  optee_fip:
    name: Stage 2 - ${{ matrix.board }} OP-TEE/TF-A/U-Boot ${{ matrix.artifact_suffix }}
    needs: stmm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64
            board: qemu-arm64
            board_title: QEMU ARM64 CI baseline
            build_kind: qemu
            uboot_defconfig: qemu_arm64_defconfig
            optee_platform: vexpress-qemu_armv8a
            optee_flavor: ''
            tfa_plat: qemu
            requires_rockchip_tpl: false
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64
            board: rockpro64-rk3399
            board_title: ROCKPro64 / RK3399 supported secondary Path A
            build_kind: rockchip
            uboot_defconfig: rockpro64-rk3399_defconfig
            optee_platform: rockchip
            optee_flavor: rk3399
            tfa_plat: rk3399
            requires_rockchip_tpl: false
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64
            board: pinetab2-rk3566
            board_title: Pine64 PineTab2 / RK3566 supported secondary Path A
            build_kind: rockchip
            uboot_defconfig: pinetab2-rk3566_defconfig
            optee_platform: rockchip
            optee_flavor: rk3568
            tfa_plat: rk3568
            requires_rockchip_tpl: false
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64
            board: rock5b-rk3588
            board_title: Radxa ROCK 5B / RK3588 primary Path A
            build_kind: rockchip
            uboot_defconfig: rock5b-rk3588_defconfig
            optee_platform: rockchip
            optee_flavor: rk3588
            tfa_plat: rk3588
            requires_rockchip_tpl: true
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64-repro
            board: qemu-arm64
            board_title: QEMU ARM64 CI baseline
            build_kind: qemu
            uboot_defconfig: qemu_arm64_defconfig
            optee_platform: vexpress-qemu_armv8a
            optee_flavor: ''
            tfa_plat: qemu
            requires_rockchip_tpl: false
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64-repro
            board: rockpro64-rk3399
            board_title: ROCKPro64 / RK3399 supported secondary Path A
            build_kind: rockchip
            uboot_defconfig: rockpro64-rk3399_defconfig
            optee_platform: rockchip
            optee_flavor: rk3399
            tfa_plat: rk3399
            requires_rockchip_tpl: false
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64-repro
            board: pinetab2-rk3566
            board_title: Pine64 PineTab2 / RK3566 supported secondary Path A
            build_kind: rockchip
            uboot_defconfig: pinetab2-rk3566_defconfig
            optee_platform: rockchip
            optee_flavor: rk3568
            tfa_plat: rk3568
            requires_rockchip_tpl: false
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
            artifact_suffix: arm64-repro
            board: rock5b-rk3588
            board_title: Radxa ROCK 5B / RK3588 primary Path A
            build_kind: rockchip
            uboot_defconfig: rock5b-rk3588_defconfig
            optee_platform: rockchip
            optee_flavor: rk3588
            tfa_plat: rk3588
            requires_rockchip_tpl: true
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:1aa0a2307eea88ae00d07c7b3c8e804187ee272ccc89cde7b51667b3b065fb1d # trixie-debian13-dev — auto-resolves to ${{ matrix.arch }}
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Install docker CLI + buildx (${{ matrix.arch }})
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.9.3.tgz"
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-rootless-extras-29.9.3.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.39.0/buildx-v0.39.0.${{ matrix.buildx_arch }}"
          case "${{ matrix.docker_arch }}" in
            x86_64)
              DOCKER_SHA512=ff0eeb5d9994a6891b9bebe7c37c8982642da9fdc3b7f19302b3c2276b306b859d56e76f00148eeed2e36daffa576873e15276d79a61e1798e11741511c6e65e # 29.9.3 (linux/amd64)
              ROOTLESS_SHA512=3ea734eb68ae8e74159725410072bc196251bba2f12988014193d694a8a12e4a38f448c1d980563e810cfa4c92c8e364e8aa69652eda1900f91768ea7badb693 # 29.9.3 (linux/amd64)
              BUILDX_SHA512=9c3a17f0b782cfcc12b883546ed4efe684900f2139bee2ca369518aea35ea36a44201f9669f0eab43fca926926d90e11bf8cabf4a87653ad7aff50c5dba80fa6 # v0.39.0 (linux/amd64)
              ;;
            aarch64)
              DOCKER_SHA512=373b7542d225479e066cb540889cf24035f7909a17519845bedb93bb0b208c3bdd778af47d412de52136bf98d63ac1a5aba76e09eacd15641151c6e7f73aa198 # 29.9.3 (linux/arm64)
              ROOTLESS_SHA512=7bab17249d06874cd5900ffc9908db692e8f158e17b03fc8afff5b9feaab5044752f7a018225695f8ca548212fa4d5095c3f15d0b06ed263f00ab4a895d6fc8a # 29.9.3 (linux/arm64)
              BUILDX_SHA512=810c87058af0abb1205366d85ac47c3b1111676f7ae411fba19d3fe49a13a0695fe0d8bb03cdbd097132507eec19c7aecf4189e3ca30cab0e4a2a3b92ce8ad2b # v0.39.0 (linux/arm64)
              ;;
            *)
              echo "Unsupported Docker artifact architecture: ${{ matrix.docker_arch }}" >&2
              exit 1
              ;;
          esac
          printf '%s  %s\n' "$DOCKER_SHA512" docker-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$ROOTLESS_SHA512" docker-rootless-extras-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$BUILDX_SHA512" "buildx-v0.39.0.${{ matrix.buildx_arch }}" | sha512sum --check --strict
          tar xzf docker-29.9.3.tgz
          tar xzf docker-rootless-extras-29.9.3.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 "buildx-v0.39.0.${{ matrix.buildx_arch }}" "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Install full ARM64 firmware toolchain
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-arm-none-eabi python3 python3-venv python3-dev \
            python3-pyelftools python3-cryptography python3-setuptools \
            device-tree-compiler \
            openssl libssl-dev libgnutls28-dev \
            softhsm2 opensc libengine-pkcs11-openssl \
            bison flex bc \
            uuid-dev iasl nasm swig \
            git ca-certificates || true
          if [ "$(uname -m)" = "x86_64" ]; then
            echo "AARCH64_PREFIX=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          else
            echo "AARCH64_PREFIX=" >> "$GITHUB_ENV"
          fi

      - name: Download BL32_AP_MM.fd from stmm job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — see PINNED.md
        with:
          name: BL32_AP_MM-${{ matrix.artifact_suffix }}
          path: stmm_artifact

      - name: Clone U-Boot and stage yubiOS fTPM fragment
        run: |
          set -euxo pipefail
          rm -rf u-boot
          git init -q u-boot
          git -C u-boot remote add origin https://github.com/yubi-OS/u-boot
          git -C u-boot fetch -q --depth=1 origin "$UBOOT_REF"
          git -C u-boot checkout --detach FETCH_HEAD
          test "$(git -C u-boot rev-parse HEAD)" = "$UBOOT_REF"
          cat > u-boot/yubios_ftpm.config <<'EOF'
          CONFIG_TEE=y
          CONFIG_OPTEE=y
          CONFIG_TPM=y
          CONFIG_TPM_V2=y
          CONFIG_TPM2_FTPM_TEE=y
          CONFIG_SUPPORT_EMMC_RPMB=y
          CONFIG_CMD_OPTEE_RPMB=y
          CONFIG_FIT_SIGNATURE=y
          CONFIG_RSA=y
          CONFIG_EFI_LOADER=y
          CONFIG_EFI_MM_COMM_TEE=y
          CONFIG_EFI_SECURE_BOOT=y
          CONFIG_EFI_TCG2_PROTOCOL=y
          CONFIG_CMD_EFIDEBUG=y
          CONFIG_HASH=y
          CONFIG_MEASURED_BOOT=y
          CONFIG_CMD_TPM=y
          CONFIG_BAUDRATE=115200
          CONFIG_BOOTDELAY=1
          CONFIG_BOOTCOMMAND="tpm2 init && tpm2 startup TPM2_SU_CLEAR && tpm2 self_test full && echo YUBIOS_TPM_OK; bootefi bootmgr"
          # CONFIG_UNIT_TEST is not set
          EOF

      - name: Build QEMU U-Boot BL33
        if: matrix.build_kind == 'qemu'
        env:
          UBOOT_DEFCONFIG: ${{ matrix.uboot_defconfig }}
        run: |
          set -euxo pipefail
          make -C u-boot CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm "$UBOOT_DEFCONFIG"
          ./u-boot/scripts/kconfig/merge_config.sh -m -O u-boot u-boot/.config u-boot/yubios_ftpm.config
          make -C u-boot CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm olddefconfig
          make -C u-boot -j"$(nproc)" CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm
          test -f u-boot/u-boot.bin
          echo "BL33_BIN=$GITHUB_WORKSPACE/u-boot/u-boot.bin" >> "$GITHUB_ENV"

      - name: Stage StMM artifact
        run: |
          set -euxo pipefail
          fd="$(find stmm_artifact -name 'BL32_AP_MM.fd' -print -quit)"
          test -n "$fd"
          cp "$fd" "$GITHUB_WORKSPACE/BL32_AP_MM.fd"
          echo "STMM_FD=$GITHUB_WORKSPACE/BL32_AP_MM.fd" >> "$GITHUB_ENV"
          ls -l "$GITHUB_WORKSPACE/BL32_AP_MM.fd"

      - name: Stage firmware signing keys (physical U2F/HSM slot 9a or swu2f + SoftHSM2 fallback)
        env:
          BURN_OTP_FUSES: ${{ inputs.burn_otp_fuses }}
        run: |
          set -euxo pipefail
          chmod +x scripts/lib/stage-firmware-pkcs11-keys.sh
          scripts/lib/stage-firmware-pkcs11-keys.sh "$GITHUB_WORKSPACE/fw-keys"
          test -s "$GITHUB_WORKSPACE/fw-keys/slot9a-pub.pem"
          test -s "$GITHUB_WORKSPACE/fw-keys/ta-sign-key.pem"
          test -s "$GITHUB_WORKSPACE/fw-keys/rotpk_sha256.hex"
          test -x "$GITHUB_WORKSPACE/fw-keys/pkcs11-sign-encrypt.sh"
          echo "FW_KEY_DIR=$GITHUB_WORKSPACE/fw-keys" >> "$GITHUB_ENV"
          echo "FW_KEY_SOURCE=$(cat "$GITHUB_WORKSPACE/fw-keys/key-source.txt")" >> "$GITHUB_ENV"
          echo "FW_ROTPK_SHA256=$(cat "$GITHUB_WORKSPACE/fw-keys/rotpk_sha256.hex")" >> "$GITHUB_ENV"
          if [ "${BURN_OTP_FUSES:-false}" = "true" ]; then
            echo "OTP_FUSE_SIMULATION=n" >> "$GITHUB_ENV"
          else
            echo "OTP_FUSE_SIMULATION=y" >> "$GITHUB_ENV"
          fi

      - name: Build OP-TEE TA dev kit
        env:
          OPTEE_PLATFORM: ${{ matrix.optee_platform }}
          OPTEE_FLAVOR: ${{ matrix.optee_flavor }}
        run: |
          set -euxo pipefail
          rm -rf optee_os
          git init -q optee_os
          git -C optee_os remote add origin https://github.com/yubi-OS/optee_os
          git -C optee_os fetch -q --depth=1 origin "$OPTEE_OS_REF"
          git -C optee_os checkout --detach FETCH_HEAD
          test "$(git -C optee_os rev-parse HEAD)" = "$OPTEE_OS_REF"
          optee_args=(PLATFORM="$OPTEE_PLATFORM")
          if [ -n "$OPTEE_FLAVOR" ]; then
            optee_args+=(PLATFORM_FLAVOR="$OPTEE_FLAVOR")
          fi
          if [ "$OPTEE_FLAVOR" = "rk3588" ]; then
            optee_cfg_insecure=n
            optee_args+=(
              CFG_DRAM_BASE=0x40000000
              CFG_DRAM_SIZE=0xb0000000
              CFG_NSEC_DDR_1_BASE=0x100000000
              CFG_NSEC_DDR_1_SIZE=0x2fc000000
              CFG_ROCKCHIP_OTP=y
              CFG_RK_SECURE_BOOT=y
              CFG_RK_SECURE_BOOT_SIMULATION="$OTP_FUSE_SIMULATION"
            )
          elif [ "$OPTEE_FLAVOR" = "rk3399" ]; then
            optee_cfg_insecure=y
            optee_args+=(
              CFG_DRAM_BASE=0x00200000
              CFG_DRAM_SIZE=0xf7e00000
              CFG_8250_UART_FLUSH_TIMEOUT=y
            )
          elif [ "$OPTEE_FLAVOR" = "rk3568" ]; then
            optee_cfg_insecure=y
            optee_args+=(
              CFG_DRAM_BASE=0x00200000
              CFG_DRAM_SIZE=0xefe00000
              CFG_NSEC_DDR_1_BASE=0x100000000
              CFG_NSEC_DDR_1_SIZE=0x100000000
            )
          else
            optee_cfg_insecure=y
          fi
          echo "OPTEE_CFG_INSECURE=$optee_cfg_insecure" >> "$GITHUB_ENV"
          make -C optee_os -j"$(nproc)" \
            "${optee_args[@]}" \
            CROSS_COMPILE64=aarch64-linux-gnu- \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            TA_PUBLIC_KEY="$FW_KEY_DIR/slot9a-pub.pem" \
            TA_SIGN_KEY="$FW_KEY_DIR/ta-sign-key.pem" \
            CFG_REE_FS_TA=n CFG_SECSTOR_TA=n CFG_SECSTOR_TA_MGMT_PTA=n \
            CFG_INSECURE="$optee_cfg_insecure" \
            CFG_EARLY_CONSOLE_BAUDRATE=115200 \
            CFG_RPMB_FS=y CFG_REE_FS=y CFG_EARLY_TA=y \
            CFG_STMM_VOLATILE_STORAGE=y CFG_STMM_HEAP_PAGE_COUNT=800 \
            CFG_CORE_HEAP_SIZE=524288 CFG_TEE_RAM_VA_SIZE=0x00400000 \
            CFG_TEE_CORE_LOG_LEVEL=3 CFG_TEE_TA_LOG_LEVEL=3 \
            ta_dev_kit
          devkit="$(find "$GITHUB_WORKSPACE/optee_os/out" -type d -name 'export-ta_arm64' -print -quit)"
          test -f "$devkit/mk/ta_dev_kit.mk"
          echo "TA_DEV_KIT_DIR=$devkit" >> "$GITHUB_ENV"

      - name: Build fTPM TA
        run: |
          set -euxo pipefail
          rm -rf optee_ftpm ms-tpm-20-ref
          git init -q optee_ftpm
          git -C optee_ftpm remote add origin https://github.com/yubi-OS/optee_ftpm
          git -C optee_ftpm fetch -q --depth=1 origin "$OPTEE_FTPM_REF"
          git -C optee_ftpm checkout --detach FETCH_HEAD
          test "$(git -C optee_ftpm rev-parse HEAD)" = "$OPTEE_FTPM_REF"
          git init -q ms-tpm-20-ref
          git -C ms-tpm-20-ref remote add origin https://github.com/yubi-OS/ms-tpm-20-ref
          git -C ms-tpm-20-ref fetch -q --depth=1 origin "$MS_TPM_REF"
          git -C ms-tpm-20-ref checkout --detach FETCH_HEAD
          test "$(git -C ms-tpm-20-ref rev-parse HEAD)" = "$MS_TPM_REF"
          YUBIOS_REAL_SIGN_ENC="$TA_DEV_KIT_DIR/scripts/sign_encrypt.py" \
          make -C optee_ftpm -j"$(nproc)" \
            CFG_FTPM_VOLATILE_NV=y \
            TA_DEV_KIT_DIR="$TA_DEV_KIT_DIR" \
            TA_PUBLIC_KEY="$FW_KEY_DIR/slot9a-pub.pem" \
            TA_SIGN_KEY="$FW_KEY_DIR/ta-sign-key.pem" \
            SIGN_ENC="$FW_KEY_DIR/pkcs11-sign-encrypt.sh" \
            CFG_MS_TPM_20_REF="$GITHUB_WORKSPACE/ms-tpm-20-ref" \
            CROSS_COMPILE_ta_arm64=aarch64-linux-gnu- \
            CFG_ARM64_ta_arm64=y
          stripped="$(find optee_ftpm -name "${FTPM_UUID}.stripped.elf" -print -quit)"
          test -n "$stripped"
          echo "FTPM_TA=$GITHUB_WORKSPACE/$stripped" >> "$GITHUB_ENV"

      - name: Rebuild OP-TEE BL32 folding fTPM Early TA and StMM
        env:
          OPTEE_PLATFORM: ${{ matrix.optee_platform }}
          OPTEE_FLAVOR: ${{ matrix.optee_flavor }}
        run: |
          set -euxo pipefail
          optee_args=(PLATFORM="$OPTEE_PLATFORM")
          if [ -n "$OPTEE_FLAVOR" ]; then
            optee_args+=(PLATFORM_FLAVOR="$OPTEE_FLAVOR")
          fi
          if [ "$OPTEE_FLAVOR" = "rk3588" ]; then
            optee_args+=(
              CFG_DRAM_BASE=0x40000000
              CFG_DRAM_SIZE=0xb0000000
              CFG_NSEC_DDR_1_BASE=0x100000000
              CFG_NSEC_DDR_1_SIZE=0x2fc000000
              CFG_ROCKCHIP_OTP=y
              CFG_RK_SECURE_BOOT=y
              CFG_RK_SECURE_BOOT_SIMULATION="$OTP_FUSE_SIMULATION"
            )
          elif [ "$OPTEE_FLAVOR" = "rk3399" ]; then
            optee_args+=(
              CFG_DRAM_BASE=0x00200000
              CFG_DRAM_SIZE=0xf7e00000
              CFG_8250_UART_FLUSH_TIMEOUT=y
            )
          elif [ "$OPTEE_FLAVOR" = "rk3568" ]; then
            optee_args+=(
              CFG_DRAM_BASE=0x00200000
              CFG_DRAM_SIZE=0xefe00000
              CFG_NSEC_DDR_1_BASE=0x100000000
              CFG_NSEC_DDR_1_SIZE=0x100000000
            )
          fi
          make -C optee_os -j"$(nproc)" \
            "${optee_args[@]}" \
            CROSS_COMPILE64=aarch64-linux-gnu- \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            TA_PUBLIC_KEY="$FW_KEY_DIR/slot9a-pub.pem" \
            TA_SIGN_KEY="$FW_KEY_DIR/ta-sign-key.pem" \
            CFG_REE_FS_TA=n CFG_SECSTOR_TA=n CFG_SECSTOR_TA_MGMT_PTA=n \
            CFG_INSECURE="${OPTEE_CFG_INSECURE:-y}" \
            CFG_EARLY_CONSOLE_BAUDRATE=115200 \
            CFG_RPMB_FS=y CFG_REE_FS=y \
            CFG_STMM_VOLATILE_STORAGE=y CFG_STMM_HEAP_PAGE_COUNT=800 \
            CFG_CORE_HEAP_SIZE=524288 CFG_TEE_RAM_VA_SIZE=0x00400000 \
            CFG_EARLY_TA=y EARLY_TA_PATHS="$FTPM_TA" \
            CFG_CORE_DYN_SHM=y \
            CFG_TEE_CORE_LOG_LEVEL=3 CFG_TEE_TA_LOG_LEVEL=3 \
            CFG_STMM_PATH="$STMM_FD" \
            all
          h="$(find optee_os/out -name tee-header_v2.bin -print -quit)"
          p="$(find optee_os/out -name tee-pager_v2.bin -print -quit)"
          x="$(find optee_os/out -name tee-pageable_v2.bin -print -quit)"
          test -n "$h" && test -n "$p" && test -n "$x"
          echo "BL32_HDR=$GITHUB_WORKSPACE/$h" >> "$GITHUB_ENV"
          echo "BL32_PAGER=$GITHUB_WORKSPACE/$p" >> "$GITHUB_ENV"
          echo "BL32_PAGEABLE=$GITHUB_WORKSPACE/$x" >> "$GITHUB_ENV"
          tee_bin="$(find optee_os/out -type f \( -name tee.elf -o -name tee.bin \) -print -quit)"
          test -n "$tee_bin"
          echo "TEE_BIN=$GITHUB_WORKSPACE/$tee_bin" >> "$GITHUB_ENV"

      - name: Build TF-A trusted firmware
        env:
          BUILD_KIND: ${{ matrix.build_kind }}
          TFA_PLAT: ${{ matrix.tfa_plat }}
        run: |
          set -euxo pipefail
          rm -rf arm-trusted-firmware mbedtls
          git init -q arm-trusted-firmware
          git -C arm-trusted-firmware remote add origin https://github.com/yubi-OS/arm-trusted-firmware
          git -C arm-trusted-firmware fetch -q --depth=1 origin "$TFA_REF"
          git -C arm-trusted-firmware checkout --detach FETCH_HEAD
          test "$(git -C arm-trusted-firmware rev-parse HEAD)" = "$TFA_REF"
          for rk_hdr in \
            arm-trusted-firmware/plat/rockchip/rk3588/rk3588_def.h \
            arm-trusted-firmware/plat/rockchip/rk3399/rk3399_def.h \
            arm-trusted-firmware/plat/rockchip/rk3568/rk3568_def.h; do
            sed -i -E 's/(#define[[:space:]]+(RK_DBG_UART_BAUDRATE|RK3399_BAUDRATE|FPGA_BAUDRATE)[[:space:]]+)1500000/\1115200/' "$rk_hdr"
            grep -Eq '#define[[:space:]]+(RK_DBG_UART_BAUDRATE|RK3399_BAUDRATE|FPGA_BAUDRATE)[[:space:]]+115200' "$rk_hdr"
          done
          if [ "$TFA_PLAT" = "rk3399" ]; then
            m0_makefile=arm-trusted-firmware/plat/rockchip/rk3399/drivers/m0/Makefile
            sed -i 's/-Wall -O3 -nostdlib/-Wall -Os -nostdlib/' "$m0_makefile"
            grep -q -- '-Wall -Os -nostdlib' "$m0_makefile"
          fi
          CROSS=""
          [ "$(uname -m)" = "x86_64" ] && CROSS="aarch64-linux-gnu-"
          tfa_args=(
            CROSS_COMPILE="${CROSS}"
            PLAT="$TFA_PLAT"
            ARCH=aarch64
            BUILD_MESSAGE_TIMESTAMP="\"${TF_A_BUILD_TIMESTAMP}\""
            BUILD_STRING="$TF_A_BUILD_STRING"
          )
          if [ "$TFA_PLAT" = "rk3399" ]; then
            tfa_ld="${CROSS}ld.bfd"
            if [ -z "$CROSS" ]; then
              tfa_ld=ld.bfd
            fi
            command -v "$tfa_ld"
            "$tfa_ld" --version
            tfa_args+=(LD="$tfa_ld")
          fi
          if [ "$BUILD_KIND" = "qemu" ]; then
            git init -q mbedtls
            git -C mbedtls remote add origin https://github.com/Mbed-TLS/mbedtls
            git -C mbedtls fetch --depth 1 origin "$MBEDTLS_REF"
            git -C mbedtls checkout --detach FETCH_HEAD
            tfa_key_arg="$FW_KEY_DIR/ta-sign-key.pem"
            if [ "$FW_KEY_SOURCE" = "u2f_hsm_slot9a" ] && [ -f "$FW_KEY_DIR/openssl-pkcs11-engine.cnf" ]; then
              export OPENSSL_CONF="$FW_KEY_DIR/openssl-pkcs11-engine.cnf"
              export PKCS11_PIN="${YUBIOS_PIV_PIN:-123456}"
              tfa_key_arg="pkcs11:id=%01;type=private"
            fi
            make -C arm-trusted-firmware -j"$(nproc)" \
              "${tfa_args[@]}" \
              SPD=opteed \
              BL32="$BL32_HDR" BL32_EXTRA1="$BL32_PAGER" BL32_EXTRA2="$BL32_PAGEABLE" \
              BL32_RAM_LOCATION=tdram \
              BL33="$BL33_BIN" \
              TRUSTED_BOARD_BOOT=1 GENERATE_COT=1 \
              ROT_KEY="$tfa_key_arg" \
              TRUSTED_WORLD_KEY="$tfa_key_arg" \
              NON_TRUSTED_WORLD_KEY="$tfa_key_arg" \
              SCP_BL2_KEY="$tfa_key_arg" \
              BL31_KEY="$tfa_key_arg" \
              BL32_KEY="$tfa_key_arg" \
              BL33_KEY="$tfa_key_arg" \
              MBEDTLS_DIR="$GITHUB_WORKSPACE/mbedtls" \
              DEBUG=1 \
              all fip
            fip="$(find arm-trusted-firmware/build -name fip.bin -print -quit)"
            test -n "$fip"
            echo "FIP_BIN=$GITHUB_WORKSPACE/$fip" >> "$GITHUB_ENV"
            flash="$(find arm-trusted-firmware/build -name flash.bin -print -quit || true)"
            if [ -n "$flash" ]; then
              echo "FLASH_BIN=$GITHUB_WORKSPACE/$flash" >> "$GITHUB_ENV"
            fi
          else
            spd_args=()
            case "$TFA_PLAT" in rk3588|rk3399|rk3568) spd_args=(SPD=opteed) ;; esac
            make -C arm-trusted-firmware -j"$(nproc)" \
              "${tfa_args[@]}" \
              "${spd_args[@]}" \
              bl31
            bl31="$(find arm-trusted-firmware/build -path "*/release/bl31/bl31.elf" -print -quit)"
            test -n "$bl31"
            echo "BL31_BIN=$GITHUB_WORKSPACE/$bl31" >> "$GITHUB_ENV"
          fi

      - name: Verify FIP contents
        if: matrix.build_kind == 'qemu'
        run: |
          set -euxo pipefail
          ft=arm-trusted-firmware/tools/fiptool/fiptool
          test -x "$ft" || make -C arm-trusted-firmware fiptool
          "$ft" info "$FIP_BIN" | tee fip-info.txt
          grep -qi 'Secure Payload BL32\|tos-fw\|Trusted OS' fip-info.txt
          grep -qi 'Non-Trusted Firmware BL33\|nt-fw\|Non-Trusted' fip-info.txt

      - name: Fetch pinned Rockchip DDR/TPL blob (rkbin)
        if: matrix.build_kind == 'rockchip' && matrix.requires_rockchip_tpl == true
        env:
          RKBIN_REF: 3e288fe814e059dd06833495f845cab04ac20a5c
          RKBIN_TPL_PATH: bin/rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.24.bin
          RKBIN_TPL_SHA256: 2853a0da7ab895af43d50615af73eccf0694115dd0202483ee1c93c9071a42c3
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o rockchip-ddr-tpl.bin "https://raw.githubusercontent.com/rockchip-linux/rkbin/${RKBIN_REF}/${RKBIN_TPL_PATH}"
          printf '%s  %s\n' "$RKBIN_TPL_SHA256" rockchip-ddr-tpl.bin | sha256sum --check --strict
          echo "ROCKCHIP_TPL=$GITHUB_WORKSPACE/rockchip-ddr-tpl.bin" >> "$GITHUB_ENV"

      - name: Apply pinned rock5b OP-TEE patch to U-Boot as a commit (fail closed, clean tree)
        if: matrix.build_kind == 'rockchip' && matrix.board == 'rock5b-rk3588'
        env:
          ROCK5B_OPTEE_PATCH_SRC: firmware/u-boot/0001-rock5b-add-optee-firmware-node.patch
          ROCK5B_OPTEE_PATCH_SHA256: 40711776d4f03f3e7b030602a2b66fd02c4f375a0ae6bc86a28d713f21ef5bc0
          GIT_COMMITTER_NAME: yubiOS CI
          GIT_COMMITTER_EMAIL: ci@yubi-os.invalid
          GIT_COMMITTER_DATE: 2026-10-10T00:00:00Z
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$ROCK5B_OPTEE_PATCH_SHA256" "$ROCK5B_OPTEE_PATCH_SRC" | sha256sum --check --strict
          test "$(git -C u-boot rev-parse HEAD)" = "$UBOOT_REF"
          if grep -q 'linaro,optee-tz' u-boot/arch/arm/dts/rk3588-rock-5b-u-boot.dtsi; then
            echo "::error::rock5b U-Boot dtsi already has an OP-TEE node; refusing to apply twice"
            exit 1
          fi
          git -C u-boot am --quiet "$GITHUB_WORKSPACE/$ROCK5B_OPTEE_PATCH_SRC"
          test -z "$(git -C u-boot status --porcelain --untracked-files=no)"
          echo "U-Boot HEAD is now $(git -C u-boot rev-parse --short HEAD) with a clean tracked tree"

      - name: Apply pinned rockpro64/pinetab2 OP-TEE patch to U-Boot as a commit (fail closed, clean tree)
        if: matrix.build_kind == 'rockchip' && (matrix.board == 'rockpro64-rk3399' || matrix.board == 'pinetab2-rk3566')
        env:
          RK_OPTEE_PATCH_SRC: firmware/u-boot/0002-rockpro64-pinetab2-add-optee-firmware-node.patch
          RK_OPTEE_PATCH_SHA256: 85084a348cff9665f6922eccf745f21f426f42c30236b31ed7f5cae6bdd5c709
          GIT_COMMITTER_NAME: yubiOS CI
          GIT_COMMITTER_EMAIL: ci@yubi-os.invalid
          GIT_COMMITTER_DATE: 2026-10-10T00:00:00Z
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$RK_OPTEE_PATCH_SHA256" "$RK_OPTEE_PATCH_SRC" | sha256sum --check --strict
          test "$(git -C u-boot rev-parse HEAD)" = "$UBOOT_REF"
          if grep -q 'linaro,optee-tz' u-boot/arch/arm/dts/rk3399-rockpro64-u-boot.dtsi u-boot/arch/arm/dts/rk3566-pinetab2-u-boot.dtsi; then
            echo "::error::rockpro64/pinetab2 U-Boot dtsi already has an OP-TEE node; refusing to apply twice"
            exit 1
          fi
          git -C u-boot am --quiet "$GITHUB_WORKSPACE/$RK_OPTEE_PATCH_SRC"
          test -z "$(git -C u-boot status --porcelain --untracked-files=no)"
          echo "U-Boot HEAD is now $(git -C u-boot rev-parse --short HEAD) with a clean tracked tree"

      - name: Apply pinned rockpro64 VOP OS-handoff teardown patch to U-Boot as a commit (fail closed, clean tree)
        if: matrix.build_kind == 'rockchip' && matrix.board == 'rockpro64-rk3399'
        env:
          RK_VOP_PATCH_SRC: firmware/u-boot/0003-rockchip-vop-os-prepare-teardown.patch
          RK_VOP_PATCH_SHA256: 88efa405fb1736fead1d0737c03f5c817f9fe22db39a057c87b3a319b6cbda86
          GIT_COMMITTER_NAME: yubiOS CI
          GIT_COMMITTER_EMAIL: ci@yubi-os.invalid
          GIT_COMMITTER_DATE: 2026-10-10T00:00:00Z
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$RK_VOP_PATCH_SHA256" "$RK_VOP_PATCH_SRC" | sha256sum --check --strict
          if grep -q 'DM_FLAG_OS_PREPARE' u-boot/drivers/video/rockchip/rk3399_vop.c; then
            echo "::error::rk3399_vop already sets DM_FLAG_OS_PREPARE; refusing to apply 0003 twice"
            exit 1
          fi
          git -C u-boot am --quiet "$GITHUB_WORKSPACE/$RK_VOP_PATCH_SRC"
          test -z "$(git -C u-boot status --porcelain --untracked-files=no)"
          grep -q 'DM_FLAG_OS_PREPARE' u-boot/drivers/video/rockchip/rk3399_vop.c
          grep -q 'DM_FLAG_OS_PREPARE' u-boot/drivers/video/rockchip/rk3288_vop.c
          echo "U-Boot HEAD is now $(git -C u-boot rev-parse --short HEAD) with a clean tracked tree"

      - name: Build Rockchip U-Boot board image
        if: matrix.build_kind == 'rockchip'
        env:
          BOARD: ${{ matrix.board }}
          UBOOT_DEFCONFIG: ${{ matrix.uboot_defconfig }}
          REQUIRES_ROCKCHIP_TPL: ${{ matrix.requires_rockchip_tpl }}
        run: |
          set -euxo pipefail
          make -C u-boot CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm "$UBOOT_DEFCONFIG"
          ./u-boot/scripts/kconfig/merge_config.sh -m -O u-boot u-boot/.config u-boot/yubios_ftpm.config
          if [ "$BOARD" = "rockpro64-rk3399" ]; then
            # Serial-only U-Boot like rock5b-rk3588: no VOP scanout, no vidconsole
            # framebuffer handed to Linux (simplefb/simpledrm), no usbkbd stdin.
            ./u-boot/scripts/config --file u-boot/.config \
              -d VIDEO -d DISPLAY -d VIDEO_ROCKCHIP \
              -d DISPLAY_ROCKCHIP_HDMI -d DISPLAY_ROCKCHIP_EDP \
              -d USB_KEYBOARD -d CONSOLE_MUX
          fi
          make -C u-boot CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm olddefconfig
          if [ "$BOARD" = "rockpro64-rk3399" ]; then
            if grep -E '^CONFIG_(VIDEO|DISPLAY|VIDEO_ROCKCHIP|DISPLAY_ROCKCHIP_HDMI|DISPLAY_ROCKCHIP_EDP|USB_KEYBOARD|CONSOLE_MUX)=y' u-boot/.config; then
              echo "::error::rockpro64-rk3399 U-Boot must be serial-only (video/display/usbkbd still enabled after olddefconfig)"
              exit 1
            fi
          fi
          grep -E 'CONFIG_ROCKCHIP_RK(3399|3568|3588)=y|CONFIG_ROCKCHIP_EXTERNAL_TPL=y|CONFIG_TPL=y|CONFIG_RAM_ROCKCHIP_LPDDR4=y|CONFIG_SPL_ATF=y|CONFIG_TPM2_FTPM_TEE=y' \
            u-boot/.config | tee u-boot-config-summary.txt
          make -C u-boot -j"$(nproc)" CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm u-boot.bin
          test -s u-boot/u-boot.bin
          fdtget u-boot/dts/dt.dtb /firmware/optee compatible | grep -qx 'linaro,optee-tz'
          fdtget -l u-boot/dts/dt.dtb /reserved-memory | grep -qx 'optee@30000000'
          build_args=(BL31="$BL31_BIN" TEE="$TEE_BIN")
          if [ "$REQUIRES_ROCKCHIP_TPL" = "true" ]; then
            if [ -z "${ROCKCHIP_TPL:-}" ]; then
              {
                echo "board=${BOARD}"
                echo "uboot_defconfig=${UBOOT_DEFCONFIG}"
                echo "reason=ROCKCHIP_TPL is required for RK3588 board images"
                echo "detail=U-Boot RK3588 Kconfig implies ROCKCHIP_EXTERNAL_TPL; binman marks missing/faked blobs non-functional."
                echo "next=Provide a real rk3588 DDR/TPL blob via ROCKCHIP_TPL before publishing firmware-${BOARD}."
              } > rk-tpl-required.txt
              echo "::notice title=RK3588 external TPL required::${BOARD} built source firmware pieces, but skipped the final Rockchip image because ROCKCHIP_TPL is unset."
              exit 0
            fi
            test -s "$ROCKCHIP_TPL"
            build_args+=(ROCKCHIP_TPL="$ROCKCHIP_TPL")
          fi
          make -C u-boot -j"$(nproc)" CROSS_COMPILE="${AARCH64_PREFIX}" ARCH=arm "${build_args[@]}" 2>&1 | tee u-boot-build.log
          ! grep -Eiq 'missing external blobs|faked external blobs|non-functional|Some images are invalid' u-boot-build.log
          test -s u-boot/u-boot.bin

      - name: Write firmware artifact manifest
        if: always()
        env:
          BOARD: ${{ matrix.board }}
          BOARD_TITLE: ${{ matrix.board_title }}
          BUILD_KIND: ${{ matrix.build_kind }}
          UBOOT_DEFCONFIG: ${{ matrix.uboot_defconfig }}
          OPTEE_PLATFORM: ${{ matrix.optee_platform }}
          OPTEE_FLAVOR: ${{ matrix.optee_flavor }}
          TFA_PLAT: ${{ matrix.tfa_plat }}
          REQUIRES_ROCKCHIP_TPL: ${{ matrix.requires_rockchip_tpl }}
        run: |
          set -euo pipefail
          {
            echo "yubiOS ARM64 firmware build artifact"
            echo "board=${BOARD}"
            echo "board_title=${BOARD_TITLE}"
            echo "build_kind=${BUILD_KIND}"
            echo "arch=${{ matrix.arch }}"
            echo "uboot_defconfig=${UBOOT_DEFCONFIG}"
            echo "optee_platform=${OPTEE_PLATFORM}"
            echo "optee_flavor=${OPTEE_FLAVOR}"
            echo "tfa_plat=${TFA_PLAT}"
            echo "rockchip_tpl_required=${REQUIRES_ROCKCHIP_TPL}"
            if [ -n "${ROCKCHIP_TPL:-}" ]; then
              echo "rockchip_tpl_provided=true"
            else
              echo "rockchip_tpl_provided=false"
            fi
            echo "yubios_commit=${GITHUB_SHA}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "tfa_ref=${TFA_REF}"
            echo "optee_os_ref=${OPTEE_OS_REF}"
            echo "optee_ftpm_ref=${OPTEE_FTPM_REF}"
            echo "uboot_ref=${UBOOT_REF}"
            echo "edk2_ref=${EDK2_REF}"
            echo "edk2_platforms_ref=${EDK2_PLATFORMS_REF}"
            echo "ms_tpm_ref=${MS_TPM_REF}"
            echo "ftpm_uuid=${FTPM_UUID}"
            echo "key_source=${FW_KEY_SOURCE:-swu2f_softhsm2_slot9a}"
            echo "rotpk_sha256=${FW_ROTPK_SHA256:-}"
            echo "optee_cfg_insecure=${OPTEE_CFG_INSECURE:-y}"
            echo "optee_cfg_ree_fs_ta=n"
            echo "optee_cfg_secstor_ta=n"
            echo "otp_fuse_simulation=${OTP_FUSE_SIMULATION:-y}"
            if [ "$BUILD_KIND" = "qemu" ]; then
              echo "signature_envelope=TF-A CREATE_KEYS=1; excluded from byte-for-byte proof"
            fi
            if [ -n "${ROCKCHIP_TPL:-}" ]; then
              echo "rockchip_tpl_sha256=$(sha256sum "$ROCKCHIP_TPL" | cut -d' ' -f1)"
            fi
          } > firmware-manifest.txt

      - name: Upload fip + flash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — see PINNED.md
        with:
          name: fip-flash-${{ matrix.board }}-${{ matrix.artifact_suffix }}
          path: |
            arm-trusted-firmware/build/**/fip.bin
            arm-trusted-firmware/build/**/flash.bin
            arm-trusted-firmware/build/**/bl1.bin
            arm-trusted-firmware/build/**/bl31.elf
            BL32_AP_MM.fd
            optee_os/out/**/tee-*_v2.bin
            optee_os/out/**/tee.elf
            optee_os/out/**/tee.bin
            u-boot/u-boot.bin
            u-boot/tpl/u-boot-tpl.bin
            u-boot/u-boot.itb
            u-boot/idbloader.img
            u-boot/u-boot-rockchip.bin
            u-boot/u-boot-rockchip-spi.bin
            fip-info.txt
            u-boot-config-summary.txt
            u-boot-build.log
            rk-tpl-required.txt
            firmware-manifest.txt
          if-no-files-found: warn
          retention-days: 7

  firmware-reproducibility:
    name: Stage 2 proof - ${{ matrix.board }} unsigned components (arm64)
    needs: [stmm, optee_fip]
    strategy:
      fail-fast: false
      matrix:
        board: [qemu-arm64, rockpro64-rk3399, pinetab2-rk3566, rock5b-rk3588]
    runs-on: ubuntu-26.04
    container:
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:1aa0a2307eea88ae00d07c7b3c8e804187ee272ccc89cde7b51667b3b065fb1d # trixie-debian13-dev
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git
          apt-get install -y -qq --no-install-recommends python3

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: arm64
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Clean firmware proof workspace
        run: rm -rf proof repro-evidence

      - name: Download primary StandaloneMM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — see PINNED.md
        with:
          name: BL32_AP_MM-arm64
          path: proof/primary/stmm

      - name: Download rebuilt StandaloneMM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — see PINNED.md
        with:
          name: BL32_AP_MM-arm64-repro
          path: proof/rebuild/stmm

      - name: Download primary board artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — see PINNED.md
        with:
          name: fip-flash-${{ matrix.board }}-arm64
          path: proof/primary/firmware

      - name: Download rebuilt board artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — see PINNED.md
        with:
          name: fip-flash-${{ matrix.board }}-arm64-repro
          path: proof/rebuild/firmware

      - name: Prove two clean firmware component builds match
        run: |
          python3 scripts/verify-reproducible-firmware.py \
            "${{ matrix.board }}" \
            proof/primary \
            proof/rebuild \
            "repro-evidence/firmware-${{ matrix.board }}-arm64.json"

      - name: Retain firmware reproducibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — see PINNED.md
        with:
          name: reproducibility-firmware-${{ matrix.board }}-arm64-${{ github.sha }}
          path: repro-evidence/firmware-${{ matrix.board }}-arm64.json
          if-no-files-found: error
          retention-days: 30

  qemu:
    name: Stage 3 - QEMU fTPM e2e (${{ matrix.arch }})
    needs: [optee_fip, firmware-reproducibility]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:1aa0a2307eea88ae00d07c7b3c8e804187ee272ccc89cde7b51667b3b065fb1d # trixie-debian13-dev — auto-resolves to ${{ matrix.arch }}
    env:
      BOOT_TIMEOUT: '180'
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Install docker CLI + buildx (${{ matrix.arch }})
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.9.3.tgz"
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-rootless-extras-29.9.3.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.39.0/buildx-v0.39.0.${{ matrix.buildx_arch }}"
          case "${{ matrix.docker_arch }}" in
            x86_64)
              DOCKER_SHA512=ff0eeb5d9994a6891b9bebe7c37c8982642da9fdc3b7f19302b3c2276b306b859d56e76f00148eeed2e36daffa576873e15276d79a61e1798e11741511c6e65e # 29.9.3 (linux/amd64)
              ROOTLESS_SHA512=3ea734eb68ae8e74159725410072bc196251bba2f12988014193d694a8a12e4a38f448c1d980563e810cfa4c92c8e364e8aa69652eda1900f91768ea7badb693 # 29.9.3 (linux/amd64)
              BUILDX_SHA512=9c3a17f0b782cfcc12b883546ed4efe684900f2139bee2ca369518aea35ea36a44201f9669f0eab43fca926926d90e11bf8cabf4a87653ad7aff50c5dba80fa6 # v0.39.0 (linux/amd64)
              ;;
            aarch64)
              DOCKER_SHA512=373b7542d225479e066cb540889cf24035f7909a17519845bedb93bb0b208c3bdd778af47d412de52136bf98d63ac1a5aba76e09eacd15641151c6e7f73aa198 # 29.9.3 (linux/arm64)
              ROOTLESS_SHA512=7bab17249d06874cd5900ffc9908db692e8f158e17b03fc8afff5b9feaab5044752f7a018225695f8ca548212fa4d5095c3f15d0b06ed263f00ab4a895d6fc8a # 29.9.3 (linux/arm64)
              BUILDX_SHA512=810c87058af0abb1205366d85ac47c3b1111676f7ae411fba19d3fe49a13a0695fe0d8bb03cdbd097132507eec19c7aecf4189e3ca30cab0e4a2a3b92ce8ad2b # v0.39.0 (linux/arm64)
              ;;
            *)
              echo "Unsupported Docker artifact architecture: ${{ matrix.docker_arch }}" >&2
              exit 1
              ;;
          esac
          printf '%s  %s\n' "$DOCKER_SHA512" docker-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$ROOTLESS_SHA512" docker-rootless-extras-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$BUILDX_SHA512" "buildx-v0.39.0.${{ matrix.buildx_arch }}" | sha512sum --check --strict
          tar xzf docker-29.9.3.tgz
          tar xzf docker-rootless-extras-29.9.3.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 "buildx-v0.39.0.${{ matrix.buildx_arch }}" "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Install QEMU + TPM tooling
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-utils tpm2-tools python3 coreutils ca-certificates ipxe-qemu || true
          qemu-system-aarch64 --version

      - name: Clean QEMU artifact directory
        run: rm -rf image

      - name: Download fip/flash from optee_fip job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — see PINNED.md
        with:
          name: fip-flash-qemu-arm64-${{ matrix.arch }}
          path: image

      - name: Resolve or assemble flash.bin
        id: image
        run: |
          set -euxo pipefail
          rm -rf image/flash.bin
          flash="$(find image -name flash.bin -type f -print -quit 2>/dev/null || true)"
          if [ -z "$flash" ]; then
            bl1="$(find image -name bl1.bin -type f -print -quit 2>/dev/null || true)"
            fip="$(find image -name fip.bin -type f -print -quit 2>/dev/null || true)"
            if [ -n "$bl1" ] && [ -n "$fip" ]; then
              dd if="$bl1" of=image/flash.bin bs=4096 conv=notrunc
              dd if="$fip" of=image/flash.bin seek=64 bs=4096 conv=notrunc
              flash="image/flash.bin"
            fi
          fi
          if [ -n "$flash" ]; then
            echo "flash=$flash" >> "$GITHUB_OUTPUT"
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=No bootable image::optee_fip produced no flash.bin/fip.bin."
          fi

      - name: Boot stitched image under QEMU and assert fTPM markers
        if: steps.image.outputs.ready == '1'
        run: |
          set -euxo pipefail
          timeout "$BOOT_TIMEOUT" qemu-system-aarch64 \
            -M virt,secure=on -cpu max -m 2048 \
            -bios "${{ steps.image.outputs.flash }}" \
            -nographic -d guest_errors \
            -serial file:nw.log -serial file:optee.log || true
          touch nw.log optee.log
          fail=0
          grep -Eiq "early_ta_init.*${FTPM_UUID}|Early TA ${FTPM_UUID}" nw.log optee.log \
            && echo "PASS: fTPM Early TA at init" || { echo "::error::fTPM Early TA not at init"; fail=1; }
          grep -Eiq "ldelf: Loading TS ${FTPM_UUID}|Lookup user TA ELF ${FTPM_UUID}" nw.log optee.log \
            && echo "PASS: fTPM TA probed" || { echo "::error::fTPM TA never probed"; fail=1; }
          grep -q "YUBIOS_TPM_OK" nw.log \
            && echo "PASS: fTPM functional" || { echo "::error::fTPM not functional"; fail=1; }
          ! grep -Eq "Missing TPMv2 device|Couldn't set TPM|TA panicked|ldelf failed|data-abort" nw.log optee.log \
            && echo "PASS: no known failure signatures" || { echo "::error::known failure signature present"; fail=1; }
          grep -Eiq "stmm load address" nw.log optee.log \
            && echo "PASS: StMM SP loaded into OP-TEE" || { echo "::error::StMM SP never loaded"; fail=1; }
          [ "$fail" -eq 0 ]

      - name: Loud skip when no bootable image exists
        if: steps.image.outputs.ready != '1'
        run: echo "::notice title=QEMU e2e loud skip::No fip/flash artifact was available."

  firmware-publish:
    name: Stage 4 - Publish firmware bundle (${{ matrix.board }})
    needs: qemu
    if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
    runs-on: ubuntu-26.04
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:1aa0a2307eea88ae00d07c7b3c8e804187ee272ccc89cde7b51667b3b065fb1d # trixie-debian13-dev
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: qemu-arm64
            board_title: QEMU ARM64 CI baseline
            publish_original: true
            storage_note: Volatile StMM and fTPM NV for QEMU virt CI
            optee_platform: vexpress-qemu_armv8a
            optee_flavor: ''
            tfa_plat: qemu
            uboot_defconfig: qemu_arm64_defconfig
            required_image: flash.bin
          - board: rock5b-rk3588
            board_title: Radxa ROCK 5B / RK3588 primary Path A
            publish_original: false
            storage_note: RPMB-backed StMM and fTPM NV required before production hardware claim
            optee_platform: rockchip
            optee_flavor: rk3588
            tfa_plat: rk3588
            uboot_defconfig: rock5b-rk3588_defconfig
            required_image: u-boot-rockchip.bin
          - board: rockpro64-rk3399
            board_title: ROCKPro64 / RK3399 supported secondary Path A
            publish_original: false
            storage_note: RPMB-backed StMM and fTPM NV required before production hardware claim
            optee_platform: rockchip
            optee_flavor: rk3399
            tfa_plat: rk3399
            uboot_defconfig: rockpro64-rk3399_defconfig
            required_image: u-boot-rockchip.bin
          - board: pinetab2-rk3566
            board_title: Pine64 PineTab2 / RK3566 supported secondary Path A
            publish_original: false
            storage_note: Open-source U-Boot TPL (1056 MHz LPDDR4); RPMB-backed StMM and fTPM NV required before production hardware claim
            optee_platform: rockchip
            optee_flavor: rk3568
            tfa_plat: rk3568
            uboot_defconfig: pinetab2-rk3566_defconfig
            required_image: u-boot-rockchip.bin
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: arm64
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Clean firmware publish workspace
        run: rm -rf art fw

      - name: Download firmware artifacts (native arm64 build)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — see PINNED.md
        with:
          name: fip-flash-${{ matrix.board }}-arm64
          path: art

      - name: RK3588 TPL publish gate
        id: rk_tpl_gate
        run: |
          set -euo pipefail
          #if [ -s art/rk-tpl-required.txt ]; then
          #  cat art/rk-tpl-required.txt
          #  echo "skip_publish=1" >> "$GITHUB_OUTPUT"
          #  echo "::notice title=Firmware publish skipped::${{ matrix.board }} requires ROCKCHIP_TPL; no bootable Rockchip image was produced."
          #else
            echo "skip_publish=0" >> "$GITHUB_OUTPUT"
          #fi

      - name: Install docker CLI + buildx
        if: steps.rk_tpl_gate.outputs.skip_publish != '1'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/x86_64/docker-29.9.3.tgz"
          wcurl "https://download.docker.com/linux/static/stable/x86_64/docker-rootless-extras-29.9.3.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.39.0/buildx-v0.39.0.linux-amd64"
          printf '%s  %s\n' 'ff0eeb5d9994a6891b9bebe7c37c8982642da9fdc3b7f19302b3c2276b306b859d56e76f00148eeed2e36daffa576873e15276d79a61e1798e11741511c6e65e' docker-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' '3ea734eb68ae8e74159725410072bc196251bba2f12988014193d694a8a12e4a38f448c1d980563e810cfa4c92c8e364e8aa69652eda1900f91768ea7badb693' docker-rootless-extras-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' '9c3a17f0b782cfcc12b883546ed4efe684900f2139bee2ca369518aea35ea36a44201f9669f0eab43fca926926d90e11bf8cabf4a87653ad7aff50c5dba80fa6' buildx-v0.39.0.linux-amd64 | sha512sum --check --strict
          tar xzf docker-29.9.3.tgz
          tar xzf docker-rootless-extras-29.9.3.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 buildx-v0.39.0.linux-amd64 "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Assemble board-scoped /firmware payload
        if: steps.rk_tpl_gate.outputs.skip_publish != '1'
        env:
          BOARD: ${{ matrix.board }}
          BOARD_TITLE: ${{ matrix.board_title }}
          STORAGE_NOTE: ${{ matrix.storage_note }}
          OPTEE_PLATFORM: ${{ matrix.optee_platform }}
          OPTEE_FLAVOR: ${{ matrix.optee_flavor }}
          TFA_PLAT: ${{ matrix.tfa_plat }}
          UBOOT_DEFCONFIG: ${{ matrix.uboot_defconfig }}
          REQUIRED_IMAGE: ${{ matrix.required_image }}
        run: |
          set -euxo pipefail
          source scripts/lib/reproducible-build.sh
          rm -rf fw
          mkdir -p fw/firmware
          find art -name fip.bin        -exec cp {} fw/firmware/ \; -quit
          find art -name flash.bin      -exec cp {} fw/firmware/ \; -quit
          find art -name bl1.bin        -exec cp {} fw/firmware/ \; -quit
          find art -name bl31.elf       -exec cp {} fw/firmware/ \; -quit
          find art -name BL32_AP_MM.fd  -exec cp {} fw/firmware/ \; -quit
          find art -name u-boot.bin     -exec cp {} fw/firmware/ \; -quit
          find art -name u-boot-tpl.bin -exec cp {} fw/firmware/ \; -quit
          find art -name u-boot.itb     -exec cp {} fw/firmware/ \; -quit
          find art -name idbloader.img  -exec cp {} fw/firmware/ \; -quit
          find art -name u-boot-rockchip.bin     -exec cp {} fw/firmware/ \; -quit
          find art -name u-boot-rockchip-spi.bin -exec cp {} fw/firmware/ \; -quit
          find art -name fip-info.txt   -exec cp {} fw/firmware/ \; -quit
          find art -name firmware-manifest.txt   -exec cp {} fw/firmware/BUILD-MANIFEST.txt \; -quit
          # find art -name rk-tpl-required.txt     -exec cp {} fw/firmware/RK-TPL-REQUIRED.txt \; -quit
          find art -name tee.elf        -exec cp {} fw/firmware/ \; -quit
          find art -name tee.bin        -exec cp {} fw/firmware/ \; -quit
          find art -name 'tee-*_v2.bin' -exec cp {} fw/firmware/ \;
          if [ "$BOARD" = "qemu-arm64" ] && [ ! -s fw/firmware/flash.bin ]; then
            dd if=fw/firmware/bl1.bin of=fw/firmware/flash.bin bs=4096 conv=notrunc
            dd if=fw/firmware/fip.bin of=fw/firmware/flash.bin seek=64 bs=4096 conv=notrunc
          fi
          test -s "fw/firmware/${REQUIRED_IMAGE}" || echo "NO BOOTABLE RK IMAGE FOUND!"
          test -s fw/firmware/BL32_AP_MM.fd
          if [ "$BOARD" = "qemu-arm64" ]; then
            test -s fw/firmware/fip.bin
            test -s fw/firmware/bl1.bin
            test -s fw/firmware/flash.bin
          else
            test -s fw/firmware/bl31.elf
            test -s fw/firmware/u-boot.bin
            test -s fw/firmware/u-boot.itb || echo "NO BOOTABLE ITB IMAGE FOUND!"
            test -s fw/firmware/idbloader.img || echo "NO BOOTABLE IDB IMAGE FOUND!"
            test -s fw/firmware/tee.elf || test -s fw/firmware/tee.bin
          fi
          {
            echo "yubiOS ARM64 firmware bundle"
            echo "board=${BOARD}"
            echo "board_title=${BOARD_TITLE}"
            echo "yubios_commit=${GITHUB_SHA}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "tfa_ref=${TFA_REF}"
            echo "optee_os_ref=${OPTEE_OS_REF} (release provenance in PINNED.md)"
            echo "optee_ftpm_ref=${OPTEE_FTPM_REF} (release provenance in PINNED.md)"
            echo "uboot_ref=${UBOOT_REF}"
            echo "edk2_ref=${EDK2_REF}"
            echo "edk2_platforms_ref=${EDK2_PLATFORMS_REF}"
            echo "ms_tpm_ref=${MS_TPM_REF}"
            echo "ftpm_uuid=${FTPM_UUID}"
            echo "optee_platform=${OPTEE_PLATFORM}"
            echo "optee_flavor=${OPTEE_FLAVOR}"
            echo "tfa_plat=${TFA_PLAT}"
            echo "uboot_defconfig=${UBOOT_DEFCONFIG}"
            echo "required_image=${REQUIRED_IMAGE}"
            echo "storage_note=${STORAGE_NOTE}"
            if [ "$BOARD" = "qemu-arm64" ]; then
              echo "signature_envelope=TF-A CREATE_KEYS=1; excluded from byte-for-byte proof"
            fi
          } > fw/firmware/MANIFEST.txt
          normalize_reproducible_tree fw/firmware
          write_reproducible_checksums fw/firmware
          ls -l fw/firmware/

      - name: Log in to Docker Hub
        if: steps.rk_tpl_gate.outputs.skip_publish != '1'
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///run/docker-rootless/docker.sock login -u 0mniteck42 --password-stdin

      - name: Build and push firmware OCI artifact through Bake
        if: steps.rk_tpl_gate.outputs.skip_publish != '1'
        env:
          FIRMWARE_CONTEXT: fw
          FIRMWARE_BOARD: ${{ matrix.board }}
          FIRMWARE_BOARD_TITLE: ${{ matrix.board_title }}
          FIRMWARE_PUBLISH_ORIGINAL: ${{ matrix.publish_original }}
          GIT_SHA: ${{ github.sha }}
          PUSH: 'true'
        run: |
          set -euxo pipefail
          docker -H unix:///run/docker-rootless/docker.sock buildx bake \
            --builder hardened \
            --file yubiOS-bake.hcl \
            firmware
          docker -H unix:///run/docker-rootless/docker.sock logout

      - name: Verify pushed board tag
        if: steps.rk_tpl_gate.outputs.skip_publish != '1'
        env:
          BOARD: ${{ matrix.board }}
        run: docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "0mniteck/yubios:firmware-${BOARD}"

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [stmm, optee_fip, firmware-reproducibility, qemu, firmware-publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

name: ci_test-bootc-lifecycle
on:
  pull_request:
    paths:
      - 'tests/vm/test-bootc-upgrade.sh'
      - 'tests/vm/test-bootc-rollback.sh'
      - 'tests/vm/test-homed-migrate.sh'
      - '.github/workflows/ci_test-bootc-lifecycle.yml'
  schedule:
    # Weekly Monday 6 AM UTC drift scan
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      from_image:
        description: 'FROM image (current)'
        required: false
        default: 'docker.io/0mniteck/yubios:dev-ccb5e52b4376aa228835c2b1fa125f76dec9ffaf'
      to_image:
        description: 'TO image (target upgrade)'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
      allow_real_u2f:
        type: boolean
        description: 'Host has a real YubiKey for destructive legs'
        default: false
      run_vm_legs:
        type: boolean
        description: 'Run the full bcvk VM boot legs on the self-hosted arm64 rock1 runner (requires rock1 online). Default false: hosted amd64 verifies pulls + bcvk binary and loud-skips VM legs (ADR-023).'
        default: false

permissions:
  contents: read

jobs:
  test-upgrade:
    name: bootc upgrade + rollback test
    runs-on: ${{ inputs.run_vm_legs == true && fromJSON('["self-hosted","Linux","ARM64","KVM"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install bcvk + podman + VM host deps
        run: |
          set -euo pipefail
          sudo apt-get update
          ARCH="$(dpkg --print-architecture)"
          QEMU_PKG="qemu-system-x86"; [ "$ARCH" = "arm64" ] && QEMU_PKG="qemu-system-arm"
          sudo apt-get install -y podman "$QEMU_PKG" qemu-utils virtiofsd swtpm genisoimage
          # KVM + FUSE setup (same recipe as ci_test-vm.yml): GH runners ship
          # /dev/kvm root:kvm 0660, and /dev/fuse may be absent -- a missing
          # /dev/fuse is the documented cause of virtiofsd's silent rc=2.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo modprobe fuse || true
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229 || true
          sudo chmod 666 /dev/fuse || true
          # Arch-aware release binary + checksum verify (OMN-106/107 pattern).
          curl -fsSL "https://github.com/yubi-OS/bcvk/releases/latest/download/bcvk-${ARCH}" -o /tmp/bcvk
          curl -fsSL "https://github.com/yubi-OS/bcvk/releases/latest/download/SHA256SUMS" -o /tmp/SHA256SUMS
          (cd /tmp && grep " bcvk-${ARCH}$" SHA256SUMS | sed "s| bcvk-${ARCH}$| bcvk|" | sha256sum --check --strict)
          sudo install -m 0755 /tmp/bcvk /usr/local/bin/bcvk
          bcvk --help >/dev/null
      - name: Verify test images are pullable
        run: |
          sudo podman pull "${{ inputs.from_image || 'docker.io/0mniteck/yubios:dev-ccb5e52b4376aa228835c2b1fa125f76dec9ffaf' }}"
          sudo podman pull "${{ inputs.to_image || 'docker.io/0mniteck/yubios:dev' }}"
      - name: Run test-bootc-upgrade.sh (VM boot legs)
        if: ${{ inputs.run_vm_legs == true }}
        env:
          ALLOW_REAL_U2F: ${{ inputs.allow_real_u2f }}
        run: |
          bash tests/vm/test-bootc-upgrade.sh \
            --from-image "${{ inputs.from_image || 'docker.io/0mniteck/yubios:dev-ccb5e52b4376aa228835c2b1fa125f76dec9ffaf' }}" \
            --to-image "${{ inputs.to_image || 'docker.io/0mniteck/yubios:dev' }}" \
            --allow-real-u2f "${{ inputs.allow_real_u2f || false }}"
      - name: Loud-skip VM boot legs (ADR-023 precedent)
        if: ${{ inputs.run_vm_legs != true }}
        run: |
          echo "::warning::SKIP: bootc-upgrade VM boot legs skipped -- amd64 hosted runners cannot run bcvk ephemeral VMs (open bcvk/virtiofsd diagnosis #9/#20/#25, same gate as ci_test-vm.yml per ADR-023). Dispatch with run_vm_legs=true to run them on the self-hosted arm64 rock1 runner."
          echo "### bootc-upgrade -- SKIP: VM boot legs (amd64 hosted; dispatch run_vm_legs=true for rock1)" >> "$GITHUB_STEP_SUMMARY"

  test-homed-migrate:
    name: systemd-homed migration test
    runs-on: ${{ inputs.run_vm_legs == true && fromJSON('["self-hosted","Linux","ARM64","KVM"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bcvk + podman + VM host deps
        run: |
          set -euo pipefail
          sudo apt-get update
          ARCH="$(dpkg --print-architecture)"
          QEMU_PKG="qemu-system-x86"; [ "$ARCH" = "arm64" ] && QEMU_PKG="qemu-system-arm"
          sudo apt-get install -y podman "$QEMU_PKG" qemu-utils virtiofsd swtpm genisoimage
          # KVM + FUSE setup (same recipe as ci_test-vm.yml): GH runners ship
          # /dev/kvm root:kvm 0660, and /dev/fuse may be absent -- a missing
          # /dev/fuse is the documented cause of virtiofsd's silent rc=2.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo modprobe fuse || true
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229 || true
          sudo chmod 666 /dev/fuse || true
          # Arch-aware release binary + checksum verify (OMN-106/107 pattern).
          curl -fsSL "https://github.com/yubi-OS/bcvk/releases/latest/download/bcvk-${ARCH}" -o /tmp/bcvk
          curl -fsSL "https://github.com/yubi-OS/bcvk/releases/latest/download/SHA256SUMS" -o /tmp/SHA256SUMS
          (cd /tmp && grep " bcvk-${ARCH}$" SHA256SUMS | sed "s| bcvk-${ARCH}$| bcvk|" | sha256sum --check --strict)
          sudo install -m 0755 /tmp/bcvk /usr/local/bin/bcvk
          bcvk --help >/dev/null
      - name: Verify base image is pullable
        run: sudo podman pull docker.io/0mniteck/yubios:dev
      - name: Run test-homed-migrate.sh (VM boot legs)
        if: ${{ inputs.run_vm_legs == true }}
        env:
          ALLOW_REAL_U2F: ${{ inputs.allow_real_u2f }}
        run: |
          bash tests/vm/test-homed-migrate.sh \
            --allow-real-u2f "${{ inputs.allow_real_u2f || false }}"
      - name: Loud-skip VM boot legs (ADR-023 precedent)
        if: ${{ inputs.run_vm_legs != true }}
        run: |
          echo "::warning::SKIP: homed-migrate VM boot legs skipped -- amd64 hosted runners cannot run bcvk ephemeral VMs (open bcvk/virtiofsd diagnosis #9/#20/#25, same gate as ci_test-vm.yml per ADR-023). Dispatch with run_vm_legs=true to run them on the self-hosted arm64 rock1 runner."
          echo "### homed-migrate -- SKIP: VM boot legs (amd64 hosted; dispatch run_vm_legs=true for rock1)" >> "$GITHUB_STEP_SUMMARY"

            yubios-uki
          docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "0mniteck/yubios:uki-${{ github.sha }}-${{ matrix.arch }}"
          docker -H unix:///run/docker-rootless/docker.sock logout


      - name: Install cosign v3.1.2 (per-arch installer + uki)
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true && matrix.publish == true
        run: |
          wcurl "https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64"
          COSIGN_SHA512=01174ede4958413aca502e7eafdff34a5a7fab39c25af66b84c24b98e354e5cf2631bf2c07ecdd8c684dfab843f9694237606706eeafc20ae30ed5ed831f1d60
          printf '%s  %s\n' "$COSIGN_SHA512" cosign-linux-amd64 | sha512sum --check --strict
          install -D -m 0755 cosign-linux-amd64 /usr/local/bin/cosign

      - name: Resolve per-arch digests + extract BuildKit attestations
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true && matrix.publish == true
        id: resolve
        env:
          INSTALLER_TAG: 0mniteck/yubios:installer-${{ github.sha }}-${{ matrix.arch }}
          UKI_TAG: 0mniteck/yubios:uki-${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          : > per-arch-digests.txt
          for tag in "$INSTALLER_TAG" "$UKI_TAG"; do
            DIGEST=$(docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            echo "$tag $DIGEST" >> per-arch-digests.txt
          done
          docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$INSTALLER_TAG" --format '{{json .SBOM}}' > sbom.json
          docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$INSTALLER_TAG" --format '{{json .Provenance}}' > provenance.json
          test -s sbom.json
          test -s provenance.json
          jq -e . sbom.json
          jq -e . provenance.json

      - name: cosign sign per-arch (ukis + installer per-arch)
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true && matrix.publish == true
        run: |
          while read -r tag digest; do
            for attempt in 1 2 3 4 5; do
            cosign sign --key cosign/yubios-omni157.key --signing-config cosign/signing-config.json "$tag@$digest" && exit 0
            echo "::warning::cosign per-arch-sign attempt ${attempt}/5 failed; retry in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          echo "::error::cosign per-arch-sign failed after 5 attempts" >&2
          exit 1

          done < per-arch-digests.txt

          docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "0mniteck/yubios:installer-${{ github.sha }}-${{ matrix.arch }}"


name: fetch-fedora-bootc-manifest

# Resolves the quay.io/fedora/fedora-bootc:45 *INDEX* (manifest-list)
# digest, then replaces the previously pinned Fedora bootc digest everywhere it
# appears in repo text files.  The upstream stream tag (:45, FEDORA_STREAM_TAG)
# is only QUERIED here; the Containerfile carries the digest-only form
#   FROM quay.io/fedora/fedora-bootc@sha256:<index-digest>
# (OMN-170 / B-REPRO-MIRROR).  Any legacy `fedora-bootc:<tag>@sha256:` FROM is
# normalized to the digest-only form, and the run fails closed if the
# Containerfile FROM does not end up as `fedora-bootc@sha256:<new-digest>`.
#
# Runs on the BARE runner (no container): this is only a registry HTTPS query
# and a repo text update. AGENTS.md allows container absent.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout yubiOS for PINNED.md update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
        with:
          token: ${{ secrets.WORKFLOW }}

      - name: Fetch Fedora bootc manifest and update pinned refs
        env:
          # Upstream stream tag that is queried; never written into Containerfile*.
          FEDORA_STREAM_TAG: '45'
        run: |
          set -euo pipefail
          image_path='fedora/fedora-bootc'
          tag="${FEDORA_STREAM_TAG}"
          manifest_url="https://quay.io/v2/${image_path}/manifests/${tag}"
          accept_headers=(
            -H 'Accept: application/vnd.oci.image.index.v1+json'
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json'
            -H 'Accept: application/vnd.oci.image.manifest.v1+json'
          )

          echo "== HEAD quay.io/${image_path}:${tag} (index media types preferred) =="
          headers=$(curl -sI "${accept_headers[@]}" "$manifest_url")
          if ! printf '%s\n' "$headers" | grep -qi '^docker-content-digest:'; then
            TOKEN=$(curl -fsSL "https://quay.io/v2/auth?service=quay.io&scope=repository:${image_path}:pull" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
            headers=$(curl -sI -H "Authorization: Bearer $TOKEN" "${accept_headers[@]}" "$manifest_url")
            auth_args=(-H "Authorization: Bearer $TOKEN")
          else
            auth_args=()
          fi
          printf '%s\n' "$headers" | grep -i -E 'docker-content-digest|content-type'
          index_digest=$(printf '%s\n' "$headers" | awk 'tolower($1)=="docker-content-digest:" {gsub("\r", "", $2); print $2; exit}')
          test -n "$index_digest"
          printf '%s\n' "$index_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'

          echo "== Confirm it is an INDEX and list its per-arch children =="
          curl -fsSL "${auth_args[@]}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "$manifest_url" > /tmp/fedora-bootc-index.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/fedora-bootc-index.json'))
          print('mediaType:', d.get('mediaType',''))
          if 'manifests' not in d:
              raise SystemExit('NOT an index - single-arch manifest returned')
          for m in d['manifests']:
              p=m.get('platform',{})
              print(' -', p.get('os'), p.get('architecture'), m.get('digest'))
          PY

          python3 - "$index_digest" <<'PY'
          import datetime, pathlib, re, sys
          new_index = sys.argv[1]
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', new_index):
              raise SystemExit(f'Refusing malformed index digest: {new_index!r}')
          today = datetime.date.today().isoformat()
          pinned = pathlib.Path('PINNED.md')
          text = pinned.read_text()
          # PINNED.md row: digest-only image column (OMN-170) or legacy `:45` column.
          match = re.search(r'`quay\.io/fedora/fedora-bootc(?::[0-9A-Za-z._-]+)?`[^|]*\| `(sha256:[0-9a-f]{64})`', text)
          if not match:
              raise SystemExit('Could not find current fedora-bootc digest row in PINNED.md')
          old_index = match.group(1)
          replacements = {old_index: new_index}
          if old_index == new_index:
              print(f'fedora-bootc index digest unchanged: {new_index}')
          # Legacy `fedora-bootc:<tag>@sha256:` -> digest-only `fedora-bootc@sha256:`.
          legacy_ref = re.compile(r'quay\.io/fedora/fedora-bootc:[0-9A-Za-z._-]+@(sha256:[0-9a-f]{64})')

          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  data = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = data
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
                  updated = updated.replace(old.removeprefix('sha256:'), new.removeprefix('sha256:'))
              if path.name.startswith('Containerfile'):
                  updated = legacy_ref.sub(r'quay.io/fedora/fedora-bootc@\1', updated)
              if path == pinned and old_index != new_index:
                  updated = re.sub(r'Re-resolved \d{4}-\d{2}-\d{2}', f'Re-resolved {today}', updated)
              if updated != data:
                  path.write_text(updated)
                  print(f'updated {path}')

          # Fail closed: every fedora-bootc FROM in a top-level Containerfile* must be
          # the digest-only form pinned to the freshly resolved index digest.
          want = f'quay.io/fedora/fedora-bootc@{new_index}'
          froms = []
          for cf in sorted(pathlib.Path('.').glob('Containerfile*')):
              for line in cf.read_text().splitlines():
                  s = line.strip()
                  if s.upper().startswith('FROM ') and 'fedora-bootc' in s:
                      froms.append((cf.name, s))
                      if s.split()[1] != want:
                          raise SystemExit(f'{cf}: FROM is {s.split()[1]!r}, expected {want!r}')
          if not froms:
              raise SystemExit('No fedora-bootc FROM found in any top-level Containerfile*')
          for name, s in froms:
              print(f'verified {name}: {s}')
          PY

          if git diff --quiet; then
            echo "PINNED.md and referenced Fedora bootc digests already current."
          else
            GITHUB_TOKEN=${{ secrets.WORKFLOW }}
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add PINNED.md .
            git commit -m "Refresh pinned Fedora bootc digest"
            git push
          fi

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [fetch]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

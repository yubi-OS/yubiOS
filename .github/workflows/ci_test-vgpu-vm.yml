name: yubiOS vGPU VM e2e (tests/vm)

# Derived from ci_test-vm.yml -- same lint gate, same host-deps / zstd-QEMU /
# bcvk-build / KVM / AppArmor preflight, same matrix, same rc contract (0 pass,
# 77 loud SKIP, anything else fails), same artifact upload, same ci.yml callback.
#
# What it adds: a virtual GPU in scope for the whole suite.
#
#   * tests/vm/test-vgpu-virtio-ci.sh      -- host-side virtio-gpu-pci /
#     vfio-user-pci device-model gate, then a guest leg asserting the DRM nodes,
#     the bound virtio_gpu driver, and the NEGATIVE VFIO surface (no /dev/vfio,
#     nothing bound to vfio-pci) that a default yubiOS image must present.
#   * tests/vm/test-vfio-user-host-ci.sh   -- QEMU's userspace device client
#     (vfio-user-pci, upstream since QEMU 10.1) against a libvfio-user server over
#     an owner-only AF_UNIX socket, with no kernel VFIO modules anywhere.
#
# Then it re-runs EVERY ci_test-vm.yml leg (fTPM chain, LUKS2 FIDO2, FIDO2
# enrollment, hardware YubiKey leg on dispatch) with YUBIOS_VGPU=1 in scope. That
# is the point: per refs/vgpu-vfio-user-trust-boundary-2026-07-25.md rule 5, no
# trust-boundary component may consume GPU state, so adding a vGPU must be a no-op
# for Secure Boot, LUKS2 FIDO2 unlock, homed, pam-u2f and fTPM PCR behaviour.
#
# Real vfio-pci GPU passthrough, IOMMU isolation and vendor mediated vGPU are NOT
# tested here and cannot be: no hosted or self-hosted runner in this org has an
# IOMMU plus a real GPU. Those stay bare-metal-only, documented in the same ref.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Pullable yubiOS OCI image ref (or local path) to boot for the full e2e. Leave blank to skip the VM boot leg.'
        required: true
        default: 'docker.io/0mniteck/yubios:dev'
        type: string
      hw_device:
        description: 'DESTRUCTIVE: spare block device path (e.g. /dev/sdb) on the self-hosted rock1 runner for the physical-YubiKey hardware test (tests/vm/test-luks-fido2.sh). Wipes this device. Leave blank (default) to skip -- this never runs on push, only on an explicit dispatch with this set.'
        required: false
        default: ''
        type: string
      hw_image:
        description: 'yubiOS OCI image ref for the hardware YubiKey passthrough test (defaults to the same image input above).'
        required: false
        default: ''
        type: string
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      firmware_image:
        description: 'OCI ref of the published yubiOS firmware bundle to source flash.bin from (ci_firmware-rk.yml Stage 4 output). The fTPM lives in this firmware, not in the yubiOS OS image.'
        required: false
        default: 'docker.io/0mniteck/yubios:firmware-qemu-arm64'
        type: string
      ftpm_linux_payload:
        description: 'Also run fTPM Stage B: bcvk to-disk the yubiOS image and boot it under the fTPM firmware to prove the guest kernel binds tpm_ftpm_tee. Slow (TCG) and unproven; off by default.'
        required: false
        default: true
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string
      allow_real_u2f:
        description: 'Pass ALLOW_REAL_U2F=1 to the passless CI tests (test-luks-fido2-ci.sh, test-fido2-enrollment.sh). Required on the arm64 self-hosted rock1 runner because that runner has a physical YubiKey attached for the DESTRUCTIVE test (tests/vm/test-luks-fido2.sh). PR #144 real-U2F guard correctly refuses to silently run passless tests when a real key is on the host (otherwise a passless regression would be masked by the in-guest software authenticator losing the enumeration race to the real key) -- so CI must explicitly opt in. Default false; set true on any dispatch that runs on rock1.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  # -- Real gate: shell syntax + shellcheck on every tests/vm script. --
  lint-vm-scripts:
    runs-on: ubuntu-24.04
    container:
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:61dc022a1908439c478ed4b00e883fe8a7a03540fac23a8aed61352e28e6ae07 # trixie-debian13-dev INDEX (manifest list)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
      - name: shellcheck + bash -n on tests/vm/*.sh
        run: |
          apt-get update -qq
          apt-get install -y -qq shellcheck bash
          fail=0
          for s in tests/vm/*.sh; do
            echo "== $s =="
            bash -n "$s" || { echo "::error::bash -n failed: $s"; fail=1; }
            shellcheck -S warning "$s" || { echo "::error::shellcheck failed: $s"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1

  # -- VM e2e: native matrix, bare runner (full host toolchain: cargo + qemu + --
  #    KVM). Hardened dhi base omits crt*.o/libc, so bcvk's cargo build needs the
  #    bare runner (same lesson as the bcvk Rust CI). fail-fast:false for parity.
  vgpu-vm-e2e:
    needs: lint-vm-scripts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemu_pkgs: qemu-system-x86 ovmf
            primary: false
          - arch: arm64
            # Self-hosted ARM64 board (runner "rock1", labels self-hosted+Linux+ARM64+KVM) --
            # real hardware with actual KVM support, unblocking the boot leg that hosted
            # self-hosted ARM64 GPU runners can't run (no nested virt, see the KVM gate below).
            runner: [self-hosted, Linux, ARM64, KVM]
            qemu_pkgs: qemu-system-arm qemu-efi-aarch64
            primary: true
            # -- Negative 2 (composefs tamper) leg, merged in from the former standalone
            #    composefs-tamper-test job. arm64-only; amd64 leg skips them via `if: matrix.arch == 'arm64'`.
            root_type_guid: b921b045-1df0-41c3-af44-4c6f280d3fae
            qemu: qemu-system-aarch64
            fw_dir: /usr/share/AAVMF
            code_fd: AAVMF_CODE.fd
            vars_fd: AAVMF_VARS.fd
            machine: virt,accel=kvm
            cpu: host
            smp: "1"
            boot_timeout: "120"
    runs-on: ${{ matrix.runner }}
    env:
      # Consumed by tests/vm/*-ci.sh legs that branch on 'is a vGPU attached'.
      YUBIOS_VGPU: '1'
    steps:
      - name: Reclaim workspace before checkout (self-hosted rock1 can accumulate root-owned files from sudo-run test scripts)
        run: |
          # actions/checkout's own cleanup runs as the unprivileged runner user and
          # cannot remove root-owned leftovers (e.g. tests/vm/test-ftpm-qemu-ci.sh's
          # old WORK dir, before it moved to /tmp) -- when that happens it silently
          # falls back to a STALE pre-checkout tree with no error banner, which is
          # exactly what runs 30180564384/30180564430 hit. Wipe the workspace with
          # sudo before checkout ever runs, every time, so this can't recur.
          sudo rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Free disk space (self-hosted rock1 persists disk across runs -- unlike hosted runners)
        if: matrix.arch == 'arm64'
        run: |
          df -h "$PWD" || true
          echo "--- pruning podman storage from prior runs (root-owned, since bcvk/vm-e2e now runs under sudo) ---"
          sudo podman system prune -af --volumes || true
          echo "--- removing leftover bcvk-src clone + cargo target from a prior run ---"
          sudo rm -rf /opt/*-src || true
          echo "--- cleaning apt cache ---"
          sudo apt-get clean || true
          df -h "$PWD" || true

      - name: Install host deps (swtpm + qemu + fido2 + cryptsetup)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            swtpm swtpm-tools qemu-utils ${{ matrix.qemu_pkgs }} \
            fido2-tools cryptsetup-bin git build-essential pkg-config libssl-dev virtiofsd \
            apparmor-utils util-linux parted dosfstools e2fsprogs
          # GH runners ship /dev/kvm root:kvm 0660 -- the runner user (and
          # root-in-rootless-podman) can't open it. Documented GH recipe:
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || true
          # virtiofsd needs /dev/fuse; GH Actions ubuntu-24.04 runners don't
          # guarantee the fuse module is loaded / device node present. A
          # missing /dev/fuse is a plausible cause of virtiofsd's silent
          # rc=2 (empty stdout+stderr+logfile) seen in prior runs -- FUSE
          # device-open failures in some Rust FUSE crates exit before their
          # own logger initializes.
          sudo modprobe fuse || true
          sudo mkdir -p /dev
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229 || true
          sudo chmod 666 /dev/fuse || true
          ls -la /dev/fuse || echo "::warning::/dev/fuse still absent after modprobe+mknod"

      - name: Install zstd-capable QEMU for ARM64 DirectBoot
        id: qemu-zstd
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          # Fedora ARM64 vmlinuz images are EFI zboot images with zstd-compressed
          # payloads. Ubuntu 24.04's packaged QEMU predates upstream commit
          # 3a18e8a25992 (hw/loader: Add support for zboot images compressed
          # with zstd), so bcvk's DirectBoot path fails before the guest starts.
          # Build only qemu-system-aarch64 from that pinned upstream commit and
          # prepend it to PATH for bcvk. rock1 is self-hosted and persistent, so
          # keep /opt/qemu-zstd as a local cache between runs (binary + source,
          # both under /opt so they survive between jobs on this runner).
          QEMU_ZSTD_COMMIT=3a18e8a25992d1643707e2cebdd6e9bb2bd7d3b9
          QEMU_PREFIX=/opt/qemu-zstd/${QEMU_ZSTD_COMMIT}
          QEMU_SRC=/opt/qemu-zstd-src
          if [ ! -x "${QEMU_PREFIX}/bin/qemu-system-aarch64" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              ninja-build python3-venv python3-pip meson pkg-config \
              libglib2.0-dev libpixman-1-dev zlib1g-dev libzstd-dev \
              libslirp-dev libusb-1.0-0-dev libudev-dev libaio-dev \
              libcap-ng-dev libattr1-dev
            sudo rm -rf "${QEMU_SRC}"
            sudo mkdir -p "${QEMU_SRC}"
            sudo chown "$(id -u):$(id -g)" "${QEMU_SRC}"
            git clone --filter=blob:none --depth 1 \
              https://github.com/qemu/qemu.git "${QEMU_SRC}"
            git -C "${QEMU_SRC}" fetch --depth 1 origin "${QEMU_ZSTD_COMMIT}"
            git -C "${QEMU_SRC}" checkout --detach "${QEMU_ZSTD_COMMIT}"
            (
              cd "${QEMU_SRC}"
              ./configure \
                --prefix="${QEMU_PREFIX}" \
                --target-list=aarch64-softmmu \
                --disable-docs \
                --disable-werror
              ninja -C build qemu-system-aarch64
              sudo ninja -C build install
            )
            sudo rm -rf "${QEMU_SRC}"
          fi
          sudo mkdir -p "${QEMU_PREFIX}/bcvk-bin"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec /run/host-mounts/qemu-zstd/bin/qemu-system-aarch64 -L /run/host-mounts/qemu-zstd/share/qemu "$@"' | sudo tee "${QEMU_PREFIX}/bcvk-bin/qemu-system-aarch64" >/dev/null

          sudo chmod 0755 "${QEMU_PREFIX}/bcvk-bin/qemu-system-aarch64"
          "${QEMU_PREFIX}/bin/qemu-system-aarch64" --version
          echo "${QEMU_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "qemu_prefix=${QEMU_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "### vgpu-vgpu-vm-e2e (arm64) -- INFO: using zstd-capable QEMU ${QEMU_ZSTD_COMMIT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build bcvk @ pinned source (feasibility gate)
        id: bcvk
        run: |
          set +e
          BCVK_REF=34fb0b6bfff0f59d4ff4a985dab895a7b87a2c5c # yubios branch (PR #8 --extra-qemu-arg + ephemeral SSH/vsock poll + infra sync); see PINNED.md
          # rock1 is self-hosted and persistent -- cache the built binary under
          # /opt keyed by the pinned commit, same pattern as qemu-zstd above.
          BCVK_PREFIX="/opt/bcvk/${BCVK_REF}" # cache-keyed by pinned source; rebuilds when BCVK_REF changes (bcvk PR #1+#2+#7+#8 combined upstream; no in-run CI patch since PR #8 merged)
          BCVK_SRC=/opt/bcvk-src
          if [ -x "${BCVK_PREFIX}/bin/bcvk" ]; then
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "${BCVK_PREFIX}/bin" >> "$GITHUB_PATH"
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- INFO: bcvk cache HIT at ${BCVK_PREFIX}, build skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo rm -rf "$BCVK_SRC"
          sudo mkdir -p "$BCVK_SRC"
          sudo chown "$(id -u):$(id -g)" "$BCVK_SRC"
          git init -q "$BCVK_SRC" &&
            git -C "$BCVK_SRC" remote add origin https://github.com/yubi-OS/bcvk &&
            git -C "$BCVK_SRC" fetch --depth 1 origin "$BCVK_REF" &&
            git -C "$BCVK_SRC" checkout --detach FETCH_HEAD
          bcvk_fetch_rc=$?
          if [ "$bcvk_fetch_rc" -ne 0 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: could not fetch pinned yubi-OS/bcvk source -- VM e2e not feasible on this runner"
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- SKIP: bcvk source unavailable" >> "$GITHUB_STEP_SUMMARY"
            sudo rm -rf "$BCVK_SRC"
            exit 0
          fi
          if ! grep -Fq -- 'cmd.arg("--privileged")' "$BCVK_SRC/crates/kit/src/run_ephemeral.rs"; then
            perl -0pi -e 's/(    cmd\.args\(\[\n        \/\/ Needed to create nested containers)/    cmd.arg("--privileged");\n    \/\/ Ubuntu rootful Podman needs the fully privileged profile for bcvk\n    \/\/ to bind-mount the extracted kernel inside its bwrap namespace.\n\n$1/' "$BCVK_SRC/crates/kit/src/run_ephemeral.rs"
          fi
          grep -Fq -- 'cmd.arg("--privileged")' "$BCVK_SRC/crates/kit/src/run_ephemeral.rs" \
            || { echo "::error::failed to apply bcvk privileged-container CI patch"; exit 1; }
          if ! grep -Fq -- '--cap-add CAP_SYS_ADMIN' "$BCVK_SRC/crates/kit/scripts/entrypoint.sh"; then
            perl -0pi -e 's/(bwrap --as-pid-1 --unshare-pid)/$1 --cap-add CAP_SYS_ADMIN/' "$BCVK_SRC/crates/kit/scripts/entrypoint.sh"
          fi
          grep -Fq -- '--cap-add CAP_SYS_ADMIN' "$BCVK_SRC/crates/kit/scripts/entrypoint.sh" \
            || { echo "::error::failed to apply bcvk bwrap CAP_SYS_ADMIN CI patch"; exit 1; }
          if grep -Fq -- '"rsa"' "$BCVK_SRC/crates/kit/src/ssh.rs"; then
            perl -0pi -e 's/"-t",\n\s+"rsa",\n\s+"-b",\n\s+"4096",\s+\/\/ Use 4096-bit RSA for security/"-t",\n            "ed25519",/s' "$BCVK_SRC/crates/kit/src/ssh.rs"
          fi
          grep -Fq -- '"ed25519"' "$BCVK_SRC/crates/kit/src/ssh.rs" \
            || { echo "::error::failed to apply bcvk ed25519 SSH key CI patch"; exit 1; }
          # ARM virt SMBIOS tables are published to the guest by firmware.
          # bcvk DirectBoot bypasses firmware, so use systemd's documented
          # kernel-command-line credential transport for this public key.
          if ! grep -Fq -- 'ssh_credential_karg = None' "$BCVK_SRC/crates/kit/src/run_ephemeral.rs"; then
            git -C "$BCVK_SRC" apply "$GITHUB_WORKSPACE/.github/patches/bcvk-arm64-directboot-ssh.patch" \
              || { echo "::error::failed to apply bcvk ARM64 DirectBoot SSH credential patch"; exit 1; }
          fi
          grep -Fq -- 'karg_for_root_ssh(&pubkey)' "$BCVK_SRC/crates/kit/src/run_ephemeral.rs" \
            || { echo "::error::bcvk ARM64 DirectBoot SSH credential fallback unavailable"; exit 1; }
          grep -Fq -- 'systemd.set_credential_binary=tmpfiles.extra:' "$BCVK_SRC/crates/bcvk-qemu/src/credentials.rs" \
            || { echo "::error::bcvk systemd kernel-command-line SSH credential unavailable"; exit 1; }
          # Keep tmpfiles.extra as the payload on both transports so systemd-
          # tmpfiles and the yubiOS root-only helper accept the same data.
          grep -Fq -- 'io.systemd.credential.binary:tmpfiles.extra={encoded}' "$BCVK_SRC/crates/bcvk-qemu/src/credentials.rs" \
            || { echo "::error::bcvk no longer exposes the documented tmpfiles.extra root SSH credential path"; exit 1; }
          ( cd "$BCVK_SRC" && cargo test --release -p bcvk-qemu test_karg_for_root_ssh && cargo build --release )
          if [ ! -x "$BCVK_SRC/target/release/bcvk" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: pinned bcvk source failed to build -- VM e2e not feasible (see cargo output above)"
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- SKIP: bcvk build failed" >> "$GITHUB_STEP_SUMMARY"
            sudo rm -rf "$BCVK_SRC"
            exit 0
          fi
          sudo mkdir -p "${BCVK_PREFIX}/bin"
          sudo cp "$BCVK_SRC/target/release/bcvk" "${BCVK_PREFIX}/bin/bcvk" || { echo "::error::failed to stage bcvk binary"; exit 1; }
          sudo chmod 0755 "${BCVK_PREFIX}/bin/bcvk"
          echo "${BCVK_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "skip=0" >> "$GITHUB_OUTPUT"
          echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- INFO: bcvk built and cached at ${BCVK_PREFIX}" >> "$GITHUB_STEP_SUMMARY"
          # Reclaim space immediately before the large image pull. Keep only the
          # cached bcvk binary under /opt; rock1 has a small root disk and hit
          # 69 MB free after pull.
          rm -rf ~/.cargo/registry ~/.cargo/git ~/.cargo/.package-cache 2>/dev/null || true
          sudo rm -rf "$BCVK_SRC"

      - name: Gate on KVM (bcvk hard-requires /dev/kvm; now real hardware on arm64 via self-hosted rock1)
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "kvm=1" >> "$GITHUB_OUTPUT"
          else
            echo "kvm=0" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: /dev/kvm absent on this runner (self-hosted ARM64 should have it -- if this fires on rock1, KVM isn't enabled in its kernel/BIOS, not a hosted-runner limitation); bcvk boot legs skipped LOUDLY"
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- SKIP: boot legs, no /dev/kvm on this runner" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Gate amd64 boot leg on platform-priority policy (ADR-023: ARM64 is primary)"
        id: policy
        run: |
          if [ "${{ matrix.primary }}" = "true" ]; then
            echo "boot=1" >> "$GITHUB_OUTPUT"
          else
            echo "boot=0" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: ${{ matrix.arch }} boot leg skipped -- ARM64 is yubiOS's primary target platform (ADR-023); amd64 CI does not block on the open bcvk/virtiofsd bug on a now-secondary arch (see #9/#20/#25 for the diagnosis)."
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- SKIP: boot legs, secondary platform per ADR-023 (bcvk/virtiofsd diagnosis: #9/#20/#25)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assert bcvk exposes --swtpm/--swu2f (real regression gate)
        if: steps.bcvk.outputs.skip == '0'
        run: |
          bcvk ephemeral run --help 2>&1 | grep -q -- '--swtpm' \
            || { echo "::error::pinned bcvk source missing --swtpm flag"; exit 1; }
          bcvk ephemeral run --help 2>&1 | grep -q -- '--swu2f' \
            || { echo "::error::pinned bcvk source missing --swu2f flag"; exit 1; }
          echo "bcvk exposes --swtpm and --swu2f"

      # NOT converted to docker: bcvk (crates/kit/src/run_ephemeral.rs,
      # crates/kit/src/ephemeral.rs) hardcodes Command::new("podman") for its
      # privileged ephemeral-VM container and container inspection -- there is
      # no --runtime flag. Pulling with `docker` would populate docker's own
      # image store, which podman's separate containers-storage can't see, so
      # bcvk would still report "image not known". Every podman call in this
      # workflow and in tests/vm/*.sh (pull / rm / logs) exists to interoperate
      # with that hardcoded dependency, not because we chose podman ourselves.

      - name: Pull yubiOS image into podman storage (bcvk boots from local storage)
        if: steps.bcvk.outputs.skip == '0' && steps.kvm.outputs.kvm == '1' && steps.policy.outputs.boot == '1'
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER }}
        run: |
          # Login to docker.io if a password is available. arm64 self-hosted
          # runner (rock1): apt installs docker.io but the runner user has
          # no socket access, so use sudo podman throughout. This all-in-one
          # deployment/verifier workflow uses ONE pull for both the
          # vgpu-vm-e2e leg and the composefs-tamper Negative 2 leg; the
          # podman store is preserved between legs (see step 27 comment).
          if [ -n "${DOCKER_PASSWORD:-}" ]; then
            printf '%s' "$DOCKER_PASSWORD" | sudo podman login \
              --username 0mniteck42 --password-stdin docker.io
          fi
          sudo podman pull "${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}"
          sudo podman images | head -5
          # Resolve the immutable digest (pattern from former step 32)
          # for the composefs-tamper Negative 2 leg to reuse. podman
          # supports the same `--format '{{ index .RepoDigests 0 }}'` as docker.
          RESOLVED="$(sudo podman image inspect "${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}" \
            --format '{{ index .RepoDigests 0 }}')"
          case "$RESOLVED" in
            *@sha256:*) ;;
            *) echo "::error::image did not resolve to an immutable digest: $RESOLVED"; exit 1 ;;
          esac
          echo "Installing immutable source: $RESOLVED"
          echo "RESOLVED=$RESOLVED" >> "$GITHUB_ENV"

      - name: Relax AppArmor profiles for bcvk VM boot
        if: matrix.arch == 'arm64' && steps.bcvk.outputs.skip == '0' && steps.kvm.outputs.kvm == '1' && steps.policy.outputs.boot == '1'
        run: |
          set -euo pipefail
          aa_complain="$(command -v aa-complain || true)"
          aa_status="$(command -v aa-status || true)"
          [ -n "$aa_complain" ] || [ ! -x /usr/sbin/aa-complain ] || aa_complain=/usr/sbin/aa-complain
          [ -n "$aa_status" ] || [ ! -x /usr/sbin/aa-status ] || aa_status=/usr/sbin/aa-status
          if [ -z "$aa_complain" ]; then
            echo "::error::aa-complain unavailable after installing apparmor-utils; cannot relax AppArmor profiles for bcvk VM boot"
            exit 1
          fi
          profile_loaded() {
            [ -z "$aa_status" ] || sudo "$aa_status" 2>/dev/null | grep -Fxq "   $1"
          }
          for profile in unpriv_bwrap swtpm; do
            if profile_loaded "$profile"; then
              sudo "$aa_complain" "$profile"
            else
              echo "::notice::AppArmor profile $profile is not loaded; no CI relaxation needed"
            fi
          done
          if [ -n "$aa_status" ]; then
            sudo "$aa_status" | sed -n '1,140p' || true
          fi
          echo "### vgpu-vgpu-vm-e2e (arm64) -- INFO: AppArmor profiles relaxed for bcvk VM boot (unpriv_bwrap + swtpm when loaded)" >> "$GITHUB_STEP_SUMMARY"

 # -- Hardware YubiKey passthrough legs (yubiOS#9, yubiOS#20). --
      # Deliberately steps INSIDE vm-e2e rather than a separate job: they share this
      # job's bcvk build, image pull, and AppArmor setup on the self-hosted rock1
      # runner instead of paying for all of it twice.
      #
      # tests/vm/test-luks-fido2.sh needs a PHYSICAL YubiKey + a spare block device +
      # root: it flashes the device via `bcvk native-to-disk`, then enrolls LUKS2
      # against a real YubiKey tap. Different mechanism from the swu2f software
      # authenticator legs below (no VM, no QEMU USB passthrough).
      #
      # DESTRUCTIVE, so gated on an explicit workflow_dispatch with a non-empty
      # hw_device; on any normal run all three steps skip.

      - name: Precondition -- physical YubiKey attached (USB vendor 0x1050)
        id: yubikey
        if: github.event_name == 'workflow_dispatch' && inputs.hw_device != ''
        run: |
          if lsusb 2>/dev/null | grep -qi '1050:'; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: no physical YubiKey detected on this runner (lsusb has no vendor 1050 device)."
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- SKIP: hardware leg, no physical YubiKey attached to this runner" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Precondition -- target device is a block device and not the runner's root disk
        id: device
        if: github.event_name == 'workflow_dispatch' && inputs.hw_device != '' && steps.yubikey.outputs.present == '1'
        env:
          HW_DEVICE: ${{ inputs.hw_device }}
        run: |
          set -euo pipefail
          if [ ! -b "$HW_DEVICE" ]; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: $HW_DEVICE is not a block device on this runner."
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- SKIP: hardware leg, $HW_DEVICE is not a block device" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          root_src="$(findmnt -no SOURCE / || true)"
          root_disk="$(lsblk -no PKNAME "$root_src" 2>/dev/null || true)"
          target_disk="$(basename "$HW_DEVICE")"
          if [ -n "$root_disk" ] && { [ "$root_disk" = "$target_disk" ] || [ "$(basename "$root_src")" = "$target_disk" ]; }; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::error::REFUSING: $HW_DEVICE resolves to this runner's own root disk ($root_src). Never wiping the host."
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- FAIL: hardware leg refused, $HW_DEVICE is the runner's own root disk" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # bcvk native-to-disk shells out to `blockdev` (util-linux) to size the
          # target; run 30147997124 died with "blockdev not found; install
          # util-linux" at native_to_disk.rs:95. util-linux is installed with the
          # other host deps above -- assert it resolves before we start flashing.
          if ! command -v blockdev >/dev/null 2>&1 && [ ! -x /usr/sbin/blockdev ]; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::error::blockdev unavailable despite util-linux install; bcvk native-to-disk cannot size $HW_DEVICE"
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- FAIL: hardware leg, blockdev unavailable (util-linux)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "blockdev: $(command -v blockdev || echo /usr/sbin/blockdev)"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Run tests/vm/test-luks-fido2.sh (DESTRUCTIVE -- wipes ${{ inputs.hw_device }})
        if: github.event_name == 'workflow_dispatch' && inputs.hw_device != '' && steps.yubikey.outputs.present == '1' && steps.device.outputs.ok == '1'
        timeout-minutes: 15
        env:
          HW_DEVICE: ${{ inputs.hw_device }}
          HW_IMAGE: ${{ inputs.hw_image != '' && inputs.hw_image || (inputs.image || 'docker.io/0mniteck/yubios:dev') }}
        run: |
          chmod +x tests/vm/test-luks-fido2.sh
          echo "Running test-luks-fido2.sh against $HW_DEVICE with image $HW_IMAGE (physical YubiKey required -- touch when prompted)"
          set +e
          sudo env "PATH=$PATH:/usr/sbin:/sbin" bash tests/vm/test-luks-fido2.sh "$HW_DEVICE" "$HW_IMAGE"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::test-luks-fido2.sh failed (rc=$rc) against $HW_DEVICE"
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- FAIL: hardware leg, test-luks-fido2.sh rc=$rc against $HW_DEVICE" >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- PASS: hardware leg, real-hardware LUKS2 FIDO2 enrollment against $HW_DEVICE (yubiOS#9, yubiOS#20)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests/vm/test-luks-fido2-ci.sh (boot leg gated on image availability)
        if: ${{ always() && steps.bcvk.outputs.skip == '0' && steps.kvm.outputs.kvm == '1' && steps.policy.outputs.boot == '1' }}
        timeout-minutes: 5
        env:
          YUBIOS_IMAGE: ${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}
          YUBIOS_SSH_WAIT_SECS: ${{ matrix.arch == 'arm64' && '900' || '300' }}
          ALLOW_REAL_U2F: ${{ inputs.allow_real_u2f && '1' || '0' }}
          BCVK_EPHEMERAL_EXTRA_ARGS: >-
            ${{ matrix.arch == 'arm64' && format('--ro-bind {0}:qemu-zstd --ro-bind /lib/aarch64-linux-gnu:host-lib --ro-bind /usr/lib/aarch64-linux-gnu:host-usrlib --env PATH=/run/host-mounts/qemu-zstd/bcvk-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin --env LD_LIBRARY_PATH=/run/host-mounts/host-lib:/run/host-mounts/host-usrlib:/run/host-mounts/qemu-zstd/lib --log-dir=journal,console=/tmp/yubios-vm-e2e-logs', steps.qemu-zstd.outputs.qemu_prefix) || '' }}
        run: |
          if [ -z "${YUBIOS_IMAGE}" ] && [ ! -e ./mkosi.output/yubiOS ]; then
            echo "::warning::SKIP: no yubiOS image available (no workflow_dispatch 'image' input, no mkosi.output/yubiOS). VM boot + LUKS2-FIDO2 + homed legs NOT exercised."
            {
              echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- SKIP: VM boot leg (explicit)"
              echo "- bcvk built from the pinned source and exposes \`--swtpm\`/\`--swu2f\` OK"
              echo "- swtpm / qemu / fido2-tools / cryptsetup installed OK"
              echo "- **Skipped:** VM boot + LUKS2-FIDO2 + systemd-homed legs -- needs a built yubiOS test image (\`mkosi --profile test\`) or a \`workflow_dispatch\` \`image\` input."
              echo "- To run the full e2e: dispatch this workflow with \`image\` set to a pullable yubiOS OCI ref, or build the test image into \`./mkosi.output/yubiOS\` first."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ -e /dev/kvm ] || echo "::warning::/dev/kvm absent -- bcvk may fall back to slow TCG emulation"
          chmod +x tests/vm/test-luks-fido2-ci.sh
          sudo rm -rf /tmp/yubios-vm-e2e-logs
          sudo mkdir -p /tmp/yubios-vm-e2e-logs
          sudo chmod 0777 /tmp/yubios-vm-e2e-logs
          echo "Running test-luks-fido2-ci.sh against image: ${YUBIOS_IMAGE:-./mkosi.output/yubiOS}"
          set +e
          sudo env "PATH=$PATH:/usr/sbin:/sbin" "YUBIOS_IMAGE=${YUBIOS_IMAGE:-./mkosi.output/yubiOS}" "BCVK_EPHEMERAL_EXTRA_ARGS=${BCVK_EPHEMERAL_EXTRA_ARGS:-}" "YUBIOS_SSH_WAIT_SECS=${YUBIOS_SSH_WAIT_SECS:-300}" "ALLOW_REAL_U2F=${ALLOW_REAL_U2F:-0}" bash tests/vm/test-luks-fido2-ci.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "--- disk after failed VM run ---"
            df -h "$PWD" /tmp /var/lib/containers || true
            echo "--- VM console log tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/console.txt || true
            echo "--- VM journal tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/journal.json || true
            echo "--- VM initrd journal tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/journal-initrd.json || true
          fi
          if [ "$rc" -eq 77 ]; then
            echo "::warning::SKIP: bcvk cannot DirectBoot the ARM64 zstd EFI zboot kernel in this image yet; VM boot leg skipped rather than failing on a known harness limitation."
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- SKIP: test-luks-fido2-ci.sh, bcvk lacks zstd EFI zboot support for this ARM64 image" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- PASS: test-luks-fido2-ci.sh (CTAP2 legs skip unless the test image ships swu2f Layer 2)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests/vm/test-fido2-enrollment.sh (enrollment surface, #9/#25)
        timeout-minutes: 5
        if: ${{ always() && steps.bcvk.outputs.skip == '0' && steps.kvm.outputs.kvm == '1' && steps.policy.outputs.boot == '1' }}
        env:
          YUBIOS_IMAGE: ${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}
          YUBIOS_SSH_WAIT_SECS: ${{ matrix.arch == 'arm64' && '900' || '300' }}
          ALLOW_REAL_U2F: ${{ inputs.allow_real_u2f && '1' || '0' }}
          BCVK_EPHEMERAL_EXTRA_ARGS: >-
            ${{ matrix.arch == 'arm64' && format('--ro-bind {0}:qemu-zstd --ro-bind /lib/aarch64-linux-gnu:host-lib --ro-bind /usr/lib/aarch64-linux-gnu:host-usrlib --env PATH=/run/host-mounts/qemu-zstd/bcvk-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin --env LD_LIBRARY_PATH=/run/host-mounts/host-lib:/run/host-mounts/host-usrlib:/run/host-mounts/qemu-zstd/lib --log-dir=journal,console=/tmp/yubios-vm-e2e-logs', steps.qemu-zstd.outputs.qemu_prefix) || '' }}
        run: |
          if [ -z "${YUBIOS_IMAGE}" ] && [ ! -e ./mkosi.output/yubiOS ]; then
            echo "::warning::SKIP: no yubiOS image available -- enrollment-surface e2e not exercised."
            exit 0
          fi
          chmod +x tests/vm/test-fido2-enrollment.sh
          sudo rm -rf /tmp/yubios-vm-e2e-logs
          sudo mkdir -p /tmp/yubios-vm-e2e-logs
          sudo chmod 0777 /tmp/yubios-vm-e2e-logs
          set +e
          sudo env "PATH=$PATH:/usr/sbin:/sbin" "YUBIOS_IMAGE=${YUBIOS_IMAGE:-./mkosi.output/yubiOS}" "BCVK_EPHEMERAL_EXTRA_ARGS=${BCVK_EPHEMERAL_EXTRA_ARGS:-}" "YUBIOS_SSH_WAIT_SECS=${YUBIOS_SSH_WAIT_SECS:-300}" "ALLOW_REAL_U2F=${ALLOW_REAL_U2F:-0}" bash tests/vm/test-fido2-enrollment.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "--- disk after failed enrollment VM run ---"
            df -h "$PWD" /tmp /var/lib/containers || true
            echo "--- VM console log tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/console.txt || true
            echo "--- VM journal tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/journal.json || true
            echo "--- VM initrd journal tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/journal-initrd.json || true
          fi
          if [ "$rc" -eq 77 ]; then
            echo "::warning::SKIP: bcvk cannot DirectBoot the ARM64 zstd EFI zboot kernel in this image yet; enrollment boot leg skipped rather than failing on a known harness limitation."
            echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- SKIP: test-fido2-enrollment.sh, bcvk lacks zstd EFI zboot support for this ARM64 image" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- PASS: test-fido2-enrollment.sh (CTAP2 legs skip unless the test image ships swu2f Layer 2)" >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space (post-run)
        if: always()
        run: |
          aa_enforce="$(command -v aa-enforce || true)"
          [ -n "$aa_enforce" ] || [ ! -x /usr/sbin/aa-enforce ] || aa_enforce=/usr/sbin/aa-enforce
          if [ -n "$aa_enforce" ]; then
            for profile in unpriv_bwrap swtpm; do
              sudo "$aa_enforce" "$profile" || true
            done
          fi
          # NOTE: `sudo podman system prune -af --volumes` intentionally
          # REMOVED. This all-in-one workflow keeps the yubiOS image in
          # podman storage between the vgpu-vm-e2e leg (steps before this)
          # and the composefs-tamper Negative 2 leg (steps after this).
          # Re-pulling wastes CI minutes; the same podman store is reused
          # by step 34's `docker run -v /var/lib/containers:/var/lib/containers`.
          # Container cleanup (the line above) is still safe: it removes
          # exited containers, not images.
          sudo rm -rf /opt/*-src || true
          df -h "$PWD" || true

      - name: Note hardware-only variant (runs above when dispatched with hw_device, else lint-only)
        run: |
          echo "### vgpu-vm-e2e (${{ matrix.arch }}) -- INFO: tests/vm/test-luks-fido2.sh needs a physical YubiKey + spare block device + root; the hardware leg above runs it for real when dispatched with hw_device set, otherwise it is lint-only (yubiOS#9, yubiOS#20)." >> "$GITHUB_STEP_SUMMARY"

      - name: "Reclaim target dir + loop devices (rock1 persistent)"
        if: matrix.arch == 'arm64'
        run: |
          sudo umount -R /mnt 2>/dev/null || true
          sudo losetup -D 2>/dev/null || true
          sudo mkdir -p /mnt
          sudo rm -rf /mnt/cfs-target
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /mnt/cfs-target

      - name: Install extra deps
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            binutils fdisk jq docker.io containerd runc unzip

      - name: Prepare disk image + GPT partitions + fs-verity root
        if: matrix.arch == 'arm64'
        id: cfs_disk
        run: |
          set -euo pipefail
          DISK="$RUNNER_TEMP/yubios-composefs-tamper-${{ matrix.arch }}.raw"
          truncate -s 12G "$DISK"
          LOOP="$(sudo losetup --find --show --partscan "$DISK")"
          printf 'label: gpt\nsize=1G, type=c12a7328-f81f-11d2-ba4b-00a0c93ec93b, name=ESP\ntype=%s, name=yubiOS-root\n' \
            "${{ matrix.root_type_guid }}" | sudo sfdisk "$LOOP"
          sudo partx --update "$LOOP" || true
          sudo udevadm settle
          ESP="${LOOP}p1"
          ROOT="${LOOP}p2"
          test -b "$ESP" || { echo "::error::$ESP not a block device"; exit 1; }
          test -b "$ROOT" || { echo "::error::$ROOT not a block device"; exit 1; }
          sudo mkfs.vfat -F 32 -n EFI "$ESP"
          sudo mkfs.ext4 -F -O verity -L yubiOS-root "$ROOT"
          sudo mount "$ROOT" /mnt/cfs-target
          sudo install -d -m 0755 /mnt/cfs-target/boot
          sudo mount "$ESP" /mnt/cfs-target/boot
          test "$(findmnt -nro SOURCE /mnt/cfs-target)" = "$ROOT"
          test "$(findmnt -nro SOURCE /mnt/cfs-target/boot)" = "$ESP"
          echo "DISK=$DISK"        >> "$GITHUB_ENV"
          echo "LOOP=$LOOP"        >> "$GITHUB_ENV"
          echo "ESP=$ESP"          >> "$GITHUB_ENV"
          echo "ROOT=$ROOT"        >> "$GITHUB_ENV"

      - name: Sanity-check immutable digest from vgpu-vm-e2e pull (no re-pull)
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          # Image was already pulled + RESOLVED was already exported in the
          # vgpu-vm-e2e arm64 podman pull step (single pull serves both legs).
          # This all-in-one workflow keeps the yubiOS image in podman storage
          # between the vgpu-vm-e2e leg (steps before this) and the
          # composefs-tamper Negative 2 leg (steps after this); see step 27
          # comment for why podman system prune was removed. This step
          # just confirms the digest is available for the downstream
          # `docker run -v /var/lib/containers:/var/lib/containers` in
          # step 34, which mounts the same podman store.
          test -n "${RESOLVED:-}" || { echo "::error::RESOLVED not set; vgpu-vm-e2e arm64 podman pull step must run first to export RESOLVED"; exit 1; }
          echo "RESOLVED (from vgpu-vm-e2e arm64 podman pull): $RESOLVED"

      # V3: Lay down a signed UKI before bootc install so find_uki_path()
      # detects it and bootc writes a Type2 BLS entry (uk /EFI/Linux/<file>.efi
      # + options composefs=<sha512>), not the Type1 entry the raw-kernel
      # install produces. Pulls the latest sealed-uki-artifacts-<arch>
      # artifact from ci_test_sealed-uki-vm.yml (PR #155; that workflow's
      # build job signs a UKI via systemd-sbsign) and copies yubios.efi into
      # /mnt/cfs-target/boot/EFI/Linux/. This makes Negative 2 test the real
      # yubiOS shape (UKI-based BLS), per bootc 1.16.3 PR #2269 uki key.

      - name: "Lay down signed UKI from sealed-UKI VM artifact"
        if: matrix.arch == 'arm64'
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ART_NAME="sealed-uki-artifacts-${{ matrix.arch }}"
          RUN_ID=$(curl -fsS \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/yubi-OS/yubiOS/actions/runs?status=success&per_page=30" \
            | python3 -c 'import json,sys; runs=[r for r in json.load(sys.stdin)["workflow_runs"] if "sealed UKI" in r["name"]]; print(runs[0]["id"] if runs else "")')
          test -n "$RUN_ID" || { echo "::error::no sealed-UKI VM run found"; exit 1; }
          echo "Using sealed-UKI VM run $RUN_ID"
          ART_URL=$(curl -fsS \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/yubi-OS/yubiOS/actions/runs/$RUN_ID/artifacts" \
            | python3 -c "import json,sys; arts=[a for a in json.load(sys.stdin)['artifacts'] if a['name']=='$ART_NAME']; print(arts[0]['archive_download_url'] if arts else '')")
          test -n "$ART_URL" || { echo "::error::$ART_NAME not in run $RUN_ID"; exit 1; }
          echo "Downloading $ART_NAME"
          # The archive_download_url requires the same Authorization header as
          # the listing queries above -- without it GitHub returns 401. Commit
          # a6a61667 exposed GITHUB_TOKEN to env (so the listing queries work
          # and resolve the right run id) but forgot this download line.
          curl -fsSL \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/uki.zip "$ART_URL"
          mkdir -p /tmp/uki-extract && cd /tmp/uki-extract && unzip -o /tmp/uki.zip >/dev/null
          test -f yubios.efi || { echo "::error::yubios.efi not in artifact"; exit 1; }
          file yubios.efi
          # OMN-150 Phase 2: lay down UKI at the path bootc writes its own UKI to.
          # Per bootc-uki-blsconfig-reference.md (bootc 1.16.3+):
          #   BOOTC_UKI_DIR = "EFI/Linux/bootc" (relative to ESP)
          #   get_uki_name() -> "bootc_composefs-<digest>.efi"
          #   A yubiOS drop-in that ships a pre-built UKI in /EFI/Linux/bootc/ is consistent.
          # The composefs store digest is the SHA-512 fsverity root hash; for now
          # we use sha256 as the identifier in the filename, and the BLS entry
          # uses the same path so bootc's composefs rollback/status logic can match.
          UKI_HASH=$(sha256sum yubios.efi | cut -d' ' -f1)
          sudo mkdir -p /mnt/cfs-target/boot/EFI/Linux/bootc
          sudo cp -v yubios.efi "/mnt/cfs-target/boot/EFI/Linux/bootc/bootc_composefs-${UKI_HASH}.efi"
          sudo ls -la /mnt/cfs-target/boot/EFI/Linux/bootc/
          echo "UKI laid down at /mnt/cfs-target/boot/EFI/Linux/bootc/bootc_composefs-${UKI_HASH}.efi"
          # Also write a BLSConfig .conf with the uki key, since bootc has no
          # documented BLSConfig drop-in intake (per bootc-uki-blsconfig-reference.md).
          # This is the FinalizeScript-at-install-time pattern. systemd-boot will
          # prefer this entry over bootc's own Type1 entry by sort-key.
          sudo mkdir -p /mnt/cfs-target/boot/loader/entries
          printf '%s\n' \
            'title yubiOS (UKI, om150-phase2)' \
            'version 1.0' \
            "uki /EFI/Linux/bootc/bootc_composefs-${UKI_HASH}.efi" \
            'sort-key yubios-ukify-0' | sudo tee /mnt/cfs-target/boot/loader/entries/yubios-ukify.conf >/dev/null
          sudo cat /mnt/cfs-target/boot/loader/entries/yubios-ukify.conf
          echo "BLSConfig .conf with uki key written"

      - name: bootc install to-filesystem (composefs backend, systemd-boot)
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /var/lib/containers
          sudo docker run --rm --privileged --pid=host --ipc=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers \
            -v /dev:/dev \
            -v /:/run/host \
            "$RESOLVED" \
            bootc install to-filesystem \
              --source-imgref="registry:${RESOLVED}" \
              --bootloader=systemd \
              --root-mount-spec="" \
              --composefs-backend \
              --skip-finalize \
            /run/host/mnt/cfs-target/
          echo "bootc install complete"

      - name: Lay down composefs store symlink (manual, post-install)
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          # bootc install --skip-finalize skips the finalize phase, which is what
          # normally creates the composefs store symlink at
          # /mnt/cfs-target/composefs/images/<digest>. With --composefs-backend the
          # blob lands on disk at /mnt/cfs-target/composefs/blob/<digest> but the
          # store symlink is missing. We need it because dm-verity refuses to mount
          # a composefs image without a discoverable store reference.
          #
          # Read our BLSConfig .conf (laid down before install) to find the UKI,
          # extract the composefs digest from the UKI's .cmdline PE section via
          # scripts/extract_uki_cmdline.py, then create the symlink.
          entry="$(sudo find /mnt/cfs-target/boot -type f -path '*/loader/entries/*.conf' | head -1)"
          test -n "$entry" || { echo "::error::no BLS entry under /mnt/cfs-target/boot"; exit 1; }
          uki_path="$(sudo awk '$1 == "uki" {sub(/^uki[[:space:]]+/, ""); print}' "$entry")"
          test -n "$uki_path" || { echo "::error::no uki key in $entry"; exit 1; }
          full_uki="/mnt/cfs-target/boot${uki_path}"
          test -f "$full_uki" || { echo "::error::UKI $full_uki not found"; exit 1; }
          cd_digest="$(python3 scripts/extract_uki_cmdline.py "$full_uki" | grep -oE 'composefs=[0-9a-f]{128}' | cut -d= -f2)"
          test -n "$cd_digest" || { echo "::error::no composefs= in UKI cmdline"; exit 1; }
          echo "composefs digest from UKI: $cd_digest"
          # Lay down the store symlink. The blob path is the standard bootc composefs
          # layout (verified to exist after --composefs-backend install).
          sudo mkdir -p /mnt/cfs-target/composefs/images
          if [ ! -f "/mnt/cfs-target/composefs/blob/$cd_digest" ]; then
            echo "::warning::composefs blob not at /mnt/cfs-target/composefs/blob/$cd_digest; probing alt paths"
            sudo find /mnt/cfs-target -maxdepth 6 -type f -name "$cd_digest*" 2>/dev/null | head -5 || true
          fi
          sudo ln -sfn "../blob/$cd_digest" "/mnt/cfs-target/composefs/images/$cd_digest"
          sudo ls -la "/mnt/cfs-target/composefs/images/"
          echo "composefs store symlink laid down for $cd_digest"

      - name: Verify install produced a composefs= BLS entry (Type1)
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          entry="$(sudo find /mnt/cfs-target/boot -type f -path '*/loader/entries/*.conf' | head -1)"
          test -n "$entry" || { echo "::error::no BLS entry under /mnt/cfs-target/boot"; exit 1; }
          echo "BLS entry: $entry"
          sudo cat "$entry"
          # OMN-150 Phase 2: accept both Type1 (options composefs=) and Type2 (uki -> cmdline composefs=).
          # Type1 path: extract composefs=<sha512> from the `options` line.
          # Type2 path: extract from the UKI binary's .cmdline PE section.
          options="$(sudo awk '$1 == "options" {sub(/^options[[:space:]]+/, ""); print}' "$entry")"
          echo "options: $options"
          if [[ " $options " =~ [[:space:]]composefs=([0-9a-f]{128})[[:space:]] ]]; then
            COMPOSEFS_DIGEST="${BASH_REMATCH[1]}"
            echo "Type1 path: composefs= in options line"
            echo "COMPOSEFS_DIGEST=$COMPOSEFS_DIGEST"
          else
            # Type2 path: read the UKI's .cmdline section.
            # Per bootc-uki-blsconfig-reference.md: BLSConfigType::EFI carries no options;
            # the cmdline lives in the UKI's .cmdline PE section.
            uki_path="$(sudo awk '$1 == "uki" {sub(/^uki[[:space:]]+/, ""); print}' "$entry")"
            if [ -z "$uki_path" ]; then
              uki_path="$(sudo awk '$1 == "efi" {sub(/^efi[[:space:]]+/, ""); print}' "$entry")"
            fi
            if [ -z "$uki_path" ]; then
              echo "::error::no composefs=<sha512> in $entry and no uki/efi line -- test is vacuous"
              exit 1
            fi
            # Resolve UKI path relative to ESP mount point.
            full_uki="/mnt/cfs-target/boot${uki_path}"
            test -f "$full_uki" || { echo "::error::UKI $full_uki not found"; exit 1; }
            # Extract .cmdline section from the UKI PE/PE+ binary.
            # Use python with a minimal PE parser: find .cmdline section and read its bytes.
            COMPOSEFS_DIGEST="$(python3 scripts/extract_uki_cmdline.py "$full_uki")"
            echo "Type2 path: uki=$uki_path, cmdline from $full_uki"
            echo "cmdline: $COMPOSEFS_DIGEST"
            if [[ " $COMPOSEFS_DIGEST " =~ [[:space:]]composefs=([0-9a-f]{128})[[:space:]] ]]; then
              COMPOSEFS_DIGEST="${BASH_REMATCH[1]}"
              echo "Type2 path: composefs= in UKI cmdline"
              echo "COMPOSEFS_DIGEST=$COMPOSEFS_DIGEST"
            else
              echo "::error::no composefs=<sha512> in UKI cmdline -- test is vacuous"
              exit 1
            fi
          fi
          sudo test -L "/mnt/cfs-target/composefs/images/$COMPOSEFS_DIGEST" \
            || { echo "::error::composefs store symlink missing for $COMPOSEFS_DIGEST"; exit 1; }
          echo "BLS_ENTRY=$entry"          >> "$GITHUB_ENV"
          echo "COMPOSEFS_DIGEST=$COMPOSEFS_DIGEST" >> "$GITHUB_ENV"

      - name: "Teardown loop+mount before QEMU touches the raw file"
        if: always() && matrix.arch == 'arm64' && steps.cfs_disk.outcome == 'success'
        run: |
          set +e
          sudo umount /mnt/cfs-target/boot 2>/dev/null
          sudo umount /mnt/cfs-target 2>/dev/null
          sudo losetup --detach "$LOOP" 2>/dev/null
          echo "teardown done"

      - name: Boot baseline (untampered BLS) and assert composefs mount succeeds
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          test -f "$FW_DIR/${{ matrix.code_fd }}" \
            || { echo "::error::${{ matrix.code_fd }} missing from $FW_DIR"; ls -la "$FW_DIR/"; exit 1; }
          test -f "$FW_DIR/${{ matrix.vars_fd }}" \
            || { echo "::error::${{ matrix.vars_fd }} missing"; exit 1; }
          echo "=== QEMU baseline (untampered BLS, composefs=$COMPOSEFS_DIGEST) ==="
          timeout "${{ matrix.boot_timeout }}" "$QEMU" \
            -machine "${{ matrix.machine }}" \
            -cpu "${{ matrix.cpu }}" -smp "${{ matrix.smp }}" -m 4G \
            -drive if=pflash,format=raw,readonly=on,file="$FW_DIR/${{ matrix.code_fd }}" \
            -drive if=pflash,format=raw,file="$FW_DIR/${{ matrix.vars_fd }}" \
            -drive file="$DISK",format=raw,if=virtio \
            -net none \
            -nographic -serial mon:stdio -display none -no-reboot \
            > /tmp/qemu-baseline.log 2>&1 || true
          echo "=== baseline serial log (last 60 lines) ==="
          tail -60 /tmp/qemu-baseline.log
          echo "=== end serial log ==="
          if grep -Eq '(Switching root|Reached target Basic System|initrd-switch-root\.service.*(start|finish))' /tmp/qemu-baseline.log; then
            echo "Baseline PASS: kernel reached composefs-mounted userspace"
          else
            echo "::error::Baseline AMBIGUOUS: no initrd-stage success marker"
            echo "--- looking for composefs/fsverity markers ---"
            grep -iE 'composefs|fsverity|verity|switching root|emergency' /tmp/qemu-baseline.log | head -20
            exit 1
          fi
          if grep -qiE '(Failed to mount composefs image|bootc-root-setup.*Failed|emergency)' /tmp/qemu-baseline.log; then
            echo "::error::baseline must NOT show composefs refusal -- install is broken"
            exit 1
          fi

      - name: Re-attach loop + tamper one nibble of composefs=<digest> in BLS entry
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          LOOP="$(sudo losetup --find --show --partscan "$DISK")"
          ROOT="${LOOP}p2"
          ESP="${LOOP}p1"
          sudo mount "$ROOT" /mnt/cfs-target
          sudo mount "$ESP"  /mnt/cfs-target/boot
          orig="${COMPOSEFS_DIGEST:0:1}"
          if [ "$orig" = "0" ]; then
            tampered_first="1"
          else
            tampered_first="0"
          fi
          TAMPERED_DIGEST="${tampered_first}${COMPOSEFS_DIGEST:1}"
          echo "Original composefs=<sha512>: $COMPOSEFS_DIGEST"
          echo "Tampered  composefs=<sha512>: $TAMPERED_DIGEST"
          sudo sed -i "s/composefs=${COMPOSEFS_DIGEST}/composefs=${TAMPERED_DIGEST}/g" "$BLS_ENTRY"
          sudo grep -E 'composefs=' "$BLS_ENTRY"
          if sudo test -e "/mnt/cfs-target/composefs/images/$TAMPERED_DIGEST"; then
            echo "::error::tampered digest $TAMPERED_DIGEST unexpectedly exists in store"
            exit 1
          fi
          echo "TAMPERED_DIGEST=$TAMPERED_DIGEST" >> "$GITHUB_ENV"
          echo "Tamper committed."

      - name: Teardown loop+mount before reboot
        if: always() && matrix.arch == 'arm64' && steps.cfs_disk.outcome == 'success'
        run: |
          set +e
          sudo umount /mnt/cfs-target/boot 2>/dev/null
          sudo umount /mnt/cfs-target 2>/dev/null
          sudo losetup --detach "$LOOP" 2>/dev/null

      - name: Reboot, assert composefs refusal (Negative 2)
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          echo "=== QEMU tampered (composefs=$TAMPERED_DIGEST, not in composefs store) ==="
          timeout "${{ matrix.boot_timeout }}" "$QEMU" \
            -machine "${{ matrix.machine }}" \
            -cpu "${{ matrix.cpu }}" -smp "${{ matrix.smp }}" -m 4G \
            -drive if=pflash,format=raw,readonly=on,file="$FW_DIR/${{ matrix.code_fd }}" \
            -drive if=pflash,format=raw,file="$FW_DIR/${{ matrix.vars_fd }}" \
            -drive file="$DISK",format=raw,if=virtio \
            -net none \
            -nographic -serial mon:stdio -display none -no-reboot \
            > /tmp/qemu-tampered.log 2>&1 || true
          echo "=== tampered serial log (last 60 lines) ==="
          tail -60 /tmp/qemu-tampered.log
          echo "=== end serial log ==="
          if grep -qiE '(Failed to mount composefs image|bootc-root-setup.*Failed)' /tmp/qemu-tampered.log; then
            echo "Negative 2 PASS: dm-verity refused tampered composefs=$TAMPERED_DIGEST"
            echo "### composefs-tamper-test (${{ matrix.arch }}) -- PASS: dm-verity refused tampered composefs reference" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -qiE 'emergency' /tmp/qemu-tampered.log; then
            echo "Negative 2 PASS (emergency mode reached after composefs mount failure)"
            echo "### composefs-tamper-test (${{ matrix.arch }}) -- PASS: emergency.target after tampered composefs" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -Eq '(Switching root|Reached target Basic System)' /tmp/qemu-tampered.log; then
            echo "::error::Negative 2 FAIL: tamper had no effect -- kernel reached userspace"
            exit 1
          fi
          echo "::error::Negative 2 AMBIGUOUS: no refusal marker AND no success marker"
          grep -iE 'composefs|fsverity|verity|switching root|emergency|panic|invalid' /tmp/qemu-tampered.log | head -20
          exit 1

      - name: Final cleanup detach loop and remove disk image
        if: always()
        run: |
          set +e
          sudo umount -R /mnt/cfs-target 2>/dev/null
          sudo losetup -D 2>/dev/null
          rm -f "$DISK"
          echo "cleanup done"

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [lint-vm-scripts, vgpu-vm-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

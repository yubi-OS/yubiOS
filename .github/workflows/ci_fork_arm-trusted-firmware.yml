name: ci_fork_arm-trusted-firmware

# Component CI for the yubiOS ARM64 fTPM stack (#35, task C1).
# Builds TF-A for PLAT=qemu (AArch64): the BL31 EL3 monitor with the OP-TEE
# dispatcher (SPD=opteed), then a Trusted Board Boot FIP (TRUSTED_BOARD_BOOT=1
# GENERATE_COT=1) to exercise cert_create + fiptool + the mbed TLS crypto path.
# Real BL32 (OP-TEE) / BL33 (U-Boot) come from sibling fork CIs; this fork uses
# placeholder payloads only to drive FIP packaging — do NOT stitch components here.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build-tfa:
    name: TF-A BL31 + TBB FIP (PLAT=qemu)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            runner_name: ubuntu-24.04
          - runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            runner_name: self-hosted-linux-arm64-gpu
    runs-on: ${{ matrix.runner }}
    # Bare runner: TF-A needs a full host + AArch64 cross toolchain. The hardened
    # dhi base image omits crt*.o / libc, so a container build is not used here.

    steps:
      - name: Repair stale self-hosted workspace ownership
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euxo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Checkout arm-trusted-firmware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
        with:
          repository: yubi-OS/arm-trusted-firmware
          ref: da738d5eae93af342fdc4995dd3c05acb4c9d757 # release ref; see PINNED.md

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          restore_live_boot_tools() {
            if [ -e /etc/kernel/postinst.d/kdump-tools.ci-disabled ]; then
              sudo mv /etc/kernel/postinst.d/kdump-tools.ci-disabled /etc/kernel/postinst.d/kdump-tools
            fi
            for tool in flash-kernel update-initramfs; do
              if sudo dpkg-divert --list "/usr/sbin/${tool}" | grep -q .; then
                sudo rm -f "/usr/sbin/${tool}"
                sudo dpkg-divert --quiet --rename --remove "/usr/sbin/${tool}" || true
              fi
            done
          }

          # The self-hosted ARM64 GPU runner boots from live media.  If apt finds
          # pending kernel/initramfs packages, dpkg's maintainer scripts try to
          # update live boot or kdump initrds and fail against the overlay root.
          # TF-A only needs userspace build tools here, so suppress those updates.
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] && [ "${RUNNER_ARCH:-}" = "ARM64" ] && [ -d /cdrom/casper ]; then
            trap restore_live_boot_tools EXIT
            if [ -e /etc/kernel/postinst.d/kdump-tools ] && [ ! -e /etc/kernel/postinst.d/kdump-tools.ci-disabled ]; then
              sudo mv /etc/kernel/postinst.d/kdump-tools /etc/kernel/postinst.d/kdump-tools.ci-disabled
            fi
            for tool in update-initramfs flash-kernel; do
              if ! sudo dpkg-divert --list "/usr/sbin/${tool}" | grep -q .; then
                sudo dpkg-divert --quiet --local --rename --add "/usr/sbin/${tool}"
              fi
              # Recreate the shim even when a prior interrupted job left the
              # diversion registered with the original in *.distrib.
              printf '#!/bin/sh\nexit 0\n' | sudo tee "/usr/sbin/${tool}" >/dev/null
              sudo chmod 0755 "/usr/sbin/${tool}"
            done
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3 python3-pyelftools python3-cryptography \
            device-tree-compiler \
            openssl libssl-dev \
            bison flex bc \
            uuid-dev \
            git ca-certificates
          # AArch64 toolchain: cross on amd64, native on the arm64 runner.
          if [ "$(uname -m)" = "x86_64" ]; then
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
            echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          else
            echo "CROSS_COMPILE=" >> "$GITHUB_ENV"
          fi
          aarch64-linux-gnu-gcc --version || gcc --version

      - name: Checkout mbed TLS (3.6.6 — matches TF-A MBEDTLS_CONFIG_VERSION 0x03060600)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
        with:
          repository: Mbed-TLS/mbedtls
          ref: 0bebf8b8c7f07abe3571ded48a11aa907a1ffb20 # mbedtls-3.6.6
          path: mbedtls

      - name: Build BL31 (EL3 monitor, SPD=opteed)
        run: |
          set -euxo pipefail
          make -j"$(nproc)" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            PLAT=qemu ARCH=aarch64 \
            SPD=opteed \
            DEBUG=1 \
            bl31
          ls -l build/qemu/debug/bl31/bl31.elf build/qemu/debug/bl31.bin

      - name: Stage placeholder BL32 / BL33 payloads
        run: |
          set -euxo pipefail
          # Standalone component CI: the real OP-TEE BL32 (3 binaries) and U-Boot
          # BL33 are produced by their own fork CIs. Placeholder payloads here only
          # drive the FIP + chain-of-trust packaging — they are never booted.
          head -c 262144  /dev/urandom > bl32.bin
          head -c 262144  /dev/urandom > bl32_extra1.bin
          head -c 1048576 /dev/urandom > bl32_extra2.bin
          head -c 1048576 /dev/urandom > bl33.bin

      - name: Build TBB FIP (TRUSTED_BOARD_BOOT, GENERATE_COT)
        run: |
          set -euxo pipefail
          make -j"$(nproc)" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            PLAT=qemu ARCH=aarch64 \
            SPD=opteed \
            BL32=bl32.bin BL32_EXTRA1=bl32_extra1.bin BL32_EXTRA2=bl32_extra2.bin \
            BL32_RAM_LOCATION=tdram \
            BL33=bl33.bin \
            TRUSTED_BOARD_BOOT=1 GENERATE_COT=1 CREATE_KEYS=1 \
            MBEDTLS_DIR="${GITHUB_WORKSPACE}/mbedtls" \
            DEBUG=1 \
            all fip
          ls -l build/qemu/debug/bl31/bl31.elf build/qemu/debug/fip.bin

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4 — see PINNED.md
        with:
          name: tfa-qemu-${{ matrix.runner_name }}
          path: |
            build/qemu/debug/bl31/bl31.elf
            build/qemu/debug/bl31.bin
            build/qemu/debug/fip.bin
          if-no-files-found: warn
          retention-days: 7

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [build-tfa]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

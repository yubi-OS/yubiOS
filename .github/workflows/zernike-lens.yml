name: zernike-lens

on:
  workflow_dispatch:

jobs:
  zernike-lens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install numpy
        run: python3 -m pip install --quiet --upgrade numpy

      - name: Zernike Slot 1 -- aberrated Gap D lens
        run: python3 papers/scripts/gapD_zernike_lens.py --seed 20260824

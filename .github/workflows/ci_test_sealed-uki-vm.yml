name: TEST - sealed UKI Secure Boot VM e2e

# Companion to ci_test_bootc-filesystem.yml. Proves the Secure Boot VM lane
# that the bootc-to-filesystem workflow explicitly carves out at its lines 6-7.
# Parent issue: OMN-53. Full spec: refs/sealed-uki-vm-test-2026-07-30.md.
#
# Three jobs (per the design doc's evidence requirement):
#   1. build-and-verify-uki -- builds a signed UKI from a yubiOS OCI image via
#      bootc container ukify (bootc 1.16.6+ capability verified by
#      ci_test_bootc-filesystem.yml run #11 at 7eba4856e7), signs via
#      systemd-sbsign (engine:pkcs11 SoftHSM backend per ADR-008), then
#      verifies sbverify + UKI structure + verity roothash
#      (assertions 1-3 of 6).
#   2. boot-secure-vm -- boots the signed UKI in a QEMU OVMF Secure Boot VM
#      on fresh GitHub-hosted runners, asserts systemd-stub SecureBoot=yes
#      via QEMU serial console (assertion 4 of 6).
#   3. negative-tamper-tests -- proves the negative paths (amd64-only):
#      * Negative 1 (tampered UKI byte flip -> sbverify rejection) -- IMPLEMENTED
#      * Negative 2 (tampered composefs hash -> dm-verity rejection) -- DEFERRED (separate e2e lane per user)
#      * Negative 3 (foreign ROTPK -> unsigned UKI rejection) -- IMPLEMENTED
#
# All jobs run inside the digest-pinned dhi.io/debian-base container
# (security architecture per PINNED.md / the approved-container rule).
# The dhi container runs as root, so install steps use apt-get directly
# without sudo -- matches the canonical ci_mkosi-installer.yml pattern.

on:
  workflow_dispatch:
    inputs:
      image:
        description: Pullable yubiOS OCI image ref
        required: true
        default: 'docker.io/0mniteck/yubios:dev'
        type: string
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  build-and-verify-uki:
    name: "build + sign + verify signed UKI (assertions 1-3 of 6) [${{ matrix.arch }}]"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
            docker_sha512: 42401384ef853dab0a1986a7990420e77d3ee2bc39e178f8817d27ba6c4403998b7aacf3c28c7172135cdeec281cd328a8f2af949b5f57db44a211a093cfd20b
            rootless_sha512: 184b583a0f325bef12feaf1ca175ff5ea4a65a168f2136eb1daf9c2ae646eecf02134ed65766c8800bd8eb03ac4d338d1e5d700248bc33632027b5b0b52de48a
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_arch: aarch64
            docker_sha512: 04713ac54030bed8b2c096280d034b02f5430ed73ba8bcc4a686f7bbbf4a3444eb027847e896cd9ee91c3237dbe1c25a4cfca43d1dcd922a1a10009c960ace0b
            rootless_sha512: 37649acdaacc597c115d2f19b71a4729a0119c6debbba4b4af18da2fd497ac28f5691df13137b7fc59903551ab0e08868f4b976a9a5704e2b7958b3b5b0cc0af
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:61dc022a1908439c478ed4b00e883fe8a7a03540fac23a8aed61352e28e6ae07
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 -- see PINNED.md

      - name: Install build dependencies (incl. docker CLI + rootless daemon per ci_mkosi-installer.yml pattern)
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs \
            binutils dosfstools e2fsprogs jq \
            mkosi opensc softhsm2 tpm2-tools \
            osslsigncode systemd-ukify file \
            docker.io containerd runc
          command -v mkosi \
            softhsm2-util pkcs11-tool docker dockerd \
            >/dev/null
          # Install docker CLI + rootless daemon (SHA-pinned static binaries,
          # amd64 digest; the canonical ci_mkosi-installer.yml pattern).
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          mkdir -p "$DOCKER_TOOLS_DIR/bin"
          wcurl() {
            local url="$1" sha="$2"
            local file; file="$(basename "$url")"
            curl -fsSL -o "$file" "$url"
            printf '%s  %s\n' "$sha" "$file" | sha512sum --check --strict
          }
          # V79: arch-keyed static docker binaries.
          DOCKER_SHA512=${{ matrix.docker_sha512 }}
          ROOTLESS_SHA512=${{ matrix.rootless_sha512 }}
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.6.0.tgz" "$DOCKER_SHA512"
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-rootless-extras-29.6.0.tgz" "$ROOTLESS_SHA512"
          tar xzf docker-29.6.0.tgz
          tar xzf docker-rootless-extras-29.6.0.tgz
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          # DOCKER_HOST is intentionally NOT exported to GITHUB_ENV.
          # Earlier revisions (V8/V9) set DOCKER_HOST=unix:///run/docker-rootless/docker.sock
          # (rootless socket path that no longer exists). That stale value caused docker
          # CLI in steps 5/7 to fail with "Cannot connect" -- V14 tried `unset DOCKER_HOST`
          # in the preamble but the unset did not take effect (likely GitHub Actions
          # re-injects GITHUB_ENV values into the shell environment). V15 just removes
          # the echo entirely so DOCKER_HOST is never set in the first place -- docker CLI
          # defaults to /var/run/docker.sock where the V12 system dockerd listens.
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_TOOLS_DIR/config/cli-plugins"
          echo "DOCKER_TOOLS_DIR=$DOCKER_TOOLS_DIR" >> "$GITHUB_ENV"

      - name: Resolve image digest
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER }}
          REQUESTED_IMAGE: ${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}
        run: |
          set -euo pipefail
          # V12: use apt-installed system dockerd (from docker.io package).
          # Default socket /var/run/docker.sock. The system docker CLI
          # reliably connects to it without needing -H flags, and is
          # known to properly handle DOCKER_HOST env var precedence.
          #   --storage-driver=vfs   works without kernel overlayfs
          #   --iptables=false       we don't need iptables rules in CI
          #   --ip6tables=false      same
          mkdir -p /var/lib/docker
          nohup dockerd \
            --data-root=/var/lib/docker \
            --exec-root=/var/run/docker \
            --pidfile=/var/run/docker.pid \
            --host=unix:///var/run/docker.sock \
            --iptables=false \
            --ip6tables=false \
            --storage-driver=vfs \
            > "${RUNNER_TEMP}/dockerd.log" 2>&1 < /dev/null &
          disown || true
          DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker info >/dev/null 2>&1 && break
            if ! kill -0 "$DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd.log"
            exit 1
          fi
          if [ -n "${DOCKER_PASSWORD:-}" ]; then
            printf '%s' "$DOCKER_PASSWORD" | docker login \
              --username 0mniteck42 --password-stdin docker.io
          fi
          docker pull "$REQUESTED_IMAGE"
          RESOLVED_IMAGE="$(docker image inspect "$REQUESTED_IMAGE" \
            --format '{{ index .RepoDigests 0 }}')"
          test -n "$RESOLVED_IMAGE"
          case "$RESOLVED_IMAGE" in
            *@sha256:*) ;;
            *) echo "::error::image did not resolve to an immutable digest: $RESOLVED_IMAGE"; exit 1 ;;
          esac
          echo "RESOLVED_IMAGE=$RESOLVED_IMAGE" >> "$GITHUB_ENV"

      - name: "Generate PKI as plain files (V38: cert + PKCS#8 PEM on host, no cross-mount)"
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p mkosi.output/pki
          # V56: RSA-2048 (was EC P-256 through V55). Matrix run 30618357687 proved
          # softhsm 2.7.0 hashed-ECDSA mechanisms (PR 683) are single-part only, so
          # every multi-part digest-sign via pkcs11-provider fails for EC keys
          # (rsa2048-provider PASS, ec-provider FAIL). RSA mechanisms are natively
          # multi-part; RSA-2048 also matches UEFI Secure Boot db conventions.
          # V37: Generate keypair as plain PEM files on host. V36
          # initialized a SoftHSM token on the Debian trixie host (softhsm
          # 2.6.1) and cross-mounted /var/lib/softhsm into the Fedora container
          # (softhsm 2.7.0-2.fc45). The cross-version BDB token format caused
          # "Input/output error" when the container's pkcs11-provider tried
          # to load the private key (run #47 L2247). The canonical
          # ci_mkosi-installer.yml pattern keeps the entire token lifecycle
          # inside one OS environment; here we keep the key material as files
          # on the host and let the Fedora container initialize a fresh
          # token + import the key via softhsm2-util --import. No
          # cross-mount, no cross-version BDB.
          # V68: bump RSA-2048 -> RSA-4096 for Secure Boot signing key (sb.key).
          # User directive (3:30 PT Friday): "new issue so bump to rsa4096 then debug".
          # V67 (e2fea142) fix landed the argparse arg-order bug for ukify (assertions
          # 1 + 2 now PASS) but uncovered a NEW issue at assertion 3 -- the awk
          # pattern extracting the UKI .cmdline value gets nothing because ukify
          # --json=short emits multi-line output (header on one line, value on
          # subsequent lines). That's a V69 fix (different concern, different
          # commit). The RSA-2048 -> RSA-4096 bump is a STANDALONE change per the
          # user's directive, done independently of V69 so V69 can focus on the
          # extraction logic. Also: RSA-4096 matches UEFI Secure Boot db key
          # conventions and gives margin against future softhsm mechanism quirks
          # (V56 evidence -- rsa2048-provider PASS, ec-provider FAIL on multi-part
          # digest-sign; RSA mechanisms are natively multi-part, RSA-4096 inherits
          # the same compatibility).
          openssl genrsa -out mkosi.output/pki/sb.key 4096
          openssl req -new -x509 \
            -key mkosi.output/pki/sb.key \
            -out mkosi.output/pki/sb.crt \
            -days 30 -nodes \
            -subj "/CN=yubiOS CI Secure Boot/" \
            -addext "keyUsage=digitalSignature" \
            -addext "extendedKeyUsage=codeSigning"
          # PKCS#8 PEM (unencrypted) -- the format softhsm2-util --import accepts.
          openssl pkcs8 -topk8 -nocrypt \
            -in mkosi.output/pki/sb.key \
            -out mkosi.output/pki/sb.p8
          ls -la mkosi.output/pki/
          echo "=== V37 PKI ready: $(ls mkosi.output/pki/ | wc -l) files ==="

      - name: "Verify PKI on host (V38 diagnostic: cert + PKCS#8)"
        run: |
          set -euxo pipefail
          echo "PWD=$PWD"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "--- ls -la mkosi.output/ ---"
          ls -la mkosi.output/ 2>&1 || echo "mkosi.output/ does not exist"
          echo "--- ls -la mkosi.output/pki/ ---"
          ls -la mkosi.output/pki/ 2>&1 || echo "mkosi.output/pki/ does not exist"
          echo "--- test -f mkosi.output/pki/sb.crt ---"
          if test -f mkosi.output/pki/sb.crt; then
            echo "OK: cert present"
            ls -la mkosi.output/pki/sb.crt
            file mkosi.output/pki/sb.crt 2>/dev/null || true
          else
            echo "ERROR: cert missing at mkosi.output/pki/sb.crt"
            echo "--- searching for sb.crt anywhere under \$PWD ---"
            find . -name 'sb.crt' -type f 2>/dev/null | head -20 || true
            exit 1
          fi

      - name: Build signed UKI from image (bootc container ukify + systemd-sbsign)
        run: |
          set -euo pipefail
          # V12: use apt-installed system dockerd (from docker.io package).
          # Default socket /var/run/docker.sock. The system docker CLI
          # reliably connects to it without needing -H flags, and is
          # known to properly handle DOCKER_HOST env var precedence.
          #   --storage-driver=vfs   works without kernel overlayfs
          #   --iptables=false       we don't need iptables rules in CI
          #   --ip6tables=false      same
          mkdir -p /var/lib/docker
          nohup dockerd \
            --data-root=/var/lib/docker \
            --exec-root=/var/run/docker \
            --pidfile=/var/run/docker.pid \
            --host=unix:///var/run/docker.sock \
            --iptables=false \
            --ip6tables=false \
            --storage-driver=vfs \
            > "${RUNNER_TEMP}/dockerd.log" 2>&1 < /dev/null &
          disown || true
          DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker info >/dev/null 2>&1 && break
            if ! kill -0 "$DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd.log"
            exit 1
          fi
          # V26: combine `dnf install` + `bootc container ukify` into ONE docker run.
          # V25 split them into 2 separate docker runs; the install was on a throwaway
          # container and did NOT persist to the bootc container (containers are ephemeral
          # unless committed). V25's bootc step failed with:
          #   "error: Building UKI: ukify executable not found in PATH.
          #    Please install systemd-ukify or equivalent."
          # (verified in run #33 at 04:02:24Z). The fix: do install + ukify in the same
          # container, chained with && so the bootc call only runs if install succeeds.
          # Bind-mount / to /target so `bootc container ukify` can compute the composefs
          # digest against a non-active target. Without --target, bootc errors:
          #   "Cannot operate on active root filesystem; mount separate target instead"
          # The container is `--privileged` so `mount --bind` works. Single-line bash -c
          # with && chaining (proven V18 pattern, avoids V23 multi-line quoting bug).
          # V28: three fixes to the signing step, per run #35 evidence + ADR-008:
          #   1. QUOTING -- the pkcs11 URI's semicolons were unquoted inside bash -c,
          #      so bash split the sign command at each ';' (run #35: "bash: line 1:
          #      --private-key-source=engine:pkcs11: command not found"). The URI is
          #      now single-quoted inside the double-quoted bash -c string.
          #   2. BINARY PATH -- systemd-sbsign is NOT a dnf package on rawhide (run
          #      #35: "No match for argument: systemd-sbsign"). It ships inside the
          #      main systemd package at /usr/lib/systemd/systemd-sbsign (verified
          #      against the systemd-261.2-1.fc45 file list), just not in PATH.
          #      Called by full path; no install needed.
          #   3. PIN + PROVIDER -- per ADR-008 / canonical ci_mkosi-installer.yml:
          #      provider:pkcs11 (not engine:pkcs11), PIN embedded in the URI as
          #      ?pin-value=1234, PKCS11_PROVIDER_MODULE pointed at the Fedora
          #      softhsm module, SOFTHSM2_CONF written inside the container to the
          #   3. PIN + PROVIDER -- per ADR-008 / canonical ci_mkosi-installer.yml:
          #      provider:pkcs11 (not engine:pkcs11), PIN embedded in the URI as
          #      ?pin-value=1234, PKCS11_PROVIDER_MODULE pointed at the Fedora
          #      softhsm module, SOFTHSM2_CONF written inside the container to the
          #      mounted host token dir. Only softhsm + pkcs11-provider need dnf.
          # V29: mount host token dir at /run/yubios-hsm:ro (NOT /var/lib/softhsm:ro)
          # because the softhsm RPM wants to create /var/lib/softhsm during install,
          # and mounting the host dir read-only at that exact path causes
          # 'cpio: chown failed - No data available' (run #37, exit 1). /run/ is
          # safe for both RPM install and bind-mounts -- matches the canonical
          # ci_mkosi-installer.yml path. SOFTHSM2_CONF points tokendir at the
          # V32: merge Step 1+2 (build unsigned UKI) + Step 3 (sign with sbsign) into ONE docker run.
          # V31 (run #41) proved that two separate docker runs with the same -v mount can
          # diverge: Step 1+2 wrote /output/yubios.unsigned.efi OK, but Step 3's fresh
          # container saw /output/pki/ as missing. The ephemeral-container class of
          # bugs has cost 5+ iterations. Merging into one container ensures the cert
          # (Step 6 output) and the unsigned UKI (bootc output) share the same filesystem
          # layer with no overlay/mount-mask surprises.
          # V58: drop the .tmp + mv atomic-rename dance. Run #76 (V57 commit
          # 0131059, job 91118193069 at 09:10:33Z) showed sbsign writing to
          # /output/yubios.efi.tmp and step 8 succeeding (so mv's exit code
          # was 0), yet step 9's osslsigncode verify failed with 'Failed to
          # open file: mkosi.output/yubios.efi'. Root cause: the bind-mounted
          # $GITHUB_WORKSPACE/mkosi.output:/output did not always surface the
          # rename to the host path inside this docker --rm + VFS-storage
          # combo, leaving mkosi.output/yubios.efi.tmp as the only artifact
          # visible to step 9. Fix: have sbsign write directly to the final
          # path and follow with explicit ls -la + file + test -s sanity
          # checks so a regression is impossible to hide silently.
          # V38: pass BOTH cert + PKCS#8 as base64 env vars. V35 single-file bind-mount
          # -> EISDIR; V36 cross-mount -> cross-version BDB; V37 env vars forgot KEY_P8_B64
          # (set -u exits on first echo). Inner bash decodes /tmp/sb.crt + /tmp/sb.p8. No
          # bind mounts for PKI files. Container initializes own token dir + imports
          # sb.p8 via softhsm2-util --import. V36's -v /var/lib/softhsm:ro mount was dropped
          # because the host has no tokens anymore (keeping it would EROFS the container).
          # EISDIR on /output/pki/sb.crt). Pass cert as base64 env var instead --
          # the inner bash decodes it to /tmp/sb.crt. No bind mount = no shadowing.
          CERT_B64=$(base64 -w 0 "$GITHUB_WORKSPACE/mkosi.output/pki/sb.crt")
          KEY_P8_B64=$(base64 -w 0 "$GITHUB_WORKSPACE/mkosi.output/pki/sb.p8")
          # ARG_MAX is ~128KB on Linux; both encoded payloads are well under 1KB.
          echo "CERT_B64 length: ${#CERT_B64} chars"
          echo "KEY_P8_B64 length: ${#KEY_P8_B64} chars"
          # V60: drop --rm + use docker cp. V58 dropped .tmp+mv; V59
          # added diagnostic + absolute paths. V59's diagnostic
          # (run #80, job 91121560795) confirmed the inner->outer
          # container bind mount of $GITHUB_WORKSPACE/mkosi.output:/output
          # never propagates writes back to the host runner (container-
          # in-container VFS storage driver issue, confirmed: find under
          # $GITHUB_WORKSPACE returned nothing despite /output/yubios.efi
          # being 146MB PE32+ EFI inside the inner container). docker cp
          # reads from the container's own filesystem union directly,
          # bypassing the bind-mount propagation race entirely. The
          # bind mount is still useful for the cert import (cp into
          # /output/pki/sb.crt inside the container), so we keep it.
          docker rm -f yubios-ci-build 2>/dev/null || true
          docker run --privileged --pid=host --ipc=host \
            --security-opt label=type:unconfined_t \
            --name yubios-ci-build \
            -v /var/lib/containers:/var/lib/containers \
            -v "$GITHUB_WORKSPACE/mkosi.output:/output" \
            -v /dev:/dev \
            -e CERT_B64="$CERT_B64" \
            -e KEY_P8_B64="$KEY_P8_B64" \
            "$RESOLVED_IMAGE" \
            bash -c 'set -euo pipefail; echo "$KEY_P8_B64" | base64 -d > /tmp/sb.p8.host && echo "$CERT_B64" | base64 -d > /tmp/sb.crt.host && mkdir -p /output/pki && cp /tmp/sb.crt.host /output/pki/sb.crt && ls -la /output/pki/sb.crt /tmp/sb.p8.host && file /output/pki/sb.crt /tmp/sb.p8.host && dnf install -y systemd-ukify systemd-boot-unsigned opensc softhsm pkcs11-provider && mkdir -p /target /run/yubios-hsm/tokens && mount --bind / /target && bootc container ukify --rootfs /target -- --output /output/yubios.unsigned.efi && printf "directories.tokendir = /run/yubios-hsm/tokens\nobjectstore.backend = file\n" > /run/yubios-hsm/softhsm2.conf && export SOFTHSM2_CONF=/run/yubios-hsm/softhsm2.conf && softhsm2-util --init-token --free --label yubiOS-ci --pin 1234 --so-pin 1234 && export PKCS11_PROVIDER_MODULE=/usr/lib64/libsofthsm2.so && chmod -R a+rwX /run/yubios-hsm && softhsm2-util --import /tmp/sb.p8.host --token yubiOS-ci --label sb-key --id 0102 --pin 1234 && /usr/lib/systemd/systemd-sbsign sign --private-key-source=provider:pkcs11 --private-key='\''pkcs11:token=yubiOS-ci;object=sb-key;type=private?pin-value=1234'\'' --certificate=/output/pki/sb.crt --output=/output/yubios.efi /output/yubios.unsigned.efi && ls -la /output/yubios.efi && file /output/yubios.efi && test -s /output/yubios.efi'
          docker cp yubios-ci-build:/output/yubios.efi "$GITHUB_WORKSPACE/mkosi.output/yubios.efi"
          docker rm -f yubios-ci-build >/dev/null

      - name: Assert signed UKI is well-formed (assertions 1-3 of 6)
        run: |
          set -euo pipefail
          # V59: diagnostic + absolute paths. Run #78 (V58 commit e72b32d)
          # failed at this step with 'Failed to open file:
          # mkosi.output/yubios.efi' even after V58 dropped the .tmp+mv
          # race -- the inner-docker-run bind mount of
          # $GITHUB_WORKSPACE/mkosi.output:/output inside the outer
          # dhi.io/debian-base container is fragile (container-in-container
          # bind-mount propagation), and a relative path hides where the
          # file actually landed. Fix: cd explicitly, find() the file by
          # absolute path, and verify it exists before handing it to
          # osslsigncode so a regression is impossible to hide silently.
          cd "$GITHUB_WORKSPACE"
          echo "=== V59 diagnostic: filesystem state ==="
          echo "PWD=$PWD"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "--- ls -la mkosi.output/ ---"
          ls -la mkosi.output/ 2>&1 || echo "mkosi.output/ does not exist"
          echo "--- find \$GITHUB_WORKSPACE -name 'yubios*.efi' ---"
          find "$GITHUB_WORKSPACE" -name 'yubios*.efi' -ls 2>/dev/null \
            || echo "no yubios*.efi found anywhere under \$GITHUB_WORKSPACE"
          echo "--- end diagnostic ---"
          # V61: systemd-ukify -> ukify (Debian pkg vs binary).
          # V60 commit 0985cb1 (run #82, job 91123023217) fixed the
          # bind-mount race via docker cp -- assertion 1 then passed
          # cleanly. But assertion 2 failed with
          # 'systemd-ukify: command not found' (exit 127). The apt-get
          # install of 'systemd-ukify' on Debian trixie
          # (dhi.io/debian-base) succeeded -- the package installs the
          # binary as /usr/bin/ukify, NOT /usr/bin/systemd-ukify.
          # The Fedora inner container's `dnf install systemd-ukify` is
          # a different package that does install /usr/bin/systemd-ukify;
          # the host assertion step runs on Debian where the binary
          # name is just `ukify`. command -v ukify sanity check makes a
          # future regression (binary renamed, package removed, etc.)
          # surface as `::error::ukify not found` instead of a silent
          # exit 127.
          command -v ukify >/dev/null 2>&1 || { echo "::error::ukify not found (Debian systemd-ukify package installs the binary as 'ukify' at /usr/bin/ukify)"; exit 1; }
          SIGNED_EFI="$GITHUB_WORKSPACE/mkosi.output/yubios.efi"
          CERT="$GITHUB_WORKSPACE/mkosi.output/pki/sb.crt"
          test -f "$SIGNED_EFI" || { echo "::error::$SIGNED_EFI missing"; exit 1; }
          test -f "$CERT"      || { echo "::error::$CERT missing";      exit 1; }
          echo "=== Assertion 1: osslsigncode verify accepts signed UKI (sbverify dropped per ADR-008) ==="
          osslsigncode verify -in "$SIGNED_EFI" -CAfile "$CERT"
          echo "=== Assertion 2: UKI structure has .cmdline + .linux + .initrd ==="
          ukify inspect "$SIGNED_EFI" > /tmp/inspect.txt
          grep -F '.cmdline' /tmp/inspect.txt
          grep -F '.linux'   /tmp/inspect.txt
          grep -F '.initrd'  /tmp/inspect.txt
          echo "=== Assertion 3: composefs fsverity digest sealed in UKI .cmdline ==="
          # V62: ukify inspect --json (machine-readable output).
          # V61 commit b8af8109 (run #83, job 91124368536) made assertion 1
          # pass cleanly ('Signature verification: ok') and assertion 2
          # pass cleanly (ukify ran, .cmdline/.linux/.initrd matched).
          # But assertion 3 failed at 09:42:11Z with:
          #   jq: parse error: Invalid numeric literal at line 1, column 6
          #   ##[error]Process completed with exit code 5.
          # Root cause: `ukify inspect` (without --json) in systemd v257
          # outputs human-readable text (.cmdline:, .linux:, .initrd:
          # headers followed by content on the SAME line), not JSON.
          # `jq -r '.[".cmdline"]'` then tries to parse `.cmdline: <hex>`
          # as JSON, and `.` is interpreted as a numeric literal prefix
          # -- it expects digits at column 2, but finds `c` (of `.cmdline`),
          # giving the parse error at column 6 of line 1. systemd v254+
          # added `ukify inspect --json` for machine-readable output. Fix:
          # add --json so the output is valid JSON with .cmdline/.linux/
          # .initrd as keys, and jq extracts the cmdline value cleanly.
          # Also add an `ukify inspect --json` sanity check on the
          # returned key so a future output-format change surfaces as
          # `::error::` instead of a silent jq parse error.
          # V63: ukify inspect --format=short (v257.13 has no --json).
          # V62 commit aebd23d (run #84, job 91125616967) made assertion 1
          # pass cleanly ('Signature verification: ok') and assertion 2
          # pass cleanly. But assertion 3 failed at 09:48:04Z with:
          #   ukify: error: argument --json: invalid choice:
          #     '/__w/yubiOS/yubiOS/mkosi.output/yubios.efi'
          #     (choose from pretty, short, off)
          #   ##[error]ukify inspect --json failed
          #   ##[error]Process completed with exit code 1.
          # Root cause: systemd v257.13's `ukify inspect` accepts
          # `--format=pretty|short|off` -- NOT `--json`. I assumed
          # `--json` existed (it doesn't in v257). Fix: use
          # `--format=short` (outputs `.cmdline: foo\n.linux: bar\n.initrd: baz`
          # without the pretty borders) and parse with awk instead of jq.
          # awk -F': ' '/^\.cmdline:/{print $2}' extracts the value after the
          # `\.cmdline: ` prefix. `set -euo pipefail` ensures the awk
          # exit code propagates; the explicit || handler with ::error::
          # makes a regression surface clearly.
          # V67: ukify inspect FILE --json=short (swap arg order; arg-order bug, not flag).
          # V66 commit 7dc86db3 (run #88, job 91130977668 at 10:15:39Z) failed at
          # assertion 3 with the IDENTICAL error as V64 (ea5ee131, run #86):
          #   ukify: error: unrecognized arguments: /__w/yubiOS/yubiOS/mkosi.output/yubios.efi
          # Same error from V64 (`--json short FILE`) and V66 (`--json=short FILE`)
          # proves the bug is NOT about --json value parsing -- it's argparse
          # `nargs='*'` positional arg collection order with options that take
          # values. Once argparse parses an option-with-value like `--json=short`,
          # the nargs='*' positional-collection window closes; the next non-option
          # arg (the FILE positional) becomes 'unrecognized arguments'. v257 vs
          # v261 is a red herring: Debian trixie's systemd-ukify package
          # (systemd-ukify_257.13-1~deb13u1) ships v257.13 with identical argparse
          # structure (positional nargs='*', --json choices+default). Same bug
          # in both. Fix: swap arg order to match the documented help syntax
          # (`ukify inspect FILE... [options...]`). Mirrors the working assertion 2
          # invocation (`ukify inspect "$SIGNED_EFI"`) and the boot-secure-vm
          # invocation (`ukify inspect mkosi.output/yubios.efi | jq ...`) -- both
          # already use file-first order.
          # V64: ukify inspect --json short (user's hint; --json takes a choice value).
          # V66: fix dropped `# ` prefix on V65's last comment line.
          # V65 (run #87) had a bash syntax error (exit 2) because one
          # comment line was written without the `# ` prefix, so YAML's
          # `|` block scalar treated it as bash code. The active code
          # (`ukify inspect --json=short`) was correct; only the comment
          # was broken.
          # V65: ukify inspect --json=short (equals sign, not space).
          # V64 commit ea5ee131 (run #86, job 91127722244) made assertion 1
          # pass cleanly ('Signature verification: ok') and assertion 2 pass cleanly.
          # But assertion 3 failed at 09:59:51Z with:
          #   ukify: error: unrecognized arguments: /__w/yubiOS/yubiOS/mkosi.output/yubios.efi
          #   ##[error]ukify inspect --json short failed
          #   ##[error]Process completed with exit code 1.
          # Root cause: systemd-ukify v257's `--json` flag is `optional_argument`,
          # not `required_argument`. With `--json short "$file"` (space-separated),
          # bash splits it into 3 args: `--json`, `short`, `/path/to/file`. The parser
          # then (a) accepts `--json` with no value, (b) consumes `short` as the
          # positional FILE argument (it's the only positional), and (c) sees
          # `/path/to/file` as a SECOND positional -> 'unrecognized arguments'.
          # Fix: use `--json=short` (equals sign). The equals syntax forces `--json`
          # to consume `short` as its value (the Geteopt-style `=` flag-value
          # syntax), leaving `$file` as the single positional file arg.
          ukify inspect "$SIGNED_EFI" --json=short > /tmp/inspect.txt \
            || { echo "::error::jq cmdline extraction from /tmp/inspect.txt failed"; exit 1; }
          # V71: actually fix the broken jq error message (V70 ship had search bug).
          # V70 commit 3ab647dc (run 30624304691, dispatched 10:39:35Z) shipped a fix
          # attempt for the V69 bash syntax error, but my Python edit script had a
          # search bug: the second `for` loop matched a line inside the V70 COMMENT
          # block (which references the broken syntax as an example: "V69 active
          # code: || { echo "::error::jq -r '.[\'".cmdline"].text\' extraction
          # from /tmp/inspect.txt failed"; exit 1; }") -- that line contains the
          # exact substring "jq -r ... .[".cmdline"].text ... extraction from
          # /tmp/inspect.txt failed ... exit 1", so my naive substring search
          # matched the COMMENT line (which had 10 leading spaces from "# "),
          # NOT the actual error line (which has 12 leading spaces from the
          # indented YAML run-block). V70 therefore PRESERVED the broken error
          # line and added a no-op duplicate at the wrong position. V71 fix: use
          # a stricter signature match (line.startswith with 12 spaces + `|| { echo "`)
          # so comment lines can't match. V71 active code:
          #   || { echo "::error::jq cmdline extraction from /tmp/inspect.txt failed"; exit 1; }
          # Untouched: V69 jq extraction, V68 RSA-4096 bump, V67 ukify arg-order.
          # V72: removed the orphaned || guard V71 left dangling here (bash syntax
          # error at script line 148, run 30624562181). The ukify line above already
          # carries its own || guard; the jq extraction below is now a single line
          # with inline || (no backslash continuation, no blank-line split).
          test -s /tmp/inspect.txt || { echo "::error::/tmp/inspect.txt empty (ukify produced no output)"; exit 1; }
          # V69: ukify inspect --json=short + jq for cmdline extraction (replace awk).
          # V67 (e2fea142) and V68 (75f9b0ca) both failed at assertion 3 with:
          #   ##[error]no roothash= in UKI .cmdline
          # V67 fixed the ukify invocation (arg order: `ukify inspect FILE --json=short`
          # -- file before --json=short) so assertions 1 + 2 PASS. But the awk
          # extraction of the .cmdline value got nothing because ukify --json=short
          # does NOT produce `.cmdline: <value>` text format -- it produces COMPACT
          # JSON. v257.13 src/ukify/ukify.py:1514-1521 (inspect_sections): for
          # --json != 'off', `json.dump(descs, sys.stdout, indent=indent)` with
          # indent=None for --json=short produces single-line JSON like:
          #   {".cmdline": {"size": N, "sha256": "...", "text": "roothash=..."},
          #    ".linux": {...}, ".initrd": {...}}
          # The awk pattern `/^\.cmdline:/{print $2}` only matches lines starting
          # with literal `.cmdline:` -- the JSON line starts with `{` and uses
          # `".cmdline":` (with quotes) so awk matches nothing. /tmp/cmdline.txt
          # ends up empty. v257.13 src/ukify/ukify.py:378-393 (DEFAULT_SECTIONS_TO_SHOW)
          # maps `.cmdline: 'text'`, so `.cmdline.text` is always present in the
          # JSON output (no need for --all). Fix: replace awk with jq. jq handles
          # the compact JSON cleanly and `.[".cmdline"].text` returns the cmdline
          # string. The `// empty` fallback returns nothing for missing fields
          # rather than `null` (so grep can detect "no roothash" cleanly).
          # Active code in V69:
          jq -r '.[".cmdline"].text // empty' /tmp/inspect.txt > /tmp/cmdline.txt || { echo "::error::jq cmdline extraction from /tmp/inspect.txt failed"; exit 1; }
          echo "UKI .cmdline: $(cat /tmp/cmdline.txt)"
          # V73: run 30625364579 (V72, 194e4b82) cleared the bash syntax errors and
          # the jq extraction ran cleanly, but grep found no roothash= -- correctly.
          # This lane builds the UKI with `bootc container ukify --rootfs /target`,
          # and bootc (crates/lib/src/ukify.rs) embeds a COMPOSEFS fsverity digest
          # karg via ComposefsCmdline::build -- `composefs=[?]<64-hex>` -- never a
          # dm-verity `roothash=`. The roothash= expectation came from the mkosi
          # dm-verity lane. Assert the karg this build path actually seals: the
          # optional `?` prefix means allow_missing_fsverity (status.rs Display).
          # V74: run 30625675688 (V73, 280760f8) echoed the real cmdline:
          #   audit=0 composefs=a71332a6...e956  (digest is 128 hex chars)
          # The image's fsverity digest is sha512 (128 hex), not sha256 (64 hex);
          # the {64} + \b regex can't match inside a 128-char run. Accept both.
          grep -E '\bcomposefs=\??[0-9a-f]{64}([0-9a-f]{64})?\b' /tmp/cmdline.txt \
            || { echo "::error::no composefs=<fsverity-digest> in UKI .cmdline"; exit 1; }
          echo "Assertions 1-3 PASS"

      - name: Upload signed UKI artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: sealed-uki-artifacts-${{ matrix.arch }}
          path: |
            mkosi.output/yubios.efi
            mkosi.output/yubios.unsigned.efi
            mkosi.output/pki/sb.crt
            mkosi.output/pki/sb.key
          retention-days: 7

      - name: Assert UKI machine type matches matrix arch (V79 guard)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # V81: file(1) outputs 'ARM64' on aarch64 libmagic, not 'Aarch64'.
          # Match a single unambiguous substring per arch:
          #   amd64: 'x86' (matches 'x86-64', 'AMD x86_64', etc.)
          #   arm64: 'ARM' or 'aarch64' (matches 'Aarch64', 'ARM aarch64', 'ARM64')
          # grep -qi is case-insensitive; 'ARM' alone could false-match a
          # hypothetical ARMv7 build, so require 'aarch64' OR '64-bit ARM'.
          file mkosi.output/yubios.efi
          case "${{ matrix.arch }}" in
            amd64) EXPECT='x86-64' ;;
            arm64) EXPECT='(Aarch64|ARM aarch64|ARM64)' ;;
          esac
          file mkosi.output/yubios.efi | grep -Eqi "$EXPECT" \
            || { echo "::error::UKI PE machine type does not match matrix arch ${{ matrix.arch }} (expected $EXPECT)"; exit 1; }
          echo "UKI arch guard PASS: ${{ matrix.arch }}"

  boot-secure-vm:
    name: "boot signed UKI in Secure Boot VM (assertion 4 of 6) [${{ matrix.arch }}]"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [build-and-verify-uki]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemu_pkg: qemu-system-x86
            fw_pkg: ovmf
            qemu_bin: qemu-system-x86_64
            fw_dir: /usr/share/OVMF
            code_fd: OVMF_CODE_4M.secboot.fd
            vars_fd: OVMF_VARS_4M.fd
            machine: q35,smm=on,accel=kvm
            cpu: host
            smp: "4"
            boot_timeout: "60"
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_pkg: qemu-system-arm
            fw_pkg: qemu-efi-aarch64
            qemu_bin: qemu-system-aarch64
            fw_dir: /usr/share/AAVMF
            code_fd: AAVMF_CODE.secboot.fd
            vars_fd: AAVMF_VARS.fd
            machine: virt,accel=tcg
            cpu: max
            smp: "1"
            boot_timeout: "1200"
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:61dc022a1908439c478ed4b00e883fe8a7a03540fac23a8aed61352e28e6ae07
    steps:
      - name: Install VM dependencies
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ${{ matrix.qemu_pkg }} ${{ matrix.fw_pkg }} swtpm tpm2-tools curl python3-virt-firmware \
            systemd-ukify jq openssl
          command -v ${{ matrix.qemu_bin }} >/dev/null 2>&1 || { echo "::error::${{ matrix.qemu_bin }} missing"; exit 1; }

      - name: Download signed UKI artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: sealed-uki-artifacts-${{ matrix.arch }}
          path: mkosi.output

      - name: Prepare Secure Boot firmware (enroll CI cert)
        run: |
          set -euo pipefail
          # V79: arch-keyed firmware. arm64: AAVMF_CODE.fd is a SYMLINK to
          # AAVMF_CODE.no-secboot.fd -- using it would boot firmware with SB
          # compiled out. AAVMF_CODE.secboot.fd is the enforcing build.
          mkdir -p ovmf
          test -f ${{ matrix.fw_dir }}/${{ matrix.code_fd }} \
            || { echo "::error::${{ matrix.code_fd }} missing from ${{ matrix.fw_pkg }}"; ls -la ${{ matrix.fw_dir }}/; exit 1; }
          test -f ${{ matrix.fw_dir }}/${{ matrix.vars_fd }} \
            || { echo "::error::${{ matrix.vars_fd }} missing"; ls -la ${{ matrix.fw_dir }}/; exit 1; }
          cp -L ${{ matrix.fw_dir }}/${{ matrix.code_fd }} ovmf/CODE.fd
          GUID="a0baa8a3-041d-48a8-bc87-c36d121b5e3d"
          virt-fw-vars \
            --input ${{ matrix.fw_dir }}/${{ matrix.vars_fd }} \
            --output ovmf/VARS.run.fd \
            --secure-boot \
            --set-pk  "$GUID" mkosi.output/pki/sb.crt \
            --add-kek "$GUID" mkosi.output/pki/sb.crt \
            --add-db  "$GUID" mkosi.output/pki/sb.crt
          virt-fw-vars --input ovmf/VARS.run.fd --print | grep -i secure || true
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            openssl genrsa -out /tmp/foreign.key 2048 2>/dev/null
            openssl req -new -x509 -key /tmp/foreign.key -sha256 -days 1 \
              -subj "/CN=Foreign ROTPK (arm64 SB differential)" -out /tmp/foreign.crt
            FGUID="a0baa8a3-041d-48a8-bc87-c36d5badc0de"
            virt-fw-vars \
              --input ${{ matrix.fw_dir }}/${{ matrix.vars_fd }} \
              --output ovmf/VARS.foreign.fd \
              --secure-boot \
              --set-pk  "$FGUID" /tmp/foreign.crt \
              --add-kek "$FGUID" /tmp/foreign.crt \
              --add-db  "$FGUID" /tmp/foreign.crt
          fi

      - name: Boot signed UKI in QEMU Secure Boot VM
        run: |
          set -euo pipefail
          ukify inspect mkosi.output/yubios.efi --json=short \
            | jq -r '.[".cmdline"].text // empty' > /tmp/cmdline.txt
          test -s /tmp/cmdline.txt || { echo "::error::empty cmdline extracted from UKI"; exit 1; }
          # V81: add -net none. Debian's qemu-efi-aarch64 doesn't ship
          # efi-virtio.rom; the default `virt` machine tries to instantiate
          # a virtio-net nic, fails to load the romfile, and exits with
          # "failed to find romfile "efi-virtio.rom"" before firmware
          # boots. Disabling the nic avoids the romfile dependency without
          # affecting the SB enforcement proof (we don't need network for
          # this leg -- the UKI just needs to execute and reach 'Booting Linux').
          START=$(date +%s)
          timeout ${{ matrix.boot_timeout }} ${{ matrix.qemu_bin }} \
            -machine ${{ matrix.machine }} \
            -cpu ${{ matrix.cpu }} -smp ${{ matrix.smp }} -m 4G \
            -drive if=pflash,format=raw,readonly=on,file=ovmf/CODE.fd \
            -drive if=pflash,format=raw,file=ovmf/VARS.run.fd \
            -kernel mkosi.output/yubios.efi \
            -append "$(cat /tmp/cmdline.txt)" \
            -net none \
            -nographic \
            -serial mon:stdio \
            -display none \
            -no-reboot \
            > /tmp/qemu.log 2>&1 || true
          echo "=== QEMU wall time: $(( $(date +%s) - START ))s (limit ${{ matrix.boot_timeout }}s) ==="
          echo "=== full serial log ($(wc -l < /tmp/qemu.log) lines) ==="
          cat /tmp/qemu.log
          echo "=== end serial log ==="
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            if grep -E -i 'Secure Boot[: ]+(enabled|yes)' /tmp/qemu.log; then
              echo "Assertion 4 PASS: systemd-stub reports Secure Boot enabled"
            else
              echo "::error::Secure Boot not detected in QEMU log"; tail -50 /tmp/qemu.log; exit 1
            fi
          else
            # arm64: differential SB proof (strictly stronger than grep).
            grep -q 'Booting Linux' /tmp/qemu.log \
              || { echo "::error::arm64 positive leg: UKI never executed under SB-enforcing AAVMF"; exit 1; }
            echo "arm64 positive leg PASS: signed UKI executed with our cert in db"
            START=$(date +%s)
            timeout ${{ matrix.boot_timeout }} ${{ matrix.qemu_bin }} \
              -machine ${{ matrix.machine }} \
              -cpu ${{ matrix.cpu }} -smp ${{ matrix.smp }} -m 4G \
              -drive if=pflash,format=raw,readonly=on,file=ovmf/CODE.fd \
              -drive if=pflash,format=raw,file=ovmf/VARS.foreign.fd \
              -kernel mkosi.output/yubios.efi \
              -append "$(cat /tmp/cmdline.txt)" \
              -net none \
              -nographic \
              -serial mon:stdio \
              -display none \
              -no-reboot \
              > /tmp/qemu-foreign.log 2>&1 || true
            echo "=== foreign-db QEMU wall time: $(( $(date +%s) - START ))s ==="
            cat /tmp/qemu-foreign.log
            if grep -q 'Booting Linux' /tmp/qemu-foreign.log; then
              echo "::error::arm64 negative leg FAIL: AAVMF executed our UKI with a FOREIGN db -- SB not enforcing"
              exit 1
            fi
            echo "Assertion 4 PASS (arm64, differential): AAVMF executed the UKI with our cert enrolled and refused it with a foreign db"
          fi

  # V79: deliberately NOT matrix'd. Negative 3 asserts on x86-only
  # kernel string 'secureboot: Secure boot enabled' (arch/x86/kernel/setup.c);
  # on arm64 that string can never appear -> the FAIL branch could never fire
  # and the test would pass VACUOUSLY. arm64 SB proof lives in boot-secure-vm
  # as a positive/foreign-db differential. Negative 2 deferred per user.
  negative-tamper-tests:
    name: "3 negative tamper tests -- amd64 only [Negative 3 implemented]"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [boot-secure-vm]
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:61dc022a1908439c478ed4b00e883fe8a7a03540fac23a8aed61352e28e6ae07
    steps:
      - name: Install VM dependencies for Negative 3
        run: |
          set -euo pipefail
          # V80: V79 (7ef35f95, run 30627902934) hit "sbverify missing" -- I
          # assumed sbverify would already be in the dhi.io debian-base; it
          # isn't. sbverify lives in the sbsigntool package (per Debian
          # tracker, packages.debian.org/trixie/sbsigntool) -- install it
          # alongside the rest of the VM/UKI stack the negative job needs.
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 ovmf python3-virt-firmware \
            systemd-ukify jq sbsigntool openssl
          command -v sbverify >/dev/null 2>&1 || { echo "::error::sbverify missing after sbsigntool install"; exit 1; }

      - name: Download signed UKI artifact (amd64 build, V79 arch-keyed)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # PINNED.md
        with:
          name: sealed-uki-artifacts-amd64
          path: mkosi.output

      - name: Negative 1 -- tampered UKI byte flip -> sbverify rejection
        run: |
          set -euo pipefail
          cp mkosi.output/yubios.efi mkosi.output/yubios-tampered.efi
          printf X | dd of=mkosi.output/yubios-tampered.efi \
            bs=1 count=1 conv=notrunc
          if sbverify --cert mkosi.output/pki/sb.crt \
              mkosi.output/yubios-tampered.efi 2>/dev/null; then
            echo "::error::sbverify accepted tampered UKI"
            exit 1
          fi
          echo "Negative 1 PASS: sbverify rejected tampered UKI"

      - name: Negative 2 -- tampered composefs hash -> dm-verity rejection (TODO)
        run: |
          echo "TODO: follow-up PR. Requires bootc install to-filesystem, flip"
          echo "one byte in the BLS composefs=<sha512> entry, boot the image, and"
          echo "assert dm-verity refuses to mount the composefs store. See"
          echo "refs/sealed-uki-vm-test-2026-07-30.md section 'Negative 2'."

      - name: Negative 3 -- foreign ROTPK -> OVMF rejects signed UKI as unsigned
        run: |
          set -euo pipefail
          # V78: design doc calls this "missing ROTPK -> unsigned UKI rejection".
          # The strongest form is: build a FOREIGN OVMF varstore with Secure
          # Boot enforcing but our cert NOT in db, boot the SAME signed UKI,
          # assert OVMF refuses to load it as an unsigned image. If OVMF
          # loaded it, the signing step proved nothing -- any attacker could
          # present an unsigned blob. The design doc's stated invariant:
          # "Secure Boot VM must refuse to boot" (assertion 6 negative
          # variant). Generate a throwaway key, enroll it as the FOREIGN
          # PK/KEK/db (NOT sb.crt), boot the signed UKI, expect refusal.
          mkdir -p ovmf
          test -f /usr/share/OVMF/OVMF_CODE_4M.secboot.fd || { echo "::error::OVMF secboot firmware missing"; ls -la /usr/share/OVMF/; exit 1; }
          cp /usr/share/OVMF/OVMF_CODE_4M.secboot.fd ovmf/OVMF_CODE.fd
          # Throwaway foreign PKI -- different key from sb.key, so OVMF has
          # never seen the yubios signing chain. SHA256 self-signed RSA-2048
          # is fine for the foreign key; OVMF only needs SOME db cert to
          # evaluate "is this image signed by a known signer?" -- and ours
          # is NOT in this db.
          openssl genrsa -out /tmp/foreign.key 2048 2>/dev/null
          openssl req -new -x509 -key /tmp/foreign.key -sha256 -days 1 \
            -subj "/CN=Foreign ROTPK (Negative 3)" -out /tmp/foreign.crt
          GUID="a0baa8a3-041d-48a8-bc87-c36d5badc0de"
          virt-fw-vars \
            --input /usr/share/OVMF/OVMF_VARS_4M.fd \
            --output ovmf/OVMF_VARS.foreign.fd \
            --secure-boot \
            --set-pk  "$GUID" /tmp/foreign.crt \
            --add-kek "$GUID" /tmp/foreign.crt \
            --add-db  "$GUID" /tmp/foreign.crt
          # cmdline extraction (same path as assertion 4)
          ukify inspect mkosi.output/yubios.efi --json=short \
            | jq -r '.[".cmdline"].text // empty' > /tmp/cmdline.txt
          test -s /tmp/cmdline.txt || { echo "::error::empty cmdline extracted from UKI"; exit 1; }
          # Boot with foreign db. -no-reboot forces exit on any firmware
          # halt. QEMU exits with non-zero on OVMF "Image verification
          # failed" / "Security Violation" -- capture both serial output
          # AND the exit code so we can assert either or both.
          timeout 60 qemu-system-x86_64 \
            -machine q35,smm=on,accel=kvm \
            -cpu host -smp 4 -m 4G \
            -drive if=pflash,format=raw,readonly=on,file=ovmf/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=ovmf/OVMF_VARS.foreign.fd \
            -kernel mkosi.output/yubios.efi \
            -append "$(cat /tmp/cmdline.txt)" \
            -nographic \
            -serial mon:stdio \
            -display none \
            -no-reboot \
            > /tmp/qemu-neg3.log 2>&1 || rc=$?
          : "${rc:=0}"
          echo "QEMU exit code: $rc"
          echo "--- QEMU serial (tail 60) ---"
          tail -60 /tmp/qemu-neg3.log
          echo "--- assertion ---"
          # Two failure modes are both PASS for this negative test:
          # (a) OVMF refused to load the image -> no 'secureboot: Secure
          #     boot enabled' line appears
          # (b) kernel panicked on missing rootfs -> no 'Booting Linux'
          #     banner
          if grep -q 'secureboot: Secure boot enabled' /tmp/qemu-neg3.log; then
            echo "::error::Negative 3 FAIL: kernel saw Secure Boot enabled -- foreign db accepted our signed UKI"
            exit 1
          fi
          # Must also see SOMETHING that shows OVMF blocked or kernel
          # panicked -- a silent exit is a flake, not a pass.
          if grep -qiE 'verification failed|security violation|invalid signature|cannot load image|panic' /tmp/qemu-neg3.log; then
            echo "Negative 3 PASS: OVMF refused foreign-db boot of signed UKI"
          else
            # QEMU timeout also acceptable: firmware stuck at Setup or
            # bootloader spin with no console output is itself a refusal.
            if [ "$rc" -ne 0 ]; then
              echo "Negative 3 PASS: QEMU exited non-zero ($rc) without booting -- OVMF refused foreign-db boot"
            else
              echo "::error::Negative 3 FAIL: ambiguous -- no SB banner, no refusal marker, QEMU exit 0"
              exit 1
            fi
          fi

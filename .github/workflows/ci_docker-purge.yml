name: docker-purge

# Clears ALL TAGS + IMAGE MANIFESTS from the CI repos in the Docker Hub
# namespace (docker.io/0mniteck/*) so a relaunch starts from an empty
# image history. THE REPOSITORIES THEMSELVES ARE NEVER DELETED — they
# stay in place with their settings and history; only tags/images go.
# SAFETY: the default mode is `report` — a dry-run that only lists repos
# + tag counts. Actual deletion requires an explicit dispatch with
# mode=purge, so an accidental group/cron fire can never delete images.
# Member of the ci.yml `audits` group (dispatch reachability); it is
# intentionally NOT in the `all` group.
# Endpoint: DELETE /v2/repositories/{namespace}/{repository}/tags/{tag}
# (per-tag; on Docker Hub deleting a tag removes its manifest).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = dry-run listing only; purge = DELETE every tag/image in the listed repos (repos stay)'
        type: choice
        required: true
        default: 'report'
        options:
        - report
        - purge
      namespace:
        description: 'Docker Hub namespace to operate on'
        type: string
        required: false
        default: '0mniteck'
      repos:
        description: 'Comma-separated repo names to restrict to (empty = all repos in the namespace)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  purge:
    name: Purge Docker Hub image history (tags + images)
    runs-on: ubuntu-24.04
    steps:
      - name: Report or clear tags/images
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER }}
          MODE: ${{ github.event.inputs.mode }}
          NAMESPACE: ${{ github.event.inputs.namespace }}
          REPOS_INPUT: ${{ github.event.inputs.repos }}
        run: |
          set -euo pipefail
          JWT="$(curl -sf -H 'Content-Type: application/json' \
            -d "{\"username\":\"0mniteck42\",\"password\":\"${DOCKERHUB_PASSWORD}\"}" \
            https://hub.docker.com/v2/users/login | jq -r .token)"
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "::error::Docker Hub login failed for 0mniteck42"
            exit 1
          fi
          AUTH="Authorization: Bearer ${JWT}"
          REPOS=""
          URL="https://hub.docker.com/v2/repositories/${NAMESPACE}/?page_size=100"
          while [ -n "$URL" ]; do
            PAGE="$(curl -sf -H "$AUTH" "$URL")"
            REPOS="$REPOS $(echo "$PAGE" | jq -r '.results[].name' | tr '\n' ' ')"
            URL="$(echo "$PAGE" | jq -r '.next // empty')"
          done
          REPOS="$(echo "$REPOS" | xargs)"
          if [ -n "${REPOS_INPUT// /}" ]; then
            FILTERED=""
            for WANT in ${REPOS_INPUT//,/ }; do
              case " $REPOS " in
                *" $WANT "*) FILTERED="$FILTERED $WANT";;
                *) echo "::warning::requested repo '${WANT}' not found in namespace ${NAMESPACE}";;
              esac
            done
            REPOS="$(echo "$FILTERED" | xargs)"
          fi
          echo "namespace=${NAMESPACE} mode=${MODE} repos: ${REPOS}"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          {
            echo "## Docker Hub ${MODE} — namespace \`${NAMESPACE}\`"
            echo
            echo "| repo | tags found | deleted |"
            echo "|---|---|---|"
          } | tee -a "$SUMMARY"
          TOTAL_DELETED=0
          for REPO in $REPOS; do
            TAGS=""
            URL="https://hub.docker.com/v2/repositories/${NAMESPACE}/${REPO}/tags?page_size=100"
            while [ -n "$URL" ]; do
              if ! PAGE="$(curl -sf -H "$AUTH" "$URL" 2>/dev/null)"; then
                echo "::warning::tag listing failed for ${NAMESPACE}/${REPO} (skipping remaining pages)"
                break
              fi
              TAGS="$TAGS $(echo "$PAGE" | jq -r '.results[].name' | tr '\n' ' ')"
              URL="$(echo "$PAGE" | jq -r '.next // empty')"
            done
            TAGS="$(echo "$TAGS" | xargs)"
            COUNT=0; [ -n "$TAGS" ] && COUNT=$(echo "$TAGS" | wc -w)
            DELETED=0
            if [ "$MODE" = "purge" ]; then
              for TAG in $TAGS; do
                CODE="$(curl -s -o /tmp/del-body -w '%{http_code}' -X DELETE -H "$AUTH" \
                  "https://hub.docker.com/v2/repositories/${NAMESPACE}/${REPO}/tags/${TAG}")"
                if [ "$CODE" = "204" ]; then
                  DELETED=$((DELETED + 1))
                else
                  echo "::warning::delete ${NAMESPACE}/${REPO}:${TAG} -> HTTP ${CODE} $(head -c 200 /tmp/del-body 2>/dev/null | tr -d '\n')"
                fi
              done
            fi
            TOTAL_DELETED=$((TOTAL_DELETED + DELETED))
            echo "| ${REPO} | ${COUNT} | ${DELETED} |" | tee -a "$SUMMARY"
          done
          {
            echo
            echo "Tags deleted: **${TOTAL_DELETED}** (repositories untouched)"
          } | tee -a "$SUMMARY"
          echo "done mode=${MODE} repos=$(echo $REPOS | wc -w) tags_deleted=${TOTAL_DELETED}"

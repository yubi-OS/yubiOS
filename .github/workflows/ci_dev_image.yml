name: yubiOS dev/test image (swu2f, ADR-026)

# Builds the swu2f-enabled TEST image (Containerfile.dev, on top of the same
# base as production) and publishes it to docker.io/0mniteck/yubios under the
# `dev` / `dev-<sha>` tags — a distinct namespace from `latest`/`<sha>`, per
# ADR-026 (extends the per-artifact tag scheme from ADR-022).
#
# Purpose: give ci_test-vm.yml's vm-e2e job (bcvk on rock1, self-hosted ARM64)
# a real, pullable yubiOS image so the LUKS2-FIDO2 + systemd-homed + enrollment
# boot legs actually run instead of loud-skipping for lack of an image.
#
# TEST-ONLY: this image ships `passless`, a software FIDO2 authenticator, AND a
# serial/tty getty with ROOT AUTOLOGIN so CI can drive the guest over the serial
# console when SSH is not reachable -- the fTPM chain in ci_test-vm.yml's
# ftpm-qemu job boots under U-Boot, where bcvk's SSH credential karg never
# applies. Root autologin is a total local-access bypass of pam_u2f (ADR-003).
# NEVER treat `dev`/`dev-<sha>` as production-equivalent to `latest`. Never
# wire this workflow's output into yubiOS-ci.yml's production push path.
#
# Same rootless-Docker-in-Docker pattern as yubiOS-ci.yml (ADR-014): dind on
# dhi.io's hardened base, with the production->dev dependency, strict
# yubiOS.rego policy, tags, and outputs defined in yubiOS-bake.hcl.

on:
  workflow_dispatch:
    inputs:
      Docker_push:
        default: false
        type: boolean
        required: true
        description: Push dev/test image to Docker Hub (multi-arch manifest)?
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

env:
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb # v0.35.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            docker_arch: x86_64
            buildx_arch: linux-amd64
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged --pid=host --ipc=host --security-opt label=type:unconfined_t -v /dev:/dev
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:ac54666cad73016059945e22a9d460cd0a60d869a8a92a8f5c367517eb778531 # trixie-debian13-dev — auto-resolves to ${{ matrix.arch }}
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          if [ "$(uname -m)" = "aarch64" ] && [ -e /proc/1/ns/net ] && ! apt-get update -qq 2>/dev/null; then
            if [ -f /proc/1/root/run/systemd/resolve/resolv.conf ]; then
              cp -f /proc/1/root/run/systemd/resolve/resolv.conf /etc/resolv.conf 2>/dev/null || true
            fi
            nsenter --net=/proc/1/ns/net -- apt-get update -qq
            nsenter --net=/proc/1/ns/net -- apt-get install -y -qq --no-install-recommends \
              git curl iproute2 iptables mount nftables passwd procps util-linux \
              uidmap slirp4netns fuse-overlayfs
            SELF_NET="$(readlink /proc/self/ns/net)"
            CONT_PID="$$"
            for p in /proc/[0-9]*; do
              pid="${p#/proc/}"
              if [ "$(cat "$p/comm" 2>/dev/null || true)" = "tail" ] && [ "$(readlink "$p/ns/net" 2>/dev/null || true)" = "$SELF_NET" ]; then
                CONT_PID="$pid"
                break
              fi
            done
            cp -f /proc/1/root/run/systemd/resolve/resolv.conf /tmp/upstream-resolv.conf 2>/dev/null || printf 'nameserver 1.1.1.1\n' > /tmp/upstream-resolv.conf
            ip link del eth0 2>/dev/null || true
            setsid unshare -m sh -c '
              mount --bind /tmp/upstream-resolv.conf /etc/resolv.conf
              exec nsenter --net=/proc/1/ns/net -- slirp4netns --configure --mtu=65520 --disable-host-loopback "'"$CONT_PID"'" tap0
            ' </dev/null > "${RUNNER_TEMP}/outer-slirp4netns.log" 2>&1 &
            for _ in $(seq 1 50); do
              if ip addr show dev tap0 2>/dev/null | grep -q 'inet '; then
                break
              fi
              sleep 0.2
            done
            ip addr show dev tap0 || { cat "${RUNNER_TEMP}/outer-slirp4netns.log" || true; exit 1; }
            printf 'nameserver 10.0.2.3\n' > /etc/resolv.conf
            curl -fsSI --max-time 10 https://github.com >/dev/null
          fi
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Install docker CLI + buildx (${{ matrix.arch }})
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables jq nftables passwd procps python3 util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.9.3.tgz"
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-rootless-extras-29.9.3.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.39.0/buildx-v0.39.0.${{ matrix.buildx_arch }}"
          case "${{ matrix.docker_arch }}" in
            x86_64)
              DOCKER_SHA512=ff0eeb5d9994a6891b9bebe7c37c8982642da9fdc3b7f19302b3c2276b306b859d56e76f00148eeed2e36daffa576873e15276d79a61e1798e11741511c6e65e # 29.9.3 (linux/amd64)
              ROOTLESS_SHA512=3ea734eb68ae8e74159725410072bc196251bba2f12988014193d694a8a12e4a38f448c1d980563e810cfa4c92c8e364e8aa69652eda1900f91768ea7badb693 # 29.9.3 (linux/amd64)
              BUILDX_SHA512=9c3a17f0b782cfcc12b883546ed4efe684900f2139bee2ca369518aea35ea36a44201f9669f0eab43fca926926d90e11bf8cabf4a87653ad7aff50c5dba80fa6 # v0.39.0 (linux/amd64)
              ;;
            aarch64)
              DOCKER_SHA512=373b7542d225479e066cb540889cf24035f7909a17519845bedb93bb0b208c3bdd778af47d412de52136bf98d63ac1a5aba76e09eacd15641151c6e7f73aa198 # 29.9.3 (linux/arm64)
              ROOTLESS_SHA512=7bab17249d06874cd5900ffc9908db692e8f158e17b03fc8afff5b9feaab5044752f7a018225695f8ca548212fa4d5095c3f15d0b06ed263f00ab4a895d6fc8a # 29.9.3 (linux/arm64)
              BUILDX_SHA512=810c87058af0abb1205366d85ac47c3b1111676f7ae411fba19d3fe49a13a0695fe0d8bb03cdbd097132507eec19c7aecf4189e3ca30cab0e4a2a3b92ce8ad2b # v0.39.0 (linux/arm64)
              ;;
            *)
              echo "Unsupported Docker artifact architecture: ${{ matrix.docker_arch }}" >&2
              exit 1
              ;;
          esac
          printf '%s  %s\n' "$DOCKER_SHA512" docker-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$ROOTLESS_SHA512" docker-rootless-extras-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$BUILDX_SHA512" "buildx-v0.39.0.${{ matrix.buildx_arch }}" | sha512sum --check --strict
          tar xzf docker-29.9.3.tgz
          tar xzf docker-rootless-extras-29.9.3.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          if [ -d /mnt/extended ]; then
            rm -rf /mnt/extended/docker-rootless.* 2>/dev/null || true
            ROOTLESS_DATA_DIR="$(mktemp -d /mnt/extended/docker-rootless.XXXXXX)"
          else
            ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          fi
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 "buildx-v0.39.0.${{ matrix.buildx_arch }}" "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          install -d -m 0777 /run/pcscd /run/yubios-hsm
          chmod a+rw /dev/uhid /dev/hidraw* 2>/dev/null || true
          chmod -R a+rw /dev/bus/usb 2>/dev/null || true
          rm -rf docker docker-rootless-extras docker-29.9.3.tgz docker-rootless-extras-29.9.3.tgz "buildx-v0.39.0.${{ matrix.buildx_arch }}"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///run/docker-rootless/docker.sock login -u 0mniteck42 --password-stdin

      - name: Stage initial Secure Boot keys inside final rootless layer (physical YubiKey on rock1 or swu2f fallback)
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER }}
        run: |
          if [ -n "${DOCKER_PASSWORD:-}" ]; then
            printf '%s' "$DOCKER_PASSWORD" | docker -H unix:///run/docker-rootless/docker.sock login dhi.io -u 0mniteck42 --password-stdin
          fi
          chmod +x usr/lib/yubiOS/uki/stage-ci-sb-keys.sh
          chmod -R a+rwX "$PWD"
          docker -H unix:///run/docker-rootless/docker.sock run --rm \
            --privileged \
            --security-opt label=disable \
            -v /dev:/host-dev \
            -v /sys:/sys:ro \
            -v /run/pcscd:/run/pcscd \
            -v /run/yubios-hsm:/run/yubios-hsm \
            -v "$PWD:/work" \
            -w /work \
            "dhi.io/debian-base@sha256:ac54666cad73016059945e22a9d460cd0a60d869a8a92a8f5c367517eb778531" \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                efitools openssl opensc pcscd softhsm2 pkcs11-provider \
                yubikey-manager ykcs11 fido2-tools usbutils
              SOURCE_DATE_EPOCH="'"${SOURCE_DATE_EPOCH}"'" ./usr/lib/yubiOS/uki/stage-ci-sb-keys.sh /work
            '
          chown -R 0:0 usr/lib/yubiOS/secureboot repro-evidence
          find usr/lib/yubiOS/secureboot repro-evidence -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +

      - name: Build and verify dev/test image (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: linux/${{ matrix.arch }}
          GIT_SHA: ${{ github.sha }}
          PUSH: 'false'
        run: |
          docker -H unix:///run/docker-rootless/docker.sock buildx bake \
            --builder hardened \
            --file yubiOS-bake.hcl \
            yubios-dev-ci

      - name: Prove two clean dev OCI builds match
        if: matrix.arch == 'arm64'
        env:
          REPRO_REPORT: repro-evidence/dev-arm64.json
        run: |
          if [ -d /mnt/extended ]; then
            mkdir -p /mnt/extended/tmp
            export TMPDIR=/mnt/extended/tmp
          fi
          scripts/verify-reproducible-images.sh dev

      - name: Retain dev reproducibility evidence and initial Secure Boot keys
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — see PINNED.md
        with:
          name: reproducibility-dev-arm64-${{ github.sha }}
          path: |
            repro-evidence/dev-arm64.json
            repro-evidence/secureboot/
            repro-evidence/EFI/
          if-no-files-found: error
          retention-days: 30

      - name: Push per-arch dev image (${{ matrix.arch }})
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: linux/${{ matrix.arch }}
          GIT_SHA: ${{ github.sha }}
          PUSH: 'true'
        run: |
          docker -H unix:///run/docker-rootless/docker.sock buildx bake \
            --builder hardened \
            --file yubiOS-bake.hcl \
            yubios-dev

  merge-manifest:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      DEV_SHA_TAG: 0mniteck/yubios:dev-${{ github.sha }}
      DEV_FLOATING_TAG: 0mniteck/yubios:dev
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:ac54666cad73016059945e22a9d460cd0a60d869a8a92a8f5c367517eb778531 # trixie-debian13-dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
      - name: Install docker CLI + buildx
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables jq nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/x86_64/docker-29.9.3.tgz"
          wcurl "https://download.docker.com/linux/static/stable/x86_64/docker-rootless-extras-29.9.3.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.39.0/buildx-v0.39.0.linux-amd64"
          printf '%s  %s\n' 'ff0eeb5d9994a6891b9bebe7c37c8982642da9fdc3b7f19302b3c2276b306b859d56e76f00148eeed2e36daffa576873e15276d79a61e1798e11741511c6e65e' docker-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' '3ea734eb68ae8e74159725410072bc196251bba2f12988014193d694a8a12e4a38f448c1d980563e810cfa4c92c8e364e8aa69652eda1900f91768ea7badb693' docker-rootless-extras-29.9.3.tgz | sha512sum --check --strict
          printf '%s  %s\n' '9c3a17f0b782cfcc12b883546ed4efe684900f2139bee2ca369518aea35ea36a44201f9669f0eab43fca926926d90e11bf8cabf4a87653ad7aff50c5dba80fa6' buildx-v0.39.0.linux-amd64 | sha512sum --check --strict
          tar xzf docker-29.9.3.tgz
          tar xzf docker-rootless-extras-29.9.3.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 buildx-v0.39.0.linux-amd64 "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///run/docker-rootless/docker.sock login -u 0mniteck42 --password-stdin

      - name: Guard dev/test manifest tags
        run: |
          set -euo pipefail
          for tag in "$DEV_SHA_TAG" "$DEV_FLOATING_TAG"; do
            case "$tag" in
              0mniteck/yubios:dev|0mniteck/yubios:dev-*) ;;
              *)
                echo "::error::dev/test publish attempted non-dev tag: $tag"
                exit 1
                ;;
            esac
          done

      - name: Create + push multi-arch dev manifest
        # Also tag with the 8-char short SHA prefix so dispatchers can pull
        # `dev-<short-sha>` (the natural human-readable form) without knowing
        # the full 40-char SHA at dispatch time. OMN-149 verification at
        # d2646452 dispatched `dev-d2646452` (short) but the workflow only
        # pushed `dev-d264645271cdc...` (full) -- "manifest unknown".
        run: |
          DEV_SHORT_SHA_TAG="0mniteck/yubios:dev-${GITHUB_SHA:0:8}"
          docker -H unix:///run/docker-rootless/docker.sock buildx imagetools create \
            -t "$DEV_SHA_TAG" \
            -t "$DEV_FLOATING_TAG" \
            -t "$DEV_SHORT_SHA_TAG" \
            "0mniteck/yubios:dev-${{ github.sha }}-amd64" \
            "0mniteck/yubios:dev-${{ github.sha }}-arm64"

      - name: Verify manifest list
        run: docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$DEV_SHA_TAG"

      - name: Install cosign v3.1.4
        run: |
          wcurl "https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64"
          COSIGN_SHA512=00195f672f97e206032e158cf2bb279b0c4b549dd49b5361f463465c55490a9179f7bb8ba0c5b886aa59a2d8148ddb6ba7244d9701ea8659dfce991e1b58604a # v3.1.4 (linux/amd64)
          printf '%s  %s\n' "$COSIGN_SHA512" cosign-linux-amd64 | sha512sum --check --strict
          install -D -m 0755 cosign-linux-amd64 /usr/local/bin/cosign

      - name: Resolve image digest + extract BuildKit attestations
        id: resolve
        env:
          IMAGE_TAG: 0mniteck/yubios:dev-${{ github.sha }}
        run: |
          set -euo pipefail
          DIGEST=$(docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
          docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$IMAGE_TAG" --format '{{json .SBOM}}' > sbom.json
          docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Provenance}}' > provenance.json
          test -s sbom.json
          test -s provenance.json
          jq -e . sbom.json
          jq -e . provenance.json

      - name: cosign sign (keyless OIDC, GitHub Actions)
        env:
          IMAGE_REF: 0mniteck/yubios:dev-${{ github.sha }}@${{ steps.resolve.outputs.DIGEST }}
          COSIGN_PASSWORD: ''
        run: |
          for attempt in 1 2 3 4 5; do
            cosign sign --key cosign/yubios-omni157.key --signing-config cosign/signing-config.json "$IMAGE_REF" && exit 0
            echo "::warning::cosign sign attempt ${attempt}/5 failed; retry in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          echo "::error::cosign sign failed after 5 attempts" >&2
          exit 1





  verify-attest:
    name: Verify published image attestations + signature
    needs: merge-manifest
    if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
      - name: Install cosign v3.1.4
        run: |
          curl --fail --silent --show-error --location --output cosign-linux-amd64 "https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64"
          COSIGN_SHA512=00195f672f97e206032e158cf2bb279b0c4b549dd49b5361f463465c55490a9179f7bb8ba0c5b886aa59a2d8148ddb6ba7244d9701ea8659dfce991e1b58604a # v3.1.4 (linux/amd64)
          printf '%s  %s\n' "$COSIGN_SHA512" cosign-linux-amd64 | sha512sum --check --strict
          install -D -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
      - name: Install jq for attestation predicate inspection
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Verify published image attestations + cosign signature
        env:
          IMAGE_TAG: 0mniteck/yubios:dev-${{ github.sha }}
          WORKFLOW_FILE: ci_dev_image.yml
        run: |
          WORKFLOW_FILES="${WORKFLOW_FILE%.yml}" \
            IMAGE_REF="${IMAGE_TAG}" \
            bash tests/verify-oci-attestations.sh

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [build, merge-manifest]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."
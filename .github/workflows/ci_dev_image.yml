name: yubiOS dev/test image (swu2f, ADR-026)

# Builds the swu2f-enabled TEST image (Containerfile.dev, on top of the same
# base as production) and publishes it to docker.io/0mniteck/yubios under the
# `dev` / `dev-<sha>` tags — a distinct namespace from `latest`/`<sha>`, per
# ADR-026 (extends the per-artifact tag scheme from ADR-022).
#
# Purpose: give ci_test-vm.yml's vm-e2e job (bcvk on rock1, self-hosted ARM64)
# a real, pullable yubiOS image so the LUKS2-FIDO2 + systemd-homed + enrollment
# boot legs actually run instead of loud-skipping for lack of an image.
#
# TEST-ONLY: this image ships `passless`, a software FIDO2 authenticator, AND a
# serial/tty getty with ROOT AUTOLOGIN so CI can drive the guest over the serial
# console when SSH is not reachable -- the fTPM chain in ci_test-vm.yml's
# ftpm-qemu job boots under U-Boot, where bcvk's SSH credential karg never
# applies. Root autologin is a total local-access bypass of pam_u2f (ADR-003).
# NEVER treat `dev`/`dev-<sha>` as production-equivalent to `latest`. Never
# wire this workflow's output into yubiOS-ci.yml's production push path.
#
# Same rootless-Docker-in-Docker pattern as yubiOS-ci.yml (ADR-014): dind on
# dhi.io's hardened base, with the production->dev dependency, strict
# yubiOS.rego policy, tags, and outputs defined in yubiOS-bake.hcl.

on:
  workflow_dispatch:
    inputs:
      Docker_push:
        default: false
        type: boolean
        required: true
        description: Push dev/test image to Docker Hub (multi-arch manifest)?
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

env:
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
            buildx_arch: linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:61dc022a1908439c478ed4b00e883fe8a7a03540fac23a8aed61352e28e6ae07 # auto-resolves to ${{ matrix.arch }}
    steps:
      - name: Install git for checkout and reproducibility
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Resolve reproducible build environment
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/lib/reproducible-build.sh . "$GITHUB_SHA" "$ARCH" "$GITHUB_ENV"

      - name: Install docker CLI + buildx (${{ matrix.arch }})
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables jq nftables passwd procps python3 util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.6.0.tgz"
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-rootless-extras-29.6.0.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.${{ matrix.buildx_arch }}"
          case "${{ matrix.docker_arch }}" in
            x86_64)
              DOCKER_SHA512=42401384ef853dab0a1986a7990420e77d3ee2bc39e178f8817d27ba6c4403998b7aacf3c28c7172135cdeec281cd328a8f2af949b5f57db44a211a093cfd20b
              ROOTLESS_SHA512=184b583a0f325bef12feaf1ca175ff5ea4a65a168f2136eb1daf9c2ae646eecf02134ed65766c8800bd8eb03ac4d338d1e5d700248bc33632027b5b0b52de48a
              BUILDX_SHA512=710f4f48a101af939c4a4cace5ca93ab8c1a1a9ae244a4ef73b2a900f228614472b635bd202fae383c851686d383a37cdeddf45e6d54b36cae8458826c272262
              ;;
            aarch64)
              DOCKER_SHA512=04713ac54030bed8b2c096280d034b02f5430ed73ba8bcc4a686f7bbbf4a3444eb027847e896cd9ee91c3237dbe1c25a4cfca43d1dcd922a1a10009c960ace0b
              ROOTLESS_SHA512=37649acdaacc597c115d2f19b71a4729a0119c6debbba4b4af18da2fd497ac28f5691df13137b7fc59903551ab0e08868f4b976a9a5704e2b7958b3b5b0cc0af
              BUILDX_SHA512=6dc0d4ed11a7bbd8148dab8897594d7050e7f3bc43e6d130e629aa443e50266e77beed8816737e5dc34b7d43617e7a4eef8121561042ef9a87479aea14383058
              ;;
            *)
              echo "Unsupported Docker artifact architecture: ${{ matrix.docker_arch }}" >&2
              exit 1
              ;;
          esac
          printf '%s  %s\n' "$DOCKER_SHA512" docker-29.6.0.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$ROOTLESS_SHA512" docker-rootless-extras-29.6.0.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$BUILDX_SHA512" "buildx-v0.35.0.${{ matrix.buildx_arch }}" | sha512sum --check --strict
          tar xzf docker-29.6.0.tgz
          tar xzf docker-rootless-extras-29.6.0.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 "buildx-v0.35.0.${{ matrix.buildx_arch }}" "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///run/docker-rootless/docker.sock login -u 0mniteck42 --password-stdin

      - name: Build and verify dev/test image (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: linux/${{ matrix.arch }}
          GIT_SHA: ${{ github.sha }}
          PUSH: 'false'
        run: |
          docker -H unix:///run/docker-rootless/docker.sock buildx bake \
            --builder hardened \
            --file yubiOS-bake.hcl \
            yubios-dev-ci

      - name: Prove two clean dev OCI builds match
        if: matrix.arch == 'arm64'
        env:
          REPRO_REPORT: repro-evidence/dev-arm64.json
        run: scripts/verify-reproducible-images.sh dev

      - name: Retain dev reproducibility evidence
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # PINNED.md
        with:
          name: reproducibility-dev-arm64-${{ github.sha }}
          path: repro-evidence/dev-arm64.json
          if-no-files-found: error
          retention-days: 30

      - name: Push per-arch dev image (${{ matrix.arch }})
        if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: linux/${{ matrix.arch }}
          GIT_SHA: ${{ github.sha }}
          PUSH: 'true'
        run: |
          docker -H unix:///run/docker-rootless/docker.sock buildx bake \
            --builder hardened \
            --file yubiOS-bake.hcl \
            yubios-dev

  merge-manifest:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      DEV_SHA_TAG: 0mniteck/yubios:dev-${{ github.sha }}
      DEV_FLOATING_TAG: 0mniteck/yubios:dev
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:61dc022a1908439c478ed4b00e883fe8a7a03540fac23a8aed61352e28e6ae07
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
      - name: Install docker CLI + buildx
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl iproute2 iptables jq nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/x86_64/docker-29.6.0.tgz"
          wcurl "https://download.docker.com/linux/static/stable/x86_64/docker-rootless-extras-29.6.0.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64"
          printf '%s  %s\n' '42401384ef853dab0a1986a7990420e77d3ee2bc39e178f8817d27ba6c4403998b7aacf3c28c7172135cdeec281cd328a8f2af949b5f57db44a211a093cfd20b' docker-29.6.0.tgz | sha512sum --check --strict
          printf '%s  %s\n' '184b583a0f325bef12feaf1ca175ff5ea4a65a168f2136eb1daf9c2ae646eecf02134ed65766c8800bd8eb03ac4d338d1e5d700248bc33632027b5b0b52de48a' docker-rootless-extras-29.6.0.tgz | sha512sum --check --strict
          printf '%s  %s\n' '710f4f48a101af939c4a4cace5ca93ab8c1a1a9ae244a4ef73b2a900f228614472b635bd202fae383c851686d383a37cdeddf45e6d54b36cae8458826c272262' buildx-v0.35.0.linux-amd64 | sha512sum --check --strict
          tar xzf docker-29.6.0.tgz
          tar xzf docker-rootless-extras-29.6.0.tgz
          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"
          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 buildx-v0.35.0.linux-amd64 "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"
          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"
          # RootlessKit needs unprivileged user namespaces on Ubuntu 24.04.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!
          for i in $(seq 1 60); do
            docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker -H "unix://${ROOTLESS_SOCKET}" info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi
          docker -H unix:///run/docker-rootless/docker.sock buildx create --name hardened \
            --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use || true

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER }}" | docker -H unix:///run/docker-rootless/docker.sock login -u 0mniteck42 --password-stdin

      - name: Guard dev/test manifest tags
        run: |
          set -euo pipefail
          for tag in "$DEV_SHA_TAG" "$DEV_FLOATING_TAG"; do
            case "$tag" in
              0mniteck/yubios:dev|0mniteck/yubios:dev-*) ;;
              *)
                echo "::error::dev/test publish attempted non-dev tag: $tag"
                exit 1
                ;;
            esac
          done

      - name: Create + push multi-arch dev manifest
        # Also tag with the 8-char short SHA prefix so dispatchers can pull
        # `dev-<short-sha>` (the natural human-readable form) without knowing
        # the full 40-char SHA at dispatch time. OMN-149 verification at
        # d2646452 dispatched `dev-d2646452` (short) but the workflow only
        # pushed `dev-d264645271cdc...` (full) -- "manifest unknown".
        run: |
          DEV_SHORT_SHA_TAG="0mniteck/yubios:dev-${GITHUB_SHA:0:8}"
          docker -H unix:///run/docker-rootless/docker.sock buildx imagetools create \
            -t "$DEV_SHA_TAG" \
            -t "$DEV_FLOATING_TAG" \
            -t "$DEV_SHORT_SHA_TAG" \
            "0mniteck/yubios:dev-${{ github.sha }}-amd64" \
            "0mniteck/yubios:dev-${{ github.sha }}-arm64"

      - name: Verify manifest list
        run: docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$DEV_SHA_TAG"

      - name: Install cosign v3.1.2
        run: |
          wcurl "https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64"
          COSIGN_SHA512=01174ede4958413aca502e7eafdff34a5a7fab39c25af66b84c24b98e354e5cf2631bf2c07ecdd8c684dfab843f9694237606706eeafc20ae30ed5ed831f1d60
          printf '%s  %s\n' "$COSIGN_SHA512" cosign-linux-amd64 | sha512sum --check --strict
          install -D -m 0755 cosign-linux-amd64 /usr/local/bin/cosign

      - name: Resolve image digest + extract BuildKit attestations
        id: resolve
        env:
          IMAGE_TAG: 0mniteck/yubios:dev-${{ github.sha }}
        run: |
          set -euo pipefail
          DIGEST=$(docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
          docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$IMAGE_TAG" --format '{{json .SBOM}}' > sbom.json
          docker -H unix:///run/docker-rootless/docker.sock buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Provenance}}' > provenance.json
          test -s sbom.json
          test -s provenance.json
          jq -e . sbom.json
          jq -e . provenance.json

      - name: cosign sign (keyless OIDC, GitHub Actions)
        env:
          IMAGE_REF: 0mniteck/yubios:dev-${{ github.sha }}@${{ steps.resolve.outputs.DIGEST }}
          COSIGN_PASSWORD: ''
        run: |
          for attempt in 1 2 3 4 5; do
            cosign sign --key cosign/yubios-omni157.key --signing-config cosign/signing-config.json "$IMAGE_REF" && exit 0
            echo "::warning::cosign sign attempt ${attempt}/5 failed; retry in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          echo "::error::cosign sign failed after 5 attempts" >&2
          exit 1





  verify-attest:
    name: Verify published image attestations + signature
    needs: merge-manifest
    if: github.event_name == 'workflow_dispatch' && inputs.Docker_push == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
      - name: Install cosign v3.1.2
        run: |
          curl --fail --silent --show-error --location --output cosign-linux-amd64 "https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64"
          COSIGN_SHA512=01174ede4958413aca502e7eafdff34a5a7fab39c25af66b84c24b98e354e5cf2631bf2c07ecdd8c684dfab843f9694237606706eeafc20ae30ed5ed831f1d60
          printf '%s  %s\n' "$COSIGN_SHA512" cosign-linux-amd64 | sha512sum --check --strict
          install -D -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
      - name: Install jq for attestation predicate inspection
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Verify published image attestations + cosign signature
        env:
          IMAGE_TAG: 0mniteck/yubios:dev-${{ github.sha }}
          WORKFLOW_FILE: ci_dev_image.yml
        run: |
          WORKFLOW_FILES="${WORKFLOW_FILE%.yml}" \
            IMAGE_REF="${IMAGE_TAG}" \
            bash tests/verify-oci-attestations.sh

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [build, merge-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."
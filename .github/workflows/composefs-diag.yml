name: composefs-diag
on:
  push:
    branches: [composefs-diag-2026-10-18]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    name: diag (current base)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build diagnostic export
        env:
          BASE_CURRENT: quay.io/fedora/fedora-bootc:45@sha256:43ee6f8f859835f64f2a1415a41fdd4ccfb878f79d00a6ccca84222204cb9d8e
        run: |
          set -euo pipefail
          for i in 1 2 3; do docker pull "$BASE_CURRENT" && break; echo "pull attempt $i failed"; sleep 10; done
          docker buildx build -f Containerfile --target export \
            --build-arg BASE_IMAGE="$BASE_CURRENT" \
            --build-arg SOURCE_DATE_EPOCH=1792321149 \
            --output type=local,dest=out .
          {
            echo "### composefs diag (current base 43ee6f8f)"
            echo '```'
            cat out/digests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          diff out/stage.manifest out/fixed.manifest > out/stage-vs-fixed.diff || true
          echo "stage vs fixed manifest diff lines: $(wc -l < out/stage-vs-fixed.diff)" >> "$GITHUB_STEP_SUMMARY"
          diff out/stage.manifest out/final.manifest > out/stage-vs-final.diff || true
          echo "stage vs final manifest diff lines: $(wc -l < out/stage-vs-final.diff)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic export
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composefs-diag-current-fix
          path: out/
          if-no-files-found: warn

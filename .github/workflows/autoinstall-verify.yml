name: autoinstall-verify

# Validates an autoinstall user-data file with the canonical/subiquity
# parser (scripts/validate-autoinstall-user-data.py) so seed-file changes
# (e.g. 0mniteck/U-Boot Deploy/ubuntu/*) are schema-checked before deploy.
#
# Deps follow subiquity snapcraft.yaml stage-packages; curtin + probert are
# cloned into the subiquity tree as siblings, matching the snap layout.
#
# The dry-run server has no ISO: its default source catalog contains only
# the synthesized server entry, so a desktop source id would fail the
# Source controller. We plant /cdrom/casper/install-sources.yaml (the path
# the controller loads when present) with the desktop/server source ids
# documented as current in the subiquity autoinstall reference:
# https://canonical-subiquity.readthedocs-hosted.com/en/latest/reference/autoinstall-reference.html

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "GitHub repo holding the autoinstall user-data"
        required: false
        default: "0mniteck/U-Boot"
      branch:
        description: "Branch or tag ref"
        required: false
        default: "Docker"
      path:
        description: "Path to the user-data file in the repo"
        required: false
        default: "Deploy/ubuntu/user-data"
      subiquity_ref:
        description: "canonical/subiquity ref for the parser"
        required: false
        default: "main"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate with subiquity autoinstall parser
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-aiohttp python3-apport python3-attr python3-bson python3-debian python3-distro-info python3-jsonschema python3-more-itertools python3-oauthlib python3-packaging python3-passlib python3-pkg-resources python3-pyroute2 python3-pyrsistent python3-pyudev python3-requests python3-requests-unixsocket python3-systemd python3-urwid python3-yaml python3-yarl
          git clone --depth 1 https://github.com/canonical/subiquity /tmp/subiquity
          git clone --depth 1 https://github.com/canonical/curtin /tmp/subiquity/curtin
          git clone --depth 1 https://github.com/canonical/probert /tmp/subiquity/probert
          sudo mkdir -p /cdrom/casper
          sudo tee /cdrom/casper/install-sources.yaml > /dev/null <<'EOF'
          version: 2
          kernel:
            default: linux-generic
          sources:
            - id: ubuntu-desktop-minimal
              name:
                en: Ubuntu Desktop (minimal)
              description:
                en: The default minimal desktop installation
              variant: desktop
              path: /media/filesystem
              type: cp
              size: 4000000000
              default: true
              locale_support: locale-only
              variations:
                default:
                  path: /media/filesystem
                  size: 4000000000
            - id: ubuntu-desktop
              name:
                en: Ubuntu Desktop (standard)
              description:
                en: The standard desktop installation
              variant: desktop
              path: /media/filesystem
              type: cp
              size: 5000000000
              default: false
              locale_support: locale-only
              variations:
                default:
                  path: /media/filesystem
                  size: 5000000000
            - id: ubuntu-server-minimal
              name:
                en: Ubuntu Server (minimal)
              description:
                en: The default minimal server installation
              variant: server
              path: /media/filesystem
              type: cp
              size: 2000000000
              default: false
              locale_support: locale-only
              variations:
                default:
                  path: /media/filesystem
                  size: 2000000000
            - id: ubuntu-server
              name:
                en: Ubuntu Server (standard)
              description:
                en: The standard server installation
              variant: server
              path: /media/filesystem
              type: cp
              size: 2500000000
              default: false
              locale_support: locale-only
              variations:
                default:
                  path: /media/filesystem
                  size: 2500000000
          EOF
          curl -fsSL "https://raw.githubusercontent.com/${{ inputs.repo }}/${{ inputs.branch }}/${{ inputs.path }}" -o /tmp/target-user-data
          echo "Validating ${{ inputs.repo }}@${{ inputs.branch }}:${{ inputs.path }} against subiquity@${{ inputs.subiquity_ref }}"
          cd /tmp/subiquity && python3 scripts/validate-autoinstall-user-data.py -vvv /tmp/target-user-data

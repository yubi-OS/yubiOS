name: autoinstall-verify

# Validates an autoinstall user-data file with the canonical/subiquity
# parser (scripts/validate-autoinstall-user-data.py) so seed-file changes
# (e.g. 0mniteck/U-Boot Deploy/ubuntu/*) are schema-checked before deploy.
# Deps follow subiquity snapcraft.yaml (python3-aiohttp/-jsonschema/
# -requests/-requests-unixsocket/-systemd/-yaml); curtin + probert are
# cloned into the subiquity tree as siblings, matching the snap layout.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "GitHub repo holding the autoinstall user-data"
        required: false
        default: "0mniteck/U-Boot"
      branch:
        description: "Branch or tag ref"
        required: false
        default: "Docker"
      path:
        description: "Path to the user-data file in the repo"
        required: false
        default: "Deploy/ubuntu/user-data"
      subiquity_ref:
        description: "canonical/subiquity ref for the parser"
        required: false
        default: "main"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate with subiquity autoinstall parser
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-aiohttp python3-apport python3-attr python3-bson python3-debian python3-distro-info python3-jsonschema python3-more-itertools python3-oauthlib python3-packaging python3-passlib python3-pkg-resources python3-pyroute2 python3-pyrsistent python3-pyudev python3-requests python3-requests-unixsocket python3-systemd python3-urwid python3-yaml python3-yarl
          git clone --depth 1 https://github.com/canonical/subiquity /tmp/subiquity
          git clone --depth 1 https://github.com/canonical/curtin /tmp/subiquity/curtin
          git clone --depth 1 https://github.com/canonical/probert /tmp/subiquity/probert
          curl -fsSL "https://raw.githubusercontent.com/${{ inputs.repo }}/${{ inputs.branch }}/${{ inputs.path }}" -o /tmp/target-user-data
          echo "Validating ${{ inputs.repo }}@${{ inputs.branch }}:${{ inputs.path }} against subiquity@${{ inputs.subiquity_ref }}"
          cd /tmp/subiquity && python3 scripts/validate-autoinstall-user-data.py -vvv /tmp/target-user-data

name: CI

# Top-level yubiOS CI orchestrator — group-routing dispatcher.
#
# Canonical execution sequence:
#   1. docker  — ci_docker-purge.yml, ci_docker-repos-ensure.yml
#   2. fetches — fetch-dhi-manifest.yml, fetch-fedora-bootc-manifest.yml,
#                fetch-released-tag-ref.yml
#   3. tests   — ci_test_rootless-docker.yml, ci_test_pq_tls_verify.yml,
#                ci_test-fedora-bootc-arm64-pull.yml
#      forks   — ci_fork_mkosi.yml, ci_fork_bcvk.yml,
#                ci_fork_arm-trusted-firmware.yml, ci_fork_optee-os.yml,
#                ci_fork_ms-tpm-20-ref.yml, ci_fork_optee-ftpm.yml,
#                ci_fork_u-boot.yml, ci_fork_edk2.yml
#   4. builds  — yubiOS-ci.yml, ci_dev_image.yml, ci_mkosi-installer.yml,
#                ci_firmware-rk.yml, ci_build-test-fixtures.yml
#   5. vms     — ci_test-vm.yml, ci_test-vgpu-vm.yml, ci_test_sealed-uki-vm.yml,
#                ci_test-ftpm-tpm0.yml, ci_test-bootc-lifecycle.yml,
#                ci_test-sysext-portable.yml, ci_test_bootc-filesystem.yml
#   6. misc    — ci_token-audit.yml, ci_input-shape.yml,
#                ci_dispatch-reachability.yml, ci_fork-drift-detect.yml,
#                ci_package-floor.yml, autoinstall-verify.yml,
#                diag_sign-matrix.yml, lean-check.yml, lean-run.yml,
#,,,
#
#   7. flash   — ci_flash-device-e2e.yml
#   all        — union of every workflow above (42 child workflows)

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Which CI group to run. none = no dispatch (default).'
        type: choice
        required: true
        default: 'none'
        options:
        - none
        - docker
        - fetches
        - tests
        - forks
        - builds
        - vms
        - misc
        - flash
        - firmware
        - ci-builders
        - vm-tests
        - audits
        - research
        - all
      reason:
        description: 'Why are you running this orchestrator? (audit log entry)'
        type: string
        required: false
        default: 'manual'
      target_ref:
        description: 'Branch or tag ref to dispatch. Leave empty to use this run ref.'
        type: string
        required: false
        default: ''
      Docker_push:
        description: 'Push Docker registries at the end of each builder workflow (ci_firmware-rk, yubiOS-ci, ci_dev_image, ci_mkosi-installer) when dispatched. No-op for non-builder workflows.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch workflows for the selected group
    runs-on: ubuntu-26.04
    steps:
      - name: Dispatch each workflow in the group independently
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GROUP: ${{ inputs.group }}
          REF: ${{ inputs.target_ref != '' && inputs.target_ref || github.ref_name }}
          REASON: ${{ inputs.reason }}
          DOCKER_PUSH: ${{ inputs.Docker_push }}
        run: |
          set -euo pipefail

          WORKFLOWS=()
          PUSH_WORKFLOWS=()
          case "$GROUP" in
            none)
              echo 'Group=none: no dispatch.'
              exit 0
              ;;
            docker)
              WORKFLOWS=(ci_docker-purge.yml ci_docker-repos-ensure.yml)
              ;;
            fetches)
              WORKFLOWS=(fetch-dhi-manifest.yml fetch-fedora-bootc-manifest.yml fetch-released-tag-ref.yml)
              ;;
            tests)
              WORKFLOWS=(ci_test_rootless-docker.yml ci_test_pq_tls_verify.yml ci_test-fedora-bootc-arm64-pull.yml)
              ;;
            forks)
              WORKFLOWS=(ci_fork_mkosi.yml ci_fork_bcvk.yml ci_fork_arm-trusted-firmware.yml ci_fork_optee-os.yml ci_fork_ms-tpm-20-ref.yml ci_fork_optee-ftpm.yml ci_fork_u-boot.yml ci_fork_edk2.yml ci_fork_gnome-control-center.yml)
              ;;
            builds)
              WORKFLOWS=(yubiOS-ci.yml ci_dev_image.yml ci_mkosi-installer.yml ci_firmware-rk.yml ci_build-test-fixtures.yml)
              PUSH_WORKFLOWS=(yubiOS-ci.yml ci_dev_image.yml ci_mkosi-installer.yml ci_firmware-rk.yml)
              ;;
            firmware)
              WORKFLOWS=(ci_firmware-rk.yml)
              PUSH_WORKFLOWS=(ci_firmware-rk.yml)
              ;;
            ci-builders)
              WORKFLOWS=(yubiOS-ci.yml ci_dev_image.yml ci_mkosi-installer.yml ci_build-test-fixtures.yml)
              PUSH_WORKFLOWS=(yubiOS-ci.yml ci_dev_image.yml ci_mkosi-installer.yml)
              ;;
            vms|vm-tests)
              WORKFLOWS=(ci_test-vm.yml ci_test-vgpu-vm.yml ci_test_sealed-uki-vm.yml ci_test-ftpm-tpm0.yml ci_test-bootc-lifecycle.yml ci_test-sysext-portable.yml ci_test_bootc-filesystem.yml ci_test-uki-local-oci-vm.yml ci_test-uki-local-oci-vm.yml)
              ;;
            misc)
              WORKFLOWS=(ci_token-audit.yml ci_input-shape.yml ci_dispatch-reachability.yml ci_fork-drift-detect.yml ci_package-floor.yml autoinstall-verify.yml diag_sign-matrix.yml lean-check.yml lean-run.yml)
              ;;
            audits)
              WORKFLOWS=(ci_token-audit.yml ci_input-shape.yml ci_dispatch-reachability.yml ci_fork-drift-detect.yml ci_package-floor.yml ci_docker-purge.yml ci_docker-repos-ensure.yml autoinstall-verify.yml)
              ;;
            research)
              WORKFLOWS=(lean-check.yml lean-run.yml)
              ;;
            flash)
              WORKFLOWS=(ci_flash-device-e2e.yml)
              ;;
            all)
              WORKFLOWS=(ci_docker-purge.yml ci_docker-repos-ensure.yml fetch-dhi-manifest.yml fetch-fedora-bootc-manifest.yml fetch-released-tag-ref.yml ci_test_rootless-docker.yml ci_test_pq_tls_verify.yml ci_test-fedora-bootc-arm64-pull.yml ci_fork_mkosi.yml ci_fork_bcvk.yml ci_fork_arm-trusted-firmware.yml ci_fork_optee-os.yml ci_fork_ms-tpm-20-ref.yml ci_fork_optee-ftpm.yml ci_fork_u-boot.yml ci_fork_edk2.yml ci_fork_gnome-control-center.yml yubiOS-ci.yml ci_dev_image.yml ci_mkosi-installer.yml ci_firmware-rk.yml ci_build-test-fixtures.yml ci_test-vm.yml ci_test-vgpu-vm.yml ci_test_sealed-uki-vm.yml ci_test-ftpm-tpm0.yml ci_test-bootc-lifecycle.yml ci_test-sysext-portable.yml ci_test_bootc-filesystem.yml ci_token-audit.yml ci_input-shape.yml ci_dispatch-reachability.yml ci_fork-drift-detect.yml ci_package-floor.yml autoinstall-verify.yml diag_sign-matrix.yml lean-check.yml lean-run.yml ci_flash-device-e2e.yml)
              PUSH_WORKFLOWS=(ci_firmware-rk.yml yubiOS-ci.yml ci_dev_image.yml ci_mkosi-installer.yml)
              ;;
            *)
              echo "::error::Unknown group: $GROUP"
              exit 1
              ;;
          esac

          count=0
          for wf in "${WORKFLOWS[@]}"; do
            push='false'
            is_builder=0
            for pw in "${PUSH_WORKFLOWS[@]:-}"; do
              if [ "$pw" = "$wf" ]; then push="$DOCKER_PUSH"; is_builder=1; fi
            done

            if [ "$is_builder" = 1 ]; then
              inputs_json=$(jq -n --argjson push "$([ "$push" = "true" ] && echo true || echo false)" '{Docker_push: $push}')
            else
              inputs_json='{}'
            fi
            payload=$(jq -n --arg ref "$REF" --argjson inputs "$inputs_json" '{ref: $ref, inputs: $inputs}')

            echo "Dispatching $wf (ref=$REF, Docker_push=$push)"
            curl -fsS -X POST               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${REPO}/actions/workflows/${wf}/dispatches"               -d "$payload"
            count=$((count + 1))
          done

          echo "Dispatched ${count} workflow(s) for group=${GROUP} (ref=${REF})."

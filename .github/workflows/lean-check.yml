name: lean-check

on:
  push:
    branches: ['main', 'lean-check-*']
    paths:
      - 'papers/data/lean/**'
      - 'tools/**'
      - '.github/workflows/lean-check.yml'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this check is being run'
        required: false
        default: 'manual lean check'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Forbidden-token stopgap (round-2 Lane C, expanded round-3 Lane A) —
      # source-side complement to the kernel-side axiom coverage gate below.
      # Fails if any of the five lean sources uses axiom, native_decide,
      # macro[_rules], syntax, elab[_rules], import, set_option, run_cmd,
      # #eval, attribute, notation, or infix[lr] OUTSIDE comments and string
      # literals (whole-word, identifier-boundary-aware match; comments
      # stripped with the exact same nesting-aware stripper as
      # check_lean_axioms.py, which this script imports from its own
      # directory). No Lean toolchain needed. The round-3 additions close
      # the reviewer's meta-route mutation (import Lean + skipKernelTC +
      # run_cmd environment mutation), which is additionally belt-and-braced
      # by the leanchecker kernel re-check below.
      - name: Forbidden-token gate — no axiom/native_decide/macro[_rules]/syntax/elab[_rules]/import/set_option/run_cmd/#eval/attribute/notation/infix[lr] outside comments
        run: |
          set -euo pipefail
          python3 papers/data/lean/check_forbidden_tokens.py \
            papers/data/lean/CurvedCorpus.lean \
            papers/data/lean/WayfinderBounds.lean \
            papers/data/lean/RadiusBounds.lean \
            papers/data/lean/RayleighBounds.lean \
            papers/data/lean/AzimuthBounds.lean

      - name: Install Lean 4.33.0 (pinned SHA256 release tarball, no installer script)
        run: |
          set -euo pipefail
          # Pinned toolchain: official leanprover/lean4 v4.33.0 linux release tarball.
          # SHA256 captured 2026-10-07 from the official GitHub release asset:
          #   https://github.com/leanprover/lean4/releases/download/v4.33.0/lean-4.33.0-linux.tar.zst
          # Provenance note: this hash was captured in one pass from the official
          # release; confirm it once against an independent copy of the artifact
          # (re-download from a different network and re-hash) before relying on
          # this pin for a security-sensitive merge.
          expected='4b3fb03c29a1e0a253fb1d11f9bae3725f19a0dc6fc09b3ea16d2c9df3349e2c'
          curl -sSfL --retry 3 -o /tmp/lean.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.33.0/lean-4.33.0-linux.tar.zst
          echo "$expected  /tmp/lean.tar.zst" | sha256sum --check --status
          mkdir -p "$HOME/.lean-pinned"
          tar --zstd -xf /tmp/lean.tar.zst -C "$HOME/.lean-pinned"
          echo "$HOME/.lean-pinned/lean-4.33.0-linux/bin" >> "$GITHUB_PATH"

      - name: Lean version
        run: lean --version

      - name: Check CurvedCorpus.lean
        run: |
          lean papers/data/lean/CurvedCorpus.lean
          echo "LEAN_OK: all theorems in papers/data/lean/CurvedCorpus.lean check with no sorry"

      - name: Assert no sorry in all Lean files (warnings-as-errors compile)
        run: |
          set -euo pipefail
          # A file containing `sorry` fails to compile under -DwarningAsError=true
          # (the declarationUsesSorry warning is promoted to an error), while a
          # clean file passes. This replaces the former per-file
          # `! grep -n "sorry"` steps, which could never fail: bash's stop-on-
          # error behavior ignores `!`-prefixed commands. The file list is
          # explicit so a new file cannot silently bypass the gate.
          for f in \
            papers/data/lean/CurvedCorpus.lean \
            papers/data/lean/WayfinderBounds.lean \
            papers/data/lean/RadiusBounds.lean \
            papers/data/lean/RayleighBounds.lean \
            papers/data/lean/AzimuthBounds.lean; do
            if ! lean -DwarningAsError=true "$f" > /tmp/sorry-gate.out 2>&1; then
              echo "NO_SORRY_FAIL: $f"
              cat /tmp/sorry-gate.out
              exit 1
            fi
            echo "NO_SORRY_OK: $f"
          done

      # Kernel re-check (round-3 Lane C): replay each module's compiled
      # olean through a fresh kernel environment. Catches any declaration
      # that bypassed kernel type-checking (e.g. debug.skipKernelTC +
      # run_cmd environment mutation). leanchecker ships inside the pinned
      # lean-4.33.0 toolchain (>= v4.28.0) — zero new artifacts, zero new
      # pins; the `command -v` guard makes a toolchain without it fail
      # loudly rather than skip. Same-kernel caveat (Lane C notes): this is
      # the SAME kernel implementation in a fresh process, not an
      # independent verifier. The meta-route mutation class is additionally
      # stopped at the source-side forbidden-token gate above.
      - name: Kernel re-check (leanchecker) over compiled modules
        run: |
          set -euo pipefail
          command -v leanchecker >/dev/null || {
            echo "LEANCHECKER_MISSING: leanchecker not found in the pinned lean-4.33.0 toolchain (expected since v4.28.0)" >&2
            exit 1
          }
          # Compile the five files to oleans from a flat source dir so the
          # module name is unambiguously the file basename (the files import
          # nothing beyond the Lean prelude, so a flat layout matches their
          # actual module structure).
          rm -rf /tmp/leanchecker-src /tmp/leanchecker-oleans
          mkdir -p /tmp/leanchecker-src /tmp/leanchecker-oleans
          for base in CurvedCorpus WayfinderBounds RadiusBounds RayleighBounds AzimuthBounds; do
            cp "papers/data/lean/${base}.lean" "/tmp/leanchecker-src/${base}.lean"
            if ! (cd /tmp/leanchecker-src && lean -o "/tmp/leanchecker-oleans/${base}.olean" "${base}.lean") > "/tmp/leanchecker-src/${base}-olean.err" 2>&1; then
              echo "LEANCHECKER_OLEAN_FAIL: ${base}" >&2
              cat "/tmp/leanchecker-src/${base}-olean.err" >&2
              exit 1
            fi
          done
          export LEAN_PATH="/tmp/leanchecker-oleans"
          for base in CurvedCorpus WayfinderBounds RadiusBounds RayleighBounds AzimuthBounds; do
            echo "== leanchecker --fresh ${base} =="
            if ! leanchecker --fresh "${base}" > "/tmp/leanchecker-${base}.out" 2>&1; then
              echo "LEANCHECKER_FAIL: ${base}" >&2
              cat "/tmp/leanchecker-${base}.out" >&2
              exit 1
            fi
            cat "/tmp/leanchecker-${base}.out"
          done
          echo "LEANCHECKER_OK: five modules re-type-checked via fresh kernel environment replay"

      # Axiom coverage gate (Lane A, round 2) — runs after the pinned-tarball
      # lean install step (no elan in this workflow), so `lean` is on PATH.
      - name: Axiom coverage gate — every theorem in all five lean files
        run: |
          set -euo pipefail
          PERMITTED="propext,Classical.choice,Quot.sound"
          for base in CurvedCorpus WayfinderBounds RadiusBounds RayleighBounds AzimuthBounds; do
            case "${base}" in
              CurvedCorpus)    manifest="curvedcorpus" ;;
              WayfinderBounds) manifest="wayfinder" ;;
              RadiusBounds)    manifest="radius" ;;
              RayleighBounds)  manifest="rayleigh" ;;
              AzimuthBounds)   manifest="azimuth" ;;
            esac
            echo "== axiom coverage: ${base}.lean (manifest: ${manifest}-scope.json) =="

            # 1. Generate the probe: source text + the Lean environment-walking
            #    enumeration block. Lean itself lists every theorem constant of
            #    the current module — no regex extraction feeds the probe.
            python3 papers/data/lean/check_lean_axioms.py --gen \
              --source "papers/data/lean/${base}.lean" \
              --out "/tmp/${base}-probe.lean"

            # 2. Compile the probe with the pinned toolchain; capture stdout+stderr.
            #    LOUD BY DESIGN: if the run_cmd block hits an API mismatch in the
            #    pinned 4.33.0 toolchain, this compile fails and CI stops here.
            lean "/tmp/${base}-probe.lean" > "/tmp/${base}-axioms.txt" 2>&1 || {
              echo "LEAN_FAIL: ${base} probe failed to compile (enumeration block API mismatch?)"
              cat "/tmp/${base}-axioms.txt"
              exit 1
            }

            # 3. Gate (enumerate mode): parse AXIOM_LINE lines, then
            #    - every Lean-listed theorem has an axiom line;
            #    - every axiom set within PERMITTED (sorryAx and Lean.ofReduceBool
            #      from native_decide fail);
            #    - CROSS-CHECK: regex-extracted source names ⊆ Lean-listed names
            #      (both lists printed on any divergence);
            #    - COVERAGE: every Lean-listed name appears in the scope manifest.
            #    Exit 1 on any violation.
            python3 papers/data/lean/check_lean_axioms.py \
              --source "papers/data/lean/${base}.lean" \
              --axioms "/tmp/${base}-axioms.txt" \
              --permitted "${PERMITTED}" \
              --mode enumerate \
              --require-coverage "papers/data/lean/${manifest}-scope.json"
          done
          echo "AXIOM_COVERAGE_GATE_OK: all five lean files gated via Lean-side enumeration, every theorem checked, manifest coverage enforced"


      - name: Check WayfinderBounds.lean (kernel, pinned toolchain)
        run: |
          set -euo pipefail
          lean papers/data/lean/WayfinderBounds.lean > /tmp/wayfinder-axioms.txt 2>&1 || {
            echo "LEAN_FAIL: papers/data/lean/WayfinderBounds.lean"
            cat /tmp/wayfinder-axioms.txt
            exit 1
          }
          cat /tmp/wayfinder-axioms.txt
          echo "LEAN_OK: papers/data/lean/WayfinderBounds.lean checks with no sorry"

      - name: Validate scope manifest is well-formed
        run: |
          set -euo pipefail
          python3 -c "import json; d=json.load(open('papers/data/lean/wayfinder-scope.json')); assert d['theorems'] and d['permitted_axioms'] and d['nonclaims']; print('SCOPE_MANIFEST_OK', len(d['theorems']), 'theorems')"

      - name: Assert printed axioms match permitted manifest set
        run: |
          set -euo pipefail
          python3 papers/data/lean/verify_wayfinder_axioms.py \
            --axioms /tmp/wayfinder-axioms.txt \
            --manifest papers/data/lean/wayfinder-scope.json

      - name: Check RadiusBounds.lean (kernel, pinned toolchain)
        run: |
          set -euo pipefail
          lean papers/data/lean/RadiusBounds.lean > /tmp/radius-axioms.txt 2>&1 || {
            echo "LEAN_FAIL: papers/data/lean/RadiusBounds.lean"
            cat /tmp/radius-axioms.txt
            exit 1
          }
          cat /tmp/radius-axioms.txt
          echo "LEAN_OK: papers/data/lean/RadiusBounds.lean checks with no sorry"

      - name: Validate radius scope manifest is well-formed
        run: |
          set -euo pipefail
          python3 -c "import json; d=json.load(open('papers/data/lean/radius-scope.json')); assert d['theorems'] and d['permitted_axioms'] and d['nonclaims']; print('RADIUS_SCOPE_MANIFEST_OK', len(d['theorems']), 'theorems')"

      - name: Assert printed radius axioms match permitted manifest set
        run: |
          set -euo pipefail
          python3 papers/data/lean/verify_wayfinder_axioms.py \
            --axioms /tmp/radius-axioms.txt \
            --manifest papers/data/lean/radius-scope.json

      - name: Check RayleighBounds.lean (kernel, pinned toolchain)
        run: |
          set -euo pipefail
          lean papers/data/lean/RayleighBounds.lean > /tmp/rayleigh-axioms.txt 2>&1 || {
            echo "LEAN_FAIL: papers/data/lean/RayleighBounds.lean"
            cat /tmp/rayleigh-axioms.txt
            exit 1
          }
          cat /tmp/rayleigh-axioms.txt
          echo "LEAN_OK: papers/data/lean/RayleighBounds.lean checks with no sorry"

      - name: Check AzimuthBounds.lean (kernel, pinned toolchain)
        run: |
          set -euo pipefail
          lean papers/data/lean/AzimuthBounds.lean > /tmp/azimuth-axioms.txt 2>&1 || {
            echo "LEAN_FAIL: papers/data/lean/AzimuthBounds.lean"
            cat /tmp/azimuth-axioms.txt
            exit 1
          }
          cat /tmp/azimuth-axioms.txt
          echo "LEAN_OK: papers/data/lean/AzimuthBounds.lean checks with no sorry"

      - name: Validate azimuth scope manifest is well-formed
        run: |
          set -euo pipefail
          python3 -c "import json; d=json.load(open('papers/data/lean/azimuth-scope.json')); assert d['theorems'] and d['permitted_axioms'] and d['nonclaims']; print('AZIMUTH_SCOPE_MANIFEST_OK', len(d['theorems']), 'theorems')"

      - name: Assert printed azimuth axioms match permitted manifest set
        run: |
          set -euo pipefail
          python3 papers/data/lean/verify_wayfinder_axioms.py \
            --axioms /tmp/azimuth-axioms.txt \
            --manifest papers/data/lean/azimuth-scope.json

      - name: Validate rayleigh scope manifest is well-formed
        run: |
          set -euo pipefail
          python3 -c "import json; d=json.load(open('papers/data/lean/rayleigh-scope.json')); assert d['theorems'] and d['permitted_axioms'] and d['nonclaims']; print('RAYLEIGH_SCOPE_MANIFEST_OK', len(d['theorems']), 'theorems')"

      - name: Assert printed rayleigh axioms match permitted manifest set
        run: |
          set -euo pipefail
          python3 papers/data/lean/verify_wayfinder_axioms.py \
            --axioms /tmp/rayleigh-axioms.txt \
            --manifest papers/data/lean/rayleigh-scope.json

      - name: Check CurvedCorpus.lean (statement pins via scope manifest)
        run: |
          set -euo pipefail
          # Reuses /tmp/CurvedCorpus-axioms.txt produced by the axiom-coverage
          # gate step earlier in this job (probe compile of the full source +
          # one #print axioms per theorem). 90 theorem statement pins checked.
          test -s /tmp/CurvedCorpus-axioms.txt
          python3 papers/data/lean/verify_wayfinder_axioms.py \
            --axioms /tmp/CurvedCorpus-axioms.txt \
            --manifest papers/data/lean/curvedcorpus-scope.json

  verify-measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install numpy
        run: python3 -m pip install --quiet numpy

      - name: Resolve measurement-side claims
        run: python3 papers/data/lean/verify_claims.py

      - name: Resolve rayleigh/1 measurement-side claims (exact components/nullity, witness bound, indicator=cut)
        run: python3 papers/data/lean/verify_rayleigh_claims.py

  verify-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install numpy
        run: python3 -m pip install --quiet numpy

      - name: point-map numerical, API and archive regressions
        run: |
          node --version
          node tools/point-map/test-pointmap.js
          node tools/point-map/test-api.mjs
          node --test tools/point-map/test-tar.mjs
          node tools/point-map/test-math.mjs
          node tools/point-map/test-preview.mjs
          node tools/point-map/test-storage.mjs
          node tools/point-map/test-radius.mjs
          node tools/point-map/test-radius-extra.mjs
          node tools/point-map/test-limits.mjs
          node tools/point-map/test-control-outcomes.mjs
          node tools/point-map/test-axis-consistency.mjs
          node tools/point-map/test-placement.mjs
          node tools/point-map/test-rayleigh.mjs
          node tools/point-map/test-admission.mjs
          node tools/point-map/test-azimuth.mjs

      - name: corpus-auditor selftest
        run: python3 tools/corpus-auditor/auditor.py --selftest

      - name: rsi-descent selftest
        run: python3 tools/rsi-descent/rsi_descent.py --selftest

      - name: boltzmann-collapse selftest
        run: python3 tools/boltzmann-collapse/collapse.py --selftest

      - name: spectral-defocus selftest
        run: python3 tools/spectral-defocus/defocus.py --selftest

      - name: spectral-defocus atomicity admission (asserts recorded negative)
        run: python3 tools/spectral-defocus/defocus.py --admit-null --n-null 50

      - name: injective-mapping selftest
        run: python3 tools/injective-mapping/mapping.py --selftest

      - name: corpus-sonometer selftest
        run: python3 tools/corpus-sonometer/sonometer.py --selftest
      - name: tautology-discerner selftest
        run: python3 tools/tautology-discerner/tautology_discerner.py --selftest

      - name: spectral-decomposer selftest
        run: python3 tools/spectral-decomposer/spectral_decomposer.py --selftest

      - name: phonon-dispersion selftest
        run: python3 tools/phonon-dispersion/phonon.py --selftest

      - name: edge-standard selftest (taste-engine source of record)
        run: python3 tools/edge-standard/edge_standard.py --selftest

      - name: edge-standard fixture parity (Python source of record vs JS worker port)
        run: node --test tools/edge-standard/test_parity_edge.test.js tools/edge-standard/test_e2e_edge.test.js

      - name: spectral-standard selftest (42 gold checks, pure stdlib)
        run: python3 tools/spectral-standard/spectral_standard.py --selftest

      - name: spectral-standard fixture parity (Python source of record vs JS worker port)
        run: node --test tools/spectral-standard/test_parity_spectral.test.js

      - name: spectral-standard centroid-walk parity (Lane E pack, euclidean post-P4)
        run: node --test tools/spectral-standard/test_centroid_parity.test.js

      - name: spectral-standard falsification harness selftest (61 anchored checks, caller-side adapter)
        run: |
          PYTHONPATH=tools/spectral-standard \
            python3 tools/spectral-standard/falsification/harness_spectral.py \
            --module tools/spectral-standard/falsification/harness_adapter.py \
            --selftest

      - name: lens-standard selftest (46 gold checks, powered lens correct loop)
        run: python3 tools/lens-standard/lens_standard.py --selftest

      - name: lens-standard falsification harness selftest (75 gated checks + anchors)
        run: python3 tools/lens-standard/falsification/harness_lens.py --selftest

      - name: lens-standard fixture parity (Python source of record vs JS worker port)
        run: node --test tools/lens-standard/test_parity_lens.test.js

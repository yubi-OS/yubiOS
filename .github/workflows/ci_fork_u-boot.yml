# Component CI adapted from the former yubi-OS/u-boot ci_test.yml. The checkout
# is the immutable current upstream release commit mirrored by the fork;
# fetch-released-tag-ref verifies and refreshes it.
name: ci_fork_u-boot

# Component CI for the yubiOS ARM64 fTPM stack (#35, task C5).
# Builds U-Boot as the BL33 non-secure bootloader for qemu_arm64 (AArch64) with
# the yubiOS fTPM + measured-boot config set layered on top of qemu_arm64_defconfig:
#   CONFIG_TEE / CONFIG_OPTEE            -> OP-TEE driver (BL32 handoff)
#   CONFIG_TPM=y CONFIG_TPM_V2=y         -> TPM 2.0 stack
#   CONFIG_TPM2_FTPM_TEE=y               -> TEE-backed fTPM interface (depends TEE && OPTEE && TPM_V2)
#   CONFIG_EFI_LOADER / EFI_MM_COMM_TEE  -> UEFI + StandaloneMM variable service (depends OPTEE)
#   CONFIG_EFI_TCG2_PROTOCOL=y           -> UEFI measured boot (depends TPM_V2)
#   CONFIG_MEASURED_BOOT=y CONFIG_HASH=y -> non-EFI measured boot (depends HASH && TPM_V2)
# Real BL31 (TF-A) / BL32 (OP-TEE) come from sibling fork CIs; this fork builds
# BL33 alone — do NOT stitch components here (that is the leader-gated INT task).

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build-uboot:
    name: U-Boot BL33 + fTPM/measured-boot (qemu_arm64)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            runner_name: ubuntu-24.04
          - runner: [self-hosted, Linux, ARM64, HIGH-MEM]
            runner_name: self-hosted-linux-arm64-gpu
    runs-on: ${{ matrix.runner }}
    # Bare runner: U-Boot needs a full host + AArch64 cross toolchain. The hardened
    # dhi base image omits crt*.o / libc, so a container build is not used here.

    steps:
      - name: Checkout u-boot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
        with:
          repository: yubi-OS/u-boot
          ref: ece349ade2973e220f524ce59e59711cc919263f # release ref; see PINNED.md

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3 python3-dev python3-pyelftools python3-setuptools \
            device-tree-compiler \
            openssl libssl-dev libgnutls28-dev \
            bison flex bc \
            uuid-dev \
            swig \
            git ca-certificates
          # AArch64 toolchain: cross on amd64, native on the arm64 runner.
          if [ "$(uname -m)" = "x86_64" ]; then
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
            echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          else
            echo "CROSS_COMPILE=" >> "$GITHUB_ENV"
          fi
          aarch64-linux-gnu-gcc --version || gcc --version

      - name: Write yubiOS fTPM + measured-boot config fragment
        run: |
          set -euxo pipefail
          cat > yubios_ftpm.config <<'EOF'
          CONFIG_TEE=y
          CONFIG_OPTEE=y
          CONFIG_TPM=y
          CONFIG_TPM_V2=y
          CONFIG_TPM2_FTPM_TEE=y
          CONFIG_EFI_LOADER=y
          CONFIG_EFI_MM_COMM_TEE=y
          CONFIG_EFI_TCG2_PROTOCOL=y
          CONFIG_HASH=y
          CONFIG_MEASURED_BOOT=y
          # Build the firmware, not U-Boot's own pytest unit tree. qemu_arm64_defconfig
          # ships CONFIG_UNIT_TEST=y, which compiles test/boot/measurement.c; that file
          # references map_to_sysmem() without <mapmem.h> and fails -Werror on AArch64.
          # The fTPM/measured-boot firmware build itself is unaffected.
          # CONFIG_UNIT_TEST is not set
          EOF
          cat yubios_ftpm.config

      - name: Configure (qemu_arm64_defconfig + yubiOS fragment)
        run: |
          set -euxo pipefail
          make CROSS_COMPILE="${CROSS_COMPILE}" ARCH=arm qemu_arm64_defconfig
          # merge_config.sh layers the fragment and warns on any value Kconfig
          # deps refuse to honor (honest signal, not a silent drop).
          ./scripts/kconfig/merge_config.sh -m .config yubios_ftpm.config
          make CROSS_COMPILE="${CROSS_COMPILE}" ARCH=arm olddefconfig

      - name: Verify yubiOS config symbols landed
        run: |
          set -euxo pipefail
          fail=0
          for sym in CONFIG_TEE CONFIG_OPTEE CONFIG_TPM CONFIG_TPM_V2 \
                     CONFIG_TPM2_FTPM_TEE CONFIG_EFI_LOADER CONFIG_EFI_MM_COMM_TEE \
                     CONFIG_EFI_TCG2_PROTOCOL CONFIG_MEASURED_BOOT; do
            if grep -q "^${sym}=y" .config; then
              echo "OK  ${sym}=y"
            else
              echo "MISSING ${sym}"; fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "::error::one or more yubiOS fTPM/measured-boot symbols failed to enable"; exit 1; }

      - name: Build U-Boot (BL33)
        run: |
          set -euxo pipefail
          make -j"$(nproc)" CROSS_COMPILE="${CROSS_COMPILE}" ARCH=arm
          ls -l u-boot u-boot.bin
          test -f u-boot.bin

      - name: Upload U-Boot artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4 — see PINNED.md
        with:
          name: u-boot-qemu_arm64-${{ matrix.runner_name }}
          path: |
            u-boot
            u-boot.bin
            .config
          if-no-files-found: warn
          retention-days: 7

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [build-uboot]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

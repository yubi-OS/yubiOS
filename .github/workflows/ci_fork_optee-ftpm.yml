# Component CI adapted from the former yubi-OS/optee_ftpm ci_test.yml. The
# checkout is an immutable yubiOS extension of the current upstream release;
# fetch-released-tag-ref verifies its release ancestry and exact fetchability.
name: ci_fork_optee_ftpm

# yubiOS fTPM Trusted Application fork CI — task T3 / C3 of #35.
#
# Builds the firmware-TPM 2.0 Trusted Application (Microsoft ms-tpm-20-ref wrapped
# by OP-TEE/optee_ftpm, TA UUID bc50d971-d4c9-42c4-82cb-343fb7f37896) as a 64-bit
# OP-TEE TA against the OP-TEE user-TA dev kit produced by the optee_os fork CI
# (task C2). To keep this CI self-contained and reproducible it rebuilds that dev
# kit inline from the pinned yubi-OS/optee_os source (PLATFORM=vexpress-qemu_armv8a, the same
# CFG_RPMB_FS=y CFG_REE_FS=n CFG_EARLY_TA=y flags C2 proved green) and pins
# ms-tpm-20-ref at the commit optee_ftpm expects.
#
# This ADDS a separate ci_test.yml; the upstream ci.yml / ci-cancel.yml / stales.yml
# are left untouched.
#
# BARE runners (no dhi container): the OP-TEE + TA cross toolchains
# (gcc-aarch64-linux-gnu, gcc-arm-linux-gnueabihf) plus libc/crt*.o are required,
# which the hardened dhi base intentionally omits — same lesson as the optee_os
# (C2) and bcvk Rust CIs. Native multi-arch matrix kept for parity; the aarch64 TA
# cross-compiles cleanly on amd64 and builds native on the arm64 runner.
# Action refs pinned per PINNED.md.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

env:
  FTPM_UUID: bc50d971-d4c9-42c4-82cb-343fb7f37896
  OPTEE_OS_REPO: https://github.com/yubi-OS/optee_os
  OPTEE_OS_REF: 440b10c3f9b1c8501f2550e282ae071bb5424972 # release-descendant ref; see PINNED.md
  MS_TPM_REPO: https://github.com/yubi-OS/ms-tpm-20-ref
  MS_TPM_REF: 98b60a44aba79b15fcce1c0d1e46cf5918400f6a # release ref; see PINNED.md
  OPTEE_PLATFORM: vexpress-qemu_armv8a

jobs:
  build-ftpm-ta:
    name: Build fTPM TA vs OP-TEE devkit (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, HIGH-MEM]
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ${{ github.workflow }}-build-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout optee_ftpm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
        with:
          repository: yubi-OS/optee_ftpm
          ref: 5e09cdbe1bcb1bc3bcf4875ebafb4e1a1154417c # release-descendant ref; see PINNED.md
          path: optee_ftpm

      - name: Install OP-TEE + TA cross toolchains and build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            python3 python3-pip python3-pyelftools python3-cryptography \
            device-tree-compiler bison flex bc uuid-dev libssl-dev openssl \
            build-essential git

      - name: Build OP-TEE TA dev kit (C2 dependency, rebuilt inline)
        run: |
          set -eu
          git init -q optee_os
          git -C optee_os remote add origin "$OPTEE_OS_REPO"
          git -C optee_os fetch --depth 1 origin "$OPTEE_OS_REF"
          git -C optee_os checkout --detach FETCH_HEAD
          make -C optee_os -j"$(nproc)" \
            PLATFORM="$OPTEE_PLATFORM" \
            CROSS_COMPILE64=aarch64-linux-gnu- \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            CFG_RPMB_FS=y \
            CFG_REE_FS=n \
            CFG_EARLY_TA=y \
            ta_dev_kit
          devkit=$(find "$GITHUB_WORKSPACE/optee_os/out" -type d -name 'export-ta_arm64' -print -quit)
          if [ -z "$devkit" ] || [ ! -f "$devkit/mk/ta_dev_kit.mk" ]; then
            echo "TA dev kit (export-ta_arm64) not produced"; find "$GITHUB_WORKSPACE/optee_os/out" -name ta_dev_kit.mk || true; exit 1
          fi
          echo "OK  TA dev kit -> $devkit"
          echo "TA_DEV_KIT_DIR=$devkit" >> "$GITHUB_ENV"

      - name: Fetch ms-tpm-20-ref (pinned)
        run: |
          set -eu
          git clone --no-tags "$MS_TPM_REPO" ms-tpm-20-ref
          git -C ms-tpm-20-ref checkout "$MS_TPM_REF"
          test -d "$GITHUB_WORKSPACE/ms-tpm-20-ref/TPMCmd/tpm/src" || { echo "ms-tpm-20-ref source layout unexpected"; exit 1; }
          echo "CFG_MS_TPM_20_REF=$GITHUB_WORKSPACE/ms-tpm-20-ref" >> "$GITHUB_ENV"

      - name: Build fTPM Trusted Application (64-bit TA)
        run: |
          set -eu
          make -C optee_ftpm -j"$(nproc)" \
            TA_DEV_KIT_DIR="$TA_DEV_KIT_DIR" \
            CFG_MS_TPM_20_REF="$CFG_MS_TPM_20_REF" \
            CROSS_COMPILE_ta_arm64=aarch64-linux-gnu- \
            CFG_ARM64_ta_arm64=y

      - name: Verify fTPM TA artifacts (${UUID}.stripped.elf)
        run: |
          set -eu
          fail=0
          stripped=$(find optee_ftpm -name "${FTPM_UUID}.stripped.elf" -print -quit 2>/dev/null || true)
          if [ -n "$stripped" ]; then
            echo "OK  ${FTPM_UUID}.stripped.elf -> $stripped"
            file "$stripped" || true
          else
            echo "MISSING  ${FTPM_UUID}.stripped.elf"; fail=1
          fi
          for extra in "${FTPM_UUID}.elf" "${FTPM_UUID}.ta"; do
            found=$(find optee_ftpm -name "$extra" -print -quit 2>/dev/null || true)
            [ -n "$found" ] && echo "OK  $extra -> $found" || echo "note: $extra not present (non-gating)"
          done
          exit $fail

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [build-ftpm-ta]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

name: phonon-followups

on:
  push:
    branches: ['phonon-followups-*']
    paths:
      - 'papers/scripts/phonon_followups.py'
      - '.github/workflows/phonon-followups.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run is being executed'
        required: false
        default: 'manual phonon follow-ups run'

jobs:
  followups:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install numpy
        run: python3 -m pip install --quiet numpy

      - name: Execute the five phonon-bridge follow-ups
        run: python3 papers/scripts/phonon_followups.py --only-5b

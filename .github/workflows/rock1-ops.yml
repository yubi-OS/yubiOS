name: rock1-ops
on:
  workflow_dispatch:
    inputs:
      script_b64:
        description: base64 bash script to run on rock1
        required: true
        type: string
jobs:
  ops:
    runs-on: [self-hosted, Linux, ARM64, KVM]
    timeout-minutes: 120
    steps:
      - name: run ops script on rock1
        env:
          SCRIPT_B64: ${{ inputs.script_b64 }}
        run: |
          echo "$SCRIPT_B64" | base64 -d > /tmp/ops.sh
          sudo -n bash /tmp/ops.sh

name: ci_token-audit
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/audit-workflow-tokens.py'
      - 'scripts/audit-workflow-tokens.allowlist.yaml'
  schedule:
    # Weekly Monday 9 AM UTC drift scan on main
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      fail_on:
        type: choice
        description: 'Exit non-zero threshold'
        options:
          - ERROR
          - WARN
          - INFO
          - NEVER
        default: ERROR

permissions:
  contents: read

jobs:
  audit:
    name: Audit workflow token scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run audit
        run: |
          python3 scripts/audit-workflow-tokens.py \
            --repo-root . \
            --secrets-config scripts/audit-workflow-tokens.allowlist.yaml \
            --offline \
            --output-format json \
            --fail-on "${{ inputs.fail_on || 'ERROR' }}" \
            > audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-audit-report-${{ github.run_id }}
          path: audit-report.json
          retention-days: 30

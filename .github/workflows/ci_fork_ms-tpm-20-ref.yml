# Component CI adapted from the former yubi-OS/ms-tpm-20-ref ci_test.yml. The
# checkout is the immutable current upstream release commit mirrored by the
# fork; fetch-released-tag-ref verifies and refreshes it.
name: ci_fork_ms-tpm-20-ref

# Component CI for the yubiOS ARM64 fTPM stack (#35, task C4).
# Builds the Microsoft TPM 2.0 reference (ms-tpm-20-ref) — the TPM 2.0 reference
# implementation that OP-TEE/optee_ftpm wraps as the fTPM Trusted Application.
# Builds the TPMCmd autotools tree (OpenSSL libcrypto backend, TpmBigNum math)
# for AArch64:
#   - ubuntu-24.04      : cross-compile with the aarch64-linux-gnu toolchain
#                         (+ arm64 OpenSSL dev for libcrypto.pc)
#   - ubuntu-24.04-arm  : native aarch64 build, then smoke-start the simulator
# Output: bin_PROGRAMS tpm2-simulator + noinst libtpm.a / libplatform.a.
# This is a SEPARATE workflow — it does NOT edit the upstream run-tests /
# docker-check / docker-publish workflows. Bare runners: TPMCmd needs a full
# host + cross toolchain; the hardened dhi base omits crt*.o / libc.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual'
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build-ms-tpm-20-ref:
    name: ms-tpm-20-ref TPM 2.0 reference (aarch64)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            runner_name: ubuntu-24.04
          - runner: ubuntu-24.04-arm
            runner_name: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout ms-tpm-20-ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
        with:
          repository: yubi-OS/ms-tpm-20-ref
          ref: ee21db0a941decd3cac67925ea3310873af60ab3 # release ref; see PINNED.md

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          # autoconf-archive provides AX_PTHREAD (used in configure.ac);
          # pkg-config + libssl-dev provide libcrypto.pc for PKG_CHECK_MODULES.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool autoconf-archive \
            pkg-config libssl-dev \
            git ca-certificates
          if [ "$(uname -m)" = "x86_64" ]; then
            # Cross to aarch64: add the arm64 toolchain and arm64 OpenSSL dev so
            # the cross libcrypto.pc + libcrypto.so resolve. The 24.04 (noble)
            # runner's default sources are amd64-only, so pin them to amd64 and
            # add a ports.ubuntu.com source for arm64.
            sudo dpkg --add-architecture arm64
            sudo sed -i 's|^Signed-By:|Architectures: amd64\nSigned-By:|' /etc/apt/sources.list.d/ubuntu.sources
            sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              crossbuild-essential-arm64 libssl-dev:arm64
            echo "CONFIGURE_HOST=--host=aarch64-linux-gnu" >> "$GITHUB_ENV"
            echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            # Point pkg-config at the arm64 .pc tree for the cross build.
            echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          else
            echo "CONFIGURE_HOST=" >> "$GITHUB_ENV"
            echo "CC=gcc" >> "$GITHUB_ENV"
          fi

      - name: Bootstrap + configure (TPMCmd)
        run: |
          set -euxo pipefail
          cd TPMCmd
          ./bootstrap
          ./configure ${CONFIGURE_HOST} CC="${CC}"

      - name: Build the TPM 2.0 reference (tpm2-simulator + libtpm)
        run: |
          set -euxo pipefail
          cd TPMCmd
          make -j"$(nproc)"
          file Simulator/src/tpm2-simulator
          file Simulator/src/tpm2-simulator | grep -q 'ARM aarch64'
          ls -l Simulator/src/tpm2-simulator

      - name: Smoke-start the simulator (native arm64 only)
        if: runner.arch == 'ARM64'
        run: |
          set -euxo pipefail
          cd TPMCmd
          # The simulator listens on a TCP control/command port pair and blocks;
          # start it, confirm it comes up, then stop it. A clean start proves the
          # OpenSSL-backed reference links and initialises on aarch64.
          ./Simulator/src/tpm2-simulator 2321 &
          SIM_PID=$!
          sleep 3
          kill "$SIM_PID" 2>/dev/null || true
          wait "$SIM_PID" 2>/dev/null || true
          echo "simulator started + stopped cleanly"

      - name: Upload reference build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — see PINNED.md
        with:
          name: ms-tpm-20-ref-${{ matrix.runner_name }}
          path: |
            TPMCmd/Simulator/src/tpm2-simulator
            TPMCmd/*.a
            TPMCmd/Simulator/src/*.a
          if-no-files-found: warn
          retention-days: 7

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [build-ms-tpm-20-ref]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

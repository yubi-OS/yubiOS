name: TEST - composefs digest matrix

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference under test (digest-pinned, arm64)"
        type: string
        required: false
        default: "docker.io/0mniteck/yubios@sha256:d7e662449bd853d26627971c495789ef6c2721410f4149aec6f09aedd2cb4858"

permissions:
  contents: read

concurrency:
  group: "composefs-matrix-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run composefs digest matrix
        shell: bash -euo pipefail {0}
        env:
          IMAGE: ${{ inputs.image }}
        run: bash tools/composefs-matrix/matrix.sh

      - name: Upload matrix results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composefs-matrix-results
          if-no-files-found: warn
          path: |
            matrix-out/results.jsonl
            matrix-out/baseline.json
            matrix-out/summary.md

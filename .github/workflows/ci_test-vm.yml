name: yubiOS VM e2e (tests/vm)

# T7 / V1 -- wire tests/vm/*.sh into a RUNNING workflow.
#
# Two scripts live in tests/vm/:
#   * test-luks-fido2-ci.sh  -- hardware-FREE e2e: drives `bcvk ephemeral run
#     --swtpm --swu2f` (pinned bcvk release descendant) and runs assertions
#     in-guest. It is deliberately skip-tolerant: pam-u2f + swtpm legs run; the
#     LUKS2-FIDO2 + homed-FIDO2 legs SKIP (not fail) unless a CTAP2 hmac-secret
#     authenticator (swu2f Layer 2, shipped only in the mkosi --profile test
#     image) is present.
#   * test-luks-fido2.sh     -- hardware e2e: needs a PHYSICAL YubiKey + a spare
#     block device + root. Never executed in CI (it flashes a disk); lint-only.
#
# Honest CI contract: this workflow lints both scripts for real, provisions and
# verifies the real bcvk dependency, and EXECUTES test-luks-fido2-ci.sh when a
# yubiOS image is available. When no image is available on a hosted runner, the
# VM boot + CTAP2 legs are SKIPPED *explicitly and loudly* -- never a silent pass.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Pullable yubiOS OCI image ref (or local path) to boot for the full e2e. Leave blank to skip the VM boot leg.'
        required: true
        default: 'docker.io/0mniteck/yubios:dev'
        type: string
      hw_device:
        description: 'DESTRUCTIVE: spare block device path (e.g. /dev/sdb) on the self-hosted rock1 runner for the physical-YubiKey hardware test (tests/vm/test-luks-fido2.sh). Wipes this device. Leave blank (default) to skip -- this never runs on push, only on an explicit dispatch with this set.'
        required: false
        default: ''
        type: string
      hw_image:
        description: 'yubiOS OCI image ref for the hardware YubiKey passthrough test (defaults to the same image input above).'
        required: false
        default: ''
        type: string
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      firmware_image:
        description: 'OCI ref of the published yubiOS firmware bundle to source flash.bin from (ci_firmware-rk.yml Stage 4 output). The fTPM lives in this firmware, not in the yubiOS OS image.'
        required: false
        default: 'docker.io/0mniteck/yubios:firmware-qemu-arm64'
        type: string
      ftpm_linux_payload:
        description: 'Also run fTPM Stage B: bcvk to-disk the yubiOS image and boot it under the fTPM firmware to prove the guest kernel binds tpm_ftpm_tee. Slow (TCG) and unproven; off by default.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string
      allow_real_u2f:
        description: 'Pass ALLOW_REAL_U2F=1 to the passless CI tests (test-luks-fido2-ci.sh, test-fido2-enrollment.sh). Required on the arm64 self-hosted rock1 runner because that runner has a physical YubiKey attached for the DESTRUCTIVE test (tests/vm/test-luks-fido2.sh). PR #144 real-U2F guard correctly refuses to silently run passless tests when a real key is on the host (otherwise a passless regression would be masked by the in-guest software authenticator losing the enumeration race to the real key) -- so CI must explicitly opt in. Default false; set true on any dispatch that runs on rock1.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  # -- Real gate: shell syntax + shellcheck on every tests/vm script. --
  lint-vm-scripts:
    runs-on: ubuntu-24.04
    container:
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:94571f3dc07fbc7166f6f1cbf1fe068a7647198ee2554e6b90d59a68cc8b053c # trixie-debian13-dev INDEX (manifest list)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md
      - name: shellcheck + bash -n on tests/vm/*.sh
        run: |
          apt-get update -qq
          apt-get install -y -qq shellcheck bash
          fail=0
          for s in tests/vm/*.sh; do
            echo "== $s =="
            bash -n "$s" || { echo "::error::bash -n failed: $s"; fail=1; }
            shellcheck -S warning "$s" || { echo "::error::shellcheck failed: $s"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Run OMN-162 negative & channel-isolation VM test scripts
        run: |
          set -euo pipefail
          apt-get install -y -qq --no-install-recommends python3 openssl
          chmod +x tests/vm/test-secure-boot-tamper.sh tests/vm/test-oci-tag-channel.sh tests/vm/test-bcvk-passthrough.sh tests/vm/test-policy-rejection.sh
          ./tests/vm/test-secure-boot-tamper.sh --self-test
          ./tests/vm/test-oci-tag-channel.sh --self-test
          ./tests/vm/test-bcvk-passthrough.sh --verify-args
          ./tests/vm/test-policy-rejection.sh

  # -- VM e2e: native matrix, bare runner (full host toolchain: cargo + qemu + --
  #    KVM). Hardened dhi base omits crt*.o/libc, so bcvk's cargo build needs the
  #    bare runner (same lesson as the bcvk Rust CI). fail-fast:false for parity.
  vm-e2e:
    needs: lint-vm-scripts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemu_pkgs: qemu-system-x86 ovmf
            primary: false
          - arch: arm64
            # Self-hosted ARM64 board (runner "rock1", labels self-hosted+Linux+ARM64+KVM) --
            # real hardware with actual KVM support, unblocking the boot leg that hosted
            # self-hosted ARM64 GPU runners can't run (no nested virt, see the KVM gate below).
            runner: [self-hosted, Linux, ARM64, KVM]
            qemu_pkgs: qemu-system-arm qemu-efi-aarch64
            primary: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Reclaim workspace before checkout (self-hosted rock1 can accumulate root-owned files from sudo-run test scripts)
        run: |
          # actions/checkout's own cleanup runs as the unprivileged runner user and
          # cannot remove root-owned leftovers (e.g. tests/vm/test-ftpm-qemu-ci.sh's
          # old WORK dir, before it moved to /tmp) -- when that happens it silently
          # falls back to a STALE pre-checkout tree with no error banner, which is
          # exactly what runs 30180564384/30180564430 hit. Wipe the workspace with
          # sudo before checkout ever runs, every time, so this can't recur.
          sudo rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Free disk space (self-hosted rock1 persists disk across runs -- unlike hosted runners)
        if: matrix.arch == 'arm64'
        run: |
          df -h "$PWD" / /mnt/extended || true
          if mountpoint -q /mnt/extended && ! mountpoint -q /var/lib/containers; then
            echo "--- bind-mounting /mnt/extended/containers onto /var/lib/containers so podman uses the 117G extended disk ---"
            sudo mkdir -p /mnt/extended/containers /var/lib/containers
            sudo mount --bind /mnt/extended/containers /var/lib/containers
          fi
          if mountpoint -q /mnt/extended && ! mountpoint -q /var/tmp; then
            echo "--- bind-mounting /mnt/extended/var-tmp onto /var/tmp so podman/bootc temp layers never hit the 12G root disk ---"
            sudo rm -rf /var/tmp/container_images_storage* /var/tmp/pipeDir* 2>/dev/null || true
            sudo mkdir -p /mnt/extended/var-tmp /var/tmp
            sudo chmod 1777 /mnt/extended/var-tmp
            sudo mount --bind /mnt/extended/var-tmp /var/tmp
          fi
          sudo rm -rf /var/tmp/container_images_storage* /var/tmp/pipeDir* 2>/dev/null || true
          echo "--- removing stray containers and dangling untagged layers (preserving cached images) ---"
          sudo podman ps -aq | xargs -r sudo podman rm -f -t 0 || true
          sudo podman image prune -f || true
          sudo docker rm -f $(sudo docker ps -aq) 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          sudo journalctl --vacuum-size=100M 2>/dev/null || true
          echo "--- removing leftover bcvk-src clone + cargo target from a prior run ---"
          sudo rm -rf /opt/bcvk-src || true
          echo "--- cleaning apt cache ---"
          sudo apt-get clean || true
          df -h "$PWD" / /var/tmp /var/lib/containers || true

      - name: Install host deps (swtpm + qemu + fido2 + cryptsetup)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            swtpm swtpm-tools qemu-utils ${{ matrix.qemu_pkgs }} \
            fido2-tools cryptsetup-bin git build-essential pkg-config libssl-dev virtiofsd \
            apparmor-utils util-linux
          # GH runners ship /dev/kvm root:kvm 0660 -- the runner user (and
          # root-in-rootless-podman) can't open it. Documented GH recipe:
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || true
          # virtiofsd needs /dev/fuse; GH Actions ubuntu-24.04 runners don't
          # guarantee the fuse module is loaded / device node present. A
          # missing /dev/fuse is a plausible cause of virtiofsd's silent
          # rc=2 (empty stdout+stderr+logfile) seen in prior runs -- FUSE
          # device-open failures in some Rust FUSE crates exit before their
          # own logger initializes.
          sudo modprobe fuse || true
          sudo mkdir -p /dev
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229 || true
          sudo chmod 666 /dev/fuse || true
          ls -la /dev/fuse || echo "::warning::/dev/fuse still absent after modprobe+mknod"

      - name: Install zstd-capable QEMU for ARM64 DirectBoot
        id: qemu-zstd
        if: matrix.arch == 'arm64'
        env:
          # B-QEMU-ZBOOT (OMN-39 / OMN-59 / OMN-60). Version-gated, self-verifying
          # workaround. Contract + removal recipe:
          # refs/qemu-zboot-version-gate-audit-2026-11-12.md
          QEMU_ZSTD_COMMIT: 4fc49f46dc95d4a27de2509e7fceb2931e91faeb # qemu/qemu v11.1.2, see PINNED.md
          QEMU_ZSTD_VERSION: '11.1.2'
          QEMU_ZBOOT_FLOOR: '11.0'
          QEMU_ZBOOT_PROBE_SECS: '5'
          YUBIOS_IMAGE: ${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}
          SUMMARY_LABEL: 'vm-e2e (arm64)'
        run: |
          set -euo pipefail
          # Fedora ARM64 vmlinuz is an EFI zboot PE ("zimg" magic at offset 4,
          # "zstd" compression tag at offset 24). QEMU learned to DirectBoot
          # zstd zboot in the 11.0 line (hw/loader: Add support for zboot
          # images compressed with zstd). Older distro QEMU links libzstd for
          # qcow2/multifd but its zboot loader still rejects the image with
          # 'unable to handle EFI zboot image with "zstd" compression'.
          # 2026-11-12 audit: rock1 Ubuntu 26.04.1 ships qemu-system-arm
          # 1:10.2.1+ds-1ubuntu3.3, which fails that probe; the pinned v11.1.2
          # build reaches "Booting Linux" on the same kernel.
          #
          # Contract, evaluated on every run:
          #   1. Log runner OS + stock QEMU (RUNNER_QEMU_VERSION).
          #   2. Stock "claims support" only if version >= QEMU_ZBOOT_FLOOR AND
          #      it links libzstd. Only then run the non-KVM DirectBoot probe.
          #   3. Probe pass => REMOVAL CONDITION MET (notice only; the pinned
          #      build stays active until a deliberate removal PR).
          #   4. Otherwise activate the pinned build, with a stale-cache guard
          #      (version + libzstd linkage) and a post-activation probe.
          QEMU_PREFIX=/opt/qemu-zstd/${QEMU_ZSTD_COMMIT}
          QEMU_SRC=/opt/qemu-zstd-src
          PINNED_QEMU="${QEMU_PREFIX}/bin/qemu-system-aarch64"
          STOCK_QEMU=/usr/bin/qemu-system-aarch64
          WORK="$(mktemp -d)"
          trap 'sudo podman image unmount "${YUBIOS_IMAGE}" >/dev/null 2>&1 || true; rm -rf "${WORK}"' EXIT
          summary() { echo "### ${SUMMARY_LABEL} -- $*" >> "$GITHUB_STEP_SUMMARY"; }
          version_ge() { [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          qemu_ver() { { "$1" --version 2>/dev/null || true; } | sed -n '1s/^QEMU emulator version \([0-9][0-9.]*\).*/\1/p'; }
          # No `ldd | grep -q`: under pipefail an early grep exit can SIGPIPE ldd.
          links_zstd() { case "$(ldd "$1" 2>/dev/null || true)" in *libzstd.so*) return 0 ;; esac; return 1; }

          # 1. Runner identity + stock QEMU.
          RUNNER_OS_DESC="$(lsb_release -ds 2>/dev/null || (. /etc/os-release && echo "${PRETTY_NAME:-unknown}"))"
          RUNNER_QEMU_PKG="$(dpkg-query -W -f='${Version}' qemu-system-arm 2>/dev/null || echo n/a)"
          if [ -x "${STOCK_QEMU}" ]; then
            RUNNER_QEMU_VERSION="$(qemu_ver "${STOCK_QEMU}")"
            RUNNER_QEMU_VERSION="${RUNNER_QEMU_VERSION:-unknown}"
            if links_zstd "${STOCK_QEMU}"; then STOCK_ZSTD=yes; else STOCK_ZSTD=no; fi
          else
            RUNNER_QEMU_VERSION=absent
            STOCK_ZSTD=no
          fi
          echo "RUNNER_OS=${RUNNER_OS_DESC} ($(uname -srm))"
          echo "RUNNER_QEMU_VERSION=${RUNNER_QEMU_VERSION} (package qemu-system-arm ${RUNNER_QEMU_PKG}, libzstd linked: ${STOCK_ZSTD})"
          echo "runner_qemu_version=${RUNNER_QEMU_VERSION}" >> "$GITHUB_OUTPUT"
          summary "INFO: runner ${RUNNER_OS_DESC}, stock qemu-system-aarch64 ${RUNNER_QEMU_VERSION} (pkg ${RUNNER_QEMU_PKG})"

          # Kernel under test: pull vmlinuz from the image if it is already in
          # local podman storage (rock1 keeps it between runs). No pull here.
          KERNEL=""
          if sudo podman image exists "${YUBIOS_IMAGE}" 2>/dev/null; then
            MP="$(sudo podman image mount "${YUBIOS_IMAGE}" 2>/dev/null || true)"
            if [ -n "${MP}" ]; then
              for k in "${MP}"/usr/lib/modules/*/vmlinuz; do
                [ -f "$k" ] || continue
                sudo cp "$k" "${WORK}/vmlinuz"
                sudo chmod 0644 "${WORK}/vmlinuz"
                KERNEL="${WORK}/vmlinuz"
                echo "Kernel: ${k#"${MP}"} from ${YUBIOS_IMAGE}"
                break
              done
              sudo podman image unmount "${YUBIOS_IMAGE}" >/dev/null 2>&1 || true
            fi
          fi
          KERNEL_FMT=unknown
          if [ -n "${KERNEL}" ]; then
            MAGIC="$(dd if="${KERNEL}" bs=1 skip=4 count=4 2>/dev/null | tr -d '\0')"
            COMP="$(dd if="${KERNEL}" bs=1 skip=24 count=8 2>/dev/null | tr -d '\0')"
            if [ "${MAGIC}" = "zimg" ]; then KERNEL_FMT="efi-zboot-${COMP:-unknown}"; else KERNEL_FMT=raw-or-other; fi
            echo "Kernel format: ${KERNEL_FMT} ($(file -b "${KERNEL}" 2>/dev/null || echo 'file(1) unavailable'))"
          else
            echo "::notice::${YUBIOS_IMAGE} not in local podman storage yet; DirectBoot probes skipped this run"
          fi
          echo "kernel_format=${KERNEL_FMT}" >> "$GITHUB_OUTPUT"

          # Non-KVM DirectBoot probe: pass iff the guest kernel prints its banner.
          directboot_probe() {
            local q="$1" log="${WORK}/probe-$2.log" rc=0
            timeout "${QEMU_ZBOOT_PROBE_SECS}" "$q" ${3:-} -machine virt -cpu cortex-a57 -m 512M \
              -nographic -no-reboot -kernel "${KERNEL}" \
              -append "console=ttyAMA0 earlycon panic=-1" > "${log}" 2>&1 || rc=$?
            echo "probe[$2]: rc=${rc} (124 = still running at timeout, expected on success)"
            grep -m3 -E 'Booting Linux|zboot|qemu-system-aarch64:' "${log}" || true
            grep -q 'Booting Linux on physical CPU' "${log}"
          }

          # 2 + 3. Version gate and removal condition.
          REMOVAL_MET=false
          if [ "${RUNNER_QEMU_VERSION}" != absent ] && [ "${RUNNER_QEMU_VERSION}" != unknown ] \
             && version_ge "${RUNNER_QEMU_VERSION}" "${QEMU_ZBOOT_FLOOR}" && [ "${STOCK_ZSTD}" = yes ]; then
            echo "Stock QEMU ${RUNNER_QEMU_VERSION} >= ${QEMU_ZBOOT_FLOOR} and links libzstd; probing native zstd EFI zboot DirectBoot"
            if [ -z "${KERNEL}" ]; then
              echo "::warning::REMOVAL CONDITION UNVERIFIED: stock QEMU ${RUNNER_QEMU_VERSION} claims support but no zboot kernel was available to probe"
              summary "WARN: removal condition unverified (no kernel to probe)"
            elif directboot_probe "${STOCK_QEMU}" stock; then
              REMOVAL_MET=true
              echo "::notice::REMOVAL CONDITION MET: stock runner QEMU ${RUNNER_QEMU_VERSION} natively boots ARM64 zstd EFI zboot"
              echo "Removal procedure: refs/qemu-zboot-version-gate-audit-2026-11-12.md section 'Removal verification recipe'. Pinned build stays active until that PR lands."
              summary "NOTICE: REMOVAL CONDITION MET, stock QEMU ${RUNNER_QEMU_VERSION} boots ${KERNEL_FMT}; open the B-QEMU-ZBOOT removal PR"
            else
              echo "::warning::Stock QEMU ${RUNNER_QEMU_VERSION} meets the version floor but FAILED the zstd EFI zboot DirectBoot probe; keeping pinned workaround"
              summary "WARN: stock QEMU ${RUNNER_QEMU_VERSION} >= floor but failed DirectBoot probe"
            fi
          else
            echo "Stock QEMU ${RUNNER_QEMU_VERSION} < ${QEMU_ZBOOT_FLOOR} (lacks upstream ARM64 zstd EFI zboot DirectBoot loader); activating pinned QEMU workaround @ ${QEMU_ZSTD_COMMIT}"
          fi
          echo "removal_condition_met=${REMOVAL_MET}" >> "$GITHUB_OUTPUT"

          # 4. Pinned build with stale-cache guard.
          if [ -x "${PINNED_QEMU}" ]; then
            CACHED_VER="$(qemu_ver "${PINNED_QEMU}" || true)"
            if [ "${CACHED_VER}" != "${QEMU_ZSTD_VERSION}" ] || ! links_zstd "${PINNED_QEMU}"; then
              echo "::warning::Stale qemu-zstd cache at ${QEMU_PREFIX} (version '${CACHED_VER:-?}', want ${QEMU_ZSTD_VERSION}; libzstd linkage required); purging and rebuilding"
              sudo rm -rf "${QEMU_PREFIX}"
            else
              echo "qemu-zstd cache HIT: ${PINNED_QEMU} (${CACHED_VER}, libzstd linked)"
            fi
          fi
          if [ ! -x "${PINNED_QEMU}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              ninja-build python3-venv python3-pip meson pkg-config \
              libglib2.0-dev libpixman-1-dev zlib1g-dev libzstd-dev \
              libslirp-dev libusb-1.0-0-dev libudev-dev libaio-dev \
              libcap-ng-dev libattr1-dev
            sudo rm -rf "${QEMU_SRC}"
            sudo mkdir -p "${QEMU_SRC}"
            sudo chown "$(id -u):$(id -g)" "${QEMU_SRC}"
            git clone --filter=blob:none --depth 1 \
              https://github.com/qemu/qemu.git "${QEMU_SRC}"
            git -C "${QEMU_SRC}" fetch --depth 1 origin "${QEMU_ZSTD_COMMIT}"
            git -C "${QEMU_SRC}" checkout --detach "${QEMU_ZSTD_COMMIT}"
            (
              cd "${QEMU_SRC}"
              ./configure \
                --prefix="${QEMU_PREFIX}" \
                --target-list=aarch64-softmmu \
                --enable-zstd \
                --disable-docs \
                --disable-werror
              ninja -C build qemu-system-aarch64
              sudo ninja -C build install
            )
            sudo rm -rf "${QEMU_SRC}"
          fi
          if ! links_zstd "${PINNED_QEMU}"; then
            echo "::error::${PINNED_QEMU} is not linked against libzstd; zstd EFI zboot DirectBoot cannot work"
            exit 1
          fi
          PINNED_VER="$(qemu_ver "${PINNED_QEMU}")"
          if [ "${PINNED_VER}" != "${QEMU_ZSTD_VERSION}" ]; then
            echo "::error::${PINNED_QEMU} reports ${PINNED_VER:-?}, expected ${QEMU_ZSTD_VERSION} for ${QEMU_ZSTD_COMMIT}"
            exit 1
          fi
          if [ -n "${KERNEL}" ] && [ "${KERNEL_FMT}" = efi-zboot-zstd ]; then
            if ! directboot_probe "${PINNED_QEMU}" pinned "-L ${QEMU_PREFIX}/share/qemu"; then
              echo "::error::pinned QEMU ${PINNED_VER} @ ${QEMU_ZSTD_COMMIT} failed the zstd EFI zboot DirectBoot probe"
              exit 1
            fi
          fi
          sudo mkdir -p "${QEMU_PREFIX}/bcvk-bin"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec /run/host-mounts/host-lib/ld-linux-aarch64.so.1 --library-path /run/host-mounts/qemu-zstd/lib:/run/host-mounts/host-lib:/run/host-mounts/host-usrlib /run/host-mounts/qemu-zstd/bin/qemu-system-aarch64 -L /run/host-mounts/qemu-zstd/share/qemu "$@"' | sudo tee "${QEMU_PREFIX}/bcvk-bin/qemu-system-aarch64" >/dev/null
          sudo chmod 0755 "${QEMU_PREFIX}/bcvk-bin/qemu-system-aarch64"
          "${PINNED_QEMU}" --version
          echo "${QEMU_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "qemu_prefix=${QEMU_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "qemu_source=pinned" >> "$GITHUB_OUTPUT"
          summary "INFO: using pinned zstd-capable QEMU ${PINNED_VER} @ ${QEMU_ZSTD_COMMIT} (stock ${RUNNER_QEMU_VERSION}, removal_condition_met=${REMOVAL_MET})"

      - name: Disk space before bcvk build (diagnostic)
        run: |
          df -h "$PWD" /tmp || true
          echo "--- inode usage ---"
          df -i "$PWD" /tmp || true

      - name: Free disk space (pre-build -- kill stray containers from an aborted prior run)
        run: |
          sudo podman ps -aq | xargs -r sudo podman rm -f || true
          sudo podman image prune -f || true
          df -h "$PWD" || true

      - name: Install bcvk @ pinned release (source-build fallback, feasibility gate)
        id: bcvk
        run: |
          set +e
          # OMN-107: default to the prebuilt yubi-OS/bcvk release binary for this
          # arch, verified against the PINNED.md checksums (seconds on a fresh
          # hosted runner instead of a multi-minute cargo build). The source build
          # below stays as the automatic fallback when the download or checksum
          # verify fails, or when BCVK_PIN is moved off BCVK_RELEASE_COMMIT.
          BCVK_PIN=c9c06416c943d5ff956bc811f09aec0ce25bfdc7 # yubios v0.22.0 merge + baked CI patches (ARM64 DirectBoot SSH karg, --privileged, ed25519); see PINNED.md
          BCVK_RELEASE_TAG=v0.22.0-yubios.1
          BCVK_RELEASE_COMMIT=c9c06416c943d5ff956bc811f09aec0ce25bfdc7
          case "${{ matrix.arch }}" in
            amd64)
              BCVK_SHA256=0d87d074ccf43a559aa1cefc2c12eed049bbf547cd9da7212ea971395939ef36
              BCVK_SHA512=b24091a828373ac7fb214626596fac39b88b115f3be34b441800099e3e5965be5b60964e5393675d7a65732ddd4a7bea8ddd198396eb308d2e90108af2e088a6 ;;
            arm64)
              BCVK_SHA256=c6c0ce386b3203ae10829060455754244336301ea256357c49cc6abe4731e1fe
              BCVK_SHA512=a4c1c31eb31302f0eaf0c7e403868d348488652c165531903e74960ea7fff6fd78936f776516461f17ac452a75a78daf26196a13a4f3803203cfc6c14cf23d43 ;;
            *) BCVK_SHA256=""; BCVK_SHA512="" ;;
          esac
          BCVK_REF="$BCVK_PIN"
          # rock1 is self-hosted and persistent -- cache the built binary under
          # /opt keyed by the pinned commit, same pattern as qemu-zstd above.
          BCVK_PREFIX="/opt/bcvk/${BCVK_PIN}" # cache keyed by the pinned commit; a new pin re-downloads or rebuilds
          BCVK_SRC=/opt/bcvk-src
          if [ -x "${BCVK_PREFIX}/bin/bcvk" ]; then
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "${BCVK_PREFIX}/bin" >> "$GITHUB_PATH"
            echo "### vm-e2e (${{ matrix.arch }}) -- INFO: bcvk cache HIT at ${BCVK_PREFIX}, build skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$BCVK_PIN" = "$BCVK_RELEASE_COMMIT" ] && [ -n "$BCVK_SHA256" ]; then
            BCVK_DL="$(mktemp -d)"
            if curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 -o "$BCVK_DL/bcvk" \
                 "https://github.com/yubi-OS/bcvk/releases/download/${BCVK_RELEASE_TAG}/bcvk-${{ matrix.arch }}" \
               && echo "${BCVK_SHA256}  ${BCVK_DL}/bcvk" | sha256sum --check --strict \
               && echo "${BCVK_SHA512}  ${BCVK_DL}/bcvk" | sha512sum --check --strict \
               && chmod 0755 "$BCVK_DL/bcvk" \
               && "$BCVK_DL/bcvk" --help >/dev/null; then
              sudo mkdir -p "${BCVK_PREFIX}/bin"
              sudo install -m 0755 "$BCVK_DL/bcvk" "${BCVK_PREFIX}/bin/bcvk"
              rm -rf "$BCVK_DL"
              echo "${BCVK_PREFIX}/bin" >> "$GITHUB_PATH"
              echo "skip=0" >> "$GITHUB_OUTPUT"
              echo "### vm-e2e (${{ matrix.arch }}) -- INFO: bcvk ${BCVK_RELEASE_TAG} release binary verified (sha256 ${BCVK_SHA256}) and cached at ${BCVK_PREFIX}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            rm -rf "$BCVK_DL"
            echo "::warning::bcvk ${BCVK_RELEASE_TAG} release download or checksum verify failed -- falling back to the pinned source build"
          fi
          sudo rm -rf "$BCVK_SRC"
          sudo mkdir -p "$BCVK_SRC"
          sudo chown "$(id -u):$(id -g)" "$BCVK_SRC"
          git init -q "$BCVK_SRC" &&
            git -C "$BCVK_SRC" remote add origin https://github.com/yubi-OS/bcvk &&
            git -C "$BCVK_SRC" fetch --depth 1 origin "$BCVK_REF" &&
            git -C "$BCVK_SRC" checkout --detach FETCH_HEAD
          bcvk_fetch_rc=$?
          if [ "$bcvk_fetch_rc" -ne 0 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: could not fetch pinned yubi-OS/bcvk source -- VM e2e not feasible on this runner"
            echo "### vm-e2e (${{ matrix.arch }}) -- SKIP: bcvk source unavailable" >> "$GITHUB_STEP_SUMMARY"
            sudo rm -rf "$BCVK_SRC"
            exit 0
          fi
          if ! grep -Fq -- 'cmd.arg("--privileged")' "$BCVK_SRC/crates/kit/src/run_ephemeral.rs"; then
            perl -0pi -e 's/(    cmd\.args\(\[\n        \/\/ Needed to create nested containers)/    cmd.arg("--privileged");\n    \/\/ Ubuntu rootful Podman needs the fully privileged profile for bcvk\n    \/\/ to bind-mount the extracted kernel inside its bwrap namespace.\n\n$1/' "$BCVK_SRC/crates/kit/src/run_ephemeral.rs"
          fi
          grep -Fq -- 'cmd.arg("--privileged")' "$BCVK_SRC/crates/kit/src/run_ephemeral.rs" \
            || { echo "::error::failed to apply bcvk privileged-container CI patch"; exit 1; }
          # bcvk v0.21.0 dropped bwrap from the entrypoint (mount + chroot instead),
          # so the CAP_SYS_ADMIN patch only applies to older pins that still use it.
          if grep -Fq -- 'bwrap --as-pid-1' "$BCVK_SRC/crates/kit/scripts/entrypoint.sh"; then
            if ! grep -Fq -- '--cap-add CAP_SYS_ADMIN' "$BCVK_SRC/crates/kit/scripts/entrypoint.sh"; then
              perl -0pi -e 's/(bwrap --as-pid-1 --unshare-pid)/$1 --cap-add CAP_SYS_ADMIN/' "$BCVK_SRC/crates/kit/scripts/entrypoint.sh"
            fi
            grep -Fq -- '--cap-add CAP_SYS_ADMIN' "$BCVK_SRC/crates/kit/scripts/entrypoint.sh" \
              || { echo "::error::failed to apply bcvk bwrap CAP_SYS_ADMIN CI patch"; exit 1; }
          fi
          if grep -Fq -- '"rsa"' "$BCVK_SRC/crates/kit/src/ssh.rs"; then
            perl -0pi -e 's/"-t",\n\s+"rsa",\n\s+"-b",\n\s+"4096",\s+\/\/ Use 4096-bit RSA for security/"-t",\n            "ed25519",/s' "$BCVK_SRC/crates/kit/src/ssh.rs"
          fi
          grep -Fq -- '"ed25519"' "$BCVK_SRC/crates/kit/src/ssh.rs" \
            || { echo "::error::failed to apply bcvk ed25519 SSH key CI patch"; exit 1; }
          # ARM virt SMBIOS tables are published to the guest by firmware.
          # bcvk DirectBoot bypasses firmware, so use systemd's documented
          # kernel-command-line credential transport for this public key.
          if ! grep -Fq -- 'ssh_credential_karg = None' "$BCVK_SRC/crates/kit/src/run_ephemeral.rs"; then
            git -C "$BCVK_SRC" apply "$GITHUB_WORKSPACE/.github/patches/bcvk-arm64-directboot-ssh.patch" \
              || { echo "::error::failed to apply bcvk ARM64 DirectBoot SSH credential patch"; exit 1; }
          fi
          grep -Fq -- 'karg_for_root_ssh(&pubkey)' "$BCVK_SRC/crates/kit/src/run_ephemeral.rs" \
            || { echo "::error::bcvk ARM64 DirectBoot SSH credential fallback unavailable"; exit 1; }
          grep -Fq -- 'systemd.set_credential_binary=tmpfiles.extra:' "$BCVK_SRC/crates/bcvk-qemu/src/credentials.rs" \
            || { echo "::error::bcvk systemd kernel-command-line SSH credential unavailable"; exit 1; }
          # Keep tmpfiles.extra as the payload on both transports so systemd-
          # tmpfiles and the yubiOS root-only helper accept the same data.
          grep -Fq -- 'io.systemd.credential.binary:tmpfiles.extra={encoded}' "$BCVK_SRC/crates/bcvk-qemu/src/credentials.rs" \
            || { echo "::error::bcvk no longer exposes the documented tmpfiles.extra root SSH credential path"; exit 1; }
          ( cd "$BCVK_SRC" && cargo test --release -p bcvk-qemu test_karg_for_root_ssh && cargo build --release )
          if [ ! -x "$BCVK_SRC/target/release/bcvk" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: pinned bcvk source failed to build -- VM e2e not feasible (see cargo output above)"
            echo "### vm-e2e (${{ matrix.arch }}) -- SKIP: bcvk build failed" >> "$GITHUB_STEP_SUMMARY"
            sudo rm -rf "$BCVK_SRC"
            exit 0
          fi
          sudo mkdir -p "${BCVK_PREFIX}/bin"
          sudo cp "$BCVK_SRC/target/release/bcvk" "${BCVK_PREFIX}/bin/bcvk" || { echo "::error::failed to stage bcvk binary"; exit 1; }
          sudo chmod 0755 "${BCVK_PREFIX}/bin/bcvk"
          echo "${BCVK_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "skip=0" >> "$GITHUB_OUTPUT"
          echo "### vm-e2e (${{ matrix.arch }}) -- INFO: bcvk built and cached at ${BCVK_PREFIX}" >> "$GITHUB_STEP_SUMMARY"
          # Reclaim space immediately before the large image pull. Keep only the
          # cached bcvk binary under /opt; rock1 has a small root disk and hit
          # 69 MB free after pull.
          rm -rf ~/.cargo/registry ~/.cargo/git ~/.cargo/.package-cache 2>/dev/null || true
          sudo rm -rf "$BCVK_SRC"

      - name: Disk space after bcvk build attempt (diagnostic)
        if: always()
        run: |
          df -h "$PWD" /tmp || true
          du -sh /opt/bcvk-src 2>/dev/null || true
          du -sh ~/.cargo 2>/dev/null || true

      - name: Gate on KVM (bcvk hard-requires /dev/kvm; now real hardware on arm64 via self-hosted rock1)
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "kvm=1" >> "$GITHUB_OUTPUT"
          else
            echo "kvm=0" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: /dev/kvm absent on this runner (self-hosted ARM64 should have it -- if this fires on rock1, KVM isn't enabled in its kernel/BIOS, not a hosted-runner limitation); bcvk boot legs skipped LOUDLY"
            echo "### vm-e2e (${{ matrix.arch }}) -- SKIP: boot legs, no /dev/kvm on this runner" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Gate amd64 boot leg on platform-priority policy (ADR-023: ARM64 is primary)"
        id: policy
        run: |
          if [ "${{ matrix.primary }}" = "true" ]; then
            echo "boot=1" >> "$GITHUB_OUTPUT"
          else
            echo "boot=0" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: ${{ matrix.arch }} boot leg skipped -- ARM64 is yubiOS's primary target platform (ADR-023); amd64 CI does not block on the open bcvk/virtiofsd bug on a now-secondary arch (see #9/#20/#25 for the diagnosis)."
            echo "### vm-e2e (${{ matrix.arch }}) -- SKIP: boot legs, secondary platform per ADR-023 (bcvk/virtiofsd diagnosis: #9/#20/#25)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assert bcvk exposes --swtpm/--swu2f (real regression gate)
        if: steps.bcvk.outputs.skip == '0'
        run: |
          bcvk ephemeral run --help 2>&1 | grep -q -- '--swtpm' \
            || { echo "::error::pinned bcvk source missing --swtpm flag"; exit 1; }
          bcvk ephemeral run --help 2>&1 | grep -q -- '--swu2f' \
            || { echo "::error::pinned bcvk source missing --swu2f flag"; exit 1; }
          echo "bcvk exposes --swtpm and --swu2f"

      # NOT converted to docker: bcvk (crates/kit/src/run_ephemeral.rs,
      # crates/kit/src/ephemeral.rs) hardcodes Command::new("podman") for its
      # privileged ephemeral-VM container and container inspection -- there is
      # no --runtime flag. Pulling with `docker` would populate docker's own
      # image store, which podman's separate containers-storage can't see, so
      # bcvk would still report "image not known". Every podman call in this
      # workflow and in tests/vm/*.sh (pull / rm / logs) exists to interoperate
      # with that hardcoded dependency, not because we chose podman ourselves.
      - name: Free disk space (pre-pull -- reclaim space the cargo build just used)
        if: steps.bcvk.outputs.skip == '0' && steps.kvm.outputs.kvm == '1' && steps.policy.outputs.boot == '1'
        run: |
          sudo podman ps -aq | xargs -r sudo podman rm -f || true
          sudo podman image prune -f || true
          df -h "$PWD" /var/lib/containers || true

      - name: Pull yubiOS image into podman storage (bcvk boots from local storage)
        if: steps.bcvk.outputs.skip == '0' && steps.kvm.outputs.kvm == '1' && steps.policy.outputs.boot == '1'
        run: |
          set -euo pipefail
          TARGET_IMAGE="${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}"
          REMOTE_DIGEST="$(python3 - "$TARGET_IMAGE" <<'PY'
          import json, sys, urllib.request
          ref = sys.argv[1]
          if "@sha256:" in ref:
              print("sha256:" + ref.split("@sha256:", 1)[1])
              sys.exit(0)
          clean = ref
          for pfx in ("docker.io/", "index.docker.io/"):
              if clean.startswith(pfx):
                  clean = clean[len(pfx):]
          repo, tag = (clean.split(":", 1) + ["latest"])[:2]
          if "/" not in repo:
              repo = "library/" + repo
          try:
              tok_url = f"https://auth.docker.io/token?service=registry.docker.io&scope=repository:{repo}:pull"
              tok = json.loads(urllib.request.urlopen(tok_url, timeout=15).read().decode())["token"]
              req = urllib.request.Request(
                  f"https://registry-1.docker.io/v2/{repo}/manifests/{tag}",
                  headers={
                      "Authorization": f"Bearer {tok}",
                      "Accept": "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json",
                  },
                  method="HEAD",
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(r.headers.get("Docker-Content-Digest", "").strip())
          except Exception:
              print("")
          PY
          )"
          LOCAL_DIGESTS="$(sudo podman image inspect "$TARGET_IMAGE" --format '{{range .RepoDigests}}{{.}} {{end}}' 2>/dev/null || true)"
          if [ -n "$REMOTE_DIGEST" ] && [ -n "$LOCAL_DIGESTS" ] && grep -Fq "$REMOTE_DIGEST" <<<"$LOCAL_DIGESTS"; then
            echo "Cache HIT: $TARGET_IMAGE already cached in podman at $REMOTE_DIGEST -- skipping purge and pull"
          else
            echo "Cache MISS or digest updated (remote=${REMOTE_DIGEST:-unknown}, local=${LOCAL_DIGESTS:-none}) -- pruning stale images and pulling $TARGET_IMAGE"
            sudo podman image prune -af || true
            sudo podman pull "$TARGET_IMAGE"
          fi
          sudo podman images | head -5

      - name: Relax AppArmor profiles for bcvk VM boot
        if: matrix.arch == 'arm64' && steps.bcvk.outputs.skip == '0' && steps.kvm.outputs.kvm == '1' && steps.policy.outputs.boot == '1'
        run: |
          set -euo pipefail
          aa_complain="$(command -v aa-complain || true)"
          aa_status="$(command -v aa-status || true)"
          [ -n "$aa_complain" ] || [ ! -x /usr/sbin/aa-complain ] || aa_complain=/usr/sbin/aa-complain
          [ -n "$aa_status" ] || [ ! -x /usr/sbin/aa-status ] || aa_status=/usr/sbin/aa-status
          if [ -z "$aa_complain" ]; then
            echo "::error::aa-complain unavailable after installing apparmor-utils; cannot relax AppArmor profiles for bcvk VM boot"
            exit 1
          fi
          profile_loaded() {
            [ -z "$aa_status" ] || sudo "$aa_status" 2>/dev/null | grep -Fxq "   $1"
          }
          for profile in unpriv_bwrap swtpm; do
            if profile_loaded "$profile"; then
              sudo "$aa_complain" "$profile"
            else
              echo "::notice::AppArmor profile $profile is not loaded; no CI relaxation needed"
            fi
          done
          if [ -n "$aa_status" ]; then
            sudo "$aa_status" | sed -n '1,140p' || true
          fi
          echo "### vm-e2e (arm64) -- INFO: AppArmor profiles relaxed for bcvk VM boot (unpriv_bwrap + swtpm when loaded)" >> "$GITHUB_STEP_SUMMARY"

      # -- Hardware YubiKey passthrough legs (yubiOS#9, yubiOS#20). --
      # Deliberately steps INSIDE vm-e2e rather than a separate job: they share this
      # job's bcvk build, image pull, and AppArmor setup on the self-hosted rock1
      # runner instead of paying for all of it twice.
      #
      # tests/vm/test-luks-fido2.sh needs a PHYSICAL YubiKey + a spare block device +
      # root: it flashes the device via `bcvk native-to-disk`, then enrolls LUKS2
      # against a real YubiKey tap. Different mechanism from the swu2f software
      # authenticator legs below (no VM, no QEMU USB passthrough).
      #
      # DESTRUCTIVE, so gated on an explicit workflow_dispatch with a non-empty
      # hw_device; on any normal run all three steps skip.
      - name: Precondition -- physical YubiKey attached (USB vendor 0x1050)
        id: yubikey
        if: github.event_name == 'workflow_dispatch' && inputs.hw_device != ''
        run: |
          if lsusb 2>/dev/null | grep -qi '1050:'; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: no physical YubiKey detected on this runner (lsusb has no vendor 1050 device)."
            echo "### vm-e2e (${{ matrix.arch }}) -- SKIP: hardware leg, no physical YubiKey attached to this runner" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Precondition -- target device is a block device and not the runner's root disk
        id: device
        if: github.event_name == 'workflow_dispatch' && inputs.hw_device != '' && steps.yubikey.outputs.present == '1'
        env:
          HW_DEVICE: ${{ inputs.hw_device }}
        run: |
          set -euo pipefail
          if [ ! -b "$HW_DEVICE" ]; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: $HW_DEVICE is not a block device on this runner."
            echo "### vm-e2e (${{ matrix.arch }}) -- SKIP: hardware leg, $HW_DEVICE is not a block device" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          root_src="$(findmnt -no SOURCE / || true)"
          root_disk="$(lsblk -no PKNAME "$root_src" 2>/dev/null || true)"
          target_disk="$(basename "$HW_DEVICE")"
          if [ -n "$root_disk" ] && { [ "$root_disk" = "$target_disk" ] || [ "$(basename "$root_src")" = "$target_disk" ]; }; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::error::REFUSING: $HW_DEVICE resolves to this runner's own root disk ($root_src). Never wiping the host."
            echo "### vm-e2e (${{ matrix.arch }}) -- FAIL: hardware leg refused, $HW_DEVICE is the runner's own root disk" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # bcvk native-to-disk shells out to `blockdev` (util-linux) to size the
          # target; run 30147997124 died with "blockdev not found; install
          # util-linux" at native_to_disk.rs:95. util-linux is installed with the
          # other host deps above -- assert it resolves before we start flashing.
          if ! command -v blockdev >/dev/null 2>&1 && [ ! -x /usr/sbin/blockdev ]; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::error::blockdev unavailable despite util-linux install; bcvk native-to-disk cannot size $HW_DEVICE"
            echo "### vm-e2e (${{ matrix.arch }}) -- FAIL: hardware leg, blockdev unavailable (util-linux)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "blockdev: $(command -v blockdev || echo /usr/sbin/blockdev)"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      # -- Phase F0 fTPM chain (yubiOS#35), first of the tests/vm legs. --
      # The OP-TEE ms-tpm-20-ref fTPM lives in the FIRMWARE (TF-A + OP-TEE + U-Boot),
      # not in the yubiOS OS image, so no bcvk guest can expose it -- bcvk DirectBoot
      # bypasses the firmware entirely. tests/vm/test-ftpm-qemu-ci.sh therefore sources
      # flash.bin from the published firmware bundle (ci_firmware-rk.yml Stage 4) and
      # boots it directly, exactly like that workflow's Stage 3, instead of going
      # through bcvk ephemeral. Stage A asserts the secure-world markers; Stage B
      # (opt-in) installs the OS with bcvk to-disk, boots it under the same firmware,
      # and runs tests/vm/verify-tpm0-pcr-extend.sh in-guest over the serial console
      # via tests/vm/ftpm-console-driver.py -- the dev/test image's root-autologin
      # getty is the only route in, since U-Boot owns the boot and there is no network.
      #
      # Runs under TCG, so it needs neither the bcvk build nor /dev/kvm for Stage A.
      # Same rc contract as the legs below: 0 pass, 77 loud SKIP, anything else fails.
      # Run #120 (30165202571) failed in this step: Stage B's `bcvk to-disk` sat for
      # 26 minutes with no progress and timeout-minutes killed the job, so the
      # script never reached its own 77-SKIP contract and left no diagnosis. Two
      # fixes, both minimal: the script now bounds to-disk with TO_DISK_TIMEOUT and
      # converts a blown budget into a loud SKIP, and this step hands it the
      # zstd-capable QEMU built above -- to-disk boots an installer VM, and the
      # distro QEMU cannot DirectBoot this image's zstd EFI zboot kernel, which is
      # the known hang the other bcvk legs already SKIP on. Budget: 180s Stage A +
      # 900s to-disk + 900s guest boot, so the step needs more than 30 minutes.
      - name: Run tests/vm/test-ftpm-qemu-ci.sh (OP-TEE fTPM, firmware from Docker)
        if: ${{ always() && matrix.arch == 'arm64' }}
        timeout-minutes: 45
        env:
          FIRMWARE_IMAGE: ${{ inputs.firmware_image || 'docker.io/0mniteck/yubios:firmware-qemu-arm64' }}
          YUBIOS_IMAGE: ${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}
          FTPM_LINUX_PAYLOAD: ${{ inputs.ftpm_linux_payload && '1' || '0' }}
          BOOT_TIMEOUT: '180'
          LINUX_BOOT_TIMEOUT: '900'
          TO_DISK_TIMEOUT: '900'
          QEMU_ZSTD_PREFIX: ${{ steps.qemu-zstd.outputs.qemu_prefix }}
          FTPM_LOG_DIR: /tmp/yubios-ftpm-logs
        run: |
          # The arm64 leg installs qemu-system-arm already; amd64 installs the x86
          # emulator only, and neither matrix leg guarantees podman/python3 here.
          command -v qemu-system-aarch64 >/dev/null 2>&1 || missing=1
          command -v podman >/dev/null 2>&1 || missing=1
          command -v python3 >/dev/null 2>&1 || missing=1
          if [ "${missing:-0}" = "1" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              qemu-system-arm qemu-efi-aarch64 podman python3
          fi
          qemu-system-aarch64 --version | head -1
          chmod +x tests/vm/test-ftpm-qemu-ci.sh
          sudo rm -rf "$FTPM_LOG_DIR"
          sudo mkdir -p "$FTPM_LOG_DIR"
          sudo chmod 0777 "$FTPM_LOG_DIR"
          # Stage B's `bcvk to-disk` runs its own installer VM under QEMU. Put the
          # zstd-capable build first on PATH when the step above produced one.
          FTPM_PATH="$PATH:/usr/sbin:/sbin"
          if [ -n "${QEMU_ZSTD_PREFIX:-}" ] && [ -x "${QEMU_ZSTD_PREFIX}/bin/qemu-system-aarch64" ]; then
            FTPM_PATH="${QEMU_ZSTD_PREFIX}/bin:$FTPM_PATH"
            echo "bcvk to-disk will see zstd-capable QEMU at ${QEMU_ZSTD_PREFIX}/bin"
          else
            echo "::warning::no zstd-capable QEMU prefix available; bcvk to-disk may hang on the ARM64 zstd EFI zboot kernel (bounded by TO_DISK_TIMEOUT)"
          fi
          set +e
          sudo env "PATH=$FTPM_PATH" \
            "FIRMWARE_IMAGE=$FIRMWARE_IMAGE" \
            "YUBIOS_IMAGE=$YUBIOS_IMAGE" \
            "FTPM_LINUX_PAYLOAD=$FTPM_LINUX_PAYLOAD" \
            "BOOT_TIMEOUT=$BOOT_TIMEOUT" \
            "LINUX_BOOT_TIMEOUT=$LINUX_BOOT_TIMEOUT" \
            "TO_DISK_TIMEOUT=$TO_DISK_TIMEOUT" \
            "LOG_DIR=$FTPM_LOG_DIR" \
            bash tests/vm/test-ftpm-qemu-ci.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "--- OP-TEE secure-world serial log tail ---"
            sudo tail -200 "$FTPM_LOG_DIR/ftpm-optee.log" || true
            echo "--- normal-world serial log tail ---"
            sudo tail -200 "$FTPM_LOG_DIR/ftpm-nw.log" || true
            echo "--- Stage B guest console tail ---"
            sudo tail -200 "$FTPM_LOG_DIR/ftpm-linux.log" || true
          fi
          if [ "$rc" -eq 77 ]; then
            echo "::warning::SKIP: fTPM leg incomplete -- see the SKIP line above for the exact gap."
            echo "### vm-e2e (${{ matrix.arch }}) -- SKIP: test-ftpm-qemu-ci.sh, see log for the named gap" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "### vm-e2e (${{ matrix.arch }}) -- PASS: test-ftpm-qemu-ci.sh, OP-TEE fTPM verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fTPM serial logs
        if: ${{ always() && matrix.arch == 'arm64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — see PINNED.md
        continue-on-error: true
        with:
          name: ftpm-qemu-logs-${{ matrix.arch }}
          path: /tmp/yubios-ftpm-logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run tests/vm/test-luks-fido2.sh (DESTRUCTIVE -- wipes ${{ inputs.hw_device }})
        if: github.event_name == 'workflow_dispatch' && inputs.hw_device != '' && steps.yubikey.outputs.present == '1' && steps.device.outputs.ok == '1'
        timeout-minutes: 10
        env:
          HW_DEVICE: ${{ inputs.hw_device }}
          HW_IMAGE: ${{ inputs.hw_image != '' && inputs.hw_image || (inputs.image || 'docker.io/0mniteck/yubios:dev') }}
        run: |
          chmod +x tests/vm/test-luks-fido2.sh
          echo "Running test-luks-fido2.sh against $HW_DEVICE with image $HW_IMAGE (physical YubiKey required -- touch when prompted)"
          set +e
          sudo env "PATH=$PATH:/usr/sbin:/sbin" bash tests/vm/test-luks-fido2.sh "$HW_DEVICE" "$HW_IMAGE"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::test-luks-fido2.sh failed (rc=$rc) against $HW_DEVICE"
            echo "### vm-e2e (${{ matrix.arch }}) -- FAIL: hardware leg, test-luks-fido2.sh rc=$rc against $HW_DEVICE" >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          echo "### vm-e2e (${{ matrix.arch }}) -- PASS: hardware leg, real-hardware LUKS2 FIDO2 enrollment against $HW_DEVICE (yubiOS#9, yubiOS#20)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests/vm/test-luks-fido2-ci.sh (boot leg gated on image availability)
        if: ${{ always() && steps.bcvk.outputs.skip == '0' && steps.kvm.outputs.kvm == '1' && steps.policy.outputs.boot == '1' }}
        timeout-minutes: 20
        env:
          YUBIOS_IMAGE: ${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}
          YUBIOS_SSH_WAIT_SECS: ${{ matrix.arch == 'arm64' && '900' || '300' }}
          ALLOW_REAL_U2F: ${{ inputs.allow_real_u2f && '1' || '0' }}
          BCVK_EPHEMERAL_EXTRA_ARGS: >-
            ${{ matrix.arch == 'arm64' && format('--ro-bind {0}:qemu-zstd --ro-bind /lib/aarch64-linux-gnu:host-lib --ro-bind /usr/lib/aarch64-linux-gnu:host-usrlib --env PATH=/run/host-mounts/qemu-zstd/bcvk-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin --log-dir=journal,console=/tmp/yubios-vm-e2e-logs', steps.qemu-zstd.outputs.qemu_prefix) || '' }}
        run: |
          if [ -z "${YUBIOS_IMAGE}" ] && [ ! -e ./mkosi.output/yubiOS ]; then
            echo "::warning::SKIP: no yubiOS image available (no workflow_dispatch 'image' input, no mkosi.output/yubiOS). VM boot + LUKS2-FIDO2 + homed legs NOT exercised."
            {
              echo "### vm-e2e (${{ matrix.arch }}) -- SKIP: VM boot leg (explicit)"
              echo "- bcvk built from the pinned source and exposes \`--swtpm\`/\`--swu2f\` OK"
              echo "- swtpm / qemu / fido2-tools / cryptsetup installed OK"
              echo "- **Skipped:** VM boot + LUKS2-FIDO2 + systemd-homed legs -- needs a built yubiOS test image (\`mkosi --profile test\`) or a \`workflow_dispatch\` \`image\` input."
              echo "- To run the full e2e: dispatch this workflow with \`image\` set to a pullable yubiOS OCI ref, or build the test image into \`./mkosi.output/yubiOS\` first."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ -e /dev/kvm ] || echo "::warning::/dev/kvm absent -- bcvk may fall back to slow TCG emulation"
          chmod +x tests/vm/test-luks-fido2-ci.sh
          sudo rm -rf /tmp/yubios-vm-e2e-logs
          sudo mkdir -p /tmp/yubios-vm-e2e-logs
          sudo chmod 0777 /tmp/yubios-vm-e2e-logs
          echo "Running test-luks-fido2-ci.sh against image: ${YUBIOS_IMAGE:-./mkosi.output/yubiOS}"
          set +e
          sudo env "PATH=$PATH:/usr/sbin:/sbin" "YUBIOS_IMAGE=${YUBIOS_IMAGE:-./mkosi.output/yubiOS}" "BCVK_EPHEMERAL_EXTRA_ARGS=${BCVK_EPHEMERAL_EXTRA_ARGS:-}" "YUBIOS_SSH_WAIT_SECS=${YUBIOS_SSH_WAIT_SECS:-300}" "ALLOW_REAL_U2F=${ALLOW_REAL_U2F:-0}" bash tests/vm/test-luks-fido2-ci.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "--- disk after failed VM run ---"
            df -h "$PWD" /tmp /var/lib/containers || true
            echo "--- VM console log tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/console.txt || true
            echo "--- VM journal tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/journal.json || true
            echo "--- VM initrd journal tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/journal-initrd.json || true
          fi
          if [ "$rc" -eq 77 ]; then
            echo "::warning::SKIP: bcvk cannot DirectBoot the ARM64 zstd EFI zboot kernel in this image yet; VM boot leg skipped rather than failing on a known harness limitation."
            echo "### vm-e2e (${{ matrix.arch }}) -- SKIP: test-luks-fido2-ci.sh, bcvk lacks zstd EFI zboot support for this ARM64 image" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "### vm-e2e (${{ matrix.arch }}) -- PASS: test-luks-fido2-ci.sh (CTAP2 legs skip unless the test image ships swu2f Layer 2)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests/vm/test-fido2-enrollment.sh (enrollment surface, #9/#25)
        timeout-minutes: 20
        if: ${{ always() && steps.bcvk.outputs.skip == '0' && steps.kvm.outputs.kvm == '1' && steps.policy.outputs.boot == '1' }}
        env:
          YUBIOS_IMAGE: ${{ inputs.image || 'docker.io/0mniteck/yubios:dev' }}
          YUBIOS_SSH_WAIT_SECS: ${{ matrix.arch == 'arm64' && '900' || '300' }}
          ALLOW_REAL_U2F: ${{ inputs.allow_real_u2f && '1' || '0' }}
          BCVK_EPHEMERAL_EXTRA_ARGS: >-
            ${{ matrix.arch == 'arm64' && format('--ro-bind {0}:qemu-zstd --ro-bind /lib/aarch64-linux-gnu:host-lib --ro-bind /usr/lib/aarch64-linux-gnu:host-usrlib --env PATH=/run/host-mounts/qemu-zstd/bcvk-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin --log-dir=journal,console=/tmp/yubios-vm-e2e-logs', steps.qemu-zstd.outputs.qemu_prefix) || '' }}
        run: |
          if [ -z "${YUBIOS_IMAGE}" ] && [ ! -e ./mkosi.output/yubiOS ]; then
            echo "::warning::SKIP: no yubiOS image available -- enrollment-surface e2e not exercised."
            exit 0
          fi
          chmod +x tests/vm/test-fido2-enrollment.sh
          sudo rm -rf /tmp/yubios-vm-e2e-logs
          sudo mkdir -p /tmp/yubios-vm-e2e-logs
          sudo chmod 0777 /tmp/yubios-vm-e2e-logs
          set +e
          sudo env "PATH=$PATH:/usr/sbin:/sbin" "YUBIOS_IMAGE=${YUBIOS_IMAGE:-./mkosi.output/yubiOS}" "BCVK_EPHEMERAL_EXTRA_ARGS=${BCVK_EPHEMERAL_EXTRA_ARGS:-}" "YUBIOS_SSH_WAIT_SECS=${YUBIOS_SSH_WAIT_SECS:-300}" "ALLOW_REAL_U2F=${ALLOW_REAL_U2F:-0}" bash tests/vm/test-fido2-enrollment.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "--- disk after failed enrollment VM run ---"
            df -h "$PWD" /tmp /var/lib/containers || true
            echo "--- VM console log tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/console.txt || true
            echo "--- VM journal tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/journal.json || true
            echo "--- VM initrd journal tail ---"
            sudo tail -200 /tmp/yubios-vm-e2e-logs/journal-initrd.json || true
          fi
          if [ "$rc" -eq 77 ]; then
            echo "::warning::SKIP: bcvk cannot DirectBoot the ARM64 zstd EFI zboot kernel in this image yet; enrollment boot leg skipped rather than failing on a known harness limitation."
            echo "### vm-e2e (${{ matrix.arch }}) -- SKIP: test-fido2-enrollment.sh, bcvk lacks zstd EFI zboot support for this ARM64 image" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "### vm-e2e (${{ matrix.arch }}) -- PASS: test-fido2-enrollment.sh (CTAP2 legs skip unless the test image ships swu2f Layer 2)" >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space (post-run -- leave rock1 clean for the next run)
        if: always()
        run: |
          aa_enforce="$(command -v aa-enforce || true)"
          [ -n "$aa_enforce" ] || [ ! -x /usr/sbin/aa-enforce ] || aa_enforce=/usr/sbin/aa-enforce
          if [ -n "$aa_enforce" ]; then
            for profile in unpriv_bwrap swtpm; do
              sudo "$aa_enforce" "$profile" || true
            done
          fi
          sudo podman ps -aq | xargs -r sudo podman rm -f || true
          sudo podman image prune -f || true
          sudo rm -rf /opt/bcvk-src || true
          df -h "$PWD" /var/lib/containers || true

      - name: Note hardware-only variant (runs above when dispatched with hw_device, else lint-only)
        run: |
          echo "### vm-e2e (${{ matrix.arch }}) -- INFO: tests/vm/test-luks-fido2.sh needs a physical YubiKey + spare block device + root; the hardware leg above runs it for real when dispatched with hw_device set, otherwise it is lint-only (yubiOS#9, yubiOS#20)." >> "$GITHUB_STEP_SUMMARY"

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [lint-vm-scripts, vm-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

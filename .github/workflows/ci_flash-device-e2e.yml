name: yubiOS Direct-to-SD Flash & Boot Verification (rock1 / x86_64-uefi)

on:
  workflow_dispatch:
    inputs:
      SIGNKEY:
        description: 'Signing key mode: test (touch=never, unattended CI) or production (touch=cached, owner key)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production
      board:
        description: 'Target board / platform to provision (Rockchip ARM64 writes U-Boot at sector 64; x86_64-uefi provisions standard UEFI GPT + BOOTX64.EFI)'
        required: true
        default: 'rock5b-rk3588'
        type: choice
        options:
          - rock5b-rk3588
          - pinetab2-rk3566
          - rockpro64-rk3399
          - x86_64-uefi
      sd_device:
        description: 'Removable target block device on runner host (default /dev/mmcblk1; guarded against /, /boot, /mnt/extended, mmcblk0, nvme0n1)'
        required: true
        default: '/dev/mmcblk1'
        type: string
      image:
        description: 'yubiOS bootc OCI image ref to install'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string
      sign_with_u2f_hsm:
        description: 'Mint/use PIV slot 9a key on attached U2F/HSM (1050:0407) or test fallback to sign PK/KEK/db.auth, systemd-boot, and UKI'
        required: false
        default: true
        type: boolean
      piv_touch_policy:
        description: 'Optional override for U2F/HSM PIV slot 9a touch policy (auto uses SIGNKEY: test->never, production->cached)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - cached
          - never
          - always
      run_post_install_vm_boot:
        description: 'Optional VM boot check (default false; first-boot Secure Boot enrollment requires board StMM/OP-TEE or UEFI SetupMode=1)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  flash-device-e2e:
    name: Flash Media & Verify (${{ inputs.board }} / SIGNKEY=${{ inputs.SIGNKEY }})
    runs-on: ${{ (inputs.board == 'x86_64-uefi' || inputs.board == 'amd64-uefi') && fromJSON('["self-hosted", "Linux", "X64", "KVM"]') || fromJSON('["self-hosted", "Linux", "ARM64", "KVM"]') }}
    timeout-minutes: 180
    steps:
      - name: Reclaim workspace before checkout (self-hosted runner can accumulate root-owned files)
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Checkout yubiOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Run signed UKI + bootc SD/USB flash + ESP loader architecture verification
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER }}
          FLASH_SIGNKEY: ${{ inputs.SIGNKEY }}
          FLASH_BOARD: ${{ inputs.board }}
          FLASH_SD_DEVICE: ${{ inputs.sd_device }}
          FLASH_OS_IMAGE: ${{ inputs.image }}
          FLASH_SIGN_WITH_U2F_HSM: ${{ inputs.sign_with_u2f_hsm }}
          FLASH_PIV_TOUCH_POLICY: ${{ inputs.piv_touch_policy }}
          FLASH_RUN_POST_VM: ${{ inputs.run_post_install_vm_boot }}
        run: |
          chmod +x scripts/flash-device-e2e.sh
          bash scripts/flash-device-e2e.sh

      - name: Upload full VM boot logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — see PINNED.md
        with:
          name: flash-device-e2e-logs
          path: /tmp/yubios-flash-e2e-logs/*.log
          if-no-files-found: warn
          retention-days: 14

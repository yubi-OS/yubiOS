name: TEST - bootc to-filesystem install e2e

# Validate the destructive README install path only on disposable loopback
# disks inside fresh GitHub-hosted VMs. This is an external published-image
# regression smoke: the orchestrator runs it before the production image build.
# It proves a strict fs-verity composefs repository and an unsealed traditional
# BLS deployment; a separate Secure Boot VM lane is required to prove sealing.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Pullable yubiOS image to install; the run resolves and records its immutable digest.'
        required: true
        default: 'docker.io/0mniteck/yubios:latest'
        type: string
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  install-to-filesystem:
    name: install-to-filesystem (${{ matrix.arch }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
            root_type_guid: 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            root_type_guid: b921b045-1df0-41c3-af44-4c6f280d3fae
    runs-on: ${{ matrix.runner }}
    env:
      REQUESTED_IMAGE: ${{ inputs.image || 'docker.io/0mniteck/yubios:latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Assert README install contract
        run: |
          set -euo pipefail
          grep -Fq -- 'bootc install to-filesystem' README.md
          grep -Fq -- '--root-mount-spec=""' README.md
          grep -Fq -- '--skip-finalize' README.md
          grep -Fq -- '/run/host/mnt/' README.md

      - name: Prepare fresh externally partitioned target at /mnt
        id: disk
        env:
          ROOT_TYPE_GUID: ${{ matrix.root_type_guid }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            binutils dosfstools e2fsprogs erofs-utils fdisk fsverity jq util-linux

          DISK_IMAGE="${RUNNER_TEMP}/yubios-bootc-to-filesystem-${{ matrix.arch }}.raw"
          truncate -s 12G "$DISK_IMAGE"
          LOOP_DEVICE="$(sudo losetup --find --show --partscan "$DISK_IMAGE")"
          printf 'label: gpt\nsize=1G, type=c12a7328-f81f-11d2-ba4b-00a0c93ec93b, name=ESP\ntype=%s, name=yubiOS-root\n' \
            "$ROOT_TYPE_GUID" | sudo sfdisk "$LOOP_DEVICE"
          sudo partx --update "$LOOP_DEVICE" || true
          sudo udevadm settle

          ESP_PART="${LOOP_DEVICE}p1"
          ROOT_PART="${LOOP_DEVICE}p2"
          test -b "$ESP_PART"
          test -b "$ROOT_PART"
          sudo mkfs.vfat -F 32 -n EFI "$ESP_PART"
          sudo mkfs.ext4 -F -O verity -L yubiOS-root "$ROOT_PART"
          sudo tune2fs -l "$ROOT_PART" | \
            sed -n 's/^Filesystem features:[[:space:]]*//p' | \
            tr ' ' '\n' | grep -qx verity
          sudo mount "$ROOT_PART" /mnt
          sudo install -d -m 0755 /mnt/boot
          sudo mount "$ESP_PART" /mnt/boot

          test "$(findmnt -nro SOURCE /mnt)" = "$ROOT_PART"
          test "$(findmnt -nro SOURCE /mnt/boot)" = "$ESP_PART"
          sudo sfdisk --dump "$LOOP_DEVICE"
          findmnt --target /mnt
          findmnt --target /mnt/boot

          {
            echo "disk_image=$DISK_IMAGE"
            echo "loop_device=$LOOP_DEVICE"
            echo "esp_part=$ESP_PART"
            echo "root_part=$ROOT_PART"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve image digest and install with the README command
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_PASSWORD:-}" ]; then
            printf '%s' "$DOCKER_PASSWORD" | docker login \
              --username 0mniteck42 --password-stdin docker.io
          fi
          docker pull "$REQUESTED_IMAGE"
          RESOLVED_IMAGE="$(docker image inspect "$REQUESTED_IMAGE" \
            --format '{{ index .RepoDigests 0 }}')"
          test -n "$RESOLVED_IMAGE"
          case "$RESOLVED_IMAGE" in
            *@sha256:*) ;;
            *) echo "::error::image did not resolve to an immutable digest: $RESOLVED_IMAGE"; exit 1 ;;
          esac
          echo "Installing immutable source: $RESOLVED_IMAGE"
          sudo install -d -m 0755 /var/lib/containers

          docker run --rm "$RESOLVED_IMAGE" bash -euxo pipefail -c '
            bootc --version
            bootc install to-filesystem --help | grep -F -- --composefs-backend
            bootc install to-filesystem --help | grep -F -- --allow-missing-verity
            test -x /usr/lib/bootc/initramfs-setup
            test -x /usr/lib/dracut/modules.d/51bootc/module-setup.sh

            found_initramfs=0
            for initramfs in /usr/lib/modules/*/initramfs.img; do
              test -e "$initramfs" || continue
              found_initramfs=1
              listing="$(mktemp)"
              lsinitrd "$initramfs" > "$listing"
              grep -Fq bootc-root-setup.service "$listing"
              grep -Fq usr/lib/bootc/initramfs-setup "$listing"
              rm -f "$listing"
            done
            test "$found_initramfs" -eq 1

            if bootc container split-kernel-and-rootfs --help >/dev/null 2>&1; then
              echo "sealed-build split capability: present"
            else
              echo "sealed-build split capability: absent; install remains BLS/unsealed"
            fi
            if bootc container ukify --help >/dev/null 2>&1; then
              echo "sealed-build ukify capability: present"
            else
              echo "sealed-build ukify capability: absent"
            fi
          '

          docker run --rm --privileged --pid=host --ipc=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers \
            -v /dev:/dev \
            -v /:/run/host \
            "$RESOLVED_IMAGE" \
            bootc install to-filesystem \
              --source-imgref="registry:${RESOLVED_IMAGE}" \
              --bootloader=systemd \
              --root-mount-spec="" \
              --composefs-backend \
              --skip-finalize \
              /run/host/mnt/

          echo "RESOLVED_IMAGE=$RESOLVED_IMAGE" >> "$GITHUB_ENV"

      - name: Run runtime systemd hardening and Bats checks in target image (OMN-40 / OMN-54 / OMN-55)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bats jq python3 openssl
          chmod +x tests/verify-systemd-hardening-runtime.sh tests/vm/test-*.sh
          HARDENING_OUT="${RUNNER_TEMP}/systemd-hardening-runtime-${{ matrix.arch }}"
          ./tests/verify-systemd-hardening-runtime.sh \
            --image "$RESOLVED_IMAGE" \
            --repo-root "$GITHUB_WORKSPACE" \
            --out-dir "$HARDENING_OUT"
          echo "HARDENING_OUT=$HARDENING_OUT" >> "$GITHUB_ENV"

      - name: Retain runtime hardening evidence (OMN-40 / OMN-54 / OMN-55)
        if: always() && env.HARDENING_OUT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — see PINNED.md
        with:
          name: systemd-hardening-runtime-${{ matrix.arch }}
          path: ${{ env.HARDENING_OUT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Verify strict composefs repository and sealed UKI BLSConfig deployment (OMN-150)
        env:
          ROOT_PART: ${{ steps.disk.outputs.root_part }}
          ESP_PART: ${{ steps.disk.outputs.esp_part }}
        run: |
          set -euo pipefail
          test "$(findmnt -nro SOURCE /mnt)" = "$ROOT_PART"
          test "$(findmnt -nro SOURCE /mnt/boot)" = "$ESP_PART"
          for directory in objects images streams; do
            sudo test -d "/mnt/composefs/${directory}"
          done
          sudo test -d /mnt/state/deploy
          sudo test ! -d /mnt/ostree/repo
          sudo test -d /mnt/boot/loader/entries

          if sudo test -f /mnt/composefs/meta.json; then
            sudo jq -e \
              '.algorithm | type == "string" and startswith("fsverity-sha512-")' \
              /mnt/composefs/meta.json
          fi

          image_count=0
          tamper_target=''
          tamper_measurement=''
          while IFS= read -r -d '' image_link; do
            image_count=$((image_count + 1))
            image_digest="${image_link##*/}"
            if ! [[ "$image_digest" =~ ^[0-9a-f]{128}$ ]]; then
              echo "::error::unexpected composefs image name: $image_digest"
              exit 1
            fi

            image_target="$(sudo readlink -f "$image_link")"
            case "$image_target" in
              /mnt/composefs/objects/*) ;;
              *) echo "::error::image escaped the composefs object store: $image_target"; exit 1 ;;
            esac

            measurement="$(sudo fsverity measure "$image_target")"
            measured_digest="${measurement%% *}"
            measured_digest="${measured_digest#sha512:}"
            test "$measured_digest" = "$image_digest"
            sudo dump.erofs -s "$image_target" >/dev/null

            if [ -z "$tamper_target" ]; then
              tamper_target="$image_target"
              tamper_measurement="$measurement"
            fi
          done < <(sudo find /mnt/composefs/images -maxdepth 1 -type l -print0)

          test "$image_count" -gt 0
          test -n "$tamper_target"
          if printf X | sudo dd of="$tamper_target" bs=1 count=1 conv=notrunc status=none 2>tamper.err; then
            echo "::error::fs-verity-protected composefs image accepted a write"
            exit 1
          fi
          cat tamper.err
          test "$(sudo fsverity measure "$tamper_target")" = "$tamper_measurement"

          bls_count=0
          composefs_digest=''
          seal_state=''
          while IFS= read -r -d '' entry; do
            bls_count=$((bls_count + 1))
            echo "Inspecting BLS entry: $entry"
            sudo sed -n '1,160p' "$entry"

            uki_rel="$(sudo awk '$1 == "uki" || $1 == "efi" {print $2}' "$entry" | head -1)"
            if [ -n "$uki_rel" ]; then
              # OMN-150 Phase 2 (Type2 UKI BLSConfig): bootc install writes
              # `uki /EFI/Linux/bootc/bootc_composefs-<digest>.efi` and places the
              # UKI binary on the ESP.
              uki_file="/mnt/boot${uki_rel}"
              sudo test -f "$uki_file" || { echo "::error::UKI file missing at $uki_file"; exit 1; }
              uki_cmdline="$(sudo python3 scripts/extract_uki_cmdline.py "$uki_file")"
              echo "UKI .cmdline: $uki_cmdline"
              if grep -Eq '(^|[[:space:]])root=' <<<"$uki_cmdline"; then
                echo "::error::root= unexpectedly present in UKI .cmdline"
                exit 1
              fi
              if grep -Eq '(^|[[:space:]])composefs(\.digest)?=([^[:space:]]*\?)' <<<"$uki_cmdline"; then
                echo "::error::optional fs-verity marker (?) present in UKI .cmdline"
                exit 1
              fi
              entry_digest="$(grep -oE 'composefs(\.digest=v[12]-sha(256|512)-[0-9]+:|=)[0-9a-f]{128}' <<<"$uki_cmdline" | head -1 | sed -E 's/^.*[:=]//')"
              if [ -z "$entry_digest" ]; then
                echo "::error::strict 128-hex composefs digest absent in UKI .cmdline: $uki_cmdline"
                exit 1
              fi
              case "$uki_rel" in
                /EFI/Linux/bootc/bootc_composefs-"${entry_digest}".efi) ;;
                *) echo "::error::UKI path is not bound to composefs digest: $uki_rel (expected /EFI/Linux/bootc/bootc_composefs-${entry_digest}.efi)"; exit 1 ;;
              esac
              sudo test -L "/mnt/composefs/images/${entry_digest}"
              composefs_digest="$entry_digest"
              seal_state="sealed-uki-blsconfig"
            else
              echo "::error::expected Type2 UKI BLSConfig entry (uki /EFI/Linux/bootc/bootc_composefs-<digest>.efi) in $entry"
              exit 1
            fi
          done < <(sudo find /mnt/boot -type f -path '*/loader/entries/*.conf' -print0)

          test "$bls_count" -gt 0
          test -n "$composefs_digest"
          echo "SEAL_STATE=${seal_state}" >> "$GITHUB_ENV"

          {
            echo '### bootc composefs install evidence (OMN-150 Phase 2)'
            echo "- Source: \`${RESOLVED_IMAGE}\`"
            echo "- Metadata images verified: ${image_count}"
            echo "- Deployment digest: \`${composefs_digest}\`"
            echo '- fs-verity: enforced; protected-object write rejected'
            echo "- Seal state: **${seal_state}** (\`uki /EFI/Linux/bootc/bootc_composefs-${composefs_digest}.efi\` bound to composefs store)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "bootc to-filesystem installed $RESOLVED_IMAGE onto externally prepared mounts"
          echo "Verified: strict composefs repository, EROFS metadata, fs-verity, Type2 UKI BLSConfig, and no root= argument"

      - name: Detach disposable target
        if: always()
        env:
          LOOP_DEVICE: ${{ steps.disk.outputs.loop_device }}
        run: |
          set +e
          mountpoint -q /mnt/boot && sudo umount /mnt/boot
          mountpoint -q /mnt && sudo umount /mnt
          if [ -n "${LOOP_DEVICE:-}" ] && [ -b "$LOOP_DEVICE" ]; then
            sudo losetup --detach "$LOOP_DEVICE"
          fi

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [install-to-filesystem]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."

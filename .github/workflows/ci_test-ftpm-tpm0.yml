# OMN-96 -- yubiOS fTPM /dev/tpm0 guest verification (always-on, matrix)
#
# Small dedicated workflow that runs ONLY the fTPM legs of ci_test-vm.yml,
# keeping the matrix + platform-priority pattern from ci_test-vm.yml verbatim:
#   - arm64 self-hosted (rock1, KVM): does the real Stage A firmware-marker
#     check on every push.
#   - amd64 hosted: per ADR-023 (ARM64 is the primary target), the leg is
#     SKIPped LOUDLY -- emulating an arm64 firmware bundle on amd64 was
#     attempted earlier (the firmware tag is arm64-only) and is not in scope
#     for this workflow.
#
# Stage B (Linux payload + in-guest verify-tpm0-pcr-extend.sh) stays opt-in
# via inputs.ftpm_linux_payload to keep per-push run time bounded (Stage A
# is the always-on fTPM-firmware-marker gate; Stage B is for explicit
# end-to-end Linux fTPM verification).
#
# Pattern copied from ci_test-vm.yml (ses_06730e703ffezdFn0SrMQJhw8R):
#   - Bare runner (no container; podman/bcvk need privileges the
#     hardened dhi.io/debian-base container strips).
#   - `sudo apt-get install` for host deps.
#   - `sudo env "PATH=$PATH:/usr/sbin:/sbin" ...` wrapping every podman
#     invocation so rootful podman can see what was pulled.
#   - Reuses tests/vm/test-ftpm-qemu-ci.sh verbatim.
#
# Honest contract: rc=0 pass, rc=77 loud SKIP, anything else FAIL.
name: yubiOS fTPM /dev/tpm0 guest verify (OMN-96)

on:
  workflow_dispatch:
    inputs:
      firmware_image:
        description: 'OCI ref for the firmware bundle. Default: published QEMU ARM64 firmware.'
        required: false
        default: 'docker.io/0mniteck/yubios:firmware-qemu-arm64'
        type: string
      yubios_image:
        description: 'OCI ref for the yubiOS dev/test image.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string
      ftpm_linux_payload:
        description: 'Also run Stage B (Linux payload + in-guest verifier). Slow (bcvk to-disk) and unproven on first-run; default off.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ftpm-tpm0-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            primary: false
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, KVM]
            primary: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: "Gate amd64 boot leg on platform-priority policy (ADR-023: ARM64 is primary)"
        id: policy
        if: matrix.arch == 'amd64'
        run: |
          if [ "${{ matrix.primary }}" = "true" ]; then
            echo "boot=1" >> "$GITHUB_OUTPUT"
          else
            echo "boot=0" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: amd64 boot leg skipped -- ARM64 is yubiOS's primary target (ADR-023); fTPM verification is per-arch (the firmware bundle is arm64-only by tag, so this leg cannot boot it on an amd64 runner without binfmt/QEMU emulation that this workflow deliberately does not run). The arm64 matrix leg is the always-on gate."
            echo "### ftpm-tpm0 (${{ matrix.arch }}) -- SKIP: platform-priority per ADR-023 (amd64 cannot boot the arm64 firmware bundle)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reclaim workspace before checkout (bare runner -- root-owned leftovers possible)
        if: matrix.arch == 'arm64' || (matrix.arch == 'amd64' && steps.policy.outputs.boot == '1')
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Checkout
        if: matrix.arch == 'arm64' || (matrix.arch == 'amd64' && steps.policy.outputs.boot == '1')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — see PINNED.md

      - name: Install host deps (podman, qemu aarch64, swtpm, tpm2-tools)
        if: matrix.arch == 'arm64' || (matrix.arch == 'amd64' && steps.policy.outputs.boot == '1')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            podman qemu-system-arm qemu-efi-aarch64 qemu-utils swtpm swtpm-tools tpm2-tools \
            python3 python3-serial skopeo

      - name: Login to docker.io (bare runner pulls need creds for 0mniteck42 namespace)
        if: matrix.arch == 'arm64' || (matrix.arch == 'amd64' && steps.policy.outputs.boot == '1')
        env:
          DOCKER_USER: 0mniteck42
          DOCKER_PASS: ${{ secrets.DOCKER }}
        run: |
          echo "$DOCKER_PASS" | sudo podman login --username "$DOCKER_USER" --password-stdin docker.io

      - name: Run tests/vm/test-ftpm-qemu-ci.sh (Stage A always; Stage B when FTPM_LINUX_PAYLOAD=1)
        if: matrix.arch == 'arm64' || (matrix.arch == 'amd64' && steps.policy.outputs.boot == '1')
        env:
          PATH: ${{ runner.temp }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          FIRMWARE_IMAGE: ${{ inputs.firmware_image || 'docker.io/0mniteck/yubios:firmware-qemu-arm64' }}
          YUBIOS_IMAGE: ${{ inputs.yubios_image || 'docker.io/0mniteck/yubios:dev' }}
          FTPM_LINUX_PAYLOAD: ${{ inputs.ftpm_linux_payload && '1' || '0' }}
          BOOT_TIMEOUT: '180'
          LINUX_BOOT_TIMEOUT: '900'
          TO_DISK_TIMEOUT: '900'
          WORK: /tmp/yubios-ftpm-tpm0-work
          LOG_DIR: /tmp/yubios-ftpm-tpm0-logs
        run: |
          chmod +x tests/vm/test-ftpm-qemu-ci.sh tests/vm/ftpm-console-driver.py tests/vm/verify-tpm0-pcr-extend.sh
          # set +e around the test script so its non-zero exit (rc=77 = loud SKIP per
          # the test-ftpm-qemu-ci.sh contract) doesn't trigger this run block's
          # own set -e and skip the rc capture. ci_test-vm.yml's same step uses
          # the identical pattern; this is the yubiOS canon.
          set +e
          sudo env "PATH=$PATH:/usr/sbin:/sbin" bash tests/vm/test-ftpm-qemu-ci.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "--- secure-world serial log tail ---"
            sudo tail -200 /tmp/yubios-ftpm-tpm0-logs/ftpm-optee.log 2>/dev/null || true
            echo "--- normal-world serial log tail ---"
            sudo tail -200 /tmp/yubios-ftpm-tpm0-logs/ftpm-nw.log 2>/dev/null || true
            echo "--- bcvk to-disk log tail (Stage B) ---"
            sudo tail -200 /tmp/yubios-ftpm-tpm0-logs/ftpm-to-disk.log 2>/dev/null || true
            echo "--- guest console log tail (Stage B) ---"
            sudo tail -200 /tmp/yubios-ftpm-tpm0-logs/ftpm-linux.log 2>/dev/null || true
          fi
          if [ "$rc" -eq 77 ]; then
            echo "::warning::SKIP: fTPM /dev/tpm0 leg incomplete (see log)"
            echo "### ftpm-tpm0 -- SKIP" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "### ftpm-tpm0 -- PASS: fTPM firmware markers verified (Stage A) [+ Stage B if FTPM_LINUX_PAYLOAD=1]" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fTPM serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — see PINNED.md
        with:
          name: ftpm-tpm0-logs-${{ matrix.arch }}
          path: /tmp/yubios-ftpm-tpm0-logs/*.log
          if-no-files-found: warn
          retention-days: 7

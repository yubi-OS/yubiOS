name: zernike-caustics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'recon or classify'
        required: false
        default: 'classify'

permissions:
  contents: read

jobs:
  caustics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install numpy
        run: python3 -m pip install --quiet 'numpy==2.1.3'
      - name: Run F4 caustic classification
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: python3 papers/scripts/f4_caustic_classify.py --mode "$MODE"

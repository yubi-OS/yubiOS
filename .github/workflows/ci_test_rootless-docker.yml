name: TEST - Rootless Docker bootstrap validation

on:
  workflow_dispatch:
    inputs:
      ci_callback:
        description: 'Internal: call back to ci.yml when this workflow finishes.'
        required: false
        default: false
        type: boolean
      ci_chain_ref:
        description: 'Internal: ref carried by the ci.yml orchestrator.'
        required: false
        default: ''
        type: string
      ci_reason:
        description: 'Internal: original ci.yml orchestrator reason.'
        required: false
        default: 'manual'
        type: string
      ci_Docker_push:
        description: 'Internal: production image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Dev_Docker_push:
        description: 'Internal: dev image push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Firmware_Docker_push:
        description: 'Internal: firmware artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_Installer_Docker_push:
        description: 'Internal: installer artifact push flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_fork_run:
        description: 'Internal: fork workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_test_run:
        description: 'Internal: TEST workflow flag carried by ci.yml.'
        required: false
        default: false
        type: boolean
      ci_vm_image:
        description: 'Internal: VM image ref carried by ci.yml.'
        required: false
        default: 'docker.io/0mniteck/yubios:dev'
        type: string

permissions:
  contents: read
  actions: write

env:
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

jobs:
  rootless-docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
            buildx_arch: linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_arch: aarch64
            buildx_arch: linux-arm64
    runs-on: ${{ matrix.runner }}
    container:
      options: --privileged
      volumes:
        - /mnt:/mnt
      credentials:
        username: 0mniteck42
        password: ${{ secrets.DOCKER }}
      image: docker://dhi.io/debian-base@sha256:7b1d6522b9a4e72e2ca3537c031ca3650c654ec81c181447bf952069eb827226
    steps:
      - name: Exercise rootless Docker bootstrap (${{ matrix.arch }})
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            curl iproute2 iptables nftables passwd procps util-linux \
            uidmap slirp4netns fuse-overlayfs
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-29.9.1.tgz"
          wcurl "https://download.docker.com/linux/static/stable/${{ matrix.docker_arch }}/docker-rootless-extras-29.9.1.tgz"
          wcurl "https://github.com/docker/buildx/releases/download/v0.38.0/buildx-v0.38.0.${{ matrix.buildx_arch }}"
          case "${{ matrix.docker_arch }}" in
            x86_64)
              DOCKER_SHA512=f508d7befbb25a9993b762d6b8b5e626d7382884c63d8d6f0db0bc8d7e27b6a7bcaac4f353e79fe2eeaef8233d817e430982138cf94e86aee2ca9ebb975d9323
              ROOTLESS_SHA512=16ec64b59b207eb6d937b18fa8880dd1b345603f6a2b481d67f9f6fba9a00d19f1d09552fe5b4d75aa4b1e108854306c25519f1489a7a2972c7f94229805573c
              BUILDX_SHA512=fa2a4b38d084304e3993161a7cb5beb46c38f311ca5697dc57e97bf6e4f3505e66d9b4b089faf138e499565fca83620aa0a73a571141111cbd4d1877fe0e692b
              ;;
            aarch64)
              DOCKER_SHA512=f1dbaee45f65122a3edbf59f8f9e7ea77212a300cfabdf54beeb5a115b18536e7d846a0a0b15adffa1e5fb56a9bc7d82fba350ef662c448935d372c98996a34e
              ROOTLESS_SHA512=20c59b7b4d680c0cd811fb17c138e5fea4cbac0528837fd9c81a8316cb151338ef8cbf5c55697228b8b32aea81f05e561693525a0cb51c8696889f011e21a07c
              BUILDX_SHA512=ce6749dafc2f662a4fc12857803250608e5b911f69c94f8fb93c55c7a334090527ecf0867476d252a22d31cd2e0af9ca2e4a478e49ea9b14c232cd3138922183
              ;;
            *)
              echo "Unsupported Docker artifact architecture: ${{ matrix.docker_arch }}" >&2
              exit 1
              ;;
          esac
          printf '%s  %s\n' "$DOCKER_SHA512" docker-29.9.1.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$ROOTLESS_SHA512" docker-rootless-extras-29.9.1.tgz | sha512sum --check --strict
          printf '%s  %s\n' "$BUILDX_SHA512" "buildx-v0.38.0.${{ matrix.buildx_arch }}" | sha512sum --check --strict
          tar xzf docker-29.9.1.tgz
          tar xzf docker-rootless-extras-29.9.1.tgz

          DOCKER_TOOLS_DIR="${RUNNER_TEMP}/docker-tools"
          ROOTLESS_USER=docker-rootless
          ROOTLESS_RUNTIME_DIR=/run/docker-rootless
          ROOTLESS_SOCKET="${ROOTLESS_RUNTIME_DIR}/docker.sock"
          ROOTLESS_DATA_DIR="$(mktemp -d /mnt/docker-rootless.XXXXXX)"

          mkdir -p "$DOCKER_TOOLS_DIR/bin" "$DOCKER_TOOLS_DIR/config/cli-plugins"
          install -m 0755 docker/* "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/dockerd-rootless.sh "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 docker-rootless-extras/rootlesskit "$DOCKER_TOOLS_DIR/bin/"
          install -m 0755 "buildx-v0.38.0.${{ matrix.buildx_arch }}" \
            "$DOCKER_TOOLS_DIR/config/cli-plugins/docker-buildx"

          useradd --create-home --shell /bin/sh "$ROOTLESS_USER"
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subuid
          printf '%s\n' "${ROOTLESS_USER}:100000:65536" > /etc/subgid
          install -d -m 0700 -o "$ROOTLESS_USER" -g "$ROOTLESS_USER" "$ROOTLESS_RUNTIME_DIR"
          chown "$ROOTLESS_USER:$ROOTLESS_USER" "$ROOTLESS_DATA_DIR"
          chmod 0700 "$ROOTLESS_DATA_DIR"

          # Ubuntu 24.04 hosted runners restrict unprivileged user namespaces.
          # The outer job container is privileged and the runner is ephemeral.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          # DHI intentionally lacks a complete PAM login stack. Record the
          # original failure without making the diagnostic depend on PAM.
          if runuser -u "$ROOTLESS_USER" -- id; then
            echo 'runuser unexpectedly succeeded'
          else
            echo 'runuser failed as observed; continuing with setpriv'
          fi

          echo "$DOCKER_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$DOCKER_TOOLS_DIR/config" >> "$GITHUB_ENV"
          export PATH="$DOCKER_TOOLS_DIR/bin:$PATH"
          export DOCKER_CONFIG="$DOCKER_TOOLS_DIR/config"
          export DOCKER_HOST="unix://${ROOTLESS_SOCKET}"
          setpriv \
            --reuid="$ROOTLESS_USER" \
            --regid="$ROOTLESS_USER" \
            --init-groups \
            env \
              HOME="/home/${ROOTLESS_USER}" \
              USER="$ROOTLESS_USER" \
              LOGNAME="$ROOTLESS_USER" \
              XDG_RUNTIME_DIR="$ROOTLESS_RUNTIME_DIR" \
              PATH="$DOCKER_TOOLS_DIR/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns \
              dockerd-rootless.sh \
                --data-root="$ROOTLESS_DATA_DIR" \
                --storage-driver=fuse-overlayfs \
                -H "unix://${ROOTLESS_SOCKET}" \
            > "${RUNNER_TEMP}/dockerd-rootless.log" 2>&1 &
          ROOTLESS_DOCKER_PID=$!

          for _ in $(seq 1 90); do
            docker info >/dev/null 2>&1 && break
            if ! kill -0 "$ROOTLESS_DOCKER_PID" 2>/dev/null; then
              cat "${RUNNER_TEMP}/dockerd-rootless.log"
              exit 1
            fi
            sleep 1
          done
          if ! docker info >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/dockerd-rootless.log"
            exit 1
          fi

          docker info --format '{{json .SecurityOptions}}' | tee /tmp/docker-security-options
          grep -q 'name=rootless' /tmp/docker-security-options
          docker buildx create --name hardened --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" --use || true
          docker buildx inspect hardened

      - name: Verify rootless Docker across the step boundary (${{ matrix.arch }})
        run: |
          set -eu
          docker -H unix:///run/docker-rootless/docker.sock info \
            --format '{{json .SecurityOptions}}' | tee /tmp/docker-security-options
          grep -q 'name=rootless' /tmp/docker-security-options
          docker -H unix:///run/docker-rootless/docker.sock buildx inspect hardened

  ci-callback:
    name: Callback to ci.yml orchestrator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ci_callback == true }}
    needs: [rootless-docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Report current state to ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF: ${{ inputs.ci_chain_ref != '' && inputs.ci_chain_ref || github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REASON: ${{ inputs.ci_reason }}
          CI_DOCKER_PUSH: ${{ inputs.ci_Docker_push }}
          CI_DEV_DOCKER_PUSH: ${{ inputs.ci_Dev_Docker_push }}
          CI_FIRMWARE_DOCKER_PUSH: ${{ inputs.ci_Firmware_Docker_push }}
          CI_INSTALLER_DOCKER_PUSH: ${{ inputs.ci_Installer_Docker_push }}
          CI_FORK_RUN: ${{ inputs.ci_fork_run }}
          CI_TEST_RUN: ${{ inputs.ci_test_run }}
          CI_VM_IMAGE: ${{ inputs.ci_vm_image }}
        run: |
          set -euo pipefail
          conclusion=$(jq -r 'if any(to_entries[]; .value.result == "failure" or .value.result == "cancelled") then "failure" else "success" end' <<<"$NEEDS_JSON")
          payload=$(jq -n \
            --arg ref "$REF" \
            --arg state "$WORKFLOW_NAME" \
            --arg completed_conclusion "$conclusion" \
            --arg reason "$CI_REASON" \
            --arg Docker_push "$CI_DOCKER_PUSH" \
            --arg Dev_Docker_push "$CI_DEV_DOCKER_PUSH" \
            --arg Firmware_Docker_push "$CI_FIRMWARE_DOCKER_PUSH" \
            --arg Installer_Docker_push "$CI_INSTALLER_DOCKER_PUSH" \
            --arg ci_fork_run "$CI_FORK_RUN" \
            --arg ci_test_run "$CI_TEST_RUN" \
            --arg vm_image "$CI_VM_IMAGE" \
            '{ref: $ref, inputs: {state: $state, completed_conclusion: $completed_conclusion, reason: $reason, target_ref: $ref, Docker_push: $Docker_push, Dev_Docker_push: $Dev_Docker_push, Firmware_Docker_push: $Firmware_Docker_push, Installer_Docker_push: $Installer_Docker_push, ci_fork_run: $ci_fork_run, ci_test_run: $ci_test_run, vm_image: $vm_image}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Reported ${WORKFLOW_NAME} as ${conclusion} to ci.yml."
